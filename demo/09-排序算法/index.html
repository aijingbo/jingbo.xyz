<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排序算法可视化 | 景礡之道</title>
<style>
:root {
  --bg: #0f172a;
  --canvas-bg: #1e293b;
  --card-bg: #1e293b;
  --card-border: #334155;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --text-bright: #f1f5f9;
  --blue: #3b82f6;
  --yellow: #fbbf24;
  --red: #ef4444;
  --green: #22c55e;
  --orange: #f97316;
  --accent: #818cf8;
  --accent-hover: #6366f1;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* ===== 头部 ===== */
.header {
  padding: 10px 20px;
  background: var(--card-bg);
  border-bottom: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  gap: 20px;
  flex-shrink: 0;
}
.header h1 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-bright);
  white-space: nowrap;
}
.algo-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.algo-tab {
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
}
.algo-tab:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.algo-tab.active { background: var(--accent); color: #fff; }
.compare-toggle {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
}
.compare-toggle input { accent-color: var(--accent); width: 14px; height: 14px; }
/* ===== 主体布局 ===== */
.main { flex: 1; display: flex; overflow: hidden; }
.canvas-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  min-width: 0;
}
.canvas-area.compare { flex-direction: row; }
.canvas-wrapper {
  flex: 1;
  background: var(--canvas-bg);
  border-radius: 10px;
  border: 1px solid var(--card-border);
  overflow: hidden;
  position: relative;
  min-height: 0;
}
.canvas-wrapper canvas { display: block; width: 100%; height: 100%; }
.canvas-label {
  position: absolute;
  top: 8px; left: 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  z-index: 2;
  pointer-events: none;
}
.canvas-label-select {
  position: absolute;
  top: 6px; left: 10px;
  z-index: 2;
  background: var(--bg);
  color: var(--orange);
  border: 1px solid var(--card-border);
  border-radius: 5px;
  padding: 3px 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  outline: none;
}
.done-badge {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(34, 197, 94, 0.92);
  color: #fff;
  padding: 10px 28px;
  border-radius: 10px;
  font-size: 18px;
  font-weight: 700;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 3;
  box-shadow: 0 4px 20px rgba(34,197,94,0.4);
}
.done-badge.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
/* ===== 侧边栏 ===== */
.sidebar {
  width: 290px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 10px 10px 0;
  overflow-y: auto;
  flex-shrink: 0;
}
.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 14px;
}
.card-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 10px;
}
.form-group { margin-bottom: 12px; }
.form-group:last-child { margin-bottom: 0; }
.form-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 5px;
}
.form-label .value {
  color: var(--text-bright);
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 12px;
}
input[type="range"] {
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: var(--card-border);
  border-radius: 2px;
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 2px solid var(--card-bg);
}
input[type="range"]::-moz-range-thumb {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 2px solid var(--card-bg);
}
input[type="text"] {
  flex: 1;
  padding: 7px 10px;
  background: var(--bg);
  border: 1px solid var(--card-border);
  border-radius: 6px;
  color: var(--text);
  font-size: 12px;
  font-family: 'SF Mono', 'Fira Code', monospace;
  outline: none;
}
input[type="text"]:focus { border-color: var(--accent); }
input[type="text"]::placeholder { color: #475569; }
.btn {
  padding: 7px 14px;
  border: 1px solid var(--card-border);
  border-radius: 6px;
  background: var(--card-bg);
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn:hover { background: rgba(255,255,255,0.08); border-color: var(--text-dim); }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--green); border-color: var(--green); color: #fff; }
.btn-primary:hover { background: #16a34a; }
.btn-warn { background: var(--yellow); border-color: var(--yellow); color: #1a1a2e; }
.btn-warn:hover { background: #eab308; }
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
  font-size: 13px;
}
.stat-label { color: var(--text-dim); }
.stat-value {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-weight: 600;
  color: var(--text-bright);
}
.stat-section { margin-bottom: 8px; }
.stat-section:last-child { margin-bottom: 0; }
.stat-header { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
.complexity-table { width: 100%; font-size: 12px; }
.complexity-table td { padding: 2px 0; }
.complexity-table td:first-child { color: var(--text-dim); }
.complexity-table td:last-child {
  text-align: right;
  font-family: 'SF Mono', 'Fira Code', monospace;
  color: var(--text-bright);
}
.algo-desc {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.6;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--card-border);
}
.legend { display: flex; flex-wrap: wrap; gap: 8px 12px; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-dim); }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; }
/* ===== 底部控制栏 ===== */
.footer {
  padding: 10px 20px;
  background: var(--card-bg);
  border-top: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.controls-bar { display: flex; gap: 8px; }
.step-desc {
  flex: 1;
  font-size: 12px;
  color: var(--text-dim);
  font-family: 'SF Mono', 'Fira Code', monospace;
  padding: 7px 12px;
  background: var(--bg);
  border-radius: 6px;
  border: 1px solid var(--card-border);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.kbd-hint { font-size: 11px; color: #475569; white-space: nowrap; }
.kbd {
  display: inline-block;
  padding: 1px 5px;
  background: var(--bg);
  border: 1px solid var(--card-border);
  border-radius: 3px;
  font-size: 10px;
  font-family: monospace;
  color: var(--text-dim);
}
/* ===== 滚动条 ===== */
.sidebar::-webkit-scrollbar { width: 5px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 3px; }
</style>

<body>

<!-- ===== 头部 ===== -->
<header class="header">
  <h1>排序算法可视化</h1>
  <nav class="algo-tabs" id="algoTabs">
    <button class="algo-tab active" data-algo="bubble">冒泡排序</button>
    <button class="algo-tab" data-algo="selection">选择排序</button>

  </label>

<!-- ===== 主体 ===== -->
<main class="main">

  <aside class="sidebar">

        <div class="legend-item"><div class="legend-dot" style="background:#fbbf24"></div>比较中</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>交换中</div>
        <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>已排序</div>

  </aside>
</main>

<!-- ===== 底部控制栏 ===== -->
<footer class="footer">
  <div class="controls-bar">
    <button class="btn btn-primary" id="playBtn">播放</button>
    <button class="btn" id="stepBtn">单步</button>
    <button class="btn" id="resetBtn">重置</button>
  </div>
  <div class="step-desc" id="stepDesc">准备开始排序</div>
  <div class="kbd-hint">
    <span class="kbd">Space</span> 播放/暂停
    <span class="kbd">→</span> 单步
    <span class="kbd">R</span> 重置
  </div>
</footer>

<script>
// ===== 算法信息 =====
const algorithmInfo = {
  bubble: { name:'冒泡排序', best:'O(n)', average:'O(n²)', worst:'O(n²)', space:'O(1)', stable:'是',
    desc:'重复遍历数组，比较相邻元素，若顺序错误则交换。每轮将最大元素"冒泡"到末尾。' },
  selection: { name:'选择排序', best:'O(n²)', average:'O(n²)', worst:'O(n²)', space:'O(1)', stable:'否',
    desc:'每轮从未排序部分选出最小元素，与未排序部分的首元素交换。' },
  insertion: { name:'插入排序', best:'O(n)', average:'O(n²)', worst:'O(n²)', space:'O(1)', stable:'是',
    desc:'将每个元素插入到已排序部分的正确位置，类似整理扑克牌。' },
  quick: { name:'快速排序', best:'O(n log n)', average:'O(n log n)', worst:'O(n²)', space:'O(log n)', stable:'否',
    desc:'选取基准元素，将小于基准的放左边，大于的放右边，递归排序两部分。' },
  merge: { name:'归并排序', best:'O(n log n)', average:'O(n log n)', worst:'O(n log n)', space:'O(n)', stable:'是',
    desc:'将数组递归地分成两半，分别排序后合并。稳定且高效。' },
  heap: { name:'堆排序', best:'O(n log n)', average:'O(n log n)', worst:'O(n log n)', space:'O(1)', stable:'否',
    desc:'构建最大堆，反复将堆顶元素与末尾交换并调整堆。' }
};

// ===== 排序算法生成器 =====
// 每个生成器操作传入的数组，yield 步骤对象 { type, indices }
// type: 'compare' | 'swap' | 'sorted' | 'pointer'

function* bubbleSort(arr) {
  const n = arr.length;
  for (let i = 0; i < n - 1; i++) {
    let swapped = false;
    for (let j = 0; j < n - i - 1; j++) {
      yield { type: 'compare', indices: [j, j + 1] };
      if (arr[j] > arr[j + 1]) {
        [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]];
        yield { type: 'swap', indices: [j, j + 1] };
        swapped = true;
      }
    }
    yield { type: 'sorted', index: n - i - 1 };
    if (!swapped) {
      for (let k = 0; k < n - i - 1; k++) yield { type: 'sorted', index: k };
      return;
    }
  }
  yield { type: 'sorted', index: 0 };
}

function* selectionSort(arr) {
  const n = arr.length;
  for (let i = 0; i < n - 1; i++) {
    let minIdx = i;
    yield { type: 'pointer', index: i };
    for (let j = i + 1; j < n; j++) {
      yield { type: 'compare', indices: [minIdx, j] };
      if (arr[j] < arr[minIdx]) minIdx = j;
    }
    if (minIdx !== i) {
      [arr[i], arr[minIdx]] = [arr[minIdx], arr[i]];
      yield { type: 'swap', indices: [i, minIdx] };
    }
    yield { type: 'sorted', index: i };
  }
  yield { type: 'sorted', index: n - 1 };
}

function* insertionSort(arr) {
  const n = arr.length;
  yield { type: 'sorted', index: 0 };
  for (let i = 1; i < n; i++) {
    let j = i;
    while (j > 0) {
      yield { type: 'compare', indices: [j - 1, j] };
      if (arr[j - 1] > arr[j]) {
        [arr[j - 1], arr[j]] = [arr[j], arr[j - 1]];
        yield { type: 'swap', indices: [j - 1, j] };
        j--;
      } else break;
    }
    yield { type: 'sorted', index: i };
  }
}

function* quickSort(arr, low, high) {
  if (low === undefined) { low = 0; high = arr.length - 1; }
  if (low < high) {
    const pivot = arr[high];
    let i = low - 1;
    for (let j = low; j < high; j++) {
      yield { type: 'compare', indices: [j, high] };
      if (arr[j] < pivot) {
        i++;
        if (i !== j) {
          [arr[i], arr[j]] = [arr[j], arr[i]];
          yield { type: 'swap', indices: [i, j] };
        }
      }
    }
    [arr[i + 1], arr[high]] = [arr[high], arr[i + 1]];
    yield { type: 'swap', indices: [i + 1, high] };
    const pi = i + 1;
    yield { type: 'sorted', index: pi };
    yield* quickSort(arr, low, pi - 1);
    yield* quickSort(arr, pi + 1, high);
  } else if (low === high) {
    yield { type: 'sorted', index: low };
  }
}

function* mergeSort(arr, low, high) {
  if (low === undefined) { low = 0; high = arr.length - 1; }
  if (low < high) {
    const mid = Math.floor((low + high) / 2);
    yield* mergeSort(arr, low, mid);
    yield* mergeSort(arr, mid + 1, high);
    yield* merge(arr, low, mid, high);
  }
}

function* merge(arr, low, mid, high) {
  const left = arr.slice(low, mid + 1);
  const right = arr.slice(mid + 1, high + 1);
  let i = 0, j = 0, k = low;
  while (i < left.length && j < right.length) {
    yield { type: 'compare', indices: [k] };
    if (left[i] <= right[j]) { arr[k] = left[i]; i++; }
    else { arr[k] = right[j]; j++; }
    yield { type: 'swap', indices: [k] };
    k++;
  }
  while (i < left.length) { arr[k] = left[i]; yield { type: 'swap', indices: [k] }; i++; k++; }
  while (j < right.length) { arr[k] = right[j]; yield { type: 'swap', indices: [k] }; j++; k++; }
}

function* heapSort(arr) {
  const n = arr.length;
  for (let i = Math.floor(n / 2) - 1; i >= 0; i--) yield* heapify(arr, n, i);
  for (let i = n - 1; i > 0; i--) {
    [arr[0], arr[i]] = [arr[i], arr[0]];
    yield { type: 'swap', indices: [0, i] };
    yield { type: 'sorted', index: i };
    yield* heapify(arr, i, 0);
  }
  yield { type: 'sorted', index: 0 };
}

function* heapify(arr, n, i) {
  let largest = i;
  const l = 2 * i + 1, r = 2 * i + 2;
  if (l < n) {
    yield { type: 'compare', indices: [l, largest] };
    if (arr[l] > arr[largest]) largest = l;
  }
  if (r < n) {
    yield { type: 'compare', indices: [r, largest] };
    if (arr[r] > arr[largest]) largest = r;
  }
  if (largest !== i) {
    [arr[i], arr[largest]] = [arr[largest], arr[i]];
    yield { type: 'swap', indices: [i, largest] };
    yield* heapify(arr, n, largest);
  }
}

const algorithms = { bubble: bubbleSort, selection: selectionSort, insertion: insertionSort,
  quick: (a) => quickSort(a), merge: (a) => mergeSort(a), heap: heapSort };

// ===== 可视化器 =====
class Visualizer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.array = [];
    this.workArray = [];
    this.algorithm = 'bubble';
    this.generator = null;
    this.comparisons = 0;
    this.swaps = 0;
    this.sortedIndices = new Set();
    this.highlightIndices = {};
    this.stepDescription = '准备开始排序';
    this.isDone = false;
    this.startTime = null;
    this.elapsedTime = 0;
    this.cw = 0; this.ch = 0;
  }

  setArray(arr) { this.array = [...arr]; this.reset(); }
  setAlgorithm(algo) { this.algorithm = algo; this.reset(); }

  reset() {
    this.workArray = [...this.array];
    this.generator = algorithms[this.algorithm](this.workArray);
    this.comparisons = 0;
    this.swaps = 0;
    this.sortedIndices = new Set();
    this.highlightIndices = {};
    this.stepDescription = '准备开始排序';
    this.isDone = false;
    this.startTime = null;
    this.elapsedTime = 0;
    this.render();
  }

  step() {
    if (this.isDone || !this.generator) return false;
    if (!this.startTime) this.startTime = Date.now();
    const result = this.generator.next();
    if (result.done) {
      for (let i = 0; i < this.workArray.length; i++) this.sortedIndices.add(i);
      this.highlightIndices = {};
      this.stepDescription = '排序完成！';
      this.isDone = true;
      this.elapsedTime = Date.now() - this.startTime;
      this.render();
      return false;
    }
    const step = result.value;
    this.highlightIndices = {};
    switch (step.type) {
      case 'compare':
        this.comparisons++;
        step.indices.forEach(i => { this.highlightIndices[i] = 'compare'; });
        if (step.indices.length >= 2)
          this.stepDescription = `比较 arr[${step.indices[0]}] 和 arr[${step.indices[1]}]`;
        else
          this.stepDescription = `归并比较 → 写入位置 arr[${step.indices[0]}]`;
        break;
      case 'swap':
        this.swaps++;
        step.indices.forEach(i => { this.highlightIndices[i] = 'swap'; });
        if (step.indices.length >= 2)
          this.stepDescription = `交换 arr[${step.indices[0]}] ↔ arr[${step.indices[1]}]`;
        else
          this.stepDescription = `写入 arr[${step.indices[0]}] = ${this.workArray[step.indices[0]]}`;
        break;
      case 'sorted':
        this.sortedIndices.add(step.index);
        this.stepDescription = `arr[${step.index}] 已排序`;
        break;
      case 'pointer':
        this.highlightIndices[step.index] = 'pointer';
        this.stepDescription = `标记位置 arr[${step.index}]`;
        break;
    }
    this.elapsedTime = Date.now() - this.startTime;
    this.render();
    return true;
  }

  resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = this.canvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    this.canvas.width = rect.width * dpr;
    this.canvas.height = rect.height * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cw = rect.width;
    this.ch = rect.height;
    this.render();
  }

  render() {
    const ctx = this.ctx, w = this.cw, h = this.ch;
    if (w === 0 || h === 0) return;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, w, h);
    if (this.workArray.length === 0) return;

    const n = this.workArray.length;
    const maxVal = Math.max(...this.workArray, 1);
    const barAreaH = h - 24;
    const barWidth = w / n;
    const gap = n > 50 ? 1 : Math.max(1, barWidth * 0.12);

    for (let i = 0; i < n; i++) {
      const barH = Math.max(3, (this.workArray[i] / maxVal) * barAreaH);
      const x = i * barWidth;
      const y = h - barH - 2;
      let color = '#3b82f6', glow = false;
      if (this.sortedIndices.has(i)) color = '#22c55e';
      if (this.highlightIndices[i] === 'compare') { color = '#fbbf24'; glow = true; }
      if (this.highlightIndices[i] === 'swap') { color = '#ef4444'; glow = true; }
      if (this.highlightIndices[i] === 'pointer') { color = '#f97316'; glow = true; }

      if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 10; }
      else ctx.shadowBlur = 0;

      ctx.fillStyle = color;
      const bx = x + gap / 2, bw = Math.max(1, barWidth - gap);
      const r = Math.min(bw / 2, 3);
      ctx.beginPath();
      ctx.moveTo(bx, y + r);
      ctx.arcTo(bx, y, bx + r, y, r);
      ctx.lineTo(bx + bw - r, y);
      ctx.arcTo(bx + bw, y, bx + bw, y + r, r);
      ctx.lineTo(bx + bw, h);
      ctx.lineTo(bx, h);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      // 小数组显示数值
      if (n <= 20) {
        ctx.fillStyle = this.highlightIndices[i] ? '#f1f5f9' : '#64748b';
        ctx.font = 'bold 10px "SF Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(this.workArray[i], x + barWidth / 2, y - 4);
      }
    }

    // 指针箭头
    for (const [idx, type] of Object.entries(this.highlightIndices)) {
      if (type === 'pointer') {
        const i = parseInt(idx);
        const x = i * barWidth + barWidth / 2;
        const y = h - Math.max(3, (this.workArray[i] / maxVal) * barAreaH) - 2;
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(x, y - 12);
        ctx.lineTo(x - 5, y - 5);
        ctx.lineTo(x + 5, y - 5);
        ctx.closePath();
        ctx.fill();
      }
    }
  }
}

// ===== 全局状态 =====
let viz1, viz2;
let isPlaying = false;
let playTimer = null;
let currentSpeed = 20;
let currentArraySize = 30;
let compareMode = false;
let currentAlgo1 = 'bubble';
let currentAlgo2 = 'quick';

// ===== 工具函数 =====
function generateRandomArray(size) {
  const arr = [];
  for (let i = 0; i < size; i++) arr.push(Math.floor(Math.random() * 95) + 5);
  return arr;
}

function formatTime(ms) {
  if (ms < 1000) return ms + 'ms';
  return (ms / 1000).toFixed(2) + 's';
}

// ===== UI 更新 =====
function updatePlayButton() {
  const btn = document.getElementById('playBtn');
  if (isPlaying) { btn.textContent = '暂停'; btn.classList.remove('btn-primary'); btn.classList.add('btn-warn'); }
  else { btn.textContent = '播放'; btn.classList.add('btn-primary'); btn.classList.remove('btn-warn'); }
}

function updateStepDesc() {
  const el = document.getElementById('stepDesc');
  if (compareMode) {
    el.textContent = `[${algorithmInfo[currentAlgo1].name}] ${viz1.stepDescription}  |  [${algorithmInfo[currentAlgo2].name}] ${viz2.stepDescription}`;
  } else {
    el.textContent = viz1.stepDescription;
  }
}

function updateStats() {
  const el = document.getElementById('statsContent');
  const row = (label, val) => `<div class="stat-row"><span class="stat-label">${label}</span><span class="stat-value">${val}</span></div>`;
  if (compareMode) {
    el.innerHTML = `
      <div class="stat-section">
        <div class="stat-header" style="color:var(--accent)">${algorithmInfo[currentAlgo1].name}</div>
        ${row('比较次数', viz1.comparisons)}
        ${row('交换次数', viz1.swaps)}
        ${row('已用时间', formatTime(viz1.elapsedTime))}
      </div>
      <div class="stat-section" style="border-top:1px solid var(--card-border); padding-top:8px;">
        <div class="stat-header" style="color:var(--orange)">${algorithmInfo[currentAlgo2].name}</div>
        ${row('比较次数', viz2.comparisons)}
        ${row('交换次数', viz2.swaps)}
        ${row('已用时间', formatTime(viz2.elapsedTime))}
      </div>`;
  } else {
    el.innerHTML = row('比较次数', viz1.comparisons) + row('交换次数', viz1.swaps) + row('已用时间', formatTime(viz1.elapsedTime));
  }
}

function updateComplexity() {
  const el = document.getElementById('complexityContent');
  const table = (info) => `
    <table class="complexity-table">
      <tr><td>最好情况</td><td>${info.best}</td></tr>
      <tr><td>平均情况</td><td>${info.average}</td></tr>
      <tr><td>最坏情况</td><td>${info.worst}</td></tr>
      <tr><td>空间复杂度</td><td>${info.space}</td></tr>
      <tr><td>稳定性</td><td>${info.stable}</td></tr>
    </table>`;
  if (compareMode) {
    el.innerHTML = `
      <div class="stat-section">
        <div class="stat-header" style="color:var(--accent)">${algorithmInfo[currentAlgo1].name}</div>
        ${table(algorithmInfo[currentAlgo1])}
      </div>
      <div class="stat-section" style="border-top:1px solid var(--card-border); padding-top:8px;">
        <div class="stat-header" style="color:var(--orange)">${algorithmInfo[currentAlgo2].name}</div>
        ${table(algorithmInfo[currentAlgo2])}
      </div>`;
  } else {
    el.innerHTML = table(algorithmInfo[currentAlgo1]) + `<div class="algo-desc">${algorithmInfo[currentAlgo1].desc}</div>`;
  }
}

function showDoneBadges() {
  if (viz1.isDone) document.getElementById('done1').classList.add('show');
  if (compareMode && viz2.isDone) document.getElementById('done2').classList.add('show');
}
function hideDoneBadges() {
  document.getElementById('done1').classList.remove('show');
  document.getElementById('done2').classList.remove('show');
}

// ===== 播放控制 =====
function play() {
  if (isPlaying) return;
  if (viz1.isDone && (!compareMode || viz2.isDone)) return;
  isPlaying = true;
  updatePlayButton();
  hideDoneBadges();

  function loop() {
    if (!isPlaying) return;
    if (!viz1.isDone) viz1.step();
    if (compareMode && !viz2.isDone) viz2.step();
    updateStats();
    updateStepDesc();
    const hasMore = !viz1.isDone || (compareMode && !viz2.isDone);
    if (hasMore) playTimer = setTimeout(loop, currentSpeed);
    else { isPlaying = false; updatePlayButton(); showDoneBadges(); }
  }
  loop();
}

function pause() {
  isPlaying = false;
  clearTimeout(playTimer);
  updatePlayButton();
}

function singleStep() {
  if (isPlaying) pause();
  hideDoneBadges();
  let stepped = false;
  if (!viz1.isDone) { viz1.step(); stepped = true; }
  if (compareMode && !viz2.isDone) { viz2.step(); stepped = true; }
  updateStats();
  updateStepDesc();
  if (!stepped) showDoneBadges();
}

function reset() {
  pause();
  viz1.reset();
  if (compareMode) viz2.reset();
  hideDoneBadges();
  updateStats();
  updateStepDesc();
}

function newArray() {
  pause();
  const arr = generateRandomArray(currentArraySize);
  viz1.setArray(arr);
  if (compareMode) viz2.setArray(arr);
  hideDoneBadges();
  updateStats();
  updateStepDesc();
}

// ===== 对比模式 =====
function toggleCompareMode() {
  compareMode = document.getElementById('compareToggle').checked;
  const wrapper2 = document.getElementById('wrapper2');
  const canvasArea = document.getElementById('canvasArea');
  pause();

  if (compareMode) {
    canvasArea.classList.add('compare');
    wrapper2.style.display = '';
    viz2.setArray(viz1.array);
    viz2.setAlgorithm(currentAlgo2);
  } else {
    canvasArea.classList.remove('compare');
    wrapper2.style.display = 'none';
  }

  setTimeout(() => {
    viz1.resize();
    if (compareMode) viz2.resize();
  }, 50);

  hideDoneBadges();
  updateComplexity();
  updateStats();
  updateStepDesc();
}

// ===== 自定义输入 =====
function applyCustomInput() {
  const input = document.getElementById('customInput').value.trim();
  if (!input) return;
  const values = input.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n > 0);
  if (values.length < 2) { alert('请输入至少 2 个正整数，用逗号分隔'); return; }
  if (values.length > 100) { alert('最多支持 100 个元素'); return; }
  pause();
  currentArraySize = values.length;
  document.getElementById('sizeSlider').value = values.length;
  document.getElementById('sizeVal').textContent = values.length;
  viz1.setArray(values);
  if (compareMode) viz2.setArray(values);
  hideDoneBadges();
  updateStats();
  updateStepDesc();
}

// ===== 初始化 =====
function init() {
  viz1 = new Visualizer(document.getElementById('canvas1'));
  viz2 = new Visualizer(document.getElementById('canvas2'));

  const arr = generateRandomArray(currentArraySize);
  viz1.setArray(arr);
  viz2.setArray(arr);
  viz2.setAlgorithm(currentAlgo2);

  // 算法标签
  document.querySelectorAll('.algo-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      if (isPlaying) pause();
      currentAlgo1 = tab.dataset.algo;
      viz1.setAlgorithm(currentAlgo1);
      document.querySelectorAll('.algo-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('label1').textContent = algorithmInfo[currentAlgo1].name;
      hideDoneBadges();
      updateComplexity();
      updateStats();
      updateStepDesc();
    });
  });

  // 算法2下拉
  document.getElementById('algo2Select').addEventListener('change', (e) => {
    if (isPlaying) pause();
    currentAlgo2 = e.target.value;
    viz2.setAlgorithm(currentAlgo2);
    hideDoneBadges();
    updateComplexity();
    updateStats();
    updateStepDesc();
  });

  // 控制按钮
  document.getElementById('playBtn').addEventListener('click', () => isPlaying ? pause() : play());
  document.getElementById('stepBtn').addEventListener('click', singleStep);
  document.getElementById('resetBtn').addEventListener('click', reset);
  document.getElementById('newArrayBtn').addEventListener('click', newArray);
  document.getElementById('applyCustom').addEventListener('click', applyCustomInput);
  document.getElementById('customInput').addEventListener('keydown', e => { if (e.key === 'Enter') applyCustomInput(); });
  document.getElementById('compareToggle').addEventListener('change', toggleCompareMode);

  // 滑块
  document.getElementById('sizeSlider').addEventListener('input', e => {
    currentArraySize = parseInt(e.target.value);
    document.getElementById('sizeVal').textContent = currentArraySize;
  });
  document.getElementById('sizeSlider').addEventListener('change', newArray);
  document.getElementById('speedSlider').addEventListener('input', e => {
    currentSpeed = parseInt(e.target.value);
    document.getElementById('speedVal').textContent = currentSpeed + 'ms';
  });

  // 键盘快捷键
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === ' ') { e.preventDefault(); isPlaying ? pause() : play(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); singleStep(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 'n' || e.key === 'N') newArray();
  });

  // 窗口大小变化
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      viz1.resize();
      if (compareMode) viz2.resize();
    }, 100);
  });

  // 首次渲染
  setTimeout(() => {
    viz1.resize();
    updateStats();
    updateComplexity();
  }, 0);
}

init();
</script>
