<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆锥曲线动态轨迹生成器 · 交互式可视化</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css">
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
    chtml: { fontURL: 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/output/chtml/fonts/woff-v2' },
    startup: { typeset: false }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
<style>
  :root {
    --bg: #f8f9fa;
    --card: #ffffff;
    --blue: #2563eb;
    --blue-dim: #93c5fd;
    --red: #dc2626;
    --green: #16a34a;
    --orange: #ea580c;
    --text: #0f172a;
    --text-dim: #64748b;
    --border: #e2e8f0;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.08);
    --radius: 12px;
    --ease: all .25s ease;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== 顶部 ===== */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .subject-tag {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: var(--blue);
    background: rgba(37,99,235,.1);
  }
  header h1 { font-size: 17px; font-weight: 700; }
  header .sub { font-size: 12px; color: var(--text-dim); margin-left: 4px; }

  /* ===== 主区 ===== */
  main {
    flex: 1;
    display: flex;
    gap: 14px;
    padding: 14px 24px;
    min-height: 0;
  }
  .canvas-wrap {
    flex: 0 0 65%;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
  }
  #jxgbox { width: 100%; height: 100%; min-height: 400px; background: #fff; }

  /* ===== 右侧面板 ===== */
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
    overflow-y: auto;
  }
  .panel-section {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
  }

  /* 标签页 */
  .tabs { display: flex; gap: 6px; }
  .tab {
    flex: 1;
    padding: 8px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--ease);
    text-align: center;
  }
  .tab:hover { border-color: var(--blue-dim); color: var(--blue); }
  .tab.active {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(37,99,235,.3);
  }

  /* 滑块 */
  .slider-row { margin-bottom: 12px; }
  .slider-row:last-child { margin-bottom: 0; }
  .slider-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .slider-label .name { font-size: 13px; color: var(--text); font-weight: 500; }
  .slider-label .name em { color: var(--text-dim); font-style: normal; font-size: 11px; margin-left: 4px; }
  .slider-label .val {
    font-family: "SF Mono", "JetBrains Mono", monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--blue);
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--blue);
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(37,99,235,.4);
    transition: transform .15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--blue); cursor: pointer; border: 2px solid #fff;
  }

  /* 方程与性质 */
  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 8px;
  }
  .equation {
    text-align: center;
    padding: 8px 4px;
    font-size: 15px;
    min-height: 32px;
    overflow-x: auto;
  }
  .prop-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .prop-row:last-child { border-bottom: none; }
  .prop-key { color: var(--text-dim); }
  .prop-val {
    font-family: "SF Mono", "JetBrains Mono", monospace;
    font-weight: 500;
    color: var(--text);
  }
  .prop-val.highlight { color: var(--blue); }
  .prop-val.green { color: var(--green); }

  /* ===== 底部 ===== */
  footer {
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .btn {
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--ease);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-play {
    background: var(--blue);
    color: #fff;
  }
  .btn-play:hover { background: #1d4ed8; transform: translateY(-1px); }
  .btn-play.playing { background: var(--orange); }
  .btn-play.playing:hover { background: #c2410c; }
  .btn-reset {
    background: var(--border);
    color: var(--text-dim);
  }
  .btn-reset:hover { background: #cbd5e1; color: var(--text); }
  .speed-ctrl {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  .speed-ctrl label { font-size: 13px; color: var(--text-dim); }
  .speed-ctrl input[type="range"] { width: 100px; }
  .speed-ctrl .val {
    font-family: "SF Mono", monospace;
    font-size: 13px;
    color: var(--blue);
    font-weight: 600;
    min-width: 36px;
  }

  /* JSXGraph 标签样式 */
  .JXGtext { font-family: -apple-system, "PingFang SC", sans-serif !important; }
  #jxgbox .JXGgrid line { stroke: #e2e8f0; stroke-opacity: 0.5; stroke-width: 1; }
  .dist-label {
    background: rgba(255,255,255,.85);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px !important;
    color: #475569 !important;
    border: 1px solid var(--border);
  }

  /* 响应式 */
  @media (max-width: 900px) {
    main { flex-direction: column; padding: 10px; }
    .canvas-wrap { flex: 1; min-height: 300px; }
    .panel { max-height: 40%; }
  }
</style>
</head>
<body>

<header>
  <span class="subject-tag">数学</span>
  <h1>圆锥曲线动态轨迹生成器</h1>
  <span class="sub">椭圆 · 双曲线 · 抛物线 — 交互式参数探索</span>
</header>

<main>
  <div class="canvas-wrap">
    <div id="jxgbox"></div>
  </div>
  <aside class="panel">
    <!-- 曲线类型选择 -->
    <div class="panel-section">
      <div class="tabs">
        <button class="tab active" data-mode="ellipse">椭圆</button>
        <button class="tab" data-mode="hyperbola">双曲线</button>
        <button class="tab" data-mode="parabola">抛物线</button>
      </div>
    </div>

    <!-- 参数滑块 -->
    <div class="panel-section">
      <div class="section-title">参数控制</div>
      <div id="sliders"></div>
    </div>

    <!-- 标准方程 + 性质 -->
    <div class="panel-section">
      <div class="section-title">标准方程</div>
      <div id="equation-display" class="equation"></div>
      <div class="section-title" style="margin-top:12px;">几何性质</div>
      <div id="properties-display"></div>
    </div>
  </aside>
</main>

<footer>
  <button id="play-btn" class="btn btn-play">▶ 播放轨迹动画</button>
  <button id="reset-btn" class="btn btn-reset">↺ 重置</button>
  <div class="speed-ctrl">
    <label>动画速度</label>
    <input type="range" id="speed-slider" min="0.3" max="3" step="0.1" value="1">
    <span class="val" id="speed-val">1.0×</span>
  </div>
</footer>

<script>
(function () {
  'use strict';

  /* ========== 全局状态 ========== */
  let board;
  let currentMode = 'ellipse';
  let animating = false;
  let animT = 0;
  let animDir = 1;
  let animSpeed = 0.018;
  let speedMult = 1;
  let animFrameId = null;
  let elements = [];        // 当前曲线所有可清除元素
  let animPoint = null;     // 动点引用

  // 参数
  const P = {
    ellipse:   { a: 3,   b: 2 },
    hyperbola: { a: 2,   b: 1.5 },
    parabola:  { p: 1 }
  };

  /* ========== 工具函数 ========== */
  function dist(p1, p2) {
    const dx = p1.X() - p2.X();
    const dy = p1.Y() - p2.Y();
    return Math.sqrt(dx * dx + dy * dy);
  }

  function clearElements() {
    elements.forEach(el => { try { board.removeObject(el); } catch (e) {} });
    elements = [];
    animPoint = null;
  }

  /* ========== 初始化 ========== */
  window.addEventListener('DOMContentLoaded', init);

  function init() {
    board = JXG.JSXGraph.initBoard('jxgbox', {
      boundingbox: [-8, 6, 8, -6],
      keepaspectratio: true,
      showCopyright: false,
      showNavigation: true,
      axis: false,
      grid: true,
      pan: { enabled: true, needShift: false },
      zoom: { wheel: true, needShift: false, factor: 1.1 }
    });

    // 自定义坐标轴
    const ax = board.create('axis', [[0, 0], [1, 0]], {
      strokeColor: '#94a3b8', strokeWidth: 1.2,
      ticks: {
        majorHeight: 6, minorHeight: 3,
        strokeColor: '#cbd5e1',
        label: { fontSize: 11, color: '#94a3b8', offset: [0, -10] },
        ticksDistance: 1
      },
      highlight: false
    });
    const ay = board.create('axis', [[0, 0], [0, 1]], {
      strokeColor: '#94a3b8', strokeWidth: 1.2,
      ticks: {
        majorHeight: 6, minorHeight: 3,
        strokeColor: '#cbd5e1',
        label: { fontSize: 11, color: '#94a3b8', offset: [-10, 0] },
        ticksDistance: 1
      },
      highlight: false
    });

    setupTabs();
    setupControls();
    buildCurve('ellipse');

    // 窗口缩放时刷新画布
    window.addEventListener('resize', () => {
      const c = document.getElementById('jxgbox');
      board.resizeContainer(c.clientWidth, c.clientHeight, true);
    });
  }

  /* ========== 标签页 ========== */
  function setupTabs() {
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        buildCurve(tab.dataset.mode);
      });
    });
  }

  /* ========== 控制按钮 ========== */
  function setupControls() {
    document.getElementById('play-btn').addEventListener('click', () => {
      animating = !animating;
      const btn = document.getElementById('play-btn');
      if (animating) {
        btn.innerHTML = '⏸ 暂停';
        btn.classList.add('playing');
        animate();
      } else {
        btn.innerHTML = '▶ 播放轨迹动画';
        btn.classList.remove('playing');
        if (animFrameId) cancelAnimationFrame(animFrameId);
      }
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      animT = 0;
      animDir = 1;
      board.clearTraces();
      board.update();
    });

    document.getElementById('speed-slider').addEventListener('input', e => {
      speedMult = parseFloat(e.target.value);
      document.getElementById('speed-val').textContent = speedMult.toFixed(1) + '×';
    });
  }

  /* ========== 动画循环 ========== */
  function animate() {
    if (!animating) return;

    const step = animSpeed * speedMult;

    if (currentMode === 'ellipse') {
      // 椭圆：0 → 2π 循环
      animT += step;
      if (animT >= 2 * Math.PI) {
        animT = 0;
        board.clearTraces();
      }
    } else {
      // 双曲线 / 抛物线：往返弹跳
      const limit = currentMode === 'hyperbola' ? 2.5 : 3;
      animT += animDir * step;
      if (animT >= limit) { animT = limit; animDir = -1; }
      else if (animT <= -limit) { animT = -limit; animDir = 1; }
    }

    board.update();
    animFrameId = requestAnimationFrame(animate);
  }

  /* ========== 构建曲线（统一入口） ========== */
  function buildCurve(mode) {
    clearElements();
    board.suspendUpdate();
    currentMode = mode;
    buildSliders(mode);

    if (mode === 'ellipse')        buildEllipse();
    else if (mode === 'hyperbola') buildHyperbola();
    else                           buildParabola();

    board.unsuspendUpdate();
    updateInfo();

    // 重置动画
    animT = 0;
    animDir = 1;
    board.clearTraces();
    board.update();
  }

  /* ========== 滑块面板 ========== */
  function buildSliders(mode) {
    const c = document.getElementById('sliders');

    if (mode === 'ellipse') {
      const p = P.ellipse;
      c.innerHTML = `
        <div class="slider-row">
          <div class="slider-label">
            <span class="name">半长轴 <em>a</em></span>
            <span class="val" id="val-a">${p.a.toFixed(1)}</span>
          </div>
          <input type="range" id="sl-a" min="1.5" max="5" step="0.1" value="${p.a}">
        </div>
        <div class="slider-row">
          <div class="slider-label">
            <span class="name">半短轴 <em>b</em></span>
            <span class="val" id="val-b">${p.b.toFixed(1)}</span>
          </div>
          <input type="range" id="sl-b" min="0.5" max="5" step="0.1" value="${p.b}">
        </div>`;
      document.getElementById('sl-a').addEventListener('input', e => {
        p.a = parseFloat(e.target.value);
        document.getElementById('val-a').textContent = p.a.toFixed(1);
        if (p.b > p.a) {
          p.b = p.a;
          document.getElementById('sl-b').value = p.b;
          document.getElementById('val-b').textContent = p.b.toFixed(1);
        }
        board.update(); updateInfo();
      });
      document.getElementById('sl-b').addEventListener('input', e => {
        let v = parseFloat(e.target.value);
        if (v > p.a) { v = p.a; e.target.value = v; }
        p.b = v;
        document.getElementById('val-b').textContent = v.toFixed(1);
        board.update(); updateInfo();
      });

    } else if (mode === 'hyperbola') {
      const p = P.hyperbola;
      c.innerHTML = `
        <div class="slider-row">
          <div class="slider-label">
            <span class="name">实半轴 <em>a</em></span>
            <span class="val" id="val-a">${p.a.toFixed(1)}</span>
          </div>
          <input type="range" id="sl-a" min="0.8" max="4" step="0.1" value="${p.a}">
        </div>
        <div class="slider-row">
          <div class="slider-label">
            <span class="name">虚半轴 <em>b</em></span>
            <span class="val" id="val-b">${p.b.toFixed(1)}</span>
          </div>
          <input type="range" id="sl-b" min="0.5" max="4" step="0.1" value="${p.b}">
        </div>`;
      document.getElementById('sl-a').addEventListener('input', e => {
        p.a = parseFloat(e.target.value);
        document.getElementById('val-a').textContent = p.a.toFixed(1);
        board.update(); updateInfo();
      });
      document.getElementById('sl-b').addEventListener('input', e => {
        p.b = parseFloat(e.target.value);
        document.getElementById('val-b').textContent = p.b.toFixed(1);
        board.update(); updateInfo();
      });

    } else { // parabola
      const p = P.parabola;
      c.innerHTML = `
        <div class="slider-row">
          <div class="slider-label">
            <span class="name">焦准距 <em>p</em></span>
            <span class="val" id="val-p">${p.p.toFixed(1)}</span>
          </div>
          <input type="range" id="sl-p" min="0.4" max="3" step="0.1" value="${p.p}">
        </div>`;
      document.getElementById('sl-p').addEventListener('input', e => {
        p.p = parseFloat(e.target.value);
        document.getElementById('val-p').textContent = p.p.toFixed(1);
        board.update(); updateInfo();
      });
    }
  }

  /* ========== 椭圆 ========== */
  function buildEllipse() {
    const p = P.ellipse;
    const getC = () => Math.sqrt(Math.max(0.0001, p.a * p.a - p.b * p.b));

    // 引导曲线（虚线）
    const guide = board.create('curve', [
      t => p.a * Math.cos(t), t => p.b * Math.sin(t), 0, 2 * Math.PI
    ], { strokeColor: '#cbd5e1', strokeWidth: 1, dash: 2, highlight: false });
    elements.push(guide);

    // 动态轨迹（蓝色实线）
    const trace = board.create('curve', [
      t => p.a * Math.cos(t), t => p.b * Math.sin(t),
      0, () => Math.max(0.001, animT)
    ], { strokeColor: '#2563eb', strokeWidth: 2.5, highlight: false });
    elements.push(trace);

    // 焦点
    const F1 = board.create('point', [() => -getC(), 0], {
      name: 'F₁', size: 4, fillColor: '#dc2626', strokeColor: '#fff', strokeWidth: 1.5,
      fixed: true, showInfoBox: false, label: { offset: [-14, -12], fontSize: 13 }
    });
    const F2 = board.create('point', [() => getC(), 0], {
      name: 'F₂', size: 4, fillColor: '#dc2626', strokeColor: '#fff', strokeWidth: 1.5,
      fixed: true, showInfoBox: false, label: { offset: [8, -12], fontSize: 13 }
    });
    elements.push(F1, F2);

    // 顶点
    const vOpts = { size: 3, fillColor: '#94a3b8', strokeColor: '#fff', strokeWidth: 1,
      fixed: true, showInfoBox: false, label: { fontSize: 11 } };
    const A1 = board.create('point', [() => -p.a, 0],
      Object.assign({}, vOpts, { name: 'A₁', label: { offset: [-10, -12], fontSize: 11 } }));
    const A2 = board.create('point', [() => p.a, 0],
      Object.assign({}, vOpts, { name: 'A₂', label: { offset: [6, -12], fontSize: 11 } }));
    const B1 = board.create('point', [0, () => -p.b],
      Object.assign({}, vOpts, { name: 'B₁', label: { offset: [-10, -12], fontSize: 11 } }));
    const B2 = board.create('point', [0, () => p.b],
      Object.assign({}, vOpts, { name: 'B₂', label: { offset: [6, 6], fontSize: 11 } }));
    elements.push(A1, A2, B1, B2);

    // 动点 P
    const Ppt = board.create('point', [
      () => p.a * Math.cos(animT), () => p.b * Math.sin(animT)
    ], {
      name: 'P', size: 5, fillColor: '#ea580c', strokeColor: '#fff', strokeWidth: 2,
      fixed: true, showInfoBox: false, label: { offset: [8, 8], fontSize: 13, cssStyle: 'font-weight:600;color:#ea580c' }
    });
    elements.push(Ppt);
    animPoint = Ppt;

    // 距离连线
    const l1 = board.create('segment', [Ppt, F1], {
      strokeColor: '#94a3b8', strokeWidth: 1.5, dash: 1, strokeOpacity: 0.6, highlight: false
    });
    const l2 = board.create('segment', [Ppt, F2], {
      strokeColor: '#94a3b8', strokeWidth: 1.5, dash: 1, strokeOpacity: 0.6, highlight: false
    });
    elements.push(l1, l2);

    // 距离标签
    const dl = board.create('text', [
      () => Ppt.X() + 0.3, () => Ppt.Y() + 0.4,
      () => {
        const d1 = dist(Ppt, F1), d2 = dist(Ppt, F2);
        return '|PF₁|+|PF₂|=' + d1.toFixed(2) + '+' + d2.toFixed(2) + '=' + (d1 + d2).toFixed(2);
      }
    ], { fontSize: 12, cssClass: 'dist-label', anchorX: 'left', highlight: false });
    elements.push(dl);
  }

  /* ========== 双曲线 ========== */
  function buildHyperbola() {
    const p = P.hyperbola;
    const getC = () => Math.sqrt(p.a * p.a + p.b * p.b);

    // 引导曲线 — 右支
    const guideR = board.create('curve', [
      t => p.a * Math.cosh(t), t => p.b * Math.sinh(t), -2.5, 2.5
    ], { strokeColor: '#cbd5e1', strokeWidth: 1, dash: 2, highlight: false });
    // 引导曲线 — 左支
    const guideL = board.create('curve', [
      t => -p.a * Math.cosh(t), t => p.b * Math.sinh(t), -2.5, 2.5
    ], { strokeColor: '#cbd5e1', strokeWidth: 1, dash: 2, highlight: false });
    elements.push(guideR, guideL);

    // 动态轨迹（右支，从顶点向外延伸）
    const trace = board.create('curve', [
      t => p.a * Math.cosh(t), t => p.b * Math.sinh(t),
      () => Math.min(0, animT), () => Math.max(0, animT) || 0.001
    ], { strokeColor: '#2563eb', strokeWidth: 2.5, highlight: false });
    elements.push(trace);

    // 渐近线
    const asy1 = board.create('line', [[0, 0], [1, () => p.b / p.a]], {
      strokeColor: '#16a34a', strokeWidth: 1, dash: 3, strokeOpacity: 0.5, highlight: false,
      straightFirst: true, straightLast: true
    });
    const asy2 = board.create('line', [[0, 0], [1, () => -p.b / p.a]], {
      strokeColor: '#16a34a', strokeWidth: 1, dash: 3, strokeOpacity: 0.5, highlight: false,
      straightFirst: true, straightLast: true
    });
    elements.push(asy1, asy2);

    // 焦点
    const F1 = board.create('point', [() => -getC(), 0], {
      name: 'F₁', size: 4, fillColor: '#dc2626', strokeColor: '#fff', strokeWidth: 1.5,
      fixed: true, showInfoBox: false, label: { offset: [-14, -12], fontSize: 13 }
    });
    const F2 = board.create('point', [() => getC(), 0], {
      name: 'F₂', size: 4, fillColor: '#dc2626', strokeColor: '#fff', strokeWidth: 1.5,
      fixed: true, showInfoBox: false, label: { offset: [8, -12], fontSize: 13 }
    });
    elements.push(F1, F2);

    // 顶点
    const vOpts = { size: 3, fillColor: '#94a3b8', strokeColor: '#fff', strokeWidth: 1,
      fixed: true, showInfoBox: false };
    const A1 = board.create('point', [() => -p.a, 0],
      Object.assign({}, vOpts, { name: 'A₁', label: { offset: [-10, -12], fontSize: 11 } }));
    const A2 = board.create('point', [() => p.a, 0],
      Object.assign({}, vOpts, { name: 'A₂', label: { offset: [6, -12], fontSize: 11 } }));
    elements.push(A1, A2);

    // 动点 P（右支上）
    const Ppt = board.create('point', [
      () => p.a * Math.cosh(animT), () => p.b * Math.sinh(animT)
    ], {
      name: 'P', size: 5, fillColor: '#ea580c', strokeColor: '#fff', strokeWidth: 2,
      fixed: true, showInfoBox: false, label: { offset: [8, 8], fontSize: 13, cssStyle: 'font-weight:600;color:#ea580c' }
    });
    elements.push(Ppt);
    animPoint = Ppt;

    // 距离连线
    const l1 = board.create('segment', [Ppt, F1], {
      strokeColor: '#94a3b8', strokeWidth: 1.5, dash: 1, strokeOpacity: 0.6, highlight: false
    });
    const l2 = board.create('segment', [Ppt, F2], {
      strokeColor: '#94a3b8', strokeWidth: 1.5, dash: 1, strokeOpacity: 0.6, highlight: false
    });
    elements.push(l1, l2);

    // 距离标签
    const dl = board.create('text', [
      () => Ppt.X() + 0.3, () => Ppt.Y() + 0.4,
      () => {
        const d1 = dist(Ppt, F1), d2 = dist(Ppt, F2);
        return '||PF₁|-|PF₂||=' + Math.abs(d1 - d2).toFixed(2) + '=2a=' + (2 * p.a).toFixed(2);
      }
    ], { fontSize: 12, cssClass: 'dist-label', anchorX: 'left', highlight: false });
    elements.push(dl);
  }

  /* ========== 抛物线 ========== */
  function buildParabola() {
    const p = P.parabola;

    // 引导曲线 y² = 4px → 参数式 x=pt², y=2pt
    const guide = board.create('curve', [
      t => p.p * t * t, t => 2 * p.p * t, -3, 3
    ], { strokeColor: '#cbd5e1', strokeWidth: 1, dash: 2, highlight: false });
    elements.push(guide);

    // 动态轨迹
    const trace = board.create('curve', [
      t => p.p * t * t, t => 2 * p.p * t,
      () => Math.min(0, animT), () => Math.max(0, animT) || 0.001
    ], { strokeColor: '#2563eb', strokeWidth: 2.5, highlight: false });
    elements.push(trace);

    // 准线 x = -p（绿色虚线）
    const directrix = board.create('line', [
      [() => -p.p, -4], [() => -p.p, 4]
    ], {
      strokeColor: '#16a34a', strokeWidth: 1.5, dash: 3, strokeOpacity: 0.6,
      straightFirst: false, straightLast: false, highlight: false
    });
    elements.push(directrix);

    // 准线标签
    const dlabel = board.create('text', [
      () => -p.p, 4.3, '准线 x=-p'
    ], { fontSize: 11, color: '#16a34a', anchorX: 'middle', highlight: false });
    elements.push(dlabel);

    // 焦点
    const F = board.create('point', [() => p.p, 0], {
      name: 'F', size: 4, fillColor: '#dc2626', strokeColor: '#fff', strokeWidth: 1.5,
      fixed: true, showInfoBox: false, label: { offset: [8, -12], fontSize: 13 }
    });
    elements.push(F);

    // 顶点
    const V = board.create('point', [0, 0], {
      name: 'O', size: 3, fillColor: '#94a3b8', strokeColor: '#fff', strokeWidth: 1,
      fixed: true, showInfoBox: false, label: { offset: [-10, -12], fontSize: 11 }
    });
    elements.push(V);

    // 动点 P
    const Ppt = board.create('point', [
      () => p.p * animT * animT, () => 2 * p.p * animT
    ], {
      name: 'P', size: 5, fillColor: '#ea580c', strokeColor: '#fff', strokeWidth: 2,
      fixed: true, showInfoBox: false, label: { offset: [8, 8], fontSize: 13, cssStyle: 'font-weight:600;color:#ea580c' }
    });
    elements.push(Ppt);
    animPoint = Ppt;

    // P 到焦点的连线
    const lF = board.create('segment', [Ppt, F], {
      strokeColor: '#94a3b8', strokeWidth: 1.5, dash: 1, strokeOpacity: 0.6, highlight: false
    });
    elements.push(lF);

    // P 到准线的垂线段
    const foot = board.create('point', [() => -p.p, () => Ppt.Y()], {
      visible: false, fixed: true
    });
    const lD = board.create('segment', [Ppt, foot], {
      strokeColor: '#94a3b8', strokeWidth: 1.5, dash: 1, strokeOpacity: 0.6, highlight: false
    });
    elements.push(foot, lD);

    // 距离标签
    const dl = board.create('text', [
      () => Ppt.X() + 0.3, () => Ppt.Y() + 0.4,
      () => {
        const dF = dist(Ppt, F);
        const dD = Ppt.X() + p.p; // 到准线 x=-p 的距离
        return '|PF|=' + dF.toFixed(2) + '  |P到准线|=' + dD.toFixed(2);
      }
    ], { fontSize: 12, cssClass: 'dist-label', anchorX: 'left', highlight: false });
    elements.push(dl);
  }

  /* ========== 方程与性质更新 ========== */
  function updateInfo() {
    const eqDiv = document.getElementById('equation-display');
    const propDiv = document.getElementById('properties-display');

    if (currentMode === 'ellipse') {
      const p = P.ellipse;
      const c = Math.sqrt(Math.max(0.0001, p.a * p.a - p.b * p.b));
      const e = c / p.a;
      eqDiv.innerHTML = '\\[\\frac{x^2}{' + (p.a * p.a).toFixed(2) + '} + \\frac{y^2}{' + (p.b * p.b).toFixed(2) + '} = 1\\]';
      propDiv.innerHTML =
        propRow('焦距', 'c = √(a²-b²) = ' + c.toFixed(2)) +
        propRow('焦点', 'F₁(' + (-c).toFixed(2) + ', 0)  F₂(' + c.toFixed(2) + ', 0)') +
        propRow('离心率', 'e = c/a = ' + e.toFixed(3), 'highlight') +
        propRow('定义', '|PF₁| + |PF₂| = 2a = ' + (2 * p.a).toFixed(2));
    } else if (currentMode === 'hyperbola') {
      const p = P.hyperbola;
      const c = Math.sqrt(p.a * p.a + p.b * p.b);
      const e = c / p.a;
      eqDiv.innerHTML = '\\[\\frac{x^2}{' + (p.a * p.a).toFixed(2) + '} - \\frac{y^2}{' + (p.b * p.b).toFixed(2) + '} = 1\\]';
      propDiv.innerHTML =
        propRow('焦距', 'c = √(a²+b²) = ' + c.toFixed(2)) +
        propRow('焦点', 'F₁(' + (-c).toFixed(2) + ', 0)  F₂(' + c.toFixed(2) + ', 0)') +
        propRow('离心率', 'e = c/a = ' + e.toFixed(3), 'highlight') +
        propRow('渐近线', 'y = ±(' + p.b.toFixed(1) + '/' + p.a.toFixed(1) + ')x', 'green') +
        propRow('定义', '||PF₁| - |PF₂|| = 2a = ' + (2 * p.a).toFixed(2));
    } else {
      const p = P.parabola;
      eqDiv.innerHTML = '\\[y^2 = ' + (4 * p.p).toFixed(1) + 'x\\]';
      propDiv.innerHTML =
        propRow('焦点', 'F(' + p.p.toFixed(2) + ', 0)') +
        propRow('准线', 'x = ' + (-p.p).toFixed(2), 'green') +
        propRow('离心率', 'e = 1', 'highlight') +
        propRow('焦准距', 'p = ' + p.p.toFixed(2)) +
        propRow('定义', '|PF| = |P到准线距离|');
    }

    // MathJax 重新渲染
    if (window.MathJax) {
      const typeset = () => {
        if (MathJax.typesetPromise) {
          MathJax.typesetPromise([eqDiv]).catch(() => {});
        }
      };
      if (MathJax.startup) {
        MathJax.startup.promise.then(typeset);
      } else {
        typeset();
      }
    }
  }

  function propRow(key, val, cls) {
    return '<div class="prop-row"><span class="prop-key">' + key +
      '</span><span class="prop-val' + (cls ? ' ' + cls : '') + '">' + val + '</span></div>';
  }
})();
</script>
</body>
</html>
