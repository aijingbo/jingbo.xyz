<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中外历史对照时间轴 · 教育可视化</title>
<!-- vis-timeline 样式（CDN） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-timeline@7/styles/vis-timeline-graph2d.min.css">
<style>
  :root{
    --bg:#f8f9fa; --card:#ffffff; --ink:#0f172a; --ink-2:#475569; --ink-3:#94a3b8; --line:#e2e8f0;
    /* 中国事件：红色系 */
    --cn-politics:#dc2626; --cn-culture:#ea580c; --cn-tech:#ca8a04; --cn-military:#991b1b;
    /* 世界事件：蓝色系 */
    --wd-politics:#2563eb; --wd-culture:#0891b2; --wd-tech:#7c3aed; --wd-military:#1e40af;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
  .page{max-width:1440px;margin:0 auto;padding:18px 24px 14px}

  /* ============ 顶部：标题 + 控制区 ============ */
  header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 22px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 20px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .title h1{font-size:21px;font-weight:700;letter-spacing:.5px}
  .title h1 .cn{color:var(--cn-politics)}
  .title h1 .wd{color:var(--wd-politics)}
  .title p{color:var(--ink-3);font-size:12.5px;margin-top:5px}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-left:auto}
  #era-select{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--ink-2);font:inherit;font-size:13px;cursor:pointer}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);
    background:#fff;color:var(--ink-2);font:inherit;font-size:13px;cursor:pointer;transition:all .15s}
  .chips button:hover{border-color:#cbd5e1;color:var(--ink)}
  .chips button.active{background:var(--ink);border-color:var(--ink);color:#fff}
  #reset-btn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--ink-2);font:inherit;font-size:13px;cursor:pointer}
  #reset-btn:hover{color:var(--ink);border-color:#cbd5e1}

  /* ============ 时间轴主体 ============ */
  .timeline-card{margin-top:14px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.05);overflow:hidden}
  #timeline{height:600px}
  .vis-timeline{border:none!important;font-family:inherit}
  /* 左侧分组标签 */
  .vis-labelset .vis-label{color:var(--ink)}
  .gl{display:inline-block;font-weight:700;font-size:14px;padding:10px 10px;border-radius:6px}
  .gl-cn{color:var(--cn-politics);border-left:4px solid var(--cn-politics)}
  .gl-wd{color:var(--wd-politics);border-left:4px solid var(--wd-politics)}
  /* 事件卡片通用 */
  .vis-item{border-radius:6px;font-size:12px;border-width:1.5px;cursor:pointer;
    transition:box-shadow .18s ease,transform .18s ease}
  .vis-item .vis-item-content{padding:2px 8px}
  .vis-item:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(15,23,42,.18);z-index:60}
  .vis-item.vis-selected{border-color:var(--ink)!important;background:#fff!important;
    color:var(--ink)!important;box-shadow:0 8px 20px rgba(15,23,42,.22)}
  /* 重大事件高亮：加粗 + 星标 */
  .vis-item.major{font-weight:700}
  .vis-item.major .vis-item-content::before{content:"★ ";font-size:11px}
  /* 中国事件（红色系） */
  .vis-item.cn-politics{border-color:var(--cn-politics);background:rgba(220,38,38,.08);color:#7f1d1d}
  .vis-item.cn-culture {border-color:var(--cn-culture); background:rgba(234,88,12,.08); color:#7c2d12}
  .vis-item.cn-tech    {border-color:var(--cn-tech);    background:rgba(202,138,4,.10);color:#713f12}
  .vis-item.cn-military{border-color:var(--cn-military);background:rgba(153,27,27,.08);color:#7f1d1d}
  .vis-item.vis-range.cn-politics{background:rgba(220,38,38,.16)}
  .vis-item.vis-range.cn-culture {background:rgba(234,88,12,.16)}
  .vis-item.vis-range.cn-tech    {background:rgba(202,138,4,.18)}
  .vis-item.vis-range.cn-military{background:rgba(153,27,27,.16)}
  /* 世界事件（蓝色系） */
  .vis-item.wd-politics{border-color:var(--wd-politics);background:rgba(37,99,235,.08);color:#1e3a8a}
  .vis-item.wd-culture {border-color:var(--wd-culture); background:rgba(8,145,178,.08);color:#164e63}
  .vis-item.wd-tech    {border-color:var(--wd-tech);    background:rgba(124,58,237,.08);color:#4c1d95}
  .vis-item.wd-military{border-color:var(--wd-military);background:rgba(30,64,175,.08);color:#1e3a8a}
  .vis-item.vis-range.wd-politics{background:rgba(37,99,235,.15)}
  .vis-item.vis-range.wd-culture {background:rgba(8,145,178,.15)}
  .vis-item.vis-range.wd-tech    {background:rgba(124,58,237,.15)}
  .vis-item.vis-range.wd-military{background:rgba(30,64,175,.15)}
  /* 朝代 / 时代背景带（斑马纹 + 顶部小字，窄带自动裁切） */
  .vis-item.era-band{border:none;border-radius:0;overflow:hidden;border-right:1px solid rgba(148,163,184,.18)}
  .vis-item.era-band .vis-item-content{position:absolute;top:1px;left:4px;padding:0;
    font-size:11px;color:rgba(100,116,139,.6);white-space:nowrap}
  .vis-item.era-cn-a{background:rgba(220,38,38,.045)}
  .vis-item.era-cn-b{background:rgba(220,38,38,.095)}
  .vis-item.era-wd-a{background:rgba(37,99,235,.045)}
  .vis-item.era-wd-b{background:rgba(37,99,235,.095)}
  /* 时间轴刻度：浅灰 */
  .vis-time-axis .vis-text{color:var(--ink-3)!important;font-size:11px}
  .vis-time-axis .vis-text.vis-major{color:var(--ink-2)!important;font-weight:600}
  .vis-grid.vis-minor{border-color:#f1f5f9}
  .vis-grid.vis-major{border-color:#e2e8f0}
  /* 中外关联连线层 */
  #link-layer{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
  .link-label{font-size:11px;fill:#64748b;paint-order:stroke;stroke:#fff;stroke-width:3px}

  /* ============ 底部：图例 + 操作提示 ============ */
  footer{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 20px;font-size:12px;color:var(--ink-2)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .sep{width:1px;height:16px;background:var(--line)}
  .hints{margin-left:auto;color:var(--ink-3);white-space:nowrap}

  /* ============ 详情弹层：毛玻璃卡片 ============ */
  #modal-mask{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:rgba(248,250,252,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease}
  #modal-mask.show{opacity:1;visibility:visible}
  #modal-card{position:relative;width:min(540px,92vw);background:rgba(255,255,255,.88);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.75);border-radius:16px;padding:24px 26px;
    box-shadow:0 24px 60px rgba(15,23,42,.25);
    transform:translateY(16px) scale(.97);transition:transform .3s cubic-bezier(.22,1,.36,1)}
  #modal-mask.show #modal-card{transform:none}
  #modal-close{position:absolute;top:10px;right:14px;border:none;background:transparent;
    font-size:24px;color:var(--ink-3);cursor:pointer;line-height:1}
  #modal-close:hover{color:var(--ink)}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;color:#fff;margin-right:6px}
  .badge.era{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
  #m-title{margin:12px 0 6px;font-size:20px}
  #m-time{font-size:12.5px;color:var(--ink-3);margin-bottom:10px}
  #m-desc{font-size:14px;line-height:1.85}
  #m-detail{font-size:13px;line-height:1.85;color:var(--ink-2);
    border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
  #m-rel{font-size:12.5px;margin-top:12px;color:var(--ink-2)}
  #m-rel a{color:var(--wd-politics);cursor:pointer;text-decoration:none;border-bottom:1px dashed rgba(37,99,235,.5)}
  #m-rel a:hover{border-bottom-style:solid}

  @media(max-width:1100px){
    #timeline{height:520px}
    .controls{margin-left:0}
    .hints{margin-left:0}
  }
</style>
</head>
<body>
<div class="page">

  <!-- 顶部：标题 + 时代跳转 + 分类筛选 -->
  <header class="top">
    <div class="title">
      <h1>📜 <span class="cn">中国</span> × <span class="wd">世界</span> 历史对照时间轴</h1>
      <p>同一时间维度并置中外重大事件 · 公元前 3000 年 — 公元 2026 年 · <span id="ev-count"></span> 个关键事件</p>
    </div>
    <div class="controls">
      <select id="era-select" title="按时代跳转">
        <option value="" selected>⏳ 跳转到时代…</option>
      </select>
      <div class="chips" id="cat-chips">
        <button data-cat="all" class="active">全部</button>
        <button data-cat="politics">政治</button>
        <button data-cat="culture">文化</button>
        <button data-cat="tech">科技</button>
        <button data-cat="military">军事</button>
      </div>
      <button id="reset-btn" title="回到完整时间范围">重置视图</button>
    </div>
  </header>

  <!-- 中部：双轨时间轴（上轨中国 / 下轨世界） -->
  <div class="timeline-card">
    <div id="timeline"></div>
  </div>

  <!-- 底部：图例 + 操作提示 -->
  <footer>
    <div class="legend">
      <span class="lg"><b>中国</b></span>
      <span class="lg"><span class="dot" style="background:#dc2626"></span>政治</span>
      <span class="lg"><span class="dot" style="background:#ea580c"></span>文化</span>
      <span class="lg"><span class="dot" style="background:#ca8a04"></span>科技</span>
      <span class="lg"><span class="dot" style="background:#991b1b"></span>军事</span>
      <span class="sep"></span>
      <span class="lg"><b>世界</b></span>
      <span class="lg"><span class="dot" style="background:#2563eb"></span>政治</span>
      <span class="lg"><span class="dot" style="background:#0891b2"></span>文化</span>
      <span class="lg"><span class="dot" style="background:#7c3aed"></span>科技</span>
      <span class="lg"><span class="dot" style="background:#1e40af"></span>军事</span>
      <span class="sep"></span>
      <span class="lg">★ 重大事件</span>
      <span class="lg" style="color:#94a3b8">╌ 虚线 = 中外关联事件</span>
    </div>
    <div class="hints">🖱 滚轮缩放 · 拖拽平移 · 点击事件查看详情</div>
  </footer>
</div>

<!-- 详情弹层 -->
<div id="modal-mask">
  <div id="modal-card">
    <button id="modal-close" title="关闭">×</button>
    <div><span class="badge" id="m-cat"></span><span class="badge era" id="m-era"></span></div>
    <h2 id="m-title"></h2>
    <div id="m-time"></div>
    <p id="m-desc"></p>
    <p id="m-detail"></p>
    <p id="m-rel"></p>
  </div>
</div>

<!-- vis-timeline 库（CDN） -->
<script src="https://cdn.jsdelivr.net/npm/vis-timeline@7/standalone/umd/vis-timeline-graph2d.min.js"></script>
<script>
/* ============================================================
 * 基础工具：支持公元前的日期构造（天文纪年：公元前 N 年 = 年份 1-N）
 * 注意：必须用 setFullYear，否则 0-99 年会被当作 19xx 年
 * ============================================================ */
function mkDate(y, m, d){
  const dt = new Date(2000, (m||1)-1, d||1);
  dt.setFullYear(y, (m||1)-1, d||1);
  dt.setHours(0, 0, 0, 0);
  return dt;
}
const bc = (y, m, d) => mkDate(1 - y, m, d);  // 公元前 y 年
const ad = (y, m, d) => mkDate(y, m, d);       // 公元 y 年

/* ============================================================
 * 事件数据（cat: politics 政治 / culture 文化 / tech 科技 / military 军事）
 * g: cn 中国（上轨）/ wd 世界（下轨）；major: 重大事件；circa: 约年
 * ============================================================ */
const CN = [
  {id:1, s:bc(2070), e:bc(1600), t:'夏朝建立', cat:'politics', era:'夏', major:1, circa:1,
   desc:'约公元前 2070 年，禹建立夏朝——中国史书记载的第一个世袭制王朝，“家天下”自此开始。',
   detail:'夏朝奠定了早期国家的雏形，二里头遗址被普遍认为与夏文化相关，世袭制取代禅让制。'},
  {id:2, s:bc(1600), e:bc(1046), t:'商朝与甲骨文', cat:'culture', era:'商', major:1, circa:1,
   desc:'约公元前 1600 年汤灭夏建商。殷墟甲骨文是中国已知最早的成熟文字，青铜文明高度发达。',
   detail:'甲骨卜辞记录了商王室的祭祀、战争与农事，把中国有文字可考的信史推进到三千三百年前。'},
  {id:3, s:bc(1046), t:'武王伐纣 · 西周建立', cat:'military', era:'西周', circa:1,
   desc:'公元前 1046 年，周武王在牧野之战中击败商纣王，建立周朝，定都镐京。',
   detail:'西周确立分封制与宗法制，“普天之下，莫非王土”的政治格局延续数百年。'},
  {id:4, s:bc(770), e:bc(476), t:'春秋时代', cat:'politics', era:'春秋',
   desc:'周平王东迁洛邑后王室衰微，齐桓公、晋文公等诸侯相继称霸。',
   detail:'春秋时期礼崩乐坏、百家争鸣萌芽，铁器与牛耕逐步推广，社会剧烈变革。'},
  {id:5, s:bc(551,9,28), t:'孔子诞生', cat:'culture', era:'春秋', major:1, circa:1,
   desc:'公元前 551 年，孔子生于鲁国陬邑（今山东曲阜），创立儒家学派。',
   detail:'孔子主张“仁”与“礼”，开创私学，其思想深刻塑造了此后两千多年的中国文明与东亚文化圈。'},
  {id:6, s:bc(475), e:bc(221), t:'战国时代', cat:'military', era:'战国',
   desc:'韩、赵、魏、楚、燕、齐、秦七雄并立，合纵连横，战争规模空前。',
   detail:'战国变法运动（如商鞅变法）推动中央集权形成，为秦统一中国奠定基础。'},
  {id:7, s:bc(221), t:'秦统一六国', cat:'politics', era:'秦', major:1,
   desc:'公元前 221 年，秦王嬴政灭六国，建立中国历史上第一个中央集权的统一王朝。',
   detail:'秦推行郡县制，统一文字、度量衡与车轨，修筑长城，奠定中国两千余年政治制度的基本格局。'},
  {id:8, s:bc(138), e:bc(115), t:'张骞通西域 · 丝绸之路', cat:'culture', era:'西汉', major:1,
   desc:'汉武帝遣张骞两次出使西域，“凿空”之举开辟贯通东西的丝绸之路。',
   detail:'丝绸之路促进中原与中亚、西亚乃至罗马帝国的交流，葡萄、苜蓿、佛教等相继传入中国。'},
  {id:9, s:bc(141), e:bc(87), t:'汉武帝在位', cat:'politics', era:'西汉',
   desc:'汉武帝刘彻在位 54 年：罢黜百家、北击匈奴、开疆拓土。',
   detail:'独尊儒术确立儒家的官方地位，盐铁官营强化中央财政，汉帝国成为与罗马东西辉映的大帝国。'},
  {id:10, s:ad(105), t:'蔡伦改进造纸术', cat:'tech', era:'东汉', major:1,
   desc:'公元 105 年，蔡伦改进造纸工艺，制成轻便廉价的“蔡侯纸”。',
   detail:'造纸术后来经阿拉伯传入欧洲，取代昂贵的羊皮纸，为世界文明的传播提供了革命性载体。'},
  {id:11, s:ad(220), e:ad(280), t:'三国鼎立', cat:'military', era:'三国',
   desc:'魏、蜀、吴三国鼎立，官渡、赤壁等大战奠定天下格局。',
   detail:'这一时期英雄辈出，《三国演义》使其成为中国民间最熟悉的历史时代之一。'},
  {id:12, s:ad(605), t:'科举制度确立', cat:'politics', era:'隋',
   desc:'隋炀帝设进士科，科举制度正式形成，选官打破门第垄断。',
   detail:'科举延续约 1300 年，是世界影响最深远的文官选拔制度，并启发了西方近代文官制度。'},
  {id:13, s:ad(605), e:ad(610), t:'大运河开凿', cat:'tech', era:'隋',
   desc:'隋炀帝征发民夫开凿大运河，贯通海河、黄河、淮河、长江、钱塘江五大水系。',
   detail:'全长 2700 多公里的大运河成为此后千年的南北经济命脉，部分河段至今仍在通航。'},
  {id:14, s:ad(618), t:'唐朝建立', cat:'politics', era:'唐', major:1,
   desc:'李渊称帝建唐，随后的贞观之治、开元盛世将唐朝推向鼎盛。',
   detail:'长安成为当时世界最大的国际都会，诗赋、律令、佛教艺术全面繁荣，影响远及日本、朝鲜。'},
  {id:15, s:ad(629), e:ad(645), t:'玄奘西行取经', cat:'culture', era:'唐',
   desc:'玄奘自长安出发，历经 17 年往返天竺取经，归国后译经千卷。',
   detail:'《大唐西域记》记录了中亚与印度的地理风土，是研究古代丝绸之路的第一手资料。'},
  {id:16, s:ad(1045), t:'毕昇发明活字印刷', cat:'tech', era:'北宋', major:1, circa:1,
   desc:'北宋庆历年间，毕昇发明泥活字印刷术，比欧洲古腾堡早约 400 年。',
   detail:'活字印刷大幅降低书籍成本、推动知识普及；印刷术西传深刻影响了欧洲文艺复兴与宗教改革。'},
  {id:17, s:ad(960), t:'北宋建立', cat:'politics', era:'北宋',
   desc:'赵匡胤陈桥兵变建立宋朝，重文轻武、完善科举，经济文化高度繁荣。',
   detail:'宋代商品经济发达，出现世界最早的纸币“交子”，火药、指南针广泛应用，被史学家称为“中国的文艺复兴”。'},
  {id:18, s:ad(1271), t:'元朝建立', cat:'politics', era:'元',
   desc:'忽必烈定国号“大元”，建立横跨欧亚的庞大帝国，定都大都（今北京）。',
   detail:'元代驿站贯通欧亚，马可·波罗等西方旅行者来华，东西方直接交流空前活跃。'},

/* ============================================================
 * 时间轴刻度格式化：支持“公元前”显示
 * （vis 传入的是 moment 对象，这里做鸭子类型兼容）
 * ============================================================ */
function ymd(d){
  if (typeof d.year === 'function') return {y:d.year(), m:d.month()+1, day:d.date()};
  return {y:d.getFullYear(), m:d.getMonth()+1, day:d.getDate()};
}
function axisMinor(date, scale){
  const t = ymd(date);
  const yr = t.y <= 0 ? '前' + (1 - t.y) : String(t.y);
  if (scale === 'month') return t.m + '月';
  if (scale === 'weekday' || scale === 'day' || scale === 'week') return t.m + '月' + t.day + '日';
  if (scale === 'hour' || scale === 'minute' || scale === 'second' || scale === 'millisecond') return '';
  return yr;
}
function axisMajor(date){
  const t = ymd(date);
  return t.y <= 0 ? '公元前' + (1 - t.y) + '年' : '公元' + t.y + '年';
}

/* ============================================================
 * 构建 vis-timeline
 * ============================================================ */
function toItem(e){
  return {
    id: e.id, group: e.g, start: e.s, end: e.e || undefined,
    content: e.t, className: e.g + '-' + e.cat + (e.major ? ' major' : ''),
    type: e.e ? 'range' : 'box'
  };
}
/* 朝代 / 时代背景带（按组分别交替斑马纹） */
function eraItems(){
  const out = [], cnt = {cn:0, wd:0};
  ERAS.forEach((er, i) => {
    const zebra = cnt[er.g]++ % 2 ? 'b' : 'a';
    out.push({
      id: 'era-' + i, group: er.g, start: er.s, end: er.e,
      content: er.name, type: 'background', className: 'era-band era-' + er.g + '-' + zebra
    });
  });
  return out;
}

  const btn = ev.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#cat-chips button').forEach(b => b.classList.toggle('active', b === btn));
  const cat = btn.dataset.cat;
  const filtered = ALL.filter(e => cat === 'all' || e.cat === cat).map(toItem);
  items.clear();
  items.add(filtered.concat(eraItems()));
  drawLinks();
});

/* ============================================================
 * 时代跳转（下拉菜单选择朝代 / 时代）
 * ============================================================ */
const eraSelect = document.getElementById('era-select');
[['中国朝代','cn'], ['世界时代','wd']].forEach(([label, g]) => {
  const og = document.createElement('optgroup');
  og.label = label;
  ERAS.forEach((er, i) => {
    if (er.g !== g) return;
    const o = document.createElement('option');
    o.value = i;
    o.textContent = er.name;
    og.appendChild(o);
  });
  eraSelect.appendChild(og);
});
eraSelect.addEventListener('change', () => {
  const er = ERAS[+eraSelect.value];
  if (er) timeline.setWindow(er.s, er.e, {animation: {duration: 600, easingFunction: 'easeInOutQuad'}});
  setTimeout(() => { eraSelect.selectedIndex = 0; }, 650);  // 复位便于再次选择
});

/* 重置视图 */
document.getElementById('reset-btn').addEventListener('click', () => {
  timeline.setWindow(HOME_START, HOME_END, {animation: {duration: 600, easingFunction: 'easeInOutQuad'}});
});

/* ============================================================
 * 详情弹层（毛玻璃卡片，300ms 动画）
 * ============================================================ */
const mask = document.getElementById('modal-mask');
const mCat = document.getElementById('m-cat'), mEra = document.getElementById('m-era'),
      mTitle = document.getElementById('m-title'), mTime = document.getElementById('m-time'),
      mDesc = document.getElementById('m-desc'), mDetail = document.getElementById('m-detail'),
      mRel = document.getElementById('m-rel');

function fmtD(d, circa){
  const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
  let s = (y <= 0 ? '公元前' + (1 - y) : y) + '年';
  if (!(m === 1 && day === 1)) s += m + '月' + day + '日';
  return (circa ? '约 ' : '') + s;
}
function openModal(e){
  mCat.textContent = CATNAMES[e.cat];
  mCat.style.background = CATCOLORS[e.g + '-' + e.cat];
  mEra.textContent = (e.g === 'cn' ? '中国 · ' : '世界 · ') + e.era;
  mTitle.textContent = (e.major ? '★ ' : '') + e.t;
  mTime.textContent = fmtD(e.s, e.circa) + (e.e ? ' — ' + fmtD(e.e, e.circa) : '');
  mDesc.textContent = e.desc;
  mDetail.textContent = e.detail || '';
  mDetail.style.display = e.detail ? '' : 'none';
  /* 关联事件入口 */
  mRel.innerHTML = '';
  const rels = RELMAP[e.id];
  if (rels) {
    mRel.appendChild(document.createTextNode('🔗 关联对照：'));
    rels.forEach(r => {
      const a = document.createElement('a');
      a.textContent = byId[r.other].t + '（' + r.label + '）';
      a.addEventListener('click', () => {
        timeline.focus(r.other, {animation: {duration: 600}});
        timeline.setSelection([r.other]);
        openModal(byId[r.other]);
      });
      mRel.appendChild(a);
    });
  }
  mask.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  mask.classList.remove('show');
  document.body.style.overflow = '';
  timeline.setSelection([]);
}
timeline.on('select', ({items: sel}) => {
  if (sel.length && byId[sel[0]]) openModal(byId[sel[0]]);
});
document.getElementById('modal-close').addEventListener('click', closeModal);
mask.addEventListener('click', ev => { if (ev.target === mask) closeModal(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });

/* ============================================================
 * 中外关联连线：在两个事件卡片之间绘制贝塞尔虚线
 * （SVG 覆盖在时间轴中心区域上，随缩放 / 平移实时重绘）
 * ============================================================ */
const tlEl = document.getElementById('timeline');
const SVGNS = 'http://www.w3.org/2000/svg';
function itemEl(id){
  const it = timeline.itemSet.items[id];
  if (!it || !it.displayed) return null;
  return it.dom ? (it.dom.box || it.dom.point || it.dom.range || null) : null;
}
function drawLinks(){
  const center = tlEl.querySelector('.vis-center');
  if (!center) return;
  let svg = document.getElementById('link-layer');
  if (!svg) {
    svg = document.createElementNS(SVGNS, 'svg');
    svg.id = 'link-layer';
    center.appendChild(svg);
  }
  const cr = center.getBoundingClientRect();
  svg.setAttribute('width', cr.width);
  svg.setAttribute('height', cr.height);
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  RELS.forEach(r => {
    const ea = itemEl(r.a), eb = itemEl(r.b);
    if (!ea || !eb) return;   // 任一事件被筛选隐藏时跳过
    let ra = ea.getBoundingClientRect(), rb = eb.getBoundingClientRect();
    /* 上轨（中国）事件取底边中点，下轨（世界）事件取顶边中点 */
    if (byId[r.a].g !== 'cn') { const tmp = ra; ra = rb; rb = tmp; }
    const x1 = ra.left - cr.left + ra.width / 2, y1 = ra.bottom - cr.top;
    const x2 = rb.left - cr.left + rb.width / 2, y2 = rb.top - cr.top;
    const d = y2 - y1;
    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('d', `M ${x1} ${y1} C ${x1} ${y1 + d * 0.45}, ${x2} ${y2 - d * 0.45}, ${x2} ${y2}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#94a3b8');
    path.setAttribute('stroke-width', '1.6');
    path.setAttribute('stroke-dasharray', '5 4');
    svg.appendChild(path);
    [[x1, y1], [x2, y2]].forEach(([cx, cy]) => {
      const c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', cy);
      c.setAttribute('r', 2.6); c.setAttribute('fill', '#94a3b8');
      svg.appendChild(c);
    });
    const tx = document.createElementNS(SVGNS, 'text');
    tx.setAttribute('x', (x1 + x2) / 2);
    tx.setAttribute('y', (y1 + y2) / 2 - 4);
    tx.setAttribute('text-anchor', 'middle');
    tx.setAttribute('class', 'link-label');
    tx.textContent = r.label;
    svg.appendChild(tx);
  });
}
timeline.on('rangechange', drawLinks);   // 缩放 / 平移时重绘
timeline.on('changed', drawLinks);       // 堆叠重排后重绘
window.addEventListener('resize', drawLinks);
setTimeout(drawLinks, 200);              // 首次渲染后绘制
</script>
