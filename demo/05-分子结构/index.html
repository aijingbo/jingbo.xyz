<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 分子结构交互查看器 | 景礡之道</title>
    <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
    <script>
        if (typeof $3Dmol === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/3dmol/build/3Dmol-min.js"><\/script>');
        }
    </script>
    <style>
        :root {
            --bg-dark: #0f172a; --bg-medium: #1e293b; --bg-light: #334155;
            --bg-card: rgba(30,41,59,0.85); --accent: #3b82f6; --accent-hover: #60a5fa;
            --accent-soft: rgba(59,130,246,0.15); --text-primary: #f1f5f9;
            --text-secondary: #94a3b8; --text-muted: #64748b; --border: #475569;
            --success: #22c55e; --warning: #eab308; --danger: #ef4444; --radius: 10px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-medium) 100%);
            color: var(--text-primary); height: 100vh; overflow: hidden;
        }
        #app { display: flex; height: 100vh; }
        #viewer-panel { flex: 0 0 68%; position: relative; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        #viewer { flex: 1; position: relative; background: #0a0e1a; }
        #viewer canvas { display: block !important; }
        #sidebar { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        #header { position: absolute; top:0; left:0; right:0; z-index:10; padding:10px 18px; background: linear-gradient(180deg, rgba(10,14,26,0.9) 0%, transparent 100%); pointer-events:none; }
        #header h1 { font-size:16px; font-weight:600; text-shadow:0 2px 8px rgba(0,0,0,0.6); }
        #header .subtitle { font-size:11px; color:var(--text-secondary); margin-top:2px; }
        #hint-bar { position:absolute; bottom:0; left:0; right:0; z-index:10; padding:8px 18px; background: linear-gradient(0deg, rgba(10,14,26,0.9) 0%, transparent 100%); text-align:center; font-size:12px; color:var(--text-secondary); pointer-events:none; }
        #loading-overlay { position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; background:rgba(10,14,26,0.7); backdrop-filter:blur(4px); }
        #loading-overlay.hidden { display:none; }
        .spinner { width:48px; height:48px; border:4px solid rgba(59,130,246,0.2); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
        .loading-text { margin-top:16px; font-size:13px; color:var(--text-secondary); }
        @keyframes spin { to { transform:rotate(360deg); } }
        .section { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:12px; }
        .section-title { font-size:12px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
        .section-title::before { content:''; width:3px; height:14px; background:var(--accent); border-radius:2px; }
        #molecule-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .mol-btn { background:var(--bg-medium); border:1px solid var(--border); border-radius:8px; padding:10px 8px; cursor:pointer; transition:all 0.2s ease; text-align:center; color:var(--text-primary); }
        .mol-btn:hover { border-color:var(--accent); background:var(--accent-soft); transform:translateY(-1px); }
        .mol-btn.active { border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 1px var(--accent); }
        .mol-btn .mol-name { font-size:13px; font-weight:600; }
        .mol-btn .mol-formula { font-size:11px; color:var(--text-secondary); margin-top:2px; }
        .mol-btn.active .mol-formula { color:var(--accent-hover); }
        #mode-buttons { display:flex; flex-wrap:wrap; gap:6px; }
        .mode-btn { flex:1; min-width:55px; background:var(--bg-medium); border:1px solid var(--border); border-radius:6px; padding:8px 4px; cursor:pointer; font-size:11px; color:var(--text-secondary); transition:all 0.2s; text-align:center; }
        .mode-btn:hover { border-color:var(--accent); color:var(--text-primary); }
        .mode-btn.active { background:var(--accent); border-color:var(--accent); color:white; }
        .mode-btn .mode-icon { font-size:16px; display:block; margin-bottom:2px; }
        #surface-types { display:flex; gap:6px; margin-top:8px; }
        #surface-types.hidden { display:none; }
        .surface-btn { flex:1; background:var(--bg-medium); border:1px solid var(--border); border-radius:5px; padding:5px; font-size:10px; cursor:pointer; color:var(--text-secondary); transition:all 0.2s; }
        .surface-btn:hover { border-color:var(--accent); }
        .surface-btn.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-hover); }
        #tools-row { display:flex; flex-wrap:wrap; gap:6px; }
        .tool-btn { flex:1; min-width:65px; background:var(--bg-medium); border:1px solid var(--border); border-radius:6px; padding:7px; cursor:pointer; font-size:11px; color:var(--text-secondary); transition:all 0.2s; text-align:center; }
        .tool-btn:hover { border-color:var(--accent); color:var(--text-primary); }
        .tool-btn.active { background:var(--success); border-color:var(--success); color:white; }
        .tool-btn.warn-active { background:var(--warning); border-color:var(--warning); color:var(--bg-dark); }
        .info-row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:12px; border-bottom:1px solid rgba(71,85,105,0.3); }
        .info-row:last-child { border-bottom:none; }
        .info-label { color:var(--text-secondary); }
        .info-value { color:var(--text-primary); font-weight:500; }
        .info-tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:600; }
        .tag-polar { background:rgba(59,130,246,0.2); color:var(--accent-hover); }
        .tag-nonpolar { background:rgba(148,163,184,0.15); color:var(--text-secondary); }
        .bond-table, .angle-table { width:100%; font-size:11px; margin-top:6px; border-collapse:collapse; }
        .bond-table th, .angle-table th { text-align:left; color:var(--text-muted); font-weight:500; padding:3px 4px; }
        .bond-table td, .angle-table td { padding:3px 4px; color:var(--text-secondary); }
        .bond-table td:last-child, .angle-table td:last-child { text-align:right; color:var(--accent-hover); font-weight:500; }
        .desc-text { font-size:11px; color:var(--text-secondary); line-height:1.6; margin-top:8px; padding-top:8px; border-top:1px solid rgba(71,85,105,0.3); }
        #atom-info { display:none; }
        #atom-info.visible { display:block; }
        .atom-badge { display:inline-flex; align-items:center; gap:8px; margin-bottom:8px; }
        .atom-color-dot { width:24px; height:24px; border-radius:50%; border:2px solid rgba(255,255,255,0.3); }
        #measure-info { display:none; }
        #measure-info.visible { display:block; }
        .measure-item { background:var(--bg-medium); border-radius:6px; padding:8px 10px; margin-top:6px; font-size:12px; display:flex; justify-content:space-between; }
        .measure-item .measure-type { color:var(--text-secondary); }
        .measure-item .measure-val { color:var(--success); font-weight:600; }
        #toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--danger); color:white; padding:10px 20px; border-radius:8px; font-size:13px; z-index:100; opacity:0; transition:all 0.3s ease; pointer-events:none; }
        #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        @media (max-width: 768px) { #app { flex-direction:column; } #viewer-panel { flex:0 0 50%; border-right:none; border-bottom:1px solid var(--border); } #sidebar { flex:1; } }
    </style>
</head>
<body>
    <div id="app">
        <div id="viewer-panel">
            <div id="header">
                <h1>🧪 3D 分子结构交互查看器</h1>
                <div class="subtitle">基于 3Dmol.js · 点击原子查看元素信息 · 测量键长与键角</div>
            </div>
            <div id="viewer"></div>
            <div id="loading-overlay" class="hidden">
                <div style="text-align:center;">
                    <div class="spinner"></div>
                    <div class="loading-text" id="loading-text">加载中...</div>
                </div>
            </div>
            <div id="hint-bar">🖱️ 拖拽旋转 · 滚轮缩放 · 点击原子查看信息</div>
        </div>
        <div id="sidebar">
            <div class="section">
                <div class="section-title">分子库</div>
                <div id="molecule-grid"></div>
            </div>
            <div class="section">
                <div class="section-title">显示模式</div>
                <div id="mode-buttons"></div>
                <div id="surface-types" class="hidden">
                    <button class="surface-btn active" data-stype="VDW">范德华</button>
                    <button class="surface-btn" data-stype="SAS">溶剂可及</button>
                    <button class="surface-btn" data-stype="SES">溶剂排除</button>
                </div>
            </div>
            <div class="section">
                <div class="section-title">工具</div>
                <div id="tools-row">
                    <button class="tool-btn" id="btn-measure">📏 测量</button>
                    <button class="tool-btn" id="btn-labels">🏷️ 标签</button>
                    <button class="tool-btn" id="btn-spin">🔄 旋转</button>
                    <button class="tool-btn" id="btn-reset">🎯 重置</button>
                </div>
            </div>
            <div class="section" id="mol-info-section">
                <div class="section-title">分子信息</div>
                <div id="mol-info"></div>
            </div>
            <div class="section" id="atom-info">
                <div class="section-title">原子信息</div>
                <div id="atom-info-content"></div>
            </div>
            <div class="section" id="measure-info">
                <div class="section-title">测量结果</div>
                <div id="measure-info-content"></div>
            </div>
        </div>
    </div>
    <div id="toast"></div>

    // ==================== 元素信息 ====================
    const ELEMENTS = {
        H:{n:"氢",z:1,m:1.008,c:"#FFFFFF"}, C:{n:"碳",z:6,m:12.011,c:"#909090"},
        N:{n:"氮",z:7,m:14.007,c:"#3050F8"}, O:{n:"氧",z:8,m:15.999,c:"#FF0D0D"},
        P:{n:"磷",z:15,m:30.974,c:"#FF8000"}, S:{n:"硫",z:16,m:32.06,c:"#FFFF30"},
        F:{n:"氟",z:9,m:18.998,c:"#90E050"}, Cl:{n:"氯",z:17,m:35.45,c:"#1FF01F"}
    };

    // ==================== 显示模式 ====================
    const MODES = {
        ballstick: {name:"球棍", icon:"⚪"},
        spacefill: {name:"空间填充", icon:"⬤"},
        wireframe: {name:"线框", icon:"⊡"},
        cross:     {name:"交叉", icon:"✛"},
        surface:   {name:"表面", icon:"◯"}
    };

    // ==================== 全局状态 ====================
    let viewer=null, currentModel=null, currentMolKey='water';
    let currentMode='ballstick', currentSurfaceType='VDW';
    let measureMode=false, measureAtoms=[];
    let measureShapes=[], measureLabels=[];
    let atomLabels=[], showLabels=false, spinning=false;
    // ==================== 初始化 ====================
    function init() {
        if (typeof $3Dmol === 'undefined') {
            document.getElementById('viewer').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:14px;">⚠️ 3Dmol.js 加载失败，请检查网络连接</div>';
            return;
        }
        viewer = $3Dmol.createViewer("viewer", {
            backgroundColor: 0x0a0e1a, antialias: true
        });
        createMoleculeGrid();
        createModeButtons();
        setupEventListeners();
        loadMolecule('water');
        window.addEventListener('resize', () => { if (viewer) viewer.resize(); });
    }

    // ==================== 创建分子选择网格 ====================
    function createMoleculeGrid() {
        const grid = document.getElementById('molecule-grid');
        grid.innerHTML = '';
        for (const [key, mol] of Object.entries(MOLECULES)) {
            const btn = document.createElement('button');
            btn.className = 'mol-btn' + (key === currentMolKey ? ' active' : '');
            btn.dataset.mol = key;
            btn.innerHTML = `<div class="mol-name">${mol.name}</div><div class="mol-formula">${mol.formula}</div>`;
            btn.addEventListener('click', () => loadMolecule(key));
            grid.appendChild(btn);
        }
    }

    // ==================== 创建模式按钮 ====================
    function createModeButtons() {
        const container = document.getElementById('mode-buttons');
        container.innerHTML = '';
        for (const [key, mode] of Object.entries(MODES)) {
            const btn = document.createElement('button');
            btn.className = 'mode-btn' + (key === currentMode ? ' active' : '');
            btn.dataset.mode = key;
            btn.innerHTML = `<span class="mode-icon">${mode.icon}</span>${mode.name}`;
            btn.addEventListener('click', () => applyDisplayMode(key));
            container.appendChild(btn);
        }
    }

    // ==================== 加载分子 ====================
    function loadMolecule(key) {
        const mol = MOLECULES[key];
        if (!mol) return;
        currentMolKey = key;
        // 更新按钮高亮
        document.querySelectorAll('.mol-btn').forEach(b => b.classList.toggle('active', b.dataset.mol === key));
        // 清理状态
        currentModel = null;
        resetMeasurement();
        clearLabels();
        viewer.removeAllModels();
        viewer.removeAllSurfaces();
        try { viewer.removeAllShapes(); } catch(e) {}
        try { viewer.removeAllLabels(); } catch(e) {}
        updateInfoPanel(mol);

        if (mol.format === 'pdb-download') {
            showLoading('正在从 RCSB 下载 ' + mol.pdbId + '...');
            let done = false;
            $3Dmol.download('pdb:' + mol.pdbId, viewer, {}, function(m) {
                done = true;
                hideLoading();
                if (!m) { showToast('DNA 结构下载失败，请检查网络'); return; }
                currentModel = m;
                applyDisplayMode('wireframe');
                viewer.zoomTo();
                viewer.render();
            });
            setTimeout(() => { if (!done) { hideLoading(); showToast('下载超时，请检查网络后重试'); } }, 20000);
        } else {
            currentModel = viewer.addModel(mol.data, mol.format);
            applyDisplayMode(currentMode);
            viewer.zoomTo();
            viewer.render();
        }
    }

    // ==================== 应用显示模式 ====================
    function applyDisplayMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
        // 表面子类型按钮显示/隐藏
        document.getElementById('surface-types').classList.toggle('hidden', mode !== 'surface');
        if (!currentModel) return;
        viewer.removeAllSurfaces();
        clearLabels();
        let style = {};
        switch (mode) {
            case 'ballstick': style = {stick:{radius:0.15}, sphere:{scale:0.25}}; break;
            case 'spacefill': style = {sphere:{scale:1.0}}; break;
            case 'wireframe': style = {stick:{radius:0.04}, sphere:{scale:0.05}}; break;
            case 'cross':     style = {cross:{linewidth:1.2, radius:0.25}, stick:{radius:0.04}}; break;
            case 'surface':
                style = {stick:{radius:0.1}, sphere:{scale:0.15}};
                addSurfaceByType(currentSurfaceType);
                break;
        }
        currentModel.setStyle({}, style);
        currentModel.setClickable({}, true, onAtomClick);
        // 重新应用标签
        if (showLabels) applyLabels();
        // 重新应用测量高亮
        if (measureMode && measureAtoms.length > 0) applyMeasureHighlights();
        viewer.render();
    }

    // ==================== 添加表面 ====================
    function addSurfaceByType(type) {
        const stype = $3Dmol.SurfaceType[type] || $3Dmol.SurfaceType.VDW;
        viewer.addSurface(stype, {opacity:0.7, color:'white'});
    }
    // ==================== 原子点击回调 ====================
    function onAtomClick(atom) {
        if (!atom) return;
        if (measureMode) {
            handleMeasureClick(atom);
        } else {
            showAtomInfo(atom);
        }
    }

    // ==================== 显示原子信息 ====================
    function showAtomInfo(atom) {
        const elem = ELEMENTS[atom.elem] || {n:atom.elem, z:'?', m:'?', c:'#888'};
        const panel = document.getElementById('atom-info');
        const content = document.getElementById('atom-info-content');
        // 计算键长
        let bondInfo = '';
        if (atom.bonds && atom.bonds.length > 0) {
            const allAtoms = currentModel.selectedAtoms({});
            bondInfo = '<div style="margin-top:8px;font-size:11px;color:var(--text-muted);">键长信息</div>';
            bondInfo += '<table class="bond-table"><tr><th>键</th><th>长度</th></tr>';
            for (let i = 0; i < atom.bonds.length; i++) {
                const ba = allAtoms[atom.bonds[i]];
                if (!ba) continue;
                const d = getDistance(atom, ba);
                bondInfo += `<tr><td>${atom.elem}-${ba.elem}</td><td>${d.toFixed(3)} Å</td></tr>`;
            }
            bondInfo += '</table>';
        }
        content.innerHTML = `
            <div class="atom-badge">
                <div class="atom-color-dot" style="background:${elem.c}"></div>
                <div><span style="font-size:16px;font-weight:700">${elem.n}</span>
                <span style="color:var(--text-secondary);margin-left:6px">${atom.elem}</span></div>
            </div>
            <div class="info-row"><span class="info-label">原子序数</span><span class="info-value">${elem.z}</span></div>
            <div class="info-row"><span class="info-label">相对原子质量</span><span class="info-value">${elem.m}</span></div>
            <div class="info-row"><span class="info-label">坐标 (Å)</span><span class="info-value" style="font-size:10px">(${atom.x.toFixed(2)}, ${atom.y.toFixed(2)}, ${atom.z.toFixed(2)})</span></div>
            ${bondInfo}
        `;
        panel.classList.add('visible');
    }

    // ==================== 测量功能 ====================
    function toggleMeasure() {
        measureMode = !measureMode;
        const btn = document.getElementById('btn-measure');
        btn.classList.toggle('active', measureMode);
        btn.textContent = measureMode ? '📏 测量中' : '📏 测量';
        if (!measureMode) resetMeasurement();
        // 显示/隐藏测量信息面板
        document.getElementById('measure-info').classList.toggle('visible', measureMode);
        document.getElementById('atom-info').classList.remove('visible');
    }

    function resetMeasurement() {
        measureAtoms = [];
        measureShapes.forEach(s => { try { viewer.removeShape(s); } catch(e){} });
        measureLabels.forEach(l => { try { viewer.removeLabel(l); } catch(e){} });
        measureShapes = [];
        measureLabels = [];
        const content = document.getElementById('measure-info-content');
        if (content) content.innerHTML = '<div style="font-size:11px;color:var(--text-secondary)">点击原子选择测量点<br>2个原子→键长 | 3个原子→键角</div>';
        if (currentModel) {
            applyDisplayMode(currentMode);
        }
    }

    function handleMeasureClick(atom) {
        if (measureAtoms.length >= 3) { resetMeasurement(); }
        measureAtoms.push(atom);
        applyMeasureHighlights();
        updateMeasureResult();
    }

    function applyMeasureHighlights() {
        // 移除旧的
        measureShapes.forEach(s => { try { viewer.removeShape(s); } catch(e){} });
        measureLabels.forEach(l => { try { viewer.removeLabel(l); } catch(e){} });
        measureShapes = [];
        measureLabels = [];
        const colors = ['#22c55e', '#3b82f6', '#eab308'];
        // 高亮选中原子 + 标号
        for (let i = 0; i < measureAtoms.length; i++) {
            const a = measureAtoms[i];
            // 改变原子样式
            currentModel.setStyle({serial: a.serial}, {
                sphere: {scale: 0.5, color: colors[i]},
                stick: {radius: 0.15}
            });
            // 添加标号
            try {
                const lbl = viewer.addLabel(String(i+1), {
                    position: {x: a.x, y: a.y, z: a.z},
                    fontSize: 16, fontColor: 'white',
                    backgroundColor: colors[i], showBackground: true,
                    inFront: true, padding: 4
                });
                measureLabels.push(lbl);
            } catch(e) {}
        }
        // 连线
        for (let i = 0; i < measureAtoms.length - 1; i++) {
            const a1 = measureAtoms[i], a2 = measureAtoms[i+1];
            try {
                const cyl = viewer.addCylinder({
                    start: {x:a1.x, y:a1.y, z:a1.z},
                    end: {x:a2.x, y:a2.y, z:a2.z},
                    radius: 0.04, color: '#22c55e',
                    fromCap: 2, toCap: 2
                });
                measureShapes.push(cyl);
            } catch(e) {}
        }
        viewer.render();
    }

    function updateMeasureResult() {
        const content = document.getElementById('measure-info-content');
        let html = '';
        if (measureAtoms.length >= 2) {
            const d = getDistance(measureAtoms[0], measureAtoms[1]);
            html += `<div class="measure-item"><span class="measure-type">键长 (1→2)</span><span class="measure-val">${d.toFixed(3)} Å</span></div>`;
        }
        if (measureAtoms.length >= 3) {
            const ang = getAngle(measureAtoms[0], measureAtoms[1], measureAtoms[2]);
            html += `<div class="measure-item"><span class="measure-type">键角 (1-2-3)</span><span class="measure-val">${ang.toFixed(1)}°</span></div>`;
        }
        if (measureAtoms.length < 2) {
            html = `<div style="font-size:11px;color:var(--text-secondary)">已选 ${measureAtoms.length}/3 个原子<br>${measureAtoms.length < 2 ? '继续点击选择第 ' + (measureAtoms.length+1) + ' 个原子' : ''}</div>`;
        }
        content.innerHTML = html;
    }
    // ==================== 标签功能 ====================
    function toggleLabels() {
        showLabels = !showLabels;
        document.getElementById('btn-labels').classList.toggle('warn-active', showLabels);
        if (showLabels) applyLabels(); else clearLabels();
    }
    function applyLabels() {
        clearLabels();
        if (!currentModel) return;
        const atoms = currentModel.selectedAtoms({});
        for (let i = 0; i < atoms.length; i++) {
            try {
                const lbl = viewer.addLabel(atoms[i].elem, {
                    position: {x:atoms[i].x, y:atoms[i].y, z:atoms[i].z},
                    fontSize: 9, fontColor: 'white',
                    showBackground: false, inFront: true
                });
                atomLabels.push(lbl);
            } catch(e) {}
        }
        viewer.render();
    }
    function clearLabels() {
        atomLabels.forEach(l => { try { viewer.removeLabel(l); } catch(e){} });
        atomLabels = [];
    }

    // ==================== 信息面板更新 ====================
    function updateInfoPanel(mol) {
        const el = document.getElementById('mol-info');
        const polTag = mol.polarity === '极性分子'
            ? '<span class="info-tag tag-polar">极性</span>'
            : '<span class="info-tag tag-nonpolar">非极性</span>';
        let bondHtml = '';
        if (mol.bonds && mol.bonds.length > 0) {
            bondHtml = '<table class="bond-table"><tr><th>键类型</th><th>键长</th></tr>';
            mol.bonds.forEach(b => { bondHtml += `<tr><td>${b.type}</td><td>${b.length}</td></tr>`; });
            bondHtml += '</table>';
        }
        let angleHtml = '';
        if (mol.angles && mol.angles.length > 0) {
            angleHtml = '<table class="angle-table"><tr><th>键角</th><th>角度</th></tr>';
            mol.angles.forEach(a => { angleHtml += `<tr><td>${a.type}</td><td>${a.value}</td></tr>`; });
            angleHtml += '</table>';
        }
        el.innerHTML = `
            <div class="info-row"><span class="info-label">分子名称</span><span class="info-value">${mol.name}</span></div>
            <div class="info-row"><span class="info-label">化学式</span><span class="info-value">${mol.formula}</span></div>
            <div class="info-row"><span class="info-label">分子量</span><span class="info-value">${mol.mw}</span></div>
            <div class="info-row"><span class="info-label">VSEPR 构型</span><span class="info-value">${mol.geometry}</span></div>
            <div class="info-row"><span class="info-label">对称性</span><span class="info-value">${mol.symmetry}</span></div>
            <div class="info-row"><span class="info-label">极性</span>${polTag}</div>
            ${bondHtml ? '<div style="margin-top:8px;font-size:11px;color:var(--text-muted)">键长数据</div>' + bondHtml : ''}
            ${angleHtml ? '<div style="margin-top:8px;font-size:11px;color:var(--text-muted)">键角数据</div>' + angleHtml : ''}
            <div class="desc-text">${mol.desc}</div>
        `;
        // 隐藏原子信息和测量信息面板
        document.getElementById('atom-info').classList.remove('visible');
    }

    // ==================== 工具函数 ====================
    function getDistance(a1, a2) {
        return Math.sqrt((a1.x-a2.x)**2 + (a1.y-a2.y)**2 + (a1.z-a2.z)**2);
    }
    function getAngle(a1, a2, a3) {
        const v1={x:a1.x-a2.x, y:a1.y-a2.y, z:a1.z-a2.z};
        const v2={x:a3.x-a2.x, y:a3.y-a2.y, z:a3.z-a2.z};
        const dot=v1.x*v2.x+v1.y*v2.y+v1.z*v2.z;
        const m1=Math.sqrt(v1.x**2+v1.y**2+v1.z**2);
        const m2=Math.sqrt(v2.x**2+v2.y**2+v2.z**2);
        if (m1===0||m2===0) return 0;
        let cos = dot/(m1*m2);
        cos = Math.max(-1, Math.min(1, cos));
        return Math.acos(cos) * 180 / Math.PI;
    }
    function showLoading(msg) {
        document.getElementById('loading-text').textContent = msg || '加载中...';
        document.getElementById('loading-overlay').classList.remove('hidden');
    }
    function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 5000);
    }

    // ==================== 事件监听 ====================
    function setupEventListeners() {
        // 测量按钮
        document.getElementById('btn-measure').addEventListener('click', toggleMeasure);
        // 标签按钮
        document.getElementById('btn-labels').addEventListener('click', toggleLabels);
        // 旋转按钮
        document.getElementById('btn-spin').addEventListener('click', function() {
            spinning = !spinning;
            this.classList.toggle('warn-active', spinning);
            this.textContent = spinning ? '🔄 旋转中' : '🔄 旋转';
            if (viewer) { viewer.spin(spinning, 0.5); }
        });
        // 重置视角
        document.getElementById('btn-reset').addEventListener('click', function() {
            if (viewer) { viewer.zoomTo(); viewer.render(); }
        });
        // 表面类型按钮
        document.querySelectorAll('.surface-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.surface-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentSurfaceType = this.dataset.stype;
                if (currentMode === 'surface') applyDisplayMode('surface');
            });
        });
    }

    // ==================== 启动 ====================
    window.addEventListener('load', init);
    </script>
</body>
