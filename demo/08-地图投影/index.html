<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地图投影交互对比 · 教育可视化</title>
<style>
  :root{
    --bg:#1a1a2e; --ocean:#16213e; --land:#e2e8f0; --line:#475569;
    --hover:#fbbf24; --sel:#fb923c; --tissot:rgba(239,68,68,.4);
    --accent:#60a5fa; --card:#23233f; --text:#e2e8f0; --muted:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  header{padding:18px 26px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
  header h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  header p{color:var(--muted);font-size:13px;margin-top:4px}
  .wrap{display:flex;min-height:calc(100vh - 78px)}
  .map-col{flex:0 0 70%;padding:16px;display:flex;flex-direction:column}
  .map-box{position:relative;background:var(--ocean);border-radius:12px;overflow:hidden;flex:1;min-height:0;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .map-box svg{width:100%;height:100%;display:block}
  #tip{position:absolute;pointer-events:none;background:rgba(26,26,46,.92);border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:6px;font-size:12px;display:none;z-index:10;max-width:220px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .map-footer{padding:10px 4px 0;display:flex;align-items:center;gap:18px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .map-footer .hint{flex:1}
  .switch{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .switch input{display:none}
  .switch .bar{width:38px;height:20px;border-radius:20px;background:var(--line);position:relative;transition:.25s}
  .switch .bar::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.25s}
  .switch input:checked + .bar{background:var(--accent)}
  .switch input:checked + .bar::after{left:20px}
  /* 右侧面板 */
  .panel{flex:0 0 30%;padding:16px;border-left:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:calc(100vh - 78px)}
  .card{background:var(--card);border-radius:12px;padding:14px}
  .card h3{font-size:13px;color:var(--accent);margin-bottom:10px;font-weight:600;letter-spacing:.5px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pbtn{background:#2a2a4a;border:1px solid rgba(255,255,255,.08);color:var(--text);padding:9px 6px;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s;text-align:center}
  .pbtn small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  .pbtn:hover{background:#33335a}
  .pbtn.active{background:var(--accent);border-color:var(--accent);color:#08131f}
  .pbtn.active small{color:#0b1a2b}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;margin-bottom:6px}
  .conformal{background:rgba(96,165,250,.18);color:#93c5fd}
  .equal-area{background:rgba(74,222,128,.16);color:#86efac}
  .equidistant{background:rgba(251,191,36,.16);color:#fcd34d}
  .arbitrary{background:rgba(251,146,60,.16);color:#fdba74}
  .pname{font-size:16px;font-weight:700}
  .pdesc{font-size:13px;color:var(--text);margin-top:6px;line-height:1.6}
  .pn{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
  .pn b{color:#cbd5e1}
  .info-row{margin-bottom:8px;font-size:13px}
  .info-row .k{color:var(--muted);font-size:12px}
  .info-row .v{font-weight:600}
  .empty{color:var(--muted);font-size:13px;line-height:1.6;text-align:center;padding:10px 0}
  .compare-btn{width:100%;margin-top:8px;background:#2a2a4a;border:1px solid rgba(255,255,255,.08);color:var(--text);padding:9px;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s}
  .compare-btn:hover{background:#33335a}
  .compare-btn.active{background:rgba(251,146,60,.25);border-color:var(--sel);color:#fdba74}
  .mini{display:flex;gap:10px;margin-top:10px}
  .mini>div{flex:1;text-align:center}
  .mini h5{font-size:11px;color:var(--muted);margin-bottom:4px}
  .mini svg{width:100%;background:var(--ocean);border-radius:8px;border:1px solid rgba(255,255,255,.06)}
  .bar-note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
  .bar-note b{color:#fdba74}
  @media(max-width:900px){
    .wrap{flex-direction:column}
    .map-col{flex:auto}
    .map-box{min-height:420px}
    .panel{flex:auto;border-left:0;border-top:1px solid rgba(255,255,255,.06);max-height:none}
  }
</style>

/* ============ 投影定义与说明 ============ */
const PROJECTIONS = {
  mercator:{name:"Mercator 墨卡托",cn:"墨卡托投影",prop:"conformal",propName:"等角投影",
    desc:"将地球表面以等角方式展开为平面，经纬线均为直线并互相垂直。所有方向的夹角保持不变，因此航向角可直接用直线表示。",
    note:"优点：等角、适合航海导航；缺点：高纬度面积被严重夸大，格陵兰看起来和非洲差不多大。适用：航海图、在线地图（Web 墨卡托）。"},
  equirectangular:{name:"Equirectangular 等距圆柱",cn:"等距圆柱投影",prop:"equidistant",propName:"等距投影",
    desc:"最简单的圆柱投影，直接将经度映射为 x、纬度映射为 y。沿经线距离保真，构图直观。",
    note:"优点：公式简单、易理解；缺点：形状与面积在远离赤道处均变形。适用：教学入门、像素地图、全景图。推荐鼠标悬停比较其与墨卡托的差异。"},
  equalEarth:{name:"Equal Earth 等积地球",cn:"等积地球投影",prop:"equal-area",propName:"等积投影",
    desc:"一种伪圆柱等积投影，在保证面积真实的同时兼顾了视觉美观，是近年新设计的投影。",
    note:"优点：面积真实、形状较自然；缺点：非等角，方向有轻微变形。适用：全球分布、人口/经济密度等强调面积的统计地图。"},
  orthographic:{name:"Orthographic 正射",cn:"正射投影",prop:"arbitrary",propName:"透视投影",
    desc:"模拟从无限远处观察地球的视角，一次只能看到半个地球，像悬浮在太空中的真实地球。",
    note:"优点：最直观、像真实地球；缺点：仅能看到一侧，边缘变形大。适用：地球仪模拟、卫星视角。可拖拽旋转！"},
  mollweide:{name:"Mollweide 摩尔威德",cn:"摩尔威德投影",prop:"equal-area",propName:"等积投影",
    desc:"经典等积伪圆柱投影，将世界绘制在椭圆内，赤道与中央经线为直线。",
    note:"优点：面积真实、横贯较大区域；缺点：边缘纬线变形明显。适用：全球分布图、天文天图。"},
  robinson:{name:"Robinson 罗宾逊",cn:"罗宾逊投影",prop:"arbitrary",propName:"任意投影",
    desc:"伪圆柱投影，既非等积也非等角，通过折中使整幅地图的变形最小化，视觉上最“自然”。",
    note:"优点：整体变形均衡、美观；缺点：无严格数学性质。适用：教科书世界地图、全球新闻报道。"}
};

/* ============ 状态 ============ */
let world = null, countries = null, paths = null;
let currentType = "mercator";
let selectedId = null;      // 选中国家 id
let compareMode = false;    // 面积对比高亮
let tissotOn = true;
let rotate = [0,-15];       // 正射投影旋转

const W=860, H=620;
const svg = d3.select("#map");
const mapBox = document.getElementById("mapBox");
const tip = document.getElementById("tip");
/* 分层：底层(球体/经纬网) → 国家层 → 顶层(Tissot) */
const gBase = svg.append("g");
const g = svg.append("g");
const gOverlay = svg.append("g");

/* ============ 投影工厂 ============ */
function makeProjection(type){
  const p = d3["geo"+type[0].toUpperCase()+type.slice(1)]();
  if(type==="orthographic"){
    p.rotate(rotate).clipAngle(90);
    const r = Math.min(W,H)/2 - 24;
    p.scale(r).translate([W/2,H/2]);
  }else{
    p.fitExtent([[24,24],[W-24,H-24]],{type:"Sphere"});
    if(type==="mercator"){ /* fitExtent 已适配 */ }
  }
  return p;
}

/* ============ 渲染主图 ============ */
function render(transition=true){
  const proj = makeProjection(currentType);
  const path = d3.geoPath(proj);
  const dur = transition ? 500 : 0;

  // 球体（海洋）
  gBase.selectAll("#sphere").remove();
  gBase.append("path").attr("id","sphere").attr("class","sphere")
    .attr("fill","var(--ocean)").attr("stroke","#2c3e50").attr("stroke-width",1)
    .attr("d", path({type:"Sphere"}));

  // 经纬网
  const grat = d3.geoGraticule10();
  gBase.selectAll("#graticule").remove();
  gBase.append("path").attr("id","graticule")
    .attr("fill","none").attr("stroke","rgba(148,163,184,.18)").attr("stroke-width",.5)
    .attr("d", path(grat));

  // 国家
  const sel = g.selectAll(".country").data(countries.features);
  sel.enter().append("path").attr("class","country")
    .attr("stroke","var(--line)").attr("stroke-width",.5).attr("fill","var(--land)")
    .merge(sel)
    .transition("proj").duration(dur).ease(d3.easeCubicInOut)
    .attr("d", f=>path(f));

  applyCountryStyles();
  renderTissot(proj, path, transition);
}

/* 根据交互状态着色 */
function applyCountryStyles(){
  g.selectAll(".country").style("fill", function(f){
    const id = String(f.id);
    if(compareMode && isAfrica(id)) return "rgba(251,146,60,.55)";   // 非洲高亮
    if(compareMode && id==="304") return "rgba(96,165,250,.55)";     // 格陵兰高亮（对比）
    if(selectedId && id===selectedId) return "rgba(251,146,60,.5)";  // 选中
    return "var(--land)";
  }).style("stroke","var(--line)").style("stroke-width",.5);
}

function isAfrica(id){
  const d = COUNTRY_DATA[parseInt(id)];
  return d && d.cont==="非洲";
}

/* ============ Tissot 变形指示线 ============ */
function renderTissot(proj, path, transition){
  gOverlay.selectAll("#tissot").remove();
  if(!tissotOn) return;
  const circles=[];
  for(let lat=-60;lat<=60;lat+=30)
    for(let lon=-150;lon<=150;lon+=30)
      circles.push([lon,lat]);
  const gT = gOverlay.append("g").attr("id","tissot");
  gT.selectAll("path").data(circles).enter().append("path")
    .attr("fill","var(--tissot)").attr("stroke","rgba(239,68,68,.7)").attr("stroke-width",.6)
    .attr("opacity",0)
    .attr("d", c=>{
      const circ = d3.geoCircle().center(c).radius(12).precision(2)();
      return path(circ);
    })
    .transition("tissot").duration(transition?400:0).delay(transition?100:0)
    .attr("opacity",1);
}

/* ============ 交互：悬停 / 点击 ============ */
function bindEvents(){
  g.selectAll(".country")
    .on("mouseover", function(ev, f){
      d3.select(this).style("fill", function(){
        const id=String(f.id);
        if(compareMode && (isAfrica(id)||id==="304")) return d3.select(this).style("fill");
        if(selectedId && id===selectedId) return d3.select(this).style("fill");
        return "rgba(251,191,36,.55)"; // 悬停高亮
      }).attr("stroke","var(--hover)").attr("stroke-width",1.5);
      const name = nameOf(f);
      tip.style.display="block";
      tip.innerHTML = "<b>"+name+"</b>";
      const box=mapBox.getBoundingClientRect();
      tip.style.left=(ev.offsetX+10)+"px"; tip.style.top=(ev.offsetY+10)+"px";
    })
    .on("mousemove", function(ev){
      tip.style.left=(ev.offsetX+10)+"px"; tip.style.top=(ev.offsetY+10)+"px";
    })
    .on("mouseout", function(ev,f){
      d3.select(this).style("fill", function(){
        const id=String(f.id);
        if(compareMode && (isAfrica(id)||id==="304")) return "rgba(251,146,60,.55)";
        if(selectedId && id===selectedId) return "rgba(251,146,60,.5)";
        return "var(--land)";
      }).attr("stroke","var(--line)").attr("stroke-width",.5);
      tip.style.display="none";
    })
    .on("click", function(ev,f){
      ev.stopPropagation();
      selectedId = String(f.id);
      document.getElementById("compareBtn").classList.remove("active");
      compareMode=false;
      document.getElementById("miniCompare").style.display="none";
      document.getElementById("compareNote").textContent="";
      applyCountryStyles();
      showCountryInfo(f);
    });
  svg.on("click", ()=>{ // 点击空白清除
    selectedId=null; compareMode=false;
    document.getElementById("compareBtn").classList.remove("active");
    document.getElementById("miniCompare").style.display="none";
    document.getElementById("compareNote").textContent="";
    document.getElementById("countryInfo").innerHTML='<div class="empty">点击地图上的国家查看名称、面积与大洲</div>';
    applyCountryStyles();
  });
}

function nameOf(f){
  if(f.properties && f.properties.name) return f.properties.name;
  const d=COUNTRY_DATA[parseInt(f.id)];
  return d?d.name:"未知国家";
}

function showCountryInfo(f){
  const id=String(f.id);
  const d=COUNTRY_DATA[parseInt(id)];
  const nm=nameOf(f);
  document.getElementById("countryInfo").innerHTML =
    '<div class="info-row"><span class="k">国家</span><br><span class="v">'+nm+'</span></div>'+
    '<div class="info-row"><span class="k">面积</span><br><span class="v">'+(d?fmt(d.area)+" km²":"暂无数据")+'</span></div>'+
    '<div class="info-row"><span class="k">所在大洲</span><br><span class="v">'+(d?d.cont:"暂无数据")+'</span></div>';
}
function fmt(n){return n.toLocaleString("zh-CN");}

/* ============ 正射投影拖拽旋转 ============ */
function bindDrag(){
  let dragging=false, start=null, startRot=[0,0];
  mapBox.addEventListener("mousedown", ev=>{
    if(currentType!=="orthographic") return;
    dragging=true; start=[ev.clientX,ev.clientY]; startRot=rotate.slice();
    mapBox.style.cursor="grabbing";
  });
  window.addEventListener("mousemove", ev=>{
    if(!dragging) return;
    const dx=ev.clientX-start[0], dy=ev.clientY-start[1];
    rotate=[startRot[0]+dx*0.3, Math.max(-90,Math.min(90,startRot[1]-dy*0.3))];
    render(false);
  });
  window.addEventListener("mouseup", ()=>{ dragging=false; mapBox.style.cursor="grab"; });
  mapBox.style.cursor = currentType==="orthographic" ? "grab" : "default";
}

/* ============ 投影信息面板 ============ */
function updatePropPanel(type){
  const p=PROJECTIONS[type];
  document.getElementById("pname").textContent=p.cn;
  const tag=document.getElementById("ptag");
  tag.className="tag "+p.prop;
  tag.textContent=p.propName;
  document.getElementById("pdesc").textContent=p.desc;
  document.getElementById("pn").innerHTML="<b>变形特征：</b>"+p.note;
}

/* ============ 投影按钮 ============ */
function buildButtons(){
  const box=document.getElementById("projBtns");
  for(const key in PROJECTIONS){
    const b=document.createElement("button");
    b.className="pbtn"+(key===currentType?" active":"");
    b.dataset.type=key;
    b.innerHTML=PROJECTIONS[key].name+"<small>"+PROJECTIONS[key].propName+"</small>";
    b.onclick=()=>{
      if(key===currentType) return;
      document.querySelectorAll(".pbtn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      currentType=key;
      mapBox.style.cursor = key==="orthographic" ? "grab" : "default";
      render(true);
      updatePropPanel(key);
    };
    box.appendChild(b);
  }
}

/* ============ 面积对比（墨卡托 vs 等积） ============ */
function renderCompare(){
  compareMode=true;
  document.getElementById("compareBtn").classList.add("active");
  document.getElementById("miniCompare").style.display="flex";

  // 收集格陵兰 + 非洲
  const gl = countries.features.filter(f=>String(f.id)==="304");
  const af = countries.features.filter(f=>isAfrica(String(f.id)));

  // 墨卡托小图
  const mercMini = d3.geoMercator().fitExtent([[6,6],[194,134]], {type:"Sphere"});
  drawMini("miniMerc", mercMini, gl, af);
  // 等积小图（Equal Earth 等积）
  const eqMini = d3.geoEqualEarth().fitExtent([[6,6],[194,134]], {type:"Sphere"});
  drawMini("miniEqual", eqMini, gl, af);

  const glArea=2166086, afArea=30370000;
  document.getElementById("compareNote").innerHTML =
    "格陵兰约 <b>"+fmt(glArea)+" km²</b>，非洲约 <b>"+fmt(afArea)+" km²</b> — 非洲实际面积是格陵兰的 <b>"+
    Math.round(afArea/glArea)+" 倍</b>。但墨卡托投影下两者看起来几乎一样大。悬停地图可见两区域高亮。";

  // 主图高亮
  applyCountryStyles();
}

function drawMini(svgId, proj, gl, af, probe){
  const sv=document.getElementById(svgId);
  sv.innerHTML="";
  const p=d3.geoPath(proj);
  // 参考线
  const ng=document.createElementNS("http://www.w3.org/2000/svg","path");
  ng.setAttribute("fill","none");ng.setAttribute("stroke","rgba(148,163,184,.2)");ng.setAttribute("d",p(d3.geoGraticule10()));
  sv.appendChild(ng);
  af.forEach(f=>{
    const e=document.createElementNS("http://www.w3.org/2000/svg","path");
    e.setAttribute("fill","rgba(251,146,60,.6)");e.setAttribute("stroke","var(--land)");e.setAttribute("stroke-width",.4);
    e.setAttribute("d",p(f));sv.appendChild(e);
  });
  gl.forEach(f=>{
    const e=document.createElementNS("http://www.w3.org/2000/svg","path");
    e.setAttribute("fill","rgba(96,165,250,.7)");e.setAttribute("stroke","var(--land)");e.setAttribute("stroke-width",.4);
    e.setAttribute("d",p(f));sv.appendChild(e);
  });
}

/* ============ 初始化 ============ */
function init(){
  buildButtons();
  updatePropPanel("mercator");
  bindDrag();
  document.getElementById("tissotToggle").addEventListener("change", e=>{
    tissotOn=e.target.checked; render(false);
  });
  document.getElementById("compareBtn").addEventListener("click", ()=>{
    if(compareMode){ compareMode=false; document.getElementById("compareBtn").classList.remove("active");
      document.getElementById("miniCompare").style.display="none"; document.getElementById("compareNote").textContent="";
      applyCountryStyles(); return; }
    renderCompare();
  });

  d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
    .then(w=>{
      world=w;
      countries=topojson.feature(world, world.objects.countries);
      countries.features.forEach(f=>{ f.id = f.id!==undefined ? f.id : f.properties.id; });
      render(false);
      bindEvents();
    })
    .catch(()=>{
      document.getElementById("hintTip").innerHTML="⚠️ 世界地图数据加载失败，请检查网络连接。";
    });
}
init();
</script>
