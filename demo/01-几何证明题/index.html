<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>几何证明题 · 交互式可视化</title>
<!-- JSXGraph 样式 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css">
<!-- MathJax 配置（须在库加载之前定义） -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)']] },
    chtml: { fontURL: 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/output/chtml/fonts/woff-v2' }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
<style>
  /* ================= 设计令牌（严格对应题目视觉规范） ================= */
  :root {
    --bg:        #f8f9fa;   /* 页面背景：浅色 */
    --card:      #ffffff;   /* 卡片/画布背景：白色 */
    --blue:      #2563eb;   /* 已知条件：深蓝 */
    --blue-dark: #1d4ed8;
    --gray-aux:  #94a3b8;   /* 辅助线：灰 */
    --red:       #dc2626;   /* 结论高亮：红 */
    --green:     #16a34a;   /* 等长标记：绿 */
    --orange:    #ea580c;   /* 等角标记：橙 */
    --text:      #0f172a;
    --text-dim:  #64748b;
    --border:    #e2e8f0;
    --ease:      all .3s ease;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ================= 顶部：标题 + 题目选择器 ================= */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px 12px;
    display: flex;
    align-items: center;
    gap: 28px;
    flex-wrap: wrap;
  }
  .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
  .brand .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; display: block; }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab {
    padding: 7px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: var(--ease);
  }
  .tab:hover { border-color: var(--blue); color: var(--blue); transform: translateY(-1px); }
  .tab.active { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }

  /* ================= 主区：左 60% 画布 / 右 40% 面板 ================= */
  main {
    flex: 1;
    display: flex;
    gap: 14px;
    padding: 14px 24px;
    min-height: 0;
  }

  .canvas-wrap {
    flex: 0 0 60%;
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .05);
  }
  #jxgbox { width: 100%; height: 100%; }
  .canvas-hint {
    position: absolute;
    left: 12px;
    bottom: 10px;
    font-size: 12px;
    color: var(--text-dim);
    background: rgba(255, 255, 255, .88);
    border: 1px solid var(--border);
    padding: 3px 12px;
    border-radius: 999px;
    pointer-events: none;
  }

  .panel {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    padding-bottom: 2px;
  }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .05);
  }
  .field-label {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  #problem-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .desc { font-size: 14px; line-height: 1.8; color: #334155; }

  /* 当前步骤卡片 */
  .proof-card { border-left: 4px solid var(--blue); }
  .proof-tag { font-size: 12px; color: var(--blue); font-weight: 600; margin-bottom: 4px; }
  .proof-action { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .proof-text { font-size: 14px; line-height: 1.8; color: #334155; }

  /* 步骤列表 */
  .steps-card ol { list-style: none; counter-reset: step; }
  .steps-card li {
    counter-increment: step;
    position: relative;
    padding: 8px 10px 8px 36px;
    font-size: 13.5px;
    color: var(--text-dim);
    border-radius: 8px;
    cursor: pointer;
    transition: var(--ease);
  }
  .steps-card li::before {
    content: counter(step);
    position: absolute;
    left: 8px; top: 50%;
    transform: translateY(-50%);
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #f1f5f9;
    color: var(--text-dim);
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--ease);
  }
  .steps-card li:hover { background: #f1f5f9; color: var(--text); }
  .steps-card li.done { color: #334155; }
  .steps-card li.done::before { background: #dcfce7; color: var(--green); }
  .steps-card li.active {
    background: #eff6ff;
    color: var(--blue-dark);
    font-weight: 600;
  }
  .steps-card li.active::before { background: var(--blue); color: #fff; }

  /* 图例 */
  .legend { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 12.5px; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .sw { width: 24px; height: 0; border-top: 3px solid var(--blue); border-radius: 2px; }
  .sw.dash  { border-top: 2px dashed var(--gray-aux); }
  .sw.concl { border-color: var(--red); }
  .sw.len   { border-color: var(--green); }
  .sw.ang   { border-color: var(--orange); }

  /* ================= 底部：步骤控制条 ================= */
  .controls {
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn {
    padding: 8px 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: #334155;
    font-size: 13.5px;
    cursor: pointer;
    transition: var(--ease);
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(37, 99, 235, .15); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--blue-dark); color: #fff; }

  .progress {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin: 0 8px;
  }
  #progress-fill { height: 100%; width: 0; background: var(--blue); border-radius: 999px; transition: width .3s ease; }
  .indicator { font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }

  /* ================= 响应式：窄屏堆叠 ================= */
  @media (max-width: 1023px) {
    body { overflow: auto; height: auto; }
    main { flex-direction: column; }
    .canvas-wrap { flex: none; height: 58vh; }
    .panel { overflow: visible; }
  }
</style>
</head>
<body>

  <!-- 顶部：标题 + 题目选择器 -->
  <header>
    <div class="brand">
      <h1>几何证明题 · 交互式可视化</h1>
      <span class="sub">JSXGraph 动态几何 × 步骤动画回放</span>
    </div>
    <nav id="problem-tabs" class="tabs"></nav>
  </header>

  <!-- 主区：左画布 / 右面板 -->
  <main>
    <section class="canvas-wrap">
      <div id="jxgbox"></div>
      <div class="canvas-hint">拖动蓝色顶点，图形与数值实时更新</div>
    </section>

    <aside class="panel">
      <div class="card">
        <div class="field-label">题目</div>
        <h2 id="problem-title"></h2>
        <p id="problem-desc" class="desc"></p>
      </div>

      <div class="card proof-card">
        <div class="proof-tag" id="proof-tag"></div>
        <div class="proof-action" id="step-action"></div>
        <div class="proof-text" id="step-proof"></div>
      </div>

      <div class="card steps-card">
        <div class="field-label">作图步骤 · 点击跳转</div>
        <ol id="step-list"></ol>
      </div>

      <div class="card legend-card">
        <div class="field-label">图例</div>
        <div class="legend">
          <span><i class="sw"></i>已知条件</span>
          <span><i class="sw dash"></i>辅助线</span>
          <span><i class="sw concl"></i>结论高亮</span>
          <span><i class="sw len"></i>等长标记</span>
          <span><i class="sw ang"></i>等角标记</span>
        </div>
      </div>
    </aside>
  </main>

  <!-- 底部：步骤控制条 -->
  <footer class="controls">
    <button id="btn-reset" class="btn" title="回到第一步">&#8634; 重置</button>
    <button id="btn-prev"  class="btn">&#8249; 上一步</button>
    <button id="btn-play"  class="btn primary">&#9654; 自动播放</button>
    <button id="btn-next"  class="btn">下一步 &#8250;</button>
    <div class="progress"><div id="progress-fill"></div></div>
    <span id="step-indicator" class="indicator"></span>
  </footer>

<script>
/* =========================================================
 * 全局样式常量（严格对应视觉规范）
 * 已知：深蓝实线 2px / 辅助线：灰色虚线 1.5px / 结论：红色 2.5px
 * 等长标记：绿色 / 等角标记：橙色弧线
 * =======================================================*/
var STYLE = {
  known:    { strokeColor: '#2563eb', strokeWidth: 2 },
  aux:      { strokeColor: '#94a3b8', strokeWidth: 1.5, dash: 2 },
  concl:    { strokeColor: '#dc2626', strokeWidth: 2.5 },
  lenMark:  { strokeColor: '#16a34a', strokeWidth: 2.5, highlight: false },
  angMark:  { strokeColor: '#ea580c', strokeWidth: 2, fillColor: '#fb923c', fillOpacity: 0.35, highlight: false },
  conclArc: { strokeColor: '#dc2626', strokeWidth: 2.5, fillColor: '#fca5a5', fillOpacity: 0.3, highlight: false },
  point:    { size: 3.5, fillColor: '#2563eb', strokeColor: '#ffffff', strokeWidth: 1.5,
              label: { fontSize: 14, color: '#0f172a', offset: [8, 8] } },
  auxPoint: { size: 2.5, fillColor: '#64748b', strokeColor: '#ffffff', strokeWidth: 1,
              label: { fontSize: 13, color: '#475569', offset: [8, 8] } },
  text:     { fontSize: 13, color: '#334155', fixed: true, highlight: false },
  conclText:{ fontSize: 16, color: '#dc2626', fixed: true, highlight: false,
              cssStyle: 'font-weight:700' }
};

/* ------------------------- 基础作图辅助函数 ------------------------- */

/* 自由顶点（可拖拽） */
function mkPoint(board, coords, name, extra) {
  return board.create('point', coords,
    Object.assign({ name: name }, STYLE.point, extra || {}));
}

/* 线段 */
function mkSeg(board, p, q, style, extra) {
  return board.create('segment', [p, q], Object.assign({}, style, extra || {}));
}

/* 联动文本（位置与内容均可为函数，拖拽时自动刷新） */
function mkText(board, x, y, content, extra) {
  return board.create('text', [x, y, content], Object.assign({}, STYLE.text, extra || {}));
}

/* 中点坐标函数 */
function midX(p, q) { return function () { return (p.X() + q.X()) / 2; }; }
function midY(p, q) { return function () { return (p.Y() + q.Y()) / 2; }; }

/* 三点夹角（度），v 为顶点 */
function degOf(p1, v, p2) {
  var a1 = Math.atan2(p1.Y() - v.Y(), p1.X() - v.X());
  var a2 = Math.atan2(p2.Y() - v.Y(), p2.X() - v.X());
  var d = (a1 - a2) * 180 / Math.PI;
  while (d > 180) d -= 360;
  while (d < -180) d += 360;
  return Math.abs(d);
}

/* 数值格式化 */
function fmt(x, n) { return x.toFixed(n === undefined ? 1 : n); }

/* 等长标记：在 pq 中点处绘制 count 条绿色小刻度（随图形联动） */
function mkTicks(board, p, q, count) {
  var els = [], i;
  for (i = 0; i < count; i++) {
    (function (idx) {
      var off = (idx - (count - 1) / 2) * 0.13;   // 多条刻度沿边方向错开
      var mkEnd = function (sign) {
        return board.create('point', [
          function () {
            var L = p.Dist(q) || 1e-6;
            var ux = (q.X() - p.X()) / L, uy = (q.Y() - p.Y()) / L;
            return (p.X() + q.X()) / 2 + ux * off - uy * 0.15 * sign;
          },
          function () {
            var L = p.Dist(q) || 1e-6;
            var ux = (q.X() - p.X()) / L, uy = (q.Y() - p.Y()) / L;
            return (p.Y() + q.Y()) / 2 + uy * off + ux * 0.15 * sign;
          }
        ], { visible: false, fixed: true });
      };
      var t1 = mkEnd(1), t2 = mkEnd(-1);
      els.push(t1, t2, board.create('segment', [t1, t2], STYLE.lenMark));
    })(i);
  }
  return els;
}

/* 等角标记：橙色弧线（v 为顶点） */
function mkAngle(board, p1, v, p2, radius, extra) {
  return board.create('angle', [p1, v, p2],
    Object.assign({ radius: radius || 0.55, name: '' }, STYLE.angMark, extra || {}));
}

/* 多边形（连边框一起返回，便于统一控制显隐） */
function mkPolygon(board, pts, attrs) {
  var poly = board.create('polygon', pts, Object.assign({
    vertices: { visible: false, fixed: true },
    borders: { strokeColor: '#2563eb', strokeWidth: 1.5, highlight: false },
    fillColor: '#dbeafe', fillOpacity: 0.45, highlight: false
  }, attrs || {}));
  var els = [poly];
  poly.borders.forEach(function (b) { els.push(b); });
  return els;
}

/* 以 pq 为边向外作正方形：返回两个新顶点（函数点，随拖拽联动）
 * s = ±1 控制外法线方向，需按图形布局选取 */
function squareOuter(board, p, q, s) {
  var r1 = board.create('point', [
    function () { return q.X() + s * (q.Y() - p.Y()); },
    function () { return q.Y() - s * (q.X() - p.X()); }
  ], { visible: false, fixed: true });
  var r2 = board.create('point', [
    function () { return p.X() + s * (q.Y() - p.Y()); },
    function () { return p.Y() - s * (q.X() - p.X()); }
  ], { visible: false, fixed: true });
  return [r1, r2];
}

/* 正方形中心坐标函数（用于放置面积标签） */
function sqCenterX(p, q, s) { return function () { return (p.X() + q.X()) / 2 + s * (q.Y() - p.Y()) / 2; }; }
function sqCenterY(p, q, s) { return function () { return (p.Y() + q.Y()) / 2 - s * (q.X() - p.X()) / 2; }; }

/* MathJax 重排（面板文字更新后调用） */
function typeset(el) {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([el]).catch(function () {});
  }
}

/* =========================================================
 * 题库：每道题 = setup（自由点构造） + steps（分步作图脚本）
 * 该结构模拟「AI 解析题目 → 生成 JSXGraph 构造脚本」的输出
 * =======================================================*/
var PROBLEMS = [

/* ---------------- 题 1：全等三角形的判定（SAS） ---------------- */
{
  tab: '全等三角形 SAS',
  title: '全等三角形的判定 — 边角边（SAS）',
  desc: '已知：在 \\(\\triangle ABC\\) 与 \\(\\triangle DEF\\) 中，\\(AB=DE\\)，\\(\\angle B=\\angle E\\)，\\(BC=EF\\)。求证：\\(\\triangle ABC \\cong \\triangle DEF\\)。',
  bbox: [-0.8, 6.4, 11.4, -1.0],
  setup: function (board, ctx) {
    /* △ABC 三个自由顶点（可拖拽） */
    ctx.A = mkPoint(board, [1, 1], 'A');
    ctx.B = mkPoint(board, [4.6, 1], 'B');
    ctx.C = mkPoint(board, [3.2, 3.6], 'C');
    /* △DEF：由 △ABC 平移并镜像得到（保证两边及其夹角对应相等），D 可拖拽 */
    ctx.D = mkPoint(board, [6.6, 4.8], 'D');
    ctx.E = board.create('point', [
      function () { return ctx.D.X() + (ctx.B.X() - ctx.A.X()); },
      function () { return ctx.D.Y() - (ctx.B.Y() - ctx.A.Y()); }
    ], Object.assign({ name: 'E' }, STYLE.point));
    ctx.F = board.create('point', [
      function () { return ctx.D.X() + (ctx.C.X() - ctx.A.X()); },
      function () { return ctx.D.Y() - (ctx.C.Y() - ctx.A.Y()); }
    ], Object.assign({ name: 'F' }, STYLE.point));
  },
  steps: [
    {
      action: '作 △ABC',
      proof: '作三角形 \\(ABC\\)。三个蓝色顶点均可直接拖拽，后续图形会随之联动。',
      build: function (board, ctx) {
        ctx.AB = mkSeg(board, ctx.A, ctx.B, STYLE.known);
        ctx.BC = mkSeg(board, ctx.B, ctx.C, STYLE.known);
        ctx.CA = mkSeg(board, ctx.C, ctx.A, STYLE.known);
        return [ctx.AB, ctx.BC, ctx.CA];
      }
    },
    {
      action: '作 △DEF',
      proof: '由全等变换作出三角形 \\(DEF\\)：使 \\(DE=AB\\)，\\(EF=BC\\)，且 \\(\\angle E=\\angle B\\)。',
      build: function (board, ctx) {
        ctx.DE = mkSeg(board, ctx.D, ctx.E, STYLE.known);
        ctx.EF = mkSeg(board, ctx.E, ctx.F, STYLE.known);
        ctx.FD = mkSeg(board, ctx.F, ctx.D, STYLE.known);
        /* E、F 在 setup 中创建，这里随本步一起显示 */
        return [ctx.E, ctx.F, ctx.DE, ctx.EF, ctx.FD];
      }
    },
    {
      action: '标记等边 AB 与 DE',
      proof: '已知条件①：\\(AB=DE\\)。绿色刻度表示等长，长度数值随拖拽实时更新且始终相等。',
      build: function (board, ctx) {
        var els = mkTicks(board, ctx.A, ctx.B, 1).concat(mkTicks(board, ctx.D, ctx.E, 1));
        els.push(mkText(board,
          midX(ctx.A, ctx.B),
          function () { return (ctx.A.Y() + ctx.B.Y()) / 2 - 0.42; },
          function () { return 'AB = ' + fmt(ctx.A.Dist(ctx.B), 2); }));
        els.push(mkText(board,
          midX(ctx.D, ctx.E),
          function () { return (ctx.D.Y() + ctx.E.Y()) / 2 + 0.3; },
          function () { return 'DE = ' + fmt(ctx.D.Dist(ctx.E), 2); }));
        return els;
      }
    },
    {
      action: '标记等角 ∠B 与 ∠E',
      proof: '已知条件②：\\(\\angle B=\\angle E\\)（橙色弧线），它正是两组等边的夹角。',
      build: function (board, ctx) {
        var a1 = mkAngle(board, ctx.C, ctx.B, ctx.A, 0.55);
        var a2 = mkAngle(board, ctx.D, ctx.E, ctx.F, 0.55);
        var t = mkText(board,
          function () { return (ctx.B.X() + ctx.E.X()) / 2 - 0.6; },
          function () { return (ctx.B.Y() + ctx.E.Y()) / 2 + 0.15; },
          function () { return '∠B = ∠E = ' + fmt(degOf(ctx.C, ctx.B, ctx.A)) + '°'; });
        return [a1, a2, t];
      }
    },
    {
      action: '标记等边 BC 与 EF',
      proof: '已知条件③：\\(BC=EF\\)（双刻度与单刻度区分两组等边）。',
      build: function (board, ctx) {
        var els = mkTicks(board, ctx.B, ctx.C, 2).concat(mkTicks(board, ctx.E, ctx.F, 2));
        els.push(mkText(board,
          function () { return (ctx.B.X() + ctx.C.X() + ctx.E.X() + ctx.F.X()) / 4 - 1.0; },
          function () { return (ctx.B.Y() + ctx.C.Y() + ctx.E.Y() + ctx.F.Y()) / 4 + 0.55; },
          function () { return 'BC = EF = ' + fmt(ctx.B.Dist(ctx.C), 2); }));
        return els;
      }
    },
    {
      action: '结论：△ABC ≌ △DEF',
      proof: '两边及其夹角对应相等（SAS），所以 \\(\\triangle ABC \\cong \\triangle DEF\\)。红色高亮标出全等的两个三角形。',
      build: function (board, ctx) {
        var pairs = [[ctx.A, ctx.B], [ctx.B, ctx.C], [ctx.C, ctx.A],
                     [ctx.D, ctx.E], [ctx.E, ctx.F], [ctx.F, ctx.D]];
        var els = pairs.map(function (pr) { return mkSeg(board, pr[0], pr[1], STYLE.concl); });
        els.push(mkText(board, 4.1, 5.9, '△ABC ≌ △DEF（SAS）', STYLE.conclText));
        return els;
      }
    }
  ]
},

/* ---------------- 题 2：勾股定理的面积证明 ---------------- */
{
  tab: '勾股定理',
  title: '勾股定理的面积证明',
  desc: '已知：Rt\\(\\triangle ABC\\) 中 \\(\\angle A=90^\\circ\\)，记 \\(BC=a\\)，\\(CA=b\\)，\\(AB=c\\)。求证：\\(a^2=b^2+c^2\\)。',
  bbox: [-2.6, 9.2, 10.6, -4.6],
  setup: function (board, ctx) {
    ctx.A = mkPoint(board, [2, 1], 'A');
    ctx.B = mkPoint(board, [6, 1], 'B');
    /* 过 A 作 AB 的垂线（隐藏），C 是垂线上的滑点 —— 保证 ∠A 恒为直角 */
    ctx.lineAB = board.create('line', [ctx.A, ctx.B], { visible: false });
    ctx.perp   = board.create('perpendicular', [ctx.lineAB, ctx.A], { visible: false });
    ctx.C = board.create('glider', [2, 4.2, ctx.perp], Object.assign({ name: 'C' }, STYLE.point));
  },
  steps: [
    {
      action: '作 Rt△ABC，∠A = 90°',
      proof: '作直角三角形，三边记为 \\(a,b,c\\)。点 \\(C\\) 被约束在过 \\(A\\) 且垂直 \\(AB\\) 的直线上，拖动时直角始终成立。',
      build: function (board, ctx) {
        ctx.AB = mkSeg(board, ctx.A, ctx.B, STYLE.known);
        ctx.AC = mkSeg(board, ctx.A, ctx.C, STYLE.known);
        ctx.BC = mkSeg(board, ctx.B, ctx.C, STYLE.known);
        /* 直角符号 */
        var ra = board.create('angle', [ctx.B, ctx.A, ctx.C], {
          type: 'square', radius: 0.45, name: '',
          strokeColor: '#64748b', fillColor: '#e2e8f0', fillOpacity: 0.8, highlight: false
        });
        /* 边名标签 */
        var lc = mkText(board, midX(ctx.A, ctx.B),
          function () { return (ctx.A.Y() + ctx.B.Y()) / 2 - 0.42; }, 'c');
        var lb = mkText(board,
          function () { return (ctx.A.X() + ctx.C.X()) / 2 - 0.38; },
          midY(ctx.A, ctx.C), 'b');
        var la = mkText(board,
          function () { return (ctx.B.X() + ctx.C.X()) / 2 + 0.3; },
          function () { return (ctx.B.Y() + ctx.C.Y()) / 2 + 0.3; }, 'a');
        return [ctx.AB, ctx.AC, ctx.BC, ra, lc, lb, la];
      }
    },
    {
      action: '以 c 为边向外作正方形',
      proof: '在 \\(AB\\) 外侧作正方形，其面积为 \\(c^2\\)。',
      build: function (board, ctx) {
        var sq = squareOuter(board, ctx.A, ctx.B, 1);   /* AB 下方 */
        var poly = mkPolygon(board, [ctx.A, ctx.B, sq[0], sq[1]]);
        return sq.concat(poly);
      }
    },
    {
      action: '以 b 为边向外作正方形',
      proof: '在 \\(AC\\) 外侧作正方形，其面积为 \\(b^2\\)。',
      build: function (board, ctx) {
        var sq = squareOuter(board, ctx.A, ctx.C, -1);  /* AC 左侧 */
        var poly = mkPolygon(board, [ctx.A, ctx.C, sq[0], sq[1]]);
        return sq.concat(poly);
      }
    },
    {
      action: '以 a 为边向外作正方形',
      proof: '在斜边 \\(BC\\) 外侧作正方形，其面积为 \\(a^2\\)。',
      build: function (board, ctx) {
        var sq = squareOuter(board, ctx.B, ctx.C, 1);   /* BC 外侧 */
        var poly = mkPolygon(board, [ctx.B, ctx.C, sq[0], sq[1]]);
        return sq.concat(poly);
      }
    },
    {
      action: '标注三个正方形的面积',
      proof: '面积数值实时计算：\\(S_c=c^2\\)，\\(S_b=b^2\\)，\\(S_a=a^2\\)。注意观察 \\(S_b+S_c\\) 与 \\(S_a\\) 的关系。',
      build: function (board, ctx) {
        var tc = mkText(board, sqCenterX(ctx.A, ctx.B, 1), sqCenterY(ctx.A, ctx.B, 1),
          function () { var d = ctx.A.Dist(ctx.B); return 'c² = ' + fmt(d * d); });
        var tb = mkText(board, sqCenterX(ctx.A, ctx.C, -1), sqCenterY(ctx.A, ctx.C, -1),
          function () { var d = ctx.A.Dist(ctx.C); return 'b² = ' + fmt(d * d); });
        var ta = mkText(board, sqCenterX(ctx.B, ctx.C, 1), sqCenterY(ctx.B, ctx.C, 1),
          function () { var d = ctx.B.Dist(ctx.C); return 'a² = ' + fmt(d * d); });
        var sum = mkText(board, -2.3, 8.7, function () {
          var b = ctx.A.Dist(ctx.C), c = ctx.A.Dist(ctx.B), a = ctx.B.Dist(ctx.C);
          return 'b² + c² = ' + fmt(b * b + c * c) + '， a² = ' + fmt(a * a);
        }, { fontSize: 14, cssStyle: 'font-weight:600' });
        return [tc, tb, ta, sum];
      }
    },
    {
      action: '结论：a² = b² + c²',
      proof: '勾股定理：直角三角形两直角边的平方和等于斜边的平方，即 \\[a^2=b^2+c^2\\] 拖动任意顶点，等式恒成立——这就是动态的验证。',
      build: function (board, ctx) {
        var sq = squareOuter(board, ctx.B, ctx.C, 1);
        var els = sq.slice();
        /* 斜边正方形描红边 */
        [[ctx.B, ctx.C], [ctx.C, sq[0]], [sq[0], sq[1]], [sq[1], ctx.B]].forEach(function (pr) {
          els.push(mkSeg(board, pr[0], pr[1], STYLE.concl));
        });
        els.push(mkText(board, 6.0, 8.6, 'a² = b² + c²', STYLE.conclText));
        return els;
      }
    }
  ]
},

/* ---------------- 题 3：三角形中线交于一点（重心定理） ---------------- */
{
  tab: '重心定理',
  title: '三角形的中线交于一点 — 重心定理',
  desc: '求证：三角形的三条中线交于一点 \\(G\\)（重心），且 \\(AG:GD=BG:GE=CG:GF=2:1\\)。',
  bbox: [-0.6, 7.2, 10.8, -0.8],
  setup: function (board, ctx) {
    ctx.A = mkPoint(board, [1.5, 5], 'A');
    ctx.B = mkPoint(board, [7, 5.6], 'B');
    ctx.C = mkPoint(board, [4, 1.2], 'C');
  },
  steps: [
    {
      action: '作 △ABC',
      proof: '作三角形 \\(ABC\\)。中线：顶点与对边中点的连线。',
      build: function (board, ctx) {
        ctx.AB = mkSeg(board, ctx.A, ctx.B, STYLE.known);
        ctx.BC = mkSeg(board, ctx.B, ctx.C, STYLE.known);
        ctx.CA = mkSeg(board, ctx.C, ctx.A, STYLE.known);
        return [ctx.AB, ctx.BC, ctx.CA];
      }
    },
    {
      action: '取 BC 中点 D，作中线 AD',
      proof: '取 \\(BC\\) 的中点 \\(D\\)，连接 \\(AD\\)。辅助线用灰色虚线表示。',
      build: function (board, ctx) {
        ctx.D = board.create('midpoint', [ctx.B, ctx.C], Object.assign({ name: 'D' }, STYLE.auxPoint));
        ctx.mAD = mkSeg(board, ctx.A, ctx.D, STYLE.aux);
        return [ctx.D, ctx.mAD];
      }
    },
    {
      action: '取 AC 中点 E，作中线 BE',
      proof: '取 \\(AC\\) 的中点 \\(E\\)，连接 \\(BE\\)。',
      build: function (board, ctx) {
        ctx.E = board.create('midpoint', [ctx.A, ctx.C], Object.assign({ name: 'E' }, STYLE.auxPoint));
        ctx.mBE = mkSeg(board, ctx.B, ctx.E, STYLE.aux);
        return [ctx.E, ctx.mBE];
      }
    },
    {
      action: '取 AB 中点 F，作中线 CF',
      proof: '取 \\(AB\\) 的中点 \\(F\\)，连接 \\(CF\\)。三条中线已就位。',
      build: function (board, ctx) {
        ctx.F = board.create('midpoint', [ctx.A, ctx.B], Object.assign({ name: 'F' }, STYLE.auxPoint));
        ctx.mCF = mkSeg(board, ctx.C, ctx.F, STYLE.aux);
        return [ctx.F, ctx.mCF];
      }
    },
    {
      action: '三条中线交于一点 G',
      proof: '观察：无论怎么拖动顶点，三条中线始终交于同一点 \\(G\\)，称为三角形的<b>重心</b>。',
      build: function (board, ctx) {
        ctx.lAD = board.create('line', [ctx.A, ctx.D], { visible: false });
        ctx.lBE = board.create('line', [ctx.B, ctx.E], { visible: false });
        ctx.G = board.create('intersection', [ctx.lAD, ctx.lBE, 0], {
          name: 'G', size: 4, fillColor: '#dc2626', strokeColor: '#ffffff', strokeWidth: 1.5,
          label: { fontSize: 14, color: '#dc2626', offset: [8, 8] }
        });
        return [ctx.G];
      }
    },
    {
      action: '结论：AG : GD = 2 : 1',
      proof: '重心性质：重心到顶点的距离是到对边中点距离的 2 倍，即 \\(AG:GD=BG:GE=CG:GF=2:1\\)。右侧比值实时计算，恒为 2。',
      build: function (board, ctx) {
        var els = [
          mkSeg(board, ctx.A, ctx.G, STYLE.concl),
          mkSeg(board, ctx.G, ctx.D, STYLE.concl),
          mkText(board, 8.0, 4.9, function () { return 'AG : GD = ' + fmt(ctx.A.Dist(ctx.G) / ctx.G.Dist(ctx.D), 2) + ' : 1'; }),
          mkText(board, 8.0, 4.2, function () { return 'BG : GE = ' + fmt(ctx.B.Dist(ctx.G) / ctx.G.Dist(ctx.E), 2) + ' : 1'; }),
          mkText(board, 8.0, 3.5, function () { return 'CG : GF = ' + fmt(ctx.C.Dist(ctx.G) / ctx.G.Dist(ctx.F), 2) + ' : 1'; })
        ];
        return els;
      }
    }
  ]
},

/* ---------------- 题 4：圆周角定理 ---------------- */
{
  tab: '圆周角定理',
  title: '圆周角定理',
  desc: '已知：\\(A,B,C\\) 是 \\(\\odot O\\) 上的点。求证：同弧所对的圆心角是圆周角的两倍，即 \\(\\angle AOB=2\\angle ACB\\)。',
  bbox: [-0.6, 7.0, 9.0, 0.2],
  setup: function (board, ctx) {
    ctx.O = mkPoint(board, [4, 3.6], 'O');
    ctx.circle = board.create('circle', [ctx.O, 2.3],
      { strokeColor: '#2563eb', strokeWidth: 2, highlight: false });
    /* A、B、C 为圆上的滑点（可沿圆周拖动） */
    var R = 2.3, rad = Math.PI / 180;
    var onCircle = function (deg) {
      return [ctx.O.X() + R * Math.cos(deg * rad), ctx.O.Y() + R * Math.sin(deg * rad), ctx.circle];
    };
    ctx.A = board.create('glider', onCircle(195), Object.assign({ name: 'A' }, STYLE.point));
    ctx.B = board.create('glider', onCircle(345), Object.assign({ name: 'B' }, STYLE.point));
    ctx.C = board.create('glider', onCircle(80),  Object.assign({ name: 'C' }, STYLE.point));
  },
  steps: [
    {
      action: '作圆 O',
      proof: '以 \\(O\\) 为圆心作圆。圆心 \\(O\\) 可整体拖动。',
      build: function (board, ctx) { return [ctx.circle]; }
    },
    {
      action: '在圆上取点 A、B，连半径',
      proof: '在圆上取点 \\(A,B\\)，连接半径 \\(OA,OB\\)。两点均可沿圆周拖动。',
      build: function (board, ctx) {
        ctx.OA = mkSeg(board, ctx.O, ctx.A, STYLE.known);
        ctx.OB = mkSeg(board, ctx.O, ctx.B, STYLE.known);
        return [ctx.A, ctx.B, ctx.OA, ctx.OB];
      }
    },
    {
      action: '标记圆心角 ∠AOB',
      proof: '\\(\\angle AOB\\) 是弧 \\(AB\\) 所对的<b>圆心角</b>（橙色弧线），度数实时显示。',
      build: function (board, ctx) {
        var arc = mkAngle(board, ctx.A, ctx.O, ctx.B, 0.6);
        var t = mkText(board,
          function () { return ctx.O.X() + 0.95; },
          function () { return ctx.O.Y() - 0.85; },
          function () { return '∠AOB = ' + fmt(degOf(ctx.A, ctx.O, ctx.B)) + '°'; });
        return [arc, t];
      }
    },
    {
      action: '在优弧上取点 C，连弦 CA、CB',
      proof: '在优弧 \\(AB\\) 上取点 \\(C\\)，连接 \\(CA,CB\\)。',
      build: function (board, ctx) {
        ctx.CA = mkSeg(board, ctx.C, ctx.A, STYLE.known);
        ctx.CB = mkSeg(board, ctx.C, ctx.B, STYLE.known);
        return [ctx.C, ctx.CA, ctx.CB];
      }
    },
    {
      action: '标记圆周角 ∠ACB',
      proof: '\\(\\angle ACB\\) 是弧 \\(AB\\) 所对的<b>圆周角</b>。它与 \\(\\angle AOB\\) 对着同一段弧。',
      build: function (board, ctx) {
        var arc = mkAngle(board, ctx.A, ctx.C, ctx.B, 0.5);
        var t = mkText(board,
          function () { return ctx.C.X() + 0.45; },
          function () { return ctx.C.Y() + 0.35; },
          function () { return '∠ACB = ' + fmt(degOf(ctx.A, ctx.C, ctx.B)) + '°'; });
        return [arc, t];
      }
    },
    {
      action: '结论：∠AOB = 2∠ACB',
      proof: '圆周角定理：同弧所对的圆心角等于圆周角的 2 倍，即 \\(\\angle AOB=2\\angle ACB\\)。拖动 \\(A,B,C\\) 动态验证（保持 \\(C\\) 在优弧上）。',
      build: function (board, ctx) {
        var arc1 = mkAngle(board, ctx.A, ctx.O, ctx.B, 0.88, STYLE.conclArc);
        var arc2 = mkAngle(board, ctx.A, ctx.C, ctx.B, 0.78, STYLE.conclArc);
        var t1 = mkText(board, 6.0, 6.5, '∠AOB = 2 × ∠ACB', STYLE.conclText);
        var t2 = mkText(board, 6.0, 5.8, function () {
          return '∠AOB ÷ ∠ACB = ' + fmt(degOf(ctx.A, ctx.O, ctx.B) / degOf(ctx.A, ctx.C, ctx.B), 2);
        });
        return [arc1, arc2, t1, t2];
      }
    }
  ]
},

/* ---------------- 题 5：相似三角形的判定（AA · 平行截割） ---------------- */
{
  tab: '相似三角形 AA',
  title: '相似三角形的判定 — 两角对应相等（AA）',
  desc: '已知：在 \\(\\triangle ABC\\) 中，\\(D\\) 是 \\(AB\\) 上的点，\\(DE \\parallel BC\\) 交 \\(AC\\) 于 \\(E\\)。求证：\\(\\triangle ADE \\sim \\triangle ABC\\)。',
  bbox: [-0.6, 7.2, 11.0, -0.8],
  setup: function (board, ctx) {
    ctx.A = mkPoint(board, [1, 1], 'A');
    ctx.B = mkPoint(board, [7.4, 1.2], 'B');
    ctx.C = mkPoint(board, [4.4, 5.4], 'C');
    /* 三边在 setup 中创建（D 需要以 AB 为滑道），第 1 步负责显示 */
    ctx.AB = mkSeg(board, ctx.A, ctx.B, STYLE.known);
    ctx.BC = mkSeg(board, ctx.B, ctx.C, STYLE.known);
    ctx.CA = mkSeg(board, ctx.C, ctx.A, STYLE.known);
    /* D 是 AB 上的滑点；过 D 作 BC 的平行线（隐藏），交 AC 于 E */
    ctx.D = board.create('glider', [3.6, 1.05, ctx.AB], Object.assign({ name: 'D' }, STYLE.point));
    ctx.lineBC = board.create('line', [ctx.B, ctx.C], { visible: false });
    ctx.lineAC = board.create('line', [ctx.A, ctx.C], { visible: false });
    ctx.par = board.create('parallel', [ctx.lineBC, ctx.D], { visible: false });
    ctx.E = board.create('intersection', [ctx.par, ctx.lineAC, 0],
      Object.assign({ name: 'E' }, STYLE.point));
  },
  steps: [
    {
      action: '作 △ABC',
      proof: '作三角形 \\(ABC\\)，三个顶点均可拖拽。',
      build: function (board, ctx) { return [ctx.AB, ctx.BC, ctx.CA]; }
    },
    {
      action: '在 AB 上取点 D',
      proof: '点 \\(D\\) 是 \\(AB\\) 上的动点，可沿边拖动，后续图形随之变化。',
      build: function (board, ctx) { return [ctx.D]; }
    },
    {
      action: '过 D 作 DE ∥ BC，交 AC 于 E',
      proof: '作平行线（辅助线，虚线）。由平行线分线段成比例：\\(\\dfrac{AD}{AB}=\\dfrac{AE}{AC}\\)。',
      build: function (board, ctx) {
        ctx.DE = mkSeg(board, ctx.D, ctx.E, STYLE.aux);
        return [ctx.E, ctx.DE];
      }
    },
    {
      action: '标记两组等角',
      proof: '公共角 \\(\\angle DAE=\\angle BAC\\)；由 \\(DE \\parallel BC\\)，同位角 \\(\\angle ADE=\\angle ABC\\)。两角对应相等，故相似（AA）。',
      build: function (board, ctx) {
        return [
          mkAngle(board, ctx.B, ctx.A, ctx.C, 0.5),   /* 公共角 ∠A */
          mkAngle(board, ctx.E, ctx.D, ctx.A, 0.45),  /* ∠ADE */
          mkAngle(board, ctx.C, ctx.B, ctx.A, 0.5)    /* ∠ABC */
        ];
      }
    },
    {
      action: '对应边成比例',
      proof: '相似三角形对应边成比例：\\(\\dfrac{AD}{AB}=\\dfrac{AE}{AC}=\\dfrac{DE}{BC}\\)。拖动 \\(D\\)，三个比值同步变化且始终相等。',
      build: function (board, ctx) {
        return [
          mkText(board, 8.4, 4.6, function () { return 'AD / AB = ' + fmt(ctx.A.Dist(ctx.D) / ctx.A.Dist(ctx.B), 2); }),
          mkText(board, 8.4, 3.9, function () { return 'AE / AC = ' + fmt(ctx.A.Dist(ctx.E) / ctx.A.Dist(ctx.C), 2); }),
          mkText(board, 8.4, 3.2, function () { return 'DE / BC = ' + fmt(ctx.D.Dist(ctx.E) / ctx.B.Dist(ctx.C), 2); })
        ];
      }
    },
    {
      action: '结论：△ADE ∽ △ABC',
      proof: '由 AA 判定：\\(\\triangle ADE \\sim \\triangle ABC\\)，相似比为 \\(\\dfrac{AD}{AB}\\)。红色高亮为小三角形的三边。',
      build: function (board, ctx) {
        return [
          mkSeg(board, ctx.A, ctx.D, STYLE.concl),
          mkSeg(board, ctx.A, ctx.E, STYLE.concl),
          mkSeg(board, ctx.D, ctx.E, STYLE.concl),
          mkText(board, 8.4, 5.8, '△ADE ∽ △ABC', STYLE.conclText)
        ];
      }
    }
  ]
}
];

/* =========================================================
 * 步骤引擎：按需创建元素，显隐控制实现步骤前进/回退
 * （元素只创建一次，回退仅切换 visible，拖拽不闪烁）
 * =======================================================*/
var App = {
  board: null,
  problem: null,
  problemIndex: 0,
  ctx: null,        // 题目构造上下文（保存几何元素引用）
  stepEls: [],      // 每一步产生的元素数组
  stepIndex: 0,
  timer: null,

  /* 重建画板（切换题目时调用，避免元素残留） */
  resetBoard: function (bbox) {
    if (this.board) { JXG.JSXGraph.freeBoard(this.board); this.board = null; }
    this.board = JXG.JSXGraph.initBoard('jxgbox', {
      boundingbox: bbox,
      axis: false, grid: false,
      showCopyright: false, showNavigation: false,
      keepAspectRatio: true,
      pan: { enabled: false },     // 关闭画布平移，避免拖点误触
      zoom: { enabled: false }     // 关闭滚轮缩放
    });
  },

  /* 载入题目 */
  loadProblem: function (idx) {
    this.stopPlay();
    this.problemIndex = idx;
    this.problem = PROBLEMS[idx];
    this.ctx = {};
    this.stepEls = [];
    this.resetBoard(this.problem.bbox);
    this.problem.setup(this.board, this.ctx);

    /* 题目文字 */
    document.getElementById('problem-title').textContent = this.problem.title;
    var desc = document.getElementById('problem-desc');
    desc.innerHTML = this.problem.desc;
    typeset(desc);

    /* 标签页高亮 */
    document.querySelectorAll('.tab').forEach(function (t, i) {
      t.classList.toggle('active', i === idx);
    });

    this.goToStep(0);
  },

  /* 懒创建第 i 步的元素（必须按顺序调用，保证构造依赖） */
  ensureStep: function (i) {
    if (!this.stepEls[i]) {
      this.stepEls[i] = this.problem.steps[i].build(this.board, this.ctx) || [];
    }
  },

  setStepVisible: function (i, vis) {
    (this.stepEls[i] || []).forEach(function (el) { el.setAttribute({ visible: vis }); });
  },

  /* 跳转到第 i 步 */
  goToStep: function (i) {
    var n = this.problem.steps.length, k;
    i = Math.max(0, Math.min(n - 1, i));
    for (k = 0; k <= i; k++) { this.ensureStep(k); }
    for (k = 0; k < n; k++) { this.setStepVisible(k, k <= i); }
    this.stepIndex = i;
    this.board.update();
    this.renderStep();
    this.renderList();
    this.renderBar();
  },

  /* 右侧面板：当前步骤 */
  renderStep: function () {
    var st = this.problem.steps[this.stepIndex];
    document.getElementById('proof-tag').textContent =
      '第 ' + (this.stepIndex + 1) + ' 步 / 共 ' + this.problem.steps.length + ' 步';
    document.getElementById('step-action').textContent = st.action;
    var proof = document.getElementById('step-proof');
    proof.innerHTML = st.proof;
    typeset(proof);
  },

  /* 右侧面板：步骤列表 */
  renderList: function () {
    var self = this;
    var ol = document.getElementById('step-list');
    ol.innerHTML = '';
    this.problem.steps.forEach(function (st, k) {
      var li = document.createElement('li');
      li.textContent = st.action;
      li.className = k === self.stepIndex ? 'active' : (k < self.stepIndex ? 'done' : '');
      li.onclick = function () { self.stopPlay(); self.goToStep(k); };
      ol.appendChild(li);
    });
  },

  /* 底部控制条状态 */
  renderBar: function () {
    var n = this.problem.steps.length, i = this.stepIndex;
    document.getElementById('progress-fill').style.width = ((i + 1) / n * 100) + '%';
    document.getElementById('step-indicator').textContent = (i + 1) + ' / ' + n;
    document.getElementById('btn-prev').disabled = (i === 0);
    document.getElementById('btn-next').disabled = (i === n - 1);
  },

  /* 自动播放（已到末尾则从头开始） */
  togglePlay: function () {
    if (this.timer) { this.stopPlay(); return; }
    if (this.stepIndex >= this.problem.steps.length - 1) { this.goToStep(0); }
    var self = this;
    this.timer = setInterval(function () {
      if (self.stepIndex >= self.problem.steps.length - 1) { self.stopPlay(); return; }
      self.goToStep(self.stepIndex + 1);
    }, 2600);
    this.syncPlayBtn();
  },

  stopPlay: function () {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    this.syncPlayBtn();
  },

  syncPlayBtn: function () {
    var btn = document.getElementById('btn-play');
    if (btn) { btn.innerHTML = this.timer ? '&#10074;&#10074; 暂停' : '&#9654; 自动播放'; }
  }
};

/* ------------------------- 启动 ------------------------- */
function boot() {
  /* 生成题目选择标签 */
  var nav = document.getElementById('problem-tabs');
  PROBLEMS.forEach(function (p, i) {
    var b = document.createElement('button');
    b.className = 'tab';
    b.textContent = p.tab;
    b.onclick = function () { App.loadProblem(i); };
    nav.appendChild(b);
  });

  /* 底部控制条 */
  document.getElementById('btn-prev').onclick  = function () { App.stopPlay(); App.goToStep(App.stepIndex - 1); };
  document.getElementById('btn-next').onclick  = function () { App.stopPlay(); App.goToStep(App.stepIndex + 1); };
  document.getElementById('btn-play').onclick  = function () { App.togglePlay(); };
  document.getElementById('btn-reset').onclick = function () { App.stopPlay(); App.goToStep(0); };

  /* 键盘左右方向键切换步骤 */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft')  { App.stopPlay(); App.goToStep(App.stepIndex - 1); }
    if (e.key === 'ArrowRight') { App.stopPlay(); App.goToStep(App.stepIndex + 1); }
  });

  /* 窗口尺寸变化时自适应画布 */
  var t;
  window.addEventListener('resize', function () {
    clearTimeout(t);
    t = setTimeout(function () {
      var box = document.getElementById('jxgbox');
      if (App.board) { App.board.resizeContainer(box.clientWidth, box.clientHeight); }
    }, 150);
  });

  App.loadProblem(0);
}

window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
