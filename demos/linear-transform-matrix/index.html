<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线性变换矩阵可视化 · 景礴</title>
<link rel="stylesheet" href="/assets/css/design-system.css">
<link rel="stylesheet" href="/assets/css/demo-framework.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
/* ===== 线性变换 Demo 专属样式 ===== */
:root {
  --lt-violet: #7c3aed;
  --lt-violet-light: #8b5cf6;
  --lt-violet-soft: rgba(124, 58, 237, 0.1);
  --lt-violet-glow: rgba(124, 58, 237, 0.25);
  --lt-ihat: #e11d48;
  --lt-ihat-soft: rgba(225, 29, 72, 0.12);
  --lt-jhat: #059669;
  --lt-jhat-soft: rgba(5, 150, 105, 0.12);
  --lt-gray: #94a3b8;
  --lt-grid: #e8e2d6;
  --lt-grid-transformed: rgba(124, 58, 237, 0.28);
  --lt-axis: #b8aea0;
  --lt-bg-soft: #f5f1ea;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--bg);
}

/* ===== 顶部进度条 ===== */
.top-progress {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--border-soft);
  z-index: 200;
}
.top-progress-bar {
  height: 100%;
  width: 20%;
  background: linear-gradient(90deg, var(--lt-violet), var(--lt-violet-light));
  border-radius: 0 2px 2px 0;
  transition: width 0.4s var(--ease);
}

/* ===== 杂志布局 ===== */
.magazine-layout {
  display: grid;
  grid-template-columns: 38% 62%;
  gap: var(--spacer-48);
  max-width: 1440px;
  margin: 0 auto;
  padding: var(--spacer-48) var(--spacer-32);
  min-height: calc(100vh - 64px);
}
body.has-info-bar .magazine-layout {
  padding-bottom: calc(var(--spacer-48) + 52px);
}

/* ===== 左侧文章区 ===== */
.article-side {
  display: flex;
  flex-direction: column;
  gap: var(--spacer-24);
}
.article-header { display: flex; flex-direction: column; gap: var(--spacer-12); }
.article-kicker {
  font-family: var(--font-mono);
  font-size: var(--fs-tiny);
  letter-spacing: 0.12em;
  color: var(--lt-violet);
  text-transform: uppercase;
  font-weight: 600;
}
.article-title {
  font-family: var(--font-serif);
  font-size: var(--fs-h1);
  font-weight: 700;
  line-height: 1.25;
  color: var(--text);
}
.article-subtitle {
  font-size: var(--fs-body);
  color: var(--text-muted);
  line-height: var(--lh-relaxed);
  font-style: italic;
  font-family: var(--font-serif);
}
.article-body { display: flex; flex-direction: column; gap: var(--spacer-16); }
.article-body p {
  font-size: var(--fs-body);
  line-height: 1.85;
  color: var(--text);
}
.article-body p.lead {
  font-size: 16px;
  font-weight: 500;
  line-height: 1.7;
  color: var(--lt-violet);
}
.article-body strong { color: var(--lt-violet); font-weight: 600; }
.article-body em { color: var(--lt-ihat); font-style: italic; font-weight: 500; }

/* ===== 步骤指示器 ===== */
.step-indicator {
  display: flex;
  align-items: center;
  gap: var(--spacer-12);
  margin: var(--spacer-8) 0;
}
.step-dots { display: flex; gap: 10px; }
.step-dot {
  width: 10px; height: 10px;
  border-radius: var(--radius-full);
  background-color: var(--border);
  transition: all var(--duration-base) var(--ease);
  cursor: pointer;
}
.step-dot.active {
  background-color: var(--lt-violet);
  transform: scale(1.3);
  box-shadow: 0 0 0 4px var(--lt-violet-soft);
}
.step-dot.completed { background-color: var(--lt-violet-light); opacity: 0.5; }
.step-label {
  font-family: var(--font-mono);
  font-size: var(--fs-tiny);
  color: var(--text-muted);
  letter-spacing: 0.05em;
}
.step-nav {
  display: flex;
  gap: var(--spacer-12);
  margin-top: var(--spacer-8);
  position: relative;
}
.step-nav .btn { flex: 1; }
.step-nav .btn-primary {
  background-color: var(--lt-violet);
  border-color: var(--lt-violet);
}
.step-nav .btn-primary:hover {
  background-color: #6d28d9;
  box-shadow: 0 4px 16px var(--lt-violet-glow);
}
.autoplay-btn {
  margin-left: auto;
  width: 38px; height: 38px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s var(--ease);
  flex-shrink: 0;
}
.autoplay-btn:hover { border-color: var(--lt-violet); color: var(--lt-violet); }
.autoplay-btn.playing { background: var(--lt-violet); border-color: var(--lt-violet); color: #fff; }
.autoplay-btn svg { width: 16px; height: 16px; }
.autoplay-progress {
  position: absolute;
  bottom: -6px; left: 0; right: 0;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  overflow: hidden;
}
.autoplay-progress-bar {
  height: 100%; width: 0;
  background: var(--lt-violet);
  transition: width .1s linear;
}

/* ===== 步骤内容过渡 ===== */
.step-content {
  opacity: 1;
  transition: all 0.4s var(--ease);
  min-height: 280px;
}
.step-content.fade-out { opacity: 0; transform: translateY(8px); }
.step-content.fade-in { opacity: 0; transform: translateY(-8px); }

/* ===== 定理/公式高亮框 ===== */
.theorem-box {
  background: linear-gradient(135deg, var(--lt-violet-soft), rgba(124,58,237,0.04));
  border: 1px solid rgba(124,58,237,0.15);
  border-radius: var(--radius-card);
  padding: var(--spacer-16) var(--spacer-20);
  margin: var(--spacer-12) 0;
}
.theorem-title {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 15px;
  color: var(--lt-violet);
  margin-bottom: var(--spacer-8);
}
.theorem-text {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text);
}

/* ===== 公式显示 ===== */
.formula-display {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: var(--spacer-16) var(--spacer-20);
  text-align: center;
  margin: var(--spacer-12) 0;
}
.formula-label {
  font-size: var(--fs-tiny);
  color: var(--text-muted);
  font-family: var(--font-mono);
  letter-spacing: 0.05em;
  margin-bottom: var(--spacer-8);
  text-transform: uppercase;
}
.formula-value {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}
.formula-value .pos { color: var(--lt-jhat); }
.formula-value .neg { color: var(--lt-ihat); }
.formula-value .zero { color: #d97706; }

/* ===== 右侧可视化区 ===== */
.visual-side {
  display: flex;
  flex-direction: column;
  gap: var(--spacer-16);
}
.visual-canvas-wrapper {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  overflow: hidden;
  box-shadow: var(--shadow-soft);
  position: relative;
}
.visual-canvas-wrapper svg {
  display: block;
  width: 100%;
  height: auto;
}
.visual-caption {
  font-size: var(--fs-small);
  color: var(--text-muted);
  text-align: center;
  font-style: italic;
  font-family: var(--font-serif);
  padding: 0 var(--spacer-8);
}

/* ===== 矩阵显示面板 ===== */
.matrix-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacer-16);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: var(--spacer-12) var(--spacer-20);
}
.matrix-panel-left { display: flex; align-items: center; gap: var(--spacer-16); }
.matrix-panel-label {
  font-size: var(--fs-tiny);
  color: var(--text-muted);
  font-family: var(--font-mono);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.matrix-display { display: flex; align-items: center; gap: var(--spacer-8); }
.matrix-bracket {
  font-family: var(--font-serif);
  font-size: 36px;
  font-weight: 300;
  color: var(--lt-violet);
  line-height: 1;
}
.matrix-values {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 16px;
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 600;
}
.matrix-val {
  text-align: center;
  color: var(--text);
  min-width: 36px;
  transition: color 0.3s var(--ease);
}
.matrix-val.ihat-col { color: var(--lt-ihat); }
.matrix-val.jhat-col { color: var(--lt-jhat); }

.det-display {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}
.det-label {
  font-size: var(--fs-tiny);
  color: var(--text-muted);
  font-family: var(--font-mono);
}
.det-value {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  transition: color 0.3s var(--ease);
}
.det-value.pos { color: var(--lt-jhat); }
.det-value.neg { color: var(--lt-ihat); }
.det-value.zero { color: #d97706; }

/* ===== 滑块控件 ===== */
.matrix-sliders {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--spacer-12);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: var(--spacer-16) var(--spacer-20);
}
.slider-group {
  display: flex;
  flex-direction: column;
  gap: var(--spacer-4);
}
.slider-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.slider-header label {
  font-size: var(--fs-tiny);
  color: var(--text-muted);
  font-weight: 500;
}
.slider-header .val {
  font-family: var(--font-mono);
  font-size: var(--fs-tiny);
  font-weight: 600;
  color: var(--lt-violet);
  min-width: 36px;
  text-align: right;
}
.slider-group input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  outline: none;
  cursor: pointer;
}
.slider-group input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--lt-violet);
  cursor: pointer;
  border: 2px solid var(--surface);
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  transition: transform 0.15s var(--ease);
}
.slider-group input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
.slider-group input[type=range]::-moz-range-thumb {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--lt-violet);
  cursor: pointer;
  border: 2px solid var(--surface);
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
.slider-group.ihat input[type=range]::-webkit-slider-thumb { background: var(--lt-ihat); }
.slider-group.ihat .val { color: var(--lt-ihat); }
.slider-group.jhat input[type=range]::-webkit-slider-thumb { background: var(--lt-jhat); }
.slider-group.jhat .val { color: var(--lt-jhat); }

/* ===== 预设按钮 ===== */
.preset-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacer-8);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: var(--spacer-12) var(--spacer-16);
}
.preset-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  font-size: var(--fs-tiny);
  font-weight: 500;
  font-family: var(--font-sans);
  color: var(--text-muted);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease);
  white-space: nowrap;
}
.preset-btn:hover {
  border-color: var(--lt-violet);
  color: var(--lt-violet);
  background: var(--lt-violet-soft);
}
.preset-btn.active {
  background: var(--lt-violet);
  border-color: var(--lt-violet);
  color: #fff;
}

/* ===== 应用卡片 ===== */
.app-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--spacer-12);
}
.app-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: var(--spacer-16);
  display: flex;
  flex-direction: column;
  gap: var(--spacer-8);
  transition: all var(--duration-base) var(--ease);
}
.app-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-soft);
  border-color: var(--lt-violet-light);
}
.app-card-icon {
  width: 36px; height: 36px;
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  background: var(--lt-violet-soft);
  color: var(--lt-violet);
}
.app-card-icon svg { width: 20px; height: 20px; }
.app-card-title {
  font-family: var(--font-serif);
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}
.app-card-desc {
  font-size: var(--fs-tiny);
  color: var(--text-muted);
  line-height: 1.6;
}

/* ===== 拖拽提示 ===== */
.drag-hint {
  display: flex;
  align-items: center;
  gap: var(--spacer-8);
  font-size: var(--fs-tiny);
  color: var(--text-muted);
  font-family: var(--font-mono);
  padding: var(--spacer-8) var(--spacer-12);
  background: var(--surface-muted);
  border-radius: var(--radius);
}
.drag-hint .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.drag-hint .dot.ihat { background: var(--lt-ihat); }
.drag-hint .dot.jhat { background: var(--lt-jhat); }

/* ===== SVG 元素样式 ===== */
.grid-line-orig { stroke: var(--lt-grid); stroke-width: 0.5; }
.grid-line-trans { stroke: var(--lt-grid-transformed); stroke-width: 1; }
.axis-line { stroke: var(--lt-axis); stroke-width: 1.5; }
.axis-label {
  font-family: var(--font-mono);
  font-size: 9px;
  fill: var(--text-faint);
}
.vec-ihat {
  stroke: var(--lt-ihat);
  stroke-width: 3;
  stroke-linecap: round;
}
.vec-jhat {
  stroke: var(--lt-jhat);
  stroke-width: 3;
  stroke-linecap: round;
}
.vec-label {
  font-family: var(--font-serif);
  font-size: 14px;
  font-weight: 700;
  font-style: italic;
}
.vec-label.ihat { fill: var(--lt-ihat); }
.vec-label.jhat { fill: var(--lt-jhat); }
.drag-handle {
  cursor: grab;
  touch-action: none;
  transition: r 0.15s var(--ease), opacity 0.2s var(--ease);
}
.drag-handle:hover { opacity: 0.8; }
.drag-handle:active { cursor: grabbing; }
.unit-square-orig {
  fill: rgba(148, 163, 184, 0.06);
  stroke: var(--lt-gray);
  stroke-width: 1;
  stroke-dasharray: 3 3;
}
.unit-square-trans {
  fill: var(--lt-violet-soft);
  stroke: var(--lt-violet);
  stroke-width: 1.5;
}

/* ===== 响应式 ===== */
@media (max-width: 1024px) {
  .magazine-layout {
    grid-template-columns: 1fr;
    gap: var(--spacer-32);
  }
  .article-side { order: 1; }
  .visual-side { order: 2; }
  .step-content { min-height: auto; }
}
@media (max-width: 768px) {
  .magazine-layout { padding: var(--spacer-24) var(--spacer-16); }
  .matrix-sliders { grid-template-columns: 1fr 1fr; }
  .app-cards { grid-template-columns: 1fr; }
  .matrix-panel { flex-direction: column; align-items: flex-start; }
  .preset-buttons { overflow-x: auto; flex-wrap: nowrap; }
}
</style>
</head>

// ===== SVG 配置 =====
const SVG_CFG = { vbW: 600, vbH: 500, cx: 300, cy: 250, scale: 40, range: 7 };
function toSVG(x, y) { return [SVG_CFG.cx + x * SVG_CFG.scale, SVG_CFG.cy - y * SVG_CFG.scale]; }
function toMath(sx, sy) { return [(sx - SVG_CFG.cx) / SVG_CFG.scale, (SVG_CFG.cy - sy) / SVG_CFG.scale]; }
function txPt(m, x, y) { return [m.a * x + m.b * y, m.c * x + m.d * y]; }
function det(m) { return m.a * m.d - m.b * m.c; }

// ===== 全局状态 =====
const state = {
  currentStep: 0,
  isAutoPlaying: false,
  autoPlayTimer: null,
  autoPlayProgress: 0,
  matrix: { a: 1, b: 0, c: 0, d: 1 },
  animMatrix: { a: 1, b: 0, c: 0, d: 1 },
  animTime: 0,
  dragging: null, // 'i' | 'j' | null
  dragOverlay: null
};

// ===== DOM 引用 =====
const $ = id => document.getElementById(id);
const gridLayer = $('gridLayer');
const svgEl = $('gridSvg');

// ===== 步骤内容 =====
const stepContents = [

      <p>这就是<strong>线性变换</strong>：一种保持网格结构的变形。它不弯曲直线，不破坏平行——它只是把整个平面"重新摆放"了一遍。</p>
      <p>更令人惊叹的是，整个平面的变形方式，可以被区区四个数字完全描述。这四个数字组成的东西，叫做<strong>矩阵</strong>。它是线性代数的核心语言，也是现代科学最强大的工具之一。</p>

  {
    html: `
      <p class="lead">在二维平面上，有两个特殊的向量：<strong>î</strong>（指向右方，坐标 (1, 0)）和 <strong>ĵ</strong>（指向上方，坐标 (0, 1)）。它们是整个平面的"骨架"。</p>
      <p>任何一个点 (x, y) 都可以写成 <em>x · î + y · ĵ</em>。这意味着：只要你知道 î 和 ĵ 去了哪里，你就知道<strong>所有点</strong>去了哪里。</p>
      <p>一个 2×2 矩阵的第一列是 î 变换后的位置，第二列是 ĵ 变换后的位置。矩阵就是一张"配方"——记录了两个基向量各自的新家。</p>
      <div class="theorem-box">

        <div class="theorem-text">拖动右侧的红色和绿色箭头，亲手把基向量搬到新位置。观察矩阵的数字如何随你而变，整个网格如何随之重组。</div>

      <p>因为 (x, y) = x · î + y · ĵ，变换后它自然就是 x ·（新 î）+ y ·（新 ĵ）。四个数字，决定了无穷多个点的命运。</p>
      <p>调节右侧的四个滑块，观察整个网格如何随之变形。那个紫色平行四边形，是原始单位正方形经过变换后的样子——它的面积恰好等于矩阵的<strong>行列式</strong>。</p>

// ===== 网格渲染 =====
function renderGrid(m, opts = {}) {
  const { showOriginal = true, showTransformed = true, showBasis = true, showUnitSquare = true, draggable = false } = opts;
  let html = '';

  // 原始网格
  if (showOriginal) {
    for (let i = -SVG_CFG.range; i <= SVG_CFG.range; i++) {
      if (i === 0) continue;
      const [x1, y1] = toSVG(i, -SVG_CFG.range);
      const [x2, y2] = toSVG(i, SVG_CFG.range);
      html += `<line class="grid-line-orig" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
      const [x3, y3] = toSVG(-SVG_CFG.range, i);
      const [x4, y4] = toSVG(SVG_CFG.range, i);
      html += `<line class="grid-line-orig" x1="${x3}" y1="${y3}" x2="${x4}" y2="${y4}"/>`;
    }
  }

  // 坐标轴
  const [ax1, ay1] = toSVG(-SVG_CFG.range, 0);
  const [ax2, ay2] = toSVG(SVG_CFG.range, 0);
  html += `<line class="axis-line" x1="${ax1}" y1="${ay1}" x2="${ax2}" y2="${ay2}"/>`;
  const [ax3, ay3] = toSVG(0, -SVG_CFG.range);
  const [ax4, ay4] = toSVG(0, SVG_CFG.range);
  html += `<line class="axis-line" x1="${ax3}" y1="${ay3}" x2="${ax4}" y2="${ay4}"/>`;

  // 轴标签
  const [lx, ly] = toSVG(SVG_CFG.range - 0.3, -0.5);
  html += `<text class="axis-label" x="${lx}" y="${ly}">x</text>`;
  const [lx2, ly2] = toSVG(0.4, SVG_CFG.range - 0.3);
  html += `<text class="axis-label" x="${lx2}" y="${ly2}">y</text>`;

  // 变换后网格
  if (showTransformed) {
    const d = det(m);
    const isSingular = Math.abs(d) < 0.001;
    for (let i = -SVG_CFG.range; i <= SVG_CFG.range; i++) {
      if (i === 0) continue;
      // 垂直线 x=i
      const [tx1, ty1] = txPt(m, i, -SVG_CFG.range);
      const [tx2, ty2] = txPt(m, i, SVG_CFG.range);
      const [sx1, sy1] = toSVG(tx1, ty1);
      const [sx2, sy2] = toSVG(tx2, ty2);
      const opacity = isSingular ? 0.15 : Math.max(0.12, 0.35 - Math.abs(i) * 0.03);
      html += `<line class="grid-line-trans" x1="${sx1}" y1="${sy1}" x2="${sx2}" y2="${sy2}" opacity="${opacity}"/>`;
      // 水平线 y=i
      const [tx3, ty3] = txPt(m, -SVG_CFG.range, i);
      const [tx4, ty4] = txPt(m, SVG_CFG.range, i);
      const [sx3, sy3] = toSVG(tx3, ty3);
      const [sx4, sy4] = toSVG(tx4, ty4);
      html += `<line class="grid-line-trans" x1="${sx3}" y1="${sy3}" x2="${sx4}" y2="${sy4}" opacity="${opacity}"/>`;
    }
  }

  // 原始单位正方形
  if (showUnitSquare) {
    const [p1x, p1y] = toSVG(0, 0);
    const [p2x, p2y] = toSVG(1, 0);
    const [p3x, p3y] = toSVG(1, 1);
    const [p4x, p4y] = toSVG(0, 1);
    html += `<polygon class="unit-square-orig" points="${p1x},${p1y} ${p2x},${p2y} ${p3x},${p3y} ${p4x},${p4y}"/>`;
  }

  // 变换单位正方形
  if (showUnitSquare) {
    const c1 = txPt(m, 0, 0);
    const c2 = txPt(m, 1, 0);
    const c3 = txPt(m, 1, 1);
    const c4 = txPt(m, 0, 1);
    const [s1x, s1y] = toSVG(...c1);
    const [s2x, s2y] = toSVG(...c2);
    const [s3x, s3y] = toSVG(...c3);
    const [s4x, s4y] = toSVG(...c4);
    html += `<polygon class="unit-square-trans" points="${s1x},${s1y} ${s2x},${s2y} ${s3x},${s3y} ${s4x},${s4y}"/>`;
  }

  // 基向量
  if (showBasis) {
    const [ox, oy] = toSVG(0, 0);
    // i-hat
    const [ix, iy] = toSVG(m.a, m.c);
    html += `<line class="vec-ihat" x1="${ox}" y1="${oy}" x2="${ix}" y2="${iy}" marker-end="url(#arrowIhat)"/>`;
    const ilx = m.a + (m.a >= 0 ? 0.2 : -0.5);
    const ily = m.c + (m.c >= 0 ? 0.25 : -0.1);
    const [iltx, ilty] = toSVG(ilx, ily);
    html += `<text class="vec-label ihat" x="${iltx}" y="${ilty}">î</text>`;
    if (draggable) {
      html += `<circle class="drag-handle" data-vec="i" cx="${ix}" cy="${iy}" r="9" fill="#e11d48" opacity="0.9"/>`;
    }
    // j-hat
    const [jx, jy] = toSVG(m.b, m.d);
    html += `<line class="vec-jhat" x1="${ox}" y1="${oy}" x2="${jx}" y2="${jy}" marker-end="url(#arrowJhat)"/>`;
    const jlx = m.b + (m.b >= 0 ? 0.2 : -0.5);
    const jly = m.d + (m.d >= 0 ? 0.25 : -0.1);
    const [jltx, jlty] = toSVG(jlx, jly);
    html += `<text class="vec-label jhat" x="${jltx}" y="${jlty}">ĵ</text>`;
    if (draggable) {
      html += `<circle class="drag-handle" data-vec="j" cx="${jx}" cy="${jy}" r="9" fill="#059669" opacity="0.9"/>`;
    }
  }

  gridLayer.innerHTML = html;
}

// ===== 矩阵面板 =====
function renderMatrixPanel(m) {
  const d = det(m);
  const dClass = d > 0.001 ? 'pos' : (d < -0.001 ? 'neg' : 'zero');
  const dStr = Math.abs(d) < 0.01 ? '0' : d.toFixed(2);
  return `
    <div class="matrix-panel">
      <div class="matrix-panel-left">
        <span class="matrix-panel-label">矩阵</span>
        <div class="matrix-display">
          <span class="matrix-bracket">[</span>
          <div class="matrix-values">
            <span class="matrix-val ihat-col">${m.a.toFixed(2)}</span>
            <span class="matrix-val jhat-col">${m.b.toFixed(2)}</span>
            <span class="matrix-val ihat-col">${m.c.toFixed(2)}</span>
            <span class="matrix-val jhat-col">${m.d.toFixed(2)}</span>
          </div>
          <span class="matrix-bracket">]</span>
        </div>
      </div>
      <div class="det-display">
        <span class="det-label">行列式 det</span>
        <span class="det-value ${dClass}">${dStr}</span>
      </div>
    </div>`;
}

// ===== 滑块控件 =====
function renderSliders(m) {
  const mk = (key, label, val, cls) => `
    <div class="slider-group ${cls}">
      <div class="slider-header"><label>${label}</label><span class="val">${val.toFixed(2)}</span></div>
      <input type="range" min="-2" max="2" step="0.05" value="${val}" data-key="${key}"/>
    </div>`;
  return `
    <div class="matrix-sliders">
      ${mk('a', 'a (î.x)', m.a, 'ihat')}
      ${mk('b', 'b (ĵ.x)', m.b, 'jhat')}
      ${mk('c', 'c (î.y)', m.c, 'ihat')}
      ${mk('d', 'd (ĵ.y)', m.d, 'jhat')}
    </div>`;
}

// ===== 预设变换 =====
const presets = [
  { name: '恒等', m: { a: 1, b: 0, c: 0, d: 1 } },
  { name: '旋转 45°', m: { a: Math.cos(Math.PI/4), b: -Math.sin(Math.PI/4), c: Math.sin(Math.PI/4), d: Math.cos(Math.PI/4) } },
  { name: '缩放 1.5×', m: { a: 1.5, b: 0, c: 0, d: 1.5 } },
  { name: '水平剪切', m: { a: 1, b: 1, c: 0, d: 1 } },
  { name: '反射 (x轴)', m: { a: 1, b: 0, c: 0, d: -1 } },
  { name: '奇异 (降维)', m: { a: 1, b: 1, c: 1, d: 1 } }
];

function renderPresets() {
  return `
    <div class="preset-buttons">
      ${presets.map((p, i) => `<button class="preset-btn" data-preset="${i}">${p.name}</button>`).join('')}
    </div>`;
}

// ===== 应用卡片 =====

  const cards = [
    { title: '计算机图形学', desc: '3D 渲染中的旋转、缩放、投影，本质都是矩阵乘法。每一帧画面背后是数百万次矩阵运算。', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>' },
    { title: '主成分分析 (PCA)', desc: '数据科学中，通过线性变换找到数据方差最大的方向，实现降维与特征提取。', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/></svg>' },

// ===== 拖拽提示 =====
function renderDragHint() {
  return `
    <div class="drag-hint">
      <span class="dot ihat"></span> 拖动红色圆点 = 移动 î
      <span class="dot jhat"></span> 拖动绿色圆点 = 移动 ĵ
    </div>`;
}

// ===== 更新可视化 =====
function updateVisual(step) {
  const content = stepContents[step];
  $('visualCaption').textContent = content.caption;

  if (step === 0) {
    // 自动动画模式
    renderGrid(state.animMatrix, { draggable: false });
    $('visualControls').innerHTML = renderMatrixPanel(state.animMatrix);
  } else if (step === 1) {
    // 拖拽模式
    renderGrid(state.matrix, { draggable: true });
    $('visualControls').innerHTML = renderDragHint() + renderMatrixPanel(state.matrix);
    attachDragHandlers();
  } else if (step === 2) {
    // 滑块模式
    renderGrid(state.matrix, { draggable: false });
    $('visualControls').innerHTML = renderMatrixPanel(state.matrix) + renderSliders(state.matrix);
    attachSliderHandlers();
  } else if (step === 3) {
    // 预设+滑块模式
    renderGrid(state.matrix, { draggable: false });
    $('visualControls').innerHTML = renderPresets() + renderMatrixPanel(state.matrix) + renderSliders(state.matrix);
    attachPresetHandlers();
    attachSliderHandlers();
  } else if (step === 4) {
    // 应用卡片
    renderGrid(state.animMatrix, { showOriginal: false });
    $('visualControls').innerHTML = renderAppCards();
  }

  // 渲染 KaTeX 公式
  if (step === 2) {
    const el = $('formulaStep2');
    if (el && window.katex) {
      katex.render('\\begin{pmatrix} x\\\\ y \\end{pmatrix} \\mapsto x \\cdot \\begin{pmatrix} a\\\\ c \\end{pmatrix} + y \\cdot \\begin{pmatrix} b\\\\ d \\end{pmatrix}', el, { displayMode: true });
    }
  }
}

// ===== 拖拽处理 =====
function attachDragHandlers() {
  const handles = gridLayer.querySelectorAll('.drag-handle');
  handles.forEach(h => {
    h.addEventListener('pointerdown', startDrag);
  });
}

function updateMatrixPanel(m) {
  const matrix = m || state.matrix;
  const mp = $('visualControls').querySelector('.matrix-panel');
  if (mp) {
    const tmp = document.createElement('div');
    tmp.innerHTML = renderMatrixPanel(matrix);
    mp.replaceWith(tmp.firstElementChild);
  }
}

function startDrag(e) {
  e.preventDefault();
  const vec = e.target.dataset.vec;
  state.dragging = vec;

  const onMove = (ev) => {
    if (state.dragging !== vec) return;
    const ctm = svgEl.getScreenCTM();
    if (!ctm) return;
    const pt = svgEl.createSVGPoint ? svgEl.createSVGPoint() : new DOMPoint();
    pt.x = ev.clientX;
    pt.y = ev.clientY;
    const svgP = pt.matrixTransform(ctm.inverse());
    const [mx, my] = toMath(svgP.x, svgP.y);
    const cx = Math.max(-3, Math.min(3, mx));
    const cy = Math.max(-3, Math.min(3, my));
    if (vec === 'i') {
      state.matrix.a = cx;
      state.matrix.c = cy;
    } else {
      state.matrix.b = cx;
      state.matrix.d = cy;
    }
    renderGrid(state.matrix, { draggable: true });
    updateMatrixPanel();
  };

  const onUp = () => {
    state.dragging = null;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
  };

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

// ===== 滑块处理 =====
function attachSliderHandlers() {
  const sliders = $('visualControls').querySelectorAll('input[type=range]');
  sliders.forEach(s => {
    s.addEventListener('input', (e) => {
      const key = e.target.dataset.key;
      const val = parseFloat(e.target.value);
      state.matrix[key] = val;
      // 更新滑块显示
      const valSpan = e.target.parentElement.querySelector('.val');
      if (valSpan) valSpan.textContent = val.toFixed(2);
      // 重新渲染
      renderGrid(state.matrix);
      updateMatrixPanel();
    });
  });
}

// ===== 预设按钮处理 =====
function attachPresetHandlers() {
  const btns = $('visualControls').querySelectorAll('.preset-btn');
  btns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const preset = presets[parseInt(e.target.dataset.preset)];
      // 用 GSAP 动画过渡
      gsap.to(state.matrix, {
        a: preset.m.a, b: preset.m.b, c: preset.m.c, d: preset.m.d,
        duration: 0.8, ease: 'power2.inOut',
        onUpdate: () => {
          renderGrid(state.matrix);
          updateMatrixPanel();
          // 更新滑块值
          $('visualControls').querySelectorAll('input[type=range]').forEach(s => {
            const key = s.dataset.key;
            s.value = state.matrix[key];
            const valSpan = s.parentElement.querySelector('.val');
            if (valSpan) valSpan.textContent = state.matrix[key].toFixed(2);
          });
        }
      });
    });
  });
}

// ===== 步骤动画 (Step 0) =====
let step0AnimActive = false;
const animCycle = [
  { a: 1, b: 0, c: 0, d: 1 },                    // 恒等
  { a: Math.cos(Math.PI/6), b: -Math.sin(Math.PI/6), c: Math.sin(Math.PI/6), d: Math.cos(Math.PI/6) }, // 旋转30°
  { a: 1.4, b: 0, c: 0, d: 1.4 },                // 缩放
  { a: 1, b: 0.8, c: 0, d: 1 },                  // 剪切
  { a: 1, b: 0, c: 0, d: -1 },                   // 反射
  { a: 1, b: 0, c: 0, d: 1 }                     // 回到恒等
];
let cycleIdx = 0;

function startStep0Anim() {
  step0AnimActive = true;
  cycleIdx = 0;

  function tweenTo(target) {
    gsap.to(state.animMatrix, {
      a: target.a, b: target.b, c: target.c, d: target.d,
      duration: 2.5, ease: 'power1.inOut',
      onUpdate: () => {
        if (state.currentStep === 0 || state.currentStep === 4) {
          renderGrid(state.animMatrix, state.currentStep === 0 ? { draggable: false } : { showOriginal: false });
          if (state.currentStep === 0) {
            updateMatrixPanel(state.animMatrix);
          }
        }
      },
      onComplete: () => {
        if (!step0AnimActive) return;
        cycleIdx = (cycleIdx + 1) % animCycle.length;
        tweenTo(animCycle[cycleIdx]);
      }
    });
  }
  tweenTo(animCycle[cycleIdx]);
}

function stopStep0Anim() {
  step0AnimActive = false;
  gsap.killTweensOf(state.animMatrix);
}

// ===== 步骤切换 =====
function goToStep(step) {
  if (step < 0 || step >= stepContents.length) return;
  const content = $('stepContent');
  const oldClass = content.className;
  content.className = 'step-content fade-out';

  setTimeout(() => {
    state.currentStep = step;
    content.innerHTML = stepContents[step].html;
    content.className = 'step-content fade-in';

    requestAnimationFrame(() => {
      content.className = 'step-content';
    });

    // 更新步骤指示器
    document.querySelectorAll('.step-dot').forEach((d, i) => {
      d.classList.remove('active', 'completed');
      if (i === step) d.classList.add('active');
      else if (i < step) d.classList.add('completed');
    });
    $('stepLabel').textContent = `第 ${step + 1} / ${stepContents.length} 步`;

    // 进度条
    $('topProgressBar').style.width = `${((step + 1) / stepContents.length) * 100}%`;

    // 按钮状态
    $('prevBtn').style.opacity = step === 0 ? '0.4' : '1';
    $('prevBtn').style.pointerEvents = step === 0 ? 'none' : 'auto';
    $('nextBtn').textContent = step === stepContents.length - 1 ? '完成' : '下一步 →';

    // 更新可视化
    if (step === 0 || step === 4) {
      startStep0Anim();
    } else {
      stopStep0Anim();
      // 确保 matrix 是同步的
      if (step === 1) {
        // 从当前 animMatrix 同步到 matrix
        state.matrix.a = state.animMatrix.a;
        state.matrix.b = state.animMatrix.b;
        state.matrix.c = state.animMatrix.c;
        state.matrix.d = state.animMatrix.d;
      }
    }
    updateVisual(step);
  }, 350);
}

// ===== 自动播放 =====
function toggleAutoPlay() {
  state.isAutoPlaying = !state.isAutoPlaying;
  const btn = $('autoPlayBtn');
  const bar = $('autoPlayBar');

  if (state.isAutoPlaying) {
    btn.classList.add('playing');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';
    state.autoPlayProgress = 0;
    const duration = 8000; // 8秒
    const startTime = Date.now();

    state.autoPlayTimer = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const progress = elapsed / duration;
      bar.style.width = `${Math.min(progress * 100, 100)}%`;

      if (progress >= 1) {
        if (state.currentStep < stepContents.length - 1) {
          goToStep(state.currentStep + 1);
          state.autoPlayProgress = 0;
          // 重置计时器
          clearInterval(state.autoPlayTimer);
          toggleAutoPlay();
        } else {
          // 最后一页，停止
          state.isAutoPlaying = false;
          btn.classList.remove('playing');
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
          bar.style.width = '0%';
          clearInterval(state.autoPlayTimer);
        }
      }
    }, 50);
  } else {
    btn.classList.remove('playing');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    bar.style.width = '0%';
    if (state.autoPlayTimer) clearInterval(state.autoPlayTimer);
  }
}

// ===== 导航栏滚动效果 =====
window.addEventListener('scroll', () => {
  const navbar = $('demoNavbar');
  if (window.scrollY > 10) navbar.classList.add('scrolled');
  else navbar.classList.remove('scrolled');
});

// ===== 初始化 =====
$('prevBtn').addEventListener('click', () => goToStep(state.currentStep - 1));
$('nextBtn').addEventListener('click', () => {
  if (state.currentStep < stepContents.length - 1) {
    goToStep(state.currentStep + 1);
  } else {
    // 最后一页，跳回首页
    window.location.href = '/';
  }
});
$('autoPlayBtn').addEventListener('click', toggleAutoPlay);

// 键盘导航
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') goToStep(state.currentStep - 1);
  if (e.key === 'ArrowRight') goToStep(state.currentStep + 1);
  if (e.key === ' ' && !state.dragging) {
    e.preventDefault();
    toggleAutoPlay();
  }
});

// 步骤圆点点击
document.querySelectorAll('.step-dot').forEach(d => {
  d.addEventListener('click', () => goToStep(parseInt(d.dataset.step)));
});

// 初始渲染
goToStep(0);
</script>
