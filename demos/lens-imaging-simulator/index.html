<style>
/* ============================================================
   光学透镜成像模拟器 — 交互工具型 Demo
   配色：精密光学仪器风格，暖白底 + 墨蓝主调 + 彩色光线
   ============================================================ */

/* ---------- 光学可视化专用色 ---------- */
:root {
  --opt-parallel: #f4d03f;     /* 平行光线 - 金黄 */
  --opt-center:   #3498db;     /* 过光心光线 - 青蓝 */
  --opt-focal:    #e67e22;     /* 过焦点光线 - 橙红 */
  --opt-object:   #27ae60;     /* 物体 - 深绿 */
  --opt-real:     #e74c3c;     /* 实像 - 红色 */
  --opt-virtual:  #e74c3c;     /* 虚像 - 红色(半透明) */
  --opt-axis:     #34495e;     /* 主光轴 - 深灰 */
  --opt-convex-1: #aed6f1;     /* 凸透镜渐变起 */
  --opt-convex-2: #85c1e9;     /* 凸透镜渐变止 */
  --opt-concave-1:#d7bde2;     /* 凹透镜渐变起 */
  --opt-concave-2:#bb8fce;     /* 凹透镜渐变止 */
}

html, body { height: 100%; overflow: hidden; }

.framework-interactive .interactive-main {
  padding-top: 64px;
}
body.has-info-bar .framework-interactive .interactive-main {
  padding-bottom: 52px;
}

/* ============ 画布区 ============ */
.interactive-canvas-area {
  background: linear-gradient(180deg, #faf8f5 0%, #f0ebe3 100%);
}

#lensCanvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
}
#lensCanvas.dragging { cursor: grabbing; }

/* ============ 数据面板（右上） ============ */
.lens-data-panel {
  position: absolute;
  top: var(--spacer-16);
  right: var(--spacer-16);
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 14px 18px;
  background: rgba(255, 255, 255, 0.90);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-soft);
  min-width: 200px;
}

.ldp-title {
  font-family: var(--font-serif);
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.04em;
  margin-bottom: 4px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border-soft);
}

.ldp-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.ldp-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 4px;
}

.ldp-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.ldp-value {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.ldp-formula {
  margin-top: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--border-soft);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
  line-height: 1.6;
}

.ldp-formula .check {
  color: var(--accent-bio, #059669);
  font-weight: 700;
}

.ldp-nature {
  margin-top: 4px;
  padding: 6px 10px;
  border-radius: var(--radius);
  font-size: 11px;
  font-weight: 600;
  text-align: center;
  letter-spacing: 0.02em;
}

.ldp-nature.real {
  background: rgba(231, 76, 60, 0.1);
  color: #c0392b;
}
.ldp-nature.virtual {
  background: rgba(231, 76, 60, 0.06);
  color: #c0392b;
}
.ldp-nature.none {
  background: var(--surface-muted);
  color: var(--text-muted);
}

/* ============ 加载动画 ============ */
.lens-loading {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(250, 248, 245, 0.95);
  transition: opacity 0.5s ease;
}
.lens-loading.fade { opacity: 0; pointer-events: none; }

.lens-loading-content {
  text-align: center;
}
.lens-loading-scan {
  width: 200px;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  margin: 12px auto;
  overflow: hidden;
  position: relative;
}
.lens-loading-scan::after {
  content: '';
  position: absolute;
  top: 0; left: -40%;
  width: 40%;
  height: 100%;
  background: linear-gradient(90deg, transparent, var(--opt-parallel), transparent);
  animation: scan 1.2s ease-in-out infinite;
}
@keyframes scan {
  0% { left: -40%; }
  100% { left: 100%; }
}
.lens-loading-text {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.1em;
}

/* ============ 控制面板 ============ */
.lens-control-panel {
  flex-shrink: 0;
  background-color: var(--surface-muted);
  border-top: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  max-height: 220px;
}

.ctrl-row {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

/* 透镜类型切换 */
.lens-type-toggle {
  display: inline-flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  padding: 3px;
  gap: 2px;
  flex-shrink: 0;
}
.lens-type-btn {
  padding: 6px 14px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 500;
  font-family: var(--font-sans);
  cursor: pointer;
  border-radius: var(--radius-full);
  transition: all var(--duration-fast) var(--ease);
  white-space: nowrap;
}
.lens-type-btn.active {
  background: var(--brand-soft);
  color: var(--brand);
  font-weight: 600;
}

/* 滑块组 */
.slider-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 130px;
}
.slider-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.slider-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.slider-value {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--brand);
  min-width: 38px;
  text-align: right;
}
.slider-input {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  border-radius: var(--radius-full);
  background: var(--border);
  outline: none;
  cursor: pointer;
}
.slider-input::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--brand);
  cursor: pointer;
  border: 2px solid var(--surface);

  transition: transform var(--duration-fast) var(--ease);
}
.slider-input::-webkit-slider-thumb:hover { transform: scale(1.25); }
.slider-input::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--brand); cursor: pointer;
  border: 2px solid var(--surface);
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

/* 开关按钮 */
.toggle-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.toggle-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 11px;
  font-weight: 500;
  font-family: var(--font-sans);
  color: var(--text-muted);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease);
  white-space: nowrap;
}
.toggle-btn:hover { border-color: var(--text-faint); }
.toggle-btn.active {
  color: var(--text);
  border-color: var(--text-faint);
  background: var(--bg);
}
.toggle-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border);
  transition: all var(--duration-fast) var(--ease);
}
.toggle-btn.active .toggle-dot { box-shadow: 0 0 6px currentColor; }

/* 预设按钮 */
.preset-btn {
  padding: 5px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 11px;
  font-weight: 500;
  font-family: var(--font-sans);
  color: var(--text-muted);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease);
  white-space: nowrap;
}
.preset-btn:hover {
  border-color: var(--brand);
  color: var(--brand);
}
.preset-btn.active {
  background: var(--brand-soft);
  border-color: rgba(194,65,12,0.3);
  color: var(--brand);
}

/* 动画控制 */
.anim-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.anim-btn {
  width: 34px; height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50%;
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease);
  color: var(--text-muted);
  flex-shrink: 0;
}
.anim-btn:hover { border-color: var(--text-faint); color: var(--text); }
.anim-btn.play {
  background: var(--brand);
  border-color: var(--brand);
  color: white;
  width: 38px; height: 38px;
}
.anim-btn.play:hover { background: var(--brand-hover); }
.anim-btn svg { width: 14px; height: 14px; }
.anim-btn.play svg { width: 16px; height: 16px; }

.speed-select {
  padding: 4px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 11px;
  font-family: var(--font-sans);
  color: var(--text-muted);
  cursor: pointer;
  outline: none;
}

/* 分隔线 */
.ctrl-divider {
  width: 1px;
  height: 32px;
  background: var(--border);
  flex-shrink: 0;
}

/* ============ 响应式 ============ */
@media (max-width: 768px) {
  .lens-data-panel {

  }
  .ldp-title { font-size: 11px; }
  .ldp-value { font-size: 11px; }
  .ldp-formula { font-size: 10px; }
  .lens-control-panel { padding: 10px 12px; max-height: 280px; }
  .slider-group { min-width: 100px; }
  .ctrl-row { gap: 12px; }
}
</style>

<script>
'use strict';

/* ============================================================
   光学透镜成像模拟器 — 核心逻辑
   ============================================================ */

const canvas = document.getElementById('lensCanvas');
const ctx = canvas.getContext('2d');

// ---------- 状态 ----------
const state = {
  lensType: 'convex',      // 'convex' | 'concave'
  f: 15,                    // 焦距 cm（始终为正值，符号通过 lensType 判断）
  u: 30,                    // 物距 cm
  h: 8,                     // 物高 cm
  diameter: 18,             // 透镜直径 cm
  showParallel: true,
  showCenter: true,
  showFocal: true,
  showAux: false,
  showMultiRay: false,
  isPlaying: false,
  speed: 1,
  animDir: -1,              // 动画方向：-1 远离透镜，1 靠近透镜
  activePreset: null,
  // 动画过渡
  displayU: 30,
  displayF: 15,
  displayH: 8,
  displayD: 18,
  targetU: 30,
  targetF: 15,
  targetH: 8,
  targetD: 18,
  targetLensType: 'convex',
  lensTypeBlend: 0,         // 0 = convex, 1 = concave
  targetLensTypeBlend: 0,
  hasInteracted: false,     // 是否已交互（用于显示拖拽提示）
};

// ---------- 颜色 ----------
const COLORS = {
  parallel: '#f4d03f',
  center:   '#3498db',
  focal:    '#e67e22',
  object:   '#27ae60',
  real:     '#e74c3c',
  virtual:  '#e74c3c',
  axis:     '#34495e',
  grid:     'rgba(180, 170, 155, 0.15)',
  gridMajor:'rgba(180, 170, 155, 0.28)',
  lensEdge: '#5d6d7e',
  focalPt:  '#e74c3c',
};

// ---------- Canvas 尺寸 ----------
let W = 0, H = 0, dpr = 1;
let scale = 8;  // 像素/cm
let originX = 0, originY = 0;  // 透镜光心在画布上的位置

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = rect.width;
  H = rect.height;
  // 透镜在水平中心偏左一点，给右侧像区留更多空间
  originX = W * 0.42;
  originY = H * 0.5;
  // 自适应缩放：确保 70cm 宽度可见
  scale = Math.max(4, Math.min(W / 95, H / 45));
}

window.addEventListener('resize', resizeCanvas);

// ---------- 坐标转换 ----------
function physToCanvas(x, y) {
  return { x: originX + x * scale, y: originY - y * scale };
}

// ---------- 光学计算 ----------
function getFocalLength() {
  return state.lensType === 'convex' ? state.f : -state.f;
}

function computeImage() {
  const f = getFocalLength();
  const u = state.u;
  const h = state.h;

  // 透镜公式：1/f = 1/u + 1/v  →  v = fu/(u-f)
  let v, hImage, m;
  const denom = u - f;

  if (Math.abs(denom) < 0.01) {
    // u ≈ f，凸透镜不成像
    v = Infinity;
    hImage = Infinity;
    m = Infinity;
  } else {
    v = (f * u) / denom;
    m = -v / u;
    hImage = m * h;
  }

  // 成像性质判断
  let nature = '';
  let natureClass = 'none';
  if (!isFinite(v)) {
    nature = '不成像（平行光出射）';
    natureClass = 'none';
  } else if (v > 0) {
    // 实像
    const abs_m = Math.abs(m);
    let size = abs_m > 1.01 ? '放大' : abs_m < 0.99 ? '缩小' : '等大';
    nature = `倒立${size}实像`;
    natureClass = 'real';
  } else {
    // 虚像
    const abs_m = Math.abs(m);
    let size = abs_m > 1.01 ? '放大' : abs_m < 0.99 ? '缩小' : '等大';
    nature = `正立${size}虚像`;
    natureClass = 'virtual';
  }

  return { f, u, v, h, hImage, m, nature, natureClass };
}

// ---------- 光线路径计算 ----------
// 返回每条光线的路径点数组（物理坐标）
function computeRays() {
  const f = getFocalLength();
  const u = state.u;
  const h = state.h;
  const lensRadius = state.diameter / 2;
  const rays = { parallel: [], center: [], focal: [], multi: [] };

  const denom = u - f;
  const hasImage = Math.abs(denom) > 0.01;
  const v = hasImage ? (f * u) / denom : Infinity;
  const hImage = hasImage ? -(v * h) / u : Infinity;

  // 可见范围（物理坐标）
  const xMin = -(originX / scale) - 5;
  const xMax = (W - originX) / scale + 5;

  // === 光线 1：平行于主光轴 ===
  // 从物顶水平到透镜，然后斜率为 -h/f
  {
    const objTop = { x: -u, y: h };
    const lensPt = { x: 0, y: h };
    const slope = -h / f;  // 对凸透镜为负（向下），对凹透镜为正（向上）

    // 出射光线延伸到画布边缘
    const xEnd = slope > 0 ? xMax : xMax;
    const yEnd = lensPt.y + slope * (xEnd - lensPt.x);
    // 如果出射光线向下且会穿过轴，也延伸到画布边缘
    const rayEnd = { x: xEnd, y: yEnd };

    rays.parallel = {
      incoming: [objTop, lensPt],
      outgoing: [lensPt, rayEnd],
      // 虚像延长线
      extension: hasImage && v < 0 ? [lensPt, { x: v, y: hImage }] : null,
      color: COLORS.parallel,
    };
  }

  // === 光线 2：过光心 ===
  {
    const objTop = { x: -u, y: h };
    const center = { x: 0, y: 0 };
    const slope = -h / u;
    // 延伸到画布边缘
    const xEnd = xMax;
    const yEnd = slope * xEnd;
    rays.center = {
      incoming: [objTop, center],
      outgoing: [center, { x: xEnd, y: yEnd }],
      extension: hasImage && v < 0 ? [center, { x: v, y: hImage }] : null,
      color: COLORS.center,
    };
  }

  // === 光线 3：过焦点 ===
  // 凸透镜：过物方焦点 (-f, 0)，出射后平行于主光轴
  // 凹透镜：射向像方焦点 (-f, 0)（即 |f| 在右侧），出射后平行于主光轴
  // 统一公式：从物顶到 (-f, 0)，在透镜处高度 = hf/(f-u)，出射后水平
  if (Math.abs(u - f) > 0.5) {
    const objTop = { x: -u, y: h };
    const slope = (0 - h) / (-f - (-u));  // = -h / (u - f)

    // 透镜处 y 值
    const yAtLens = h + slope * (0 - (-u));  // = h + slope * u = hf/(f-u)
    const lensPt = { x: 0, y: yAtLens };

    // 出射：水平
    const xEnd = xMax;
    rays.focal = {
      incoming: [objTop, lensPt],
      outgoing: [lensPt, { x: xEnd, y: yAtLens }],
      extension: hasImage && v < 0 ? [lensPt, { x: v, y: hImage }] : null,
      color: COLORS.focal,
    };
  } else {
    // u ≈ f：焦距光线退化为垂直线，不绘制
    rays.focal = null;
  }

  // === 漫射光线 ===
  if (state.showMultiRay) {
    const numRays = 7;
    for (let i = 0; i < numRays; i++) {
      // 物顶发出的不同角度光线
      const angle = (-0.4 + i * 0.13) ; // 不同入射角
      // 光线从物顶 (-u, h) 以角度 angle 发出
      // 击中透镜的位置
      const slope_in = Math.tan(angle);
      // 透镜处 y 值
      let yLens = h + slope_in * u;  // 从 (-u, h) 到 x=0
      // 限制在透镜直径内
      yLens = Math.max(-lensRadius, Math.min(lensRadius, yLens));

      const objTop = { x: -u, y: h };
      const lensPt = { x: 0, y: yLens };

      // 出射方向：通过像点 (v, hImage)（如果成像）
      let outEnd;
      if (hasImage && isFinite(v)) {
        const slope_out = (hImage - yLens) / (v - 0);
        if (v > 0) {
          // 实像：出射光线通过像点
          outEnd = { x: xMax, y: yLens + slope_out * (xMax - 0) };
        } else {
          // 虚像：出射光线的反向延长线通过像点
          outEnd = { x: xMax, y: yLens + slope_out * (xMax - 0) };
        }
      } else if (!hasImage) {
        // u = f，出射平行
        outEnd = { x: xMax, y: yLens };
      } else {
        outEnd = { x: xMax, y: yLens };
      }

      rays.multi.push({
        incoming: [objTop, lensPt],
        outgoing: [lensPt, outEnd],
        extension: hasImage && v < 0 ? [lensPt, { x: v, y: hImage }] : null,
        color: 'rgba(244, 208, 63, 0.35)',
      });
    }
  }

  return { rays, v, hImage, hasImage };
}

// ---------- 绘制函数 ----------

function drawGrid() {
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 1;
  const step = 5 * scale; // 每 5cm 一条
  for (let x = originX % step; x < W; x += step) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = originY % step; y < H; y += step) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

function drawAxis() {
  const y = originY;
  // 主光轴
  ctx.strokeStyle = COLORS.axis;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(0, y);
  ctx.lineTo(W, y);
  ctx.stroke();

  // 刻度
  ctx.fillStyle = 'rgba(52, 73, 94, 0.5)';
  ctx.font = '10px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const tickStep = 5; // 每 5cm 一个刻度
  const xMinPhys = Math.ceil(-originX / scale / tickStep) * tickStep;
  const xMaxPhys = Math.floor((W - originX) / scale / tickStep) * tickStep;

  for (let xPhys = xMinPhys; xPhys <= xMaxPhys; xPhys += tickStep) {
    const xCanvas = originX + xPhys * scale;
    const isMajor = xPhys % 10 === 0;
    ctx.strokeStyle = isMajor ? 'rgba(52, 73, 94, 0.4)' : 'rgba(52, 73, 94, 0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(xCanvas, y - (isMajor ? 5 : 3));
    ctx.lineTo(xCanvas, y + (isMajor ? 5 : 3));
    ctx.stroke();
    if (isMajor && xPhys !== 0) {
      ctx.fillText(xPhys + '', xCanvas, y + 8);
    }
  }
}

function drawFocalPoints() {
  const f = getFocalLength();
  const fAbs = Math.abs(f);

  // 焦点位置：物方焦点在 -|f|，像方焦点在 +|f|
  // 对于凸透镜：F 在 -f（左），F' 在 +f（右）
  // 对于凹透镜：F 在 +f（右，虚焦点），F' 在 -f（左，虚焦点）
  // 统一：物方焦点在 -f（凸透镜 f>0 在左，凹透镜 f<0 在右）
  const fObj = -f;   // 物方焦点 x 坐标
  const fImg = f;    // 像方焦点 x 坐标

  // 其实对于透镜，两个焦点分别在 ±|f|
  // 物方焦点 F: x = -|f|, 像方焦点 F': x = +|f|
  const fLeft = { x: -fAbs, y: 0 };
  const fRight = { x: fAbs, y: 0 };

  // 绘制焦点
  [fLeft, fRight].forEach((pt, i) => {
    const p = physToCanvas(pt.x, pt.y);
    ctx.fillStyle = COLORS.focalPt;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();

    // 标签
    ctx.fillStyle = 'rgba(52, 73, 94, 0.7)';
    ctx.font = '600 11px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const label = i === 0 ? 'F' : "F'";
    ctx.fillText(label, p.x, p.y + 8);
  });

  // 2f 标记（仅凸透镜且有实际意义时）
  if (state.lensType === 'convex') {
    [-(2 * fAbs), 2 * fAbs].forEach((xPhys, i) => {
      const p = physToCanvas(xPhys, 0);
      ctx.fillStyle = 'rgba(52, 73, 94, 0.4)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(52, 73, 94, 0.5)';
      ctx.font = '10px JetBrains Mono, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(i === 0 ? '2F' : "2F'", p.x, p.y + 8);
    });
  }
}

function drawLens() {
  const radius = (state.diameter / 2) * scale;
  const cx = originX;
  const cy = originY;
  const isConvex = state.lensType === 'convex';

  // 透镜宽度（视觉上的厚度）
  const lensW = isConvex ? 14 : 10;
  const halfW = lensW / 2;

  ctx.save();

  if (isConvex) {
    // 凸透镜：双凸形状
    const grad = ctx.createLinearGradient(cx - halfW, 0, cx + halfW, 0);
    grad.addColorStop(0, 'rgba(174, 214, 241, 0.15)');
    grad.addColorStop(0.3, 'rgba(133, 193, 233, 0.35)');
    grad.addColorStop(0.5, 'rgba(133, 193, 233, 0.5)');
    grad.addColorStop(0.7, 'rgba(133, 193, 233, 0.35)');
    grad.addColorStop(1, 'rgba(174, 214, 241, 0.15)');

    // 绘制双凸透镜形状
    ctx.beginPath();
    // 左弧（上到下）
    ctx.moveTo(cx, cy - radius);
    ctx.quadraticCurveTo(cx - halfW, cy, cx, cy + radius);
    // 右弧（下到上）
    ctx.quadraticCurveTo(cx + halfW, cy, cx, cy - radius);
    ctx.closePath();

    ctx.fillStyle = grad;
    ctx.fill();

    // 边缘
    ctx.strokeStyle = 'rgba(93, 109, 126, 0.6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 高光线
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - halfW * 0.4, cy - radius * 0.7);
    ctx.quadraticCurveTo(cx - halfW * 0.6, cy, cx - halfW * 0.4, cy + radius * 0.7);
    ctx.stroke();
  } else {
    // 凹透镜：双凹形状
    const grad = ctx.createLinearGradient(cx - halfW, 0, cx + halfW, 0);
    grad.addColorStop(0, 'rgba(215, 189, 226, 0.15)');
    grad.addColorStop(0.3, 'rgba(187, 143, 206, 0.35)');
    grad.addColorStop(0.5, 'rgba(187, 143, 206, 0.5)');
    grad.addColorStop(0.7, 'rgba(187, 143, 206, 0.35)');
    grad.addColorStop(1, 'rgba(215, 189, 226, 0.15)');

    ctx.beginPath();
    // 凹透镜外形：中间凹，两端有平直边缘
    const edgeW = 4;
    ctx.moveTo(cx - edgeW, cy - radius);
    // 右弧（上到中）
    ctx.quadraticCurveTo(cx + halfW, cy - radius * 0.3, cx + halfW, cy);
    ctx.quadraticCurveTo(cx + halfW, cy + radius * 0.3, cx + edgeW, cy + radius);
    // 底部
    ctx.lineTo(cx - edgeW, cy + radius);
    // 左弧（下到中）
    ctx.quadraticCurveTo(cx - halfW, cy + radius * 0.3, cx - halfW, cy);
    ctx.quadraticCurveTo(cx - halfW, cy - radius * 0.3, cx - edgeW, cy - radius);
    ctx.closePath();

    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(93, 109, 126, 0.6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // 光心标记
  ctx.fillStyle = 'rgba(52, 73, 94, 0.8)';
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.font = '600 11px JetBrains Mono, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('O', cx + 6, cy + 4);

  // 透镜类型标签
  ctx.fillStyle = 'rgba(52, 73, 94, 0.5)';
  ctx.font = '600 10px Noto Sans SC, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(isConvex ? '凸透镜' : '凹透镜', cx, cy - radius - 16);

  ctx.restore();
}

function drawArrow(physX, physY, color, label, isVirtual) {
  const p = physToCanvas(physX, physY);
  const base = physToCanvas(physX, 0);
  const arrowSize = 8;

  ctx.save();

  if (isVirtual) {
    ctx.globalAlpha = 0.5;
    ctx.setLineDash([5, 4]);
  }

  // 箭杆
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(base.x, base.y);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();

  // 箭头
  const dy = p.y - base.y;
  const angle = Math.atan2(dy, 0); // 竖直方向
  ctx.setLineDash(isVirtual ? [5, 4] : []);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x - arrowSize * Math.cos(angle - Math.PI / 6), p.y - arrowSize * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(p.x - arrowSize * Math.cos(angle + Math.PI / 6), p.y - arrowSize * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fill();

  // 标签
  ctx.globalAlpha = isVirtual ? 0.6 : 1;
  ctx.setLineDash([]);
  ctx.font = '600 12px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = dy < 0 ? 'bottom' : 'top';
  ctx.fillText(label, p.x, p.y + (dy < 0 ? -4 : 4));

  ctx.restore();
}

function drawObject() {
  drawArrow(-state.u, state.h, COLORS.object, '物', false);
}

function drawImage(imgData) {
  if (!imgData.hasImage || !isFinite(imgData.v)) return;
  // 如果像距太大（超出可视范围 3 倍），不绘制箭头但保留光线
  const xCanvas = originX + imgData.v * scale;
  const yCanvas = originY - imgData.hImage * scale;
  if (xCanvas < -200 || xCanvas > W + 200 || yCanvas < -200 || yCanvas > H + 200) return;
  const isVirtual = imgData.v < 0;
  drawArrow(imgData.v, imgData.hImage, COLORS.real, isVirtual ? '虚像' : '像', isVirtual);
}

function drawRay(ray, glow) {
  if (!ray) return;
  ctx.save();

  // 发光效果
  if (glow) {
    ctx.shadowColor = ray.color;
    ctx.shadowBlur = 8;
  }

  // 入射光线
  ctx.strokeStyle = ray.color;
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  if (ray.incoming.length >= 2) {
    const p1 = physToCanvas(ray.incoming[0].x, ray.incoming[0].y);
    const p2 = physToCanvas(ray.incoming[1].x, ray.incoming[1].y);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }

  // 出射光线
  if (ray.outgoing.length >= 2) {
    const p1 = physToCanvas(ray.outgoing[0].x, ray.outgoing[0].y);
    const p2 = physToCanvas(ray.outgoing[1].x, ray.outgoing[1].y);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }

  ctx.shadowBlur = 0;

  // 虚像延长线（虚线）
  if (ray.extension) {
    ctx.globalAlpha = 0.35;
    ctx.setLineDash([6, 4]);
    ctx.lineWidth = 1.5;
    const p1 = physToCanvas(ray.extension[0].x, ray.extension[0].y);
    const p2 = physToCanvas(ray.extension[1].x, ray.extension[1].y);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }

  ctx.restore();
}

function drawAuxiliaryLines(imgData) {
  if (!imgData.hasImage || !isFinite(imgData.v)) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(163, 163, 163, 0.3)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);

  // 物距和像距标注线
  const uY = originY + 25;
  const vY = originY + 25;

  // 物距标注
  const objX = physToCanvas(-state.u, 0).x;
  ctx.beginPath();
  ctx.moveTo(objX, uY);
  ctx.lineTo(originX, uY);
  ctx.stroke();

  // 像距标注
  if (imgData.v > 0) {
    const imgX = physToCanvas(imgData.v, 0).x;
    ctx.beginPath();
    ctx.moveTo(originX, vY);
    ctx.lineTo(imgX, vY);
    ctx.stroke();
  }

  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(100, 100, 100, 0.6)';
  ctx.font = '10px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`u=${state.u}`, (objX + originX) / 2, uY + 12);
  if (imgData.v > 0) {
    const imgX = physToCanvas(imgData.v, 0).x;
    ctx.fillText(`v=${imgData.v.toFixed(1)}`, (originX + imgX) / 2, vY + 12);
  }

  ctx.restore();
}

// ---------- 主绘制 ----------
let lastFrame = 0;
let fps = 60;
let animTime = 0;

function draw() {
  // 平滑过渡
  const lerp = 0.15;
  state.displayU += (state.targetU - state.displayU) * lerp;
  state.displayF += (state.targetF - state.displayF) * lerp;
  state.displayH += (state.targetH - state.displayH) * lerp;
  state.displayD += (state.targetD - state.displayD) * lerp;
  state.lensTypeBlend += (state.targetLensTypeBlend - state.lensTypeBlend) * lerp;

  // 用过渡值更新实际状态
  state.u = state.displayU;
  state.f = state.displayF;
  state.h = state.displayH;
  state.diameter = state.displayD;

  // 清空
  ctx.fillStyle = '#faf8f5';
  ctx.fillRect(0, 0, W, H);

  drawGrid();
  drawAxis();
  drawFocalPoints();

  const imgData = computeImage();
  const rayData = computeRays();

  // 辅助线
  if (state.showAux) {
    drawAuxiliaryLines(imgData);
  }

  // 漫射光线
  if (state.showMultiRay) {
    rayData.rays.multi.forEach(r => drawRay(r, false));
  }

  // 三条特殊光线
  if (state.showParallel) drawRay(rayData.rays.parallel, true);
  if (state.showCenter) drawRay(rayData.rays.center, true);
  if (state.showFocal) drawRay(rayData.rays.focal, true);

  // 透镜
  drawLens();

  // 物体和像
  drawObject();
  drawImage(imgData);

  // 拖拽提示（左下角）
  if (!state.hasInteracted) {
    ctx.save();
    ctx.fillStyle = 'rgba(100, 100, 100, 0.35)';
    ctx.font = '11px Noto Sans SC, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText('← 拖动物体可改变物距 →', 16, H - 16);
    ctx.restore();
  }

  // 更新数据面板
  updateDataPanel(imgData);
}

function animate(now) {
  const dt = (now - lastFrame) / 1000 || 0.016;
  lastFrame = now;
  fps = Math.round(1 / dt);

  // 动画模式：物距自动变化
  if (state.isPlaying) {
    animTime += dt * state.speed;
    const minU = 3;
    const maxU = 58;
    const range = maxU - minU;
    // 来回运动
    const phase = (Math.sin(animTime * 0.4) + 1) / 2; // 0 to 1
    const newU = minU + phase * range;
    state.targetU = newU;
    document.getElementById('sliderU').value = Math.round(newU);
    document.getElementById('valU').textContent = Math.round(newU) + ' cm';
  }

  draw();

  document.getElementById('fpsTag').textContent = `${fps} FPS`;
  requestAnimationFrame(animate);
}

// ---------- 数据面板更新 ----------
function updateDataPanel(imgData) {
  const f = getFocalLength();
  document.getElementById('dataU').textContent = state.u.toFixed(1) + ' cm';

  if (isFinite(imgData.v)) {
    const vSign = imgData.v < 0 ? '−' : '';
    document.getElementById('dataV').textContent = vSign + Math.abs(imgData.v).toFixed(1) + ' cm';
  } else {
    document.getElementById('dataV').textContent = '∞';
  }

  const fDisplay = state.lensType === 'convex' ? `+${state.f.toFixed(1)}` : `−${state.f.toFixed(1)}`;
  document.getElementById('dataF').textContent = fDisplay + ' cm';

  if (isFinite(imgData.m)) {
    const mSign = imgData.m < 0 ? '−' : '';
    document.getElementById('dataM').textContent = mSign + Math.abs(imgData.m).toFixed(2);
  } else {
    document.getElementById('dataM').textContent = '∞';
  }

  const natureEl = document.getElementById('dataNature');
  natureEl.textContent = imgData.nature;
  natureEl.className = 'ldp-nature ' + imgData.natureClass;

  // 公式验证
  const formulaEl = document.getElementById('dataFormula');
  if (isFinite(imgData.v) && Math.abs(f) > 0.01) {
    const invF = 1 / f;
    const invU = 1 / state.u;
    const invV = 1 / imgData.v;
    const sum = invU + invV;
    const match = Math.abs(invF - sum) < 0.01;

    // 格式化：正数直接显示，负数用减号
    const fmt = (val) => {
      const s = val.toFixed(4);
      return val >= 0 ? s : s; // toFixed already includes minus sign
    };

    // 构建右半部分：1/u ± |1/v|
    let rhsStr;
    if (invV >= 0) {
      rhsStr = `${fmt(invU)} + ${fmt(invV)}`;
    } else {
      rhsStr = `${fmt(invU)} − ${fmt(Math.abs(invV))}`;
    }

    formulaEl.innerHTML = `1/f = 1/u + 1/v<br>${fmt(invF)} = ${rhsStr} <span class="check">${match ? '✓' : '≈'}</span>`;
  } else if (!isFinite(imgData.v)) {
    formulaEl.innerHTML = `1/f = 1/u + 1/v<br>${(1/f).toFixed(4)} = ${(1/state.u).toFixed(4)} + 0 <span class="check">≈</span>`;
  }
}

// ---------- 预设模式 ----------
const PRESETS = {
  camera:    { lensType: 'convex', f: 15, u: 40, h: 8, diameter: 18 },
  projector: { lensType: 'convex', f: 15, u: 20, h: 5, diameter: 18 },
  magnifier: { lensType: 'convex', f: 20, u: 10, h: 5, diameter: 20 },
  equal:     { lensType: 'convex', f: 15, u: 30, h: 8, diameter: 18 },
  parallel:  { lensType: 'convex', f: 15, u: 15, h: 8, diameter: 18 },
  concave:   { lensType: 'concave', f: 15, u: 25, h: 8, diameter: 18 },
};

function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;

  // 停止动画
  if (state.isPlaying) togglePlay();

  state.targetU = p.u;
  state.targetF = p.f;
  state.targetH = p.h;
  state.targetD = p.diameter;
  state.targetLensType = p.lensType;
  state.targetLensTypeBlend = p.lensType === 'concave' ? 1 : 0;

  // 更新状态
  state.lensType = p.lensType;

  // 更新 UI
  document.getElementById('sliderF').value = p.f;
  document.getElementById('sliderU').value = p.u;
  document.getElementById('sliderH').value = p.h;
  document.getElementById('sliderD').value = p.diameter;
  document.getElementById('valF').textContent = p.f + ' cm';
  document.getElementById('valU').textContent = p.u + ' cm';
  document.getElementById('valH').textContent = p.h + ' cm';
  document.getElementById('valD').textContent = p.diameter + ' cm';

  document.getElementById('btnConvex').classList.toggle('active', p.lensType === 'convex');
  document.getElementById('btnConcave').classList.toggle('active', p.lensType === 'concave');

  // 高亮预设按钮
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.preset-btn[data-preset="${name}"]`).classList.add('active');
  state.activePreset = name;
}

// ---------- 播放/暂停 ----------
function togglePlay() {
  state.isPlaying = !state.isPlaying;
  const icon = document.getElementById('playIcon');
  if (state.isPlaying) {
    icon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
  } else {
    icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
  }
}

// ---------- 拖拽交互 ----------
let isDragging = false;
let dragStartX = 0;
let dragStartU = 0;

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function checkObjectHit(pos) {
  const objPos = physToCanvas(-state.u, state.h / 2);
  const dx = pos.x - objPos.x;
  const dy = pos.y - objPos.y;
  return Math.sqrt(dx * dx + dy * dy) < 25;
}

canvas.addEventListener('mousedown', (e) => {
  const pos = getCanvasPos(e);
  if (checkObjectHit(pos)) {
    isDragging = true;
    dragStartX = e.clientX;
    dragStartU = state.u;
    canvas.classList.add('dragging');
    state.hasInteracted = true;
    if (state.isPlaying) togglePlay();
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - dragStartX;
  const dPhys = -dx / scale; // 向左拖增加物距
  let newU = Math.max(2, Math.min(60, dragStartU + dPhys));
  state.targetU = newU;
  state.displayU = newU;
  state.u = newU;
  document.getElementById('sliderU').value = Math.round(newU);
  document.getElementById('valU').textContent = Math.round(newU) + ' cm';
  // 清除预设高亮
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
});

canvas.addEventListener('mouseup', () => {
  isDragging = false;
  canvas.classList.remove('dragging');
});
canvas.addEventListener('mouseleave', () => {
  isDragging = false;
  canvas.classList.remove('dragging');
});

// 触摸支持
canvas.addEventListener('touchstart', (e) => {
  const pos = getCanvasPos(e);
  if (checkObjectHit(pos)) {
    isDragging = true;
    dragStartX = e.touches[0].clientX;
    dragStartU = state.u;
    if (state.isPlaying) togglePlay();
    e.preventDefault();
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  const dx = e.touches[0].clientX - dragStartX;
  const dPhys = -dx / scale;
  let newU = Math.max(2, Math.min(60, dragStartU + dPhys));
  state.targetU = newU;
  state.displayU = newU;
  state.u = newU;
  document.getElementById('sliderU').value = Math.round(newU);
  document.getElementById('valU').textContent = Math.round(newU) + ' cm';
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', () => { isDragging = false; });

// ---------- 事件绑定 ----------
document.addEventListener('DOMContentLoaded', () => {
  resizeCanvas();

  // 透镜类型切换
  document.getElementById('btnConvex').addEventListener('click', () => {
    state.lensType = 'convex';
    state.targetLensTypeBlend = 0;
    document.getElementById('btnConvex').classList.add('active');
    document.getElementById('btnConcave').classList.remove('active');
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  });
  document.getElementById('btnConcave').addEventListener('click', () => {
    state.lensType = 'concave';
    state.targetLensTypeBlend = 1;
    document.getElementById('btnConcave').classList.add('active');
    document.getElementById('btnConvex').classList.remove('active');
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  });

  // 滑块
  const bindSlider = (sliderId, valId, stateKey, unit, targetKey) => {
    const slider = document.getElementById(sliderId);
    const val = document.getElementById(valId);
    slider.addEventListener('input', (e) => {
      const v = parseInt(e.target.value);
      state[stateKey] = v;
      state[targetKey] = v;
      val.textContent = v + ' ' + unit;
      state.hasInteracted = true;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    });
  };

  bindSlider('sliderF', 'valF', 'f', 'cm', 'targetF');
  bindSlider('sliderU', 'valU', 'u', 'cm', 'targetU');
  bindSlider('sliderH', 'valH', 'h', 'cm', 'targetH');
  bindSlider('sliderD', 'valD', 'diameter', 'cm', 'targetD');

  // 显示选项开关
  const bindToggle = (id, stateKey) => {
    const btn = document.getElementById(id);
    btn.addEventListener('click', () => {
      state[stateKey] = !state[stateKey];
      btn.classList.toggle('active', state[stateKey]);
    });
  };
  bindToggle('toggleParallel', 'showParallel');
  bindToggle('toggleCenter', 'showCenter');
  bindToggle('toggleFocal', 'showFocal');
  bindToggle('toggleAux', 'showAux');
  bindToggle('toggleMultiRay', 'showMultiRay');

  // 预设
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      applyPreset(btn.dataset.preset);
    });
  });

  // 播放/暂停
  document.getElementById('btnPlay').addEventListener('click', togglePlay);

  // 重置
  document.getElementById('btnReset').addEventListener('click', () => {
    if (state.isPlaying) togglePlay();
    state.targetU = 30;
    state.targetF = 15;
    state.targetH = 8;
    state.targetD = 18;
    state.targetLensTypeBlend = 0;
    state.lensType = 'convex';
    document.getElementById('sliderF').value = 15;
    document.getElementById('sliderU').value = 30;
    document.getElementById('sliderH').value = 8;
    document.getElementById('sliderD').value = 18;
    document.getElementById('valF').textContent = '15 cm';
    document.getElementById('valU').textContent = '30 cm';
    document.getElementById('valH').textContent = '8 cm';
    document.getElementById('valD').textContent = '18 cm';
    document.getElementById('btnConvex').classList.add('active');
    document.getElementById('btnConcave').classList.remove('active');
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  });

  // 速度
  document.getElementById('speedSelect').addEventListener('change', (e) => {
    state.speed = parseFloat(e.target.value);
  });

  // 导航栏滚动
  const navbar = document.getElementById('demoNavbar');
  window.addEventListener('scroll', () => {
    navbar.classList.toggle('scrolled', window.scrollY > 10);
  });

  // 隐藏加载动画
  setTimeout(() => {
    document.getElementById('lensLoading').classList.add('fade');
  }, 800);

  // 启动
  requestAnimationFrame(animate);
});
</script>
