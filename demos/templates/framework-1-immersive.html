<script type="module">
import * as THREE from 'three';

/* ============================================================
   框架一：沉浸式全屏型 — 模板脚本
   展示一个旋转的二十面体，演示框架的基本交互
   ============================================================ */

let scene, camera, renderer, mesh;
let isSpinning = true;
let currentMode = 'solid';

function init() {
  const container = document.getElementById('canvasContainer');

  // 场景
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0f);
  scene.fog = new THREE.Fog(0x0a0a0f, 8, 25);

  // 相机
  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(0, 0, 6);

  // 渲染器
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // 灯光
  const ambient = new THREE.AmbientLight(0x404060, 0.5);
  scene.add(ambient);

  const keyLight = new THREE.DirectionalLight(0xc2410c, 1.2);
  keyLight.position.set(5, 5, 5);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x0d9488, 0.6);
  fillLight.position.set(-5, -3, 2);
  scene.add(fillLight);

  // 主体：二十面体
  const geometry = new THREE.IcosahedronGeometry(1.8, 0);
  const material = new THREE.MeshStandardMaterial({
    color: 0xc2410c,
    metalness: 0.3,
    roughness: 0.4,
    flatShading: true,
  });
  mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  // 边线
  const edges = new THREE.EdgesGeometry(geometry);
  const lineMat = new THREE.LineBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.3 });
  const wireframe = new THREE.LineSegments(edges, lineMat);
  mesh.add(wireframe);

  document.getElementById('loading').classList.remove('active');
  animate();
}

function animate() {
  requestAnimationFrame(animate);

  if (isSpinning) {
    mesh.rotation.x += 0.003;
    mesh.rotation.y += 0.005;
  }

  renderer.render(scene, camera);
}

// 窗口大小
window.addEventListener('resize', () => {
  const container = document.getElementById('canvasContainer');
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// ====== 交互绑定 ======
document.addEventListener('DOMContentLoaded', () => {
  init();

  // 自动旋转
  document.getElementById('spinBtn').addEventListener('click', (e) => {
    isSpinning = !isSpinning;
    e.currentTarget.classList.toggle('active', isSpinning);
  });

  // 重置视角
  document.getElementById('resetBtn').addEventListener('click', () => {
    mesh.rotation.set(0, 0, 0);
    camera.position.set(0, 0, 6);
  });

  // 全屏
  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });

  // 模式切换
  document.querySelectorAll('.demo-mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.demo-mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;

      if (currentMode === 'wireframe') {
        mesh.material.wireframe = true;
      } else {
        mesh.material.wireframe = false;
      }
    });
  });

  // 导航栏滚动效果
  const navbar = document.getElementById('demoNavbar');
  window.addEventListener('scroll', () => {
    navbar.classList.toggle('scrolled', window.scrollY > 10);
  });
});
</script>
