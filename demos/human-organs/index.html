import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   人体器官 3D 解剖 — 沉浸式全屏型 Demo
   ============================================================ */

// ===== 全局变量 =====
let scene, camera, renderer, controls;
let raycaster, mouse;
let humanGroup;
let allOrgans = []; // 所有可拾取的器官 mesh
let selectedOrgan = null;
let hoveredOrgan = null;
let isSpinning = true;
let currentMode = 'solid';
let currentClip = 'none';
let showLabels = false;
let entryProgress = 0;
let clock;
let labelSprites = [];

// 剖切平面
const clipPlanes = {
  sagittal: new THREE.Plane(new THREE.Vector3(1, 0, 0), 0),
  coronal: new THREE.Plane(new THREE.Vector3(0, 0, 1), 0),
  horizontal: new THREE.Plane(new THREE.Vector3(0, -1, 0), 2.5),
};

// 系统配置
const SYSTEM_CONFIG = [
  { id: 'skeletal', name: '骨骼系统', color: '#F5F0E1', colorHex: 0xF5F0E1, visible: true },
  { id: 'circulatory', name: '循环系统', color: '#E53935', colorHex: 0xE53935, visible: true },
  { id: 'respiratory', name: '呼吸系统', color: '#B0BEC5', colorHex: 0xB0BEC5, visible: true },
  { id: 'digestive', name: '消化系统', color: '#D84315', colorHex: 0xD84315, visible: true },
  { id: 'nervous', name: '神经系统', color: '#FFF9C4', colorHex: 0xFFF9C4, visible: true },
  { id: 'urinary', name: '泌尿系统', color: '#FFAB91', colorHex: 0xFFAB91, visible: true },
  { id: 'skin', name: '皮肤层', color: '#FFDCC8', colorHex: 0xFFDCC8, visible: false },
];

const systemGroups = {};

// ===== 材质工厂 =====
function createOrganMaterial(colorHex, opts = {}) {
  const mat = new THREE.MeshPhysicalMaterial({
    color: colorHex,
    emissive: colorHex,
    emissiveIntensity: opts.emissive || 0.12,
    roughness: opts.roughness !== undefined ? opts.roughness : 0.5,
    metalness: opts.metalness || 0.05,
    transparent: true,
    opacity: opts.opacity !== undefined ? opts.opacity : 1.0,
    clearcoat: opts.clearcoat || 0.3,
    clearcoatRoughness: 0.5,
    side: THREE.DoubleSide,
    depthWrite: opts.opacity !== undefined && opts.opacity < 1.0 ? false : true,
  });
  return mat;
}

// 记录每个器官的原始材质属性
function tagOrgan(mesh, organId) {
  mesh.userData.organId = organId;
  mesh.userData.baseEmissive = mesh.material.emissiveIntensity;
  mesh.userData.baseOpacity = mesh.material.opacity;
  mesh.userData.baseColor = mesh.material.color.clone();
  mesh.userData.baseEmissiveColor = mesh.material.emissive.clone();
  allOrgans.push(mesh);
  return mesh;
}

// ===== 构建骨骼系统 =====
function buildSkeleton() {
  const group = new THREE.Group();
  group.name = 'skeletal';
  const boneColor = 0xF5F0E1;

  // 颅骨
  const skullGeo = new THREE.SphereGeometry(0.52, 24, 20);
  const skull = new THREE.Mesh(skullGeo, createOrganMaterial(boneColor, { roughness: 0.7, emissive: 0.06 }));
  skull.position.set(0, 6.0, 0);
  skull.scale.set(0.9, 1.0, 1.0);
  tagOrgan(skull, 'skull');
  group.add(skull);

  // 下颌
  const jawGeo = new THREE.SphereGeometry(0.32, 16, 12);
  const jaw = new THREE.Mesh(jawGeo, createOrganMaterial(boneColor, { roughness: 0.7, emissive: 0.06 }));
  jaw.position.set(0, 5.5, 0.12);
  jaw.scale.set(0.85, 0.5, 0.7);
  tagOrgan(jaw, 'skull');
  group.add(jaw);

  // 脊柱 — 椎骨堆叠
  const spineSegments = 24;
  const spineGroup = new THREE.Group();
  for (let i = 0; i < spineSegments; i++) {
    const t = i / (spineSegments - 1);
    const y = 2.2 + t * 3.5;
    const r = 0.1 + Math.sin(t * Math.PI) * 0.04;
    // 弯曲度：颈椎前凸、胸椎后凸、腰椎前凸
    const z = -0.15 + Math.sin(t * Math.PI * 2) * 0.08;
    const vertebra = new THREE.Mesh(
      new THREE.CylinderGeometry(r, r * 0.9, 0.14, 12),
      createOrganMaterial(boneColor, { roughness: 0.7, emissive: 0.06 })
    );
    vertebra.position.set(0, y, z);
    spineGroup.add(vertebra);
  }
  tagOrgan(spineGroup.children[0], 'spine');
  // 给整组标记
  spineGroup.traverse(c => { if (c.isMesh) c.userData.organId = c.userData.organId || 'spine'; });
  group.add(spineGroup);

  // 胸廓 — 肋骨
  const ribCount = 10;
  for (let i = 0; i < ribCount; i++) {
    const t = i / (ribCount - 1);
    const y = 3.7 + t * 1.4;
    const radius = 0.7 + Math.sin(t * Math.PI) * 0.35;
    const arc = Math.PI * 1.35;
    const ribGeo = new THREE.TorusGeometry(radius, 0.035, 6, 32, arc);
    const ribMat = createOrganMaterial(boneColor, { roughness: 0.7, emissive: 0.06 });
    const rib = new THREE.Mesh(ribGeo, ribMat);
    rib.position.set(0, y, 0);
    rib.rotation.x = Math.PI / 2;
    rib.rotation.z = Math.PI * 0.675;
    rib.scale.set(1, 1, 0.72); // 前后略扁
    tagOrgan(rib, 'ribcage');
    group.add(rib);
  }

  // 胸骨
  const sternum = new THREE.Mesh(
    new THREE.BoxGeometry(0.22, 1.4, 0.08),
    createOrganMaterial(boneColor, { roughness: 0.7, emissive: 0.06 })
  );
  sternum.position.set(0, 4.3, 0.48);
  tagOrgan(sternum, 'ribcage');
  group.add(sternum);

  // 锁骨
  for (const side of [-1, 1]) {
    const clavicle = new THREE.Mesh(
      new THREE.CylinderGeometry(0.04, 0.04, 1.0, 8),
      createOrganMaterial(boneColor, { roughness: 0.7, emissive: 0.06 })
    );
    clavicle.position.set(side * 0.55, 5.15, 0.35);
    clavicle.rotation.z = side * 0.25;
    clavicle.rotation.x = 0.1;
    tagOrgan(clavicle, 'ribcage');
    group.add(clavicle);
  }

  // 肩胛骨
  for (const side of [-1, 1]) {
    const scapula = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.6, 0.04),
      createOrganMaterial(boneColor, { roughness: 0.7, emissive: 0.06 })
    );
    scapula.position.set(side * 0.6, 4.6, -0.35);
    scapula.rotation.y = side * 0.15;
    tagOrgan(scapula, 'ribcage');
    group.add(scapula);
  }

  // 骨盆
  const pelvisGroup = new THREE.Group();
  // 髂骨翼
  for (const side of [-1, 1]) {
    const ilium = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 16, 12),
      createOrganMaterial(boneColor, { roughness: 0.7, emissive: 0.06 })
    );
    ilium.position.set(side * 0.42, 1.7, 0);
    ilium.scale.set(0.7, 1.2, 0.5);
    ilium.rotation.z = side * 0.15;
    tagOrgan(ilium, 'pelvis');
    pelvisGroup.add(ilium);
  }
  // 耻骨联合
  const pubis = new THREE.Mesh(
    new THREE.TorusGeometry(0.3, 0.06, 6, 16, Math.PI),
    createOrganMaterial(boneColor, { roughness: 0.7, emissive: 0.06 })
  );
  pubis.position.set(0, 1.5, 0.2);
  pubis.rotation.x = Math.PI / 2;
  pubis.scale.set(1, 1, 0.5);
  tagOrgan(pubis, 'pelvis');
  pelvisGroup.add(pubis);
  // 骶骨
  const sacrum = new THREE.Mesh(
    new THREE.ConeGeometry(0.18, 0.5, 8),
    createOrganMaterial(boneColor, { roughness: 0.7, emissive: 0.06 })
  );
  sacrum.position.set(0, 1.75, -0.12);
  sacrum.rotation.x = 0.15;
  tagOrgan(sacrum, 'pelvis');
  pelvisGroup.add(sacrum);
  group.add(pelvisGroup);

  // 上肢骨
  for (const side of [-1, 1]) {
    // 肱骨
    const humerus = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.05, 1.4, 10),
      createOrganMaterial(boneColor, { roughness: 0.7, emissive: 0.06 })
    );
    humerus.position.set(side * 1.35, 4.4, 0);
    humerus.rotation.z = side * 0.06;
    tagOrgan(humerus, 'skull'); // 归入骨骼但不是重点器官
    humerus.userData.organId = 'spine'; // 标记为通用骨骼
    group.add(humerus);
    // 桡尺骨
    for (const offset of [-0.06, 0.06]) {
      const forearm = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.035, 1.3, 8),
        createOrganMaterial(boneColor, { roughness: 0.7, emissive: 0.06 })
      );
      forearm.position.set(side * 1.4 + offset, 3.0, 0);
      forearm.userData.organId = 'spine';
      group.add(forearm);
    }
  }

  // 下肢骨
  for (const side of [-1, 1]) {
    // 股骨
    const femur = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.07, 1.8, 10),
      createOrganMaterial(boneColor, { roughness: 0.7, emissive: 0.06 })
    );
    femur.position.set(side * 0.3, 0.7, 0);
    femur.userData.organId = 'spine';
    group.add(femur);
    // 胫腓骨
    for (const offset of [-0.05, 0.05]) {
      const tibia = new THREE.Mesh(
        new THREE.CylinderGeometry(0.06, 0.05, 1.7, 8),
        createOrganMaterial(boneColor, { roughness: 0.7, emissive: 0.06 })
      );
      tibia.position.set(side * 0.3 + offset, -1.0, 0);
      tibia.userData.organId = 'spine';
      group.add(tibia);
    }
  }

  return group;
}

// ===== 标签精灵 =====
function createLabelSprite(text) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 256;
  canvas.height = 64;
  function drawRoundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
  ctx.fillStyle = 'rgba(10, 15, 26, 0.85)';
  drawRoundRect(0, 0, 256, 64, 8);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
  ctx.lineWidth = 1.5;
  drawRoundRect(0, 0, 256, 64, 8);
  ctx.stroke();
  ctx.fillStyle = '#00E5FF';
  ctx.font = 'bold 28px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);

  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(1.5, 0.375, 1);
  return sprite;
}

// ===== 初始化场景 =====
function init() {
  const container = document.getElementById('canvas-container');

  // 场景
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0f1a);
  scene.fog = new THREE.Fog(0x0a0f1a, 12, 30);

  // 相机
  camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(0, 3.5, 14);

  // 渲染器
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.localClippingEnabled = true;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  container.appendChild(renderer.domElement);

  // 灯光系统
  const ambient = new THREE.AmbientLight(0x334466, 0.4);
  scene.add(ambient);

  const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
  keyLight.position.set(5, 8, 6);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x4FC3F7, 0.5);
  fillLight.position.set(-6, 3, 4);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0x00E5FF, 0.4);
  rimLight.position.set(0, 5, -8);
  scene.add(rimLight);

  const bottomLight = new THREE.DirectionalLight(0x7C4DFF, 0.2);
  bottomLight.position.set(0, -5, 3);
  scene.add(bottomLight);

  // 背景径向光效
  const bgGeo = new THREE.PlaneGeometry(40, 40);
  const bgMat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec2 vUv;
      uniform float time;
      void main() {
        vec2 center = vUv - 0.5;
        float dist = length(center);
        float glow = 0.08 / (dist * dist + 0.05);
        vec3 col = mix(vec3(0.02, 0.04, 0.1), vec3(0.0, 0.4, 0.6), glow);
        col += vec3(0.01, 0.02, 0.04) * sin(vUv.y * 40.0 + time * 0.2) * 0.5;
        float alpha = 1.0 - smoothstep(0.3, 0.7, dist);
        gl_FragColor = vec4(col, alpha * 0.5);
      }
    `,
    transparent: true,
    depthWrite: false,
  });
  const bgMesh = new THREE.Mesh(bgGeo, bgMat);
  bgMesh.position.set(0, 3, -10);
  scene.add(bgMesh);
  bgMesh.userData.shader = bgMat;

  // 地面网格（微弱）
  const grid = new THREE.GridHelper(20, 20, 0x1a2333, 0x0f1620);
  grid.position.y = -2.5;
  grid.material.transparent = true;
  grid.material.opacity = 0.15;
  scene.add(grid);

  // OrbitControls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 3, 0);
  controls.minDistance = 4;
  controls.maxDistance = 22;
  controls.minPolarAngle = 0.15;
  controls.maxPolarAngle = Math.PI - 0.15;
  controls.enablePan = true;
  controls.panSpeed = 0.5;

  // Raycaster
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  // 时钟
  clock = new THREE.Clock();

  // 构建人体模型
  humanGroup = new THREE.Group();

  systemGroups.skeletal = buildSkeleton();
  systemGroups.circulatory = buildCirculatory();
  systemGroups.respiratory = buildRespiratory();
  systemGroups.digestive = buildDigestive();
  systemGroups.nervous = buildNervous();
  systemGroups.urinary = buildUrinary();
  systemGroups.skin = buildSkin();

  for (const sysId of Object.keys(systemGroups)) {
    humanGroup.add(systemGroups[sysId]);
  }

  // 皮肤默认隐藏
  systemGroups.skin.visible = false;

  // 后处理：收集所有 mesh 到 allOrgans，确保未被 tagOrgan 注册的也被收集
  humanGroup.traverse(child => {
    if (child.isMesh && child.material && !child.userData.collected) {
      child.userData.collected = true;
      if (!allOrgans.includes(child)) {
        allOrgans.push(child);
      }
      // 确保 base 属性存在（兼容 MeshBasicMaterial 等无 emissive 的材质）
      if (child.userData.baseOpacity === undefined) {
        child.userData.baseOpacity = child.material.opacity !== undefined ? child.material.opacity : 1.0;
        child.userData.baseColor = child.material.color ? child.material.color.clone() : new THREE.Color(0xffffff);
        child.userData.baseEmissive = child.material.emissiveIntensity !== undefined ? child.material.emissiveIntensity : 0;
        child.userData.baseEmissiveColor = child.material.emissive ? child.material.emissive.clone() : new THREE.Color(0x000000);
      }
    }
  });

  scene.add(humanGroup);

  // 入场动画：所有器官从0缩放
  allOrgans.forEach(mesh => {
    if (mesh.isMesh) {
      mesh.userData.targetScale = mesh.scale.clone();
      mesh.scale.set(0, 0, 0);
    }
  });

  // 标签
  createOrganLabels();

  // 隐藏加载
  setTimeout(() => {
    document.getElementById('loadingOverlay').classList.add('hidden');
  }, 800);

  animate();
}

// ===== 创建器官标签 =====
function createOrganLabels() {
  const labelPositions = {
    brain: { pos: [0, 6.0, 0.5], text: '大脑' },
    heart: { pos: [-0.25, 4.3, 0.6], text: '心脏' },
    lung: { pos: [0.95, 4.5, 0.5], text: '肺' },
    liver: { pos: [0.55, 3.4, 0.5], text: '肝脏' },
    stomach: { pos: [-0.25, 3.5, 0.5], text: '胃' },
    intestine: { pos: [0, 2.0, 0.5], text: '小肠' },
    kidney: { pos: [0.35, 2.8, 0.3], text: '肾脏' },
    bladder: { pos: [0, 1.3, 0.4], text: '膀胱' },
    trachea: { pos: [0, 5.3, 0.4], text: '气管' },
    spine: { pos: [0, 4.0, -0.4], text: '脊柱' },
  };

  for (const [id, info] of Object.entries(labelPositions)) {
    const sprite = createLabelSprite(info.text);
    sprite.position.set(...info.pos);
    sprite.visible = false;
    sprite.userData.organId = id;
    scene.add(sprite);
    labelSprites.push(sprite);
  }
}

// ===== 入场动画 =====
function updateEntryAnim() {
  if (entryProgress >= 1) return;

  const dt = clock.getDelta();
  entryProgress = Math.min(entryProgress + dt * 0.6, 1);

  // 系统入场顺序：骨骼 → 循环 → 呼吸 → 消化 → 神经 → 泌尿
  const systemOrder = ['skeletal', 'circulatory', 'respiratory', 'digestive', 'nervous', 'urinary'];
  const perSystem = 1 / systemOrder.length;

  systemOrder.forEach((sysId, i) => {
    const start = i * perSystem * 0.7;
    const end = start + perSystem;
    const t = THREE.MathUtils.clamp((entryProgress - start) / (end - start), 0, 1);
    const eased = 1 - Math.pow(1 - t, 3);

    systemGroups[sysId].traverse(child => {
      if (child.isMesh && child.userData.targetScale) {
        child.scale.lerpVectors(new THREE.Vector3(0,0,0), child.userData.targetScale, eased);
      }
    });
  });

  // 更新加载条
  const bar = document.getElementById('loadingBarFill');
  if (bar) bar.style.width = (entryProgress * 100) + '%';
}

// ===== 高亮 / 取消高亮 =====
function highlightOrgan(mesh) {
  if (!mesh || !mesh.material) return;
  if (!mesh.material.emissive) return; // 跳过无 emissive 的材质（如 MeshBasicMaterial）
  if (!mesh.userData.highlighted) {
    mesh.userData.highlighted = true;
    mesh.userData.savedEmissive = mesh.material.emissiveIntensity;
    mesh.userData.savedEmissiveColor = mesh.material.emissive.clone();
    mesh.material.emissiveIntensity = 0.5;
    mesh.material.emissive.setHex(0x00E5FF);
  }
}

function unhighlightOrgan(mesh) {
  if (!mesh || !mesh.material) return;
  if (mesh.userData.highlighted) {
    mesh.userData.highlighted = false;
    mesh.material.emissiveIntensity = mesh.userData.savedEmissive;
    mesh.material.emissive.copy(mesh.userData.savedEmissiveColor);
  }
}

function unhighlightAll() {
  allOrgans.forEach(m => {
    if (m.userData.highlighted) unhighlightOrgan(m);
  });
}

// ===== 点击器官 =====
function onCanvasClick(event) {
  if (entryProgress < 1) return;

  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(allOrgans, false);

  if (intersects.length > 0) {
    // 找到最近可见的
    for (const hit of intersects) {
      const organ = hit.object;
      // 检查器官所在系统是否可见
      let parentGroup = organ.parent;
      while (parentGroup && parentGroup.parent !== humanGroup) {
        parentGroup = parentGroup.parent;
      }
      if (parentGroup && parentGroup.visible) {
        selectOrgan(organ);
        return;
      }
    }
  }
  // 点击空白处取消选中
  deselectOrgan();
}

// ===== 悬停效果 =====
function onCanvasMove(event) {
  if (entryProgress < 1) return;

  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(allOrgans, false);

  let newHover = null;
  if (intersects.length > 0) {
    for (const hit of intersects) {
      const organ = hit.object;
      let parentGroup = organ.parent;
      while (parentGroup && parentGroup.parent !== humanGroup) {
        parentGroup = parentGroup.parent;
      }
      if (parentGroup && parentGroup.visible) {
        newHover = organ;
        break;
      }
    }
  }

  if (newHover !== hoveredOrgan) {
    if (hoveredOrgan && hoveredOrgan !== selectedOrgan) unhighlightOrgan(hoveredOrgan);
    hoveredOrgan = newHover;
    if (hoveredOrgan && hoveredOrgan !== selectedOrgan) highlightOrgan(hoveredOrgan);
    renderer.domElement.style.cursor = newHover ? 'pointer' : 'grab';
  }
}

// ===== 选中器官 =====
function selectOrgan(mesh) {
  // 取消之前的高亮
  if (selectedOrgan && selectedOrgan !== hoveredOrgan) {
    unhighlightOrgan(selectedOrgan);
  }

  selectedOrgan = mesh;
  highlightOrgan(mesh);

  const organId = mesh.userData.organId;
  const data = ORGAN_DATA[organId];
  if (data) {
    showOrganInfo(data, organId);
  }

  // 系统聚焦：其他系统半透明
  focusSystem(mesh.userData.system || getSystemOfOrgan(mesh));

  document.getElementById('statusTag').textContent = data ? data.name : '已选中';
}

function deselectOrgan() {
  if (selectedOrgan) {
    unhighlightOrgan(selectedOrgan);
    selectedOrgan = null;
  }
  hideOrganInfo();
  unfocusAllSystems();
  document.getElementById('statusTag').textContent = '就绪';
}

function getSystemOfOrgan(mesh) {
  let parent = mesh.parent;
  while (parent && parent.parent !== humanGroup) {
    parent = parent.parent;
  }
  if (parent) {
    for (const [id, group] of Object.entries(systemGroups)) {
      if (group === parent) return id;
    }
  }
  return null;
}

// ===== 系统聚焦 =====
function focusSystem(sysId) {
  if (!sysId) return;
  // 根据当前显示模式确定基准透明度
  let baseOp = 1.0;
  if (currentMode === 'transparent') baseOp = 0.4;
  else if (currentMode === 'xray') baseOp = 0.25;

  for (const [id, group] of Object.entries(systemGroups)) {
    if (!group.visible) continue;
    group.traverse(child => {
      if (child.isMesh && child.material) {
        if (id === sysId) {
          child.material.opacity = baseOp;
          child.material.wireframe = currentMode === 'xray';
        } else {
          child.material.opacity = baseOp * 0.15;
          child.material.wireframe = currentMode === 'xray';
        }
      }
    });
  }
}

function unfocusAllSystems() {
  // 重新应用当前显示模式，确保透明度一致
  setDisplayMode(currentMode);
}

// ===== 显示 / 隐藏器官信息 =====
function showOrganInfo(data, organId) {
  const html = `
    <div class="organ-info-system">${data.system}</div>
    <div class="organ-info-name">${data.name}</div>
    <div class="organ-info-en">${data.en}</div>
    <div class="organ-info-func">${data.func}</div>
    <div class="organ-info-desc">${data.desc}</div>
    <div class="organ-info-facts-title">关键事实</div>
    <ul class="organ-info-facts">
      ${data.facts.map(f => `<li>${f}</li>`).join('')}
    </ul>
  `;
  document.getElementById('organInfoContent').innerHTML = html;
  document.getElementById('organInfoPanel').classList.add('visible');
}

function hideOrganInfo() {
  document.getElementById('organInfoPanel').classList.remove('visible');
}

// ===== 系统切换 =====
function toggleSystem(sysId) {
  const sys = SYSTEM_CONFIG.find(s => s.id === sysId);
  if (!sys) return;
  sys.visible = !sys.visible;
  systemGroups[sysId].visible = sys.visible;

  // 如果当前有选中器官，且其系统被隐藏，取消选中
  if (selectedOrgan && !sys.visible) {
    const selSys = getSystemOfOrgan(selectedOrgan);
    if (selSys === sysId) deselectOrgan();
  }

  updateSystemList();
}

// ===== 构建系统列表 UI =====
function buildSystemList() {
  const container = document.getElementById('systemList');
  container.innerHTML = '';
  SYSTEM_CONFIG.forEach(sys => {
    const item = document.createElement('div');
    item.className = 'system-toggle' + (sys.visible ? ' active' : '');
    item.dataset.sysId = sys.id;
    item.innerHTML = `
      <span class="toggle-dot" style="background:${sys.color};color:${sys.color}"></span>
      <span class="toggle-name">${sys.name}</span>
      <span class="toggle-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </span>
    `;
    item.addEventListener('click', () => toggleSystem(sys.id));
    container.appendChild(item);
  });
}

function updateSystemList() {
  document.querySelectorAll('.system-toggle').forEach(item => {
    const sysId = item.dataset.sysId;
    const sys = SYSTEM_CONFIG.find(s => s.id === sysId);
    item.classList.toggle('active', sys.visible);
  });
}

// ===== 显示模式切换 =====
function setDisplayMode(mode) {
  currentMode = mode;
  allOrgans.forEach(mesh => {
    if (!mesh.material) return;
    if (mode === 'solid') {
      mesh.material.opacity = mesh.userData.baseOpacity;
      mesh.material.wireframe = false;
      mesh.material.transparent = mesh.userData.baseOpacity < 1.0;
      mesh.material.depthWrite = mesh.userData.baseOpacity >= 1.0;
    } else if (mode === 'transparent') {
      mesh.material.opacity = 0.4;
      mesh.material.wireframe = false;
      mesh.material.transparent = true;
      mesh.material.depthWrite = false;
    } else if (mode === 'xray') {
      mesh.material.opacity = 0.25;
      mesh.material.wireframe = true;
      mesh.material.transparent = true;
      mesh.material.depthWrite = false;
    }
  });
}

// ===== 剖切视图 =====
function setClipping(clip) {
  currentClip = clip;
  let planes = [];

  switch (clip) {
    case 'sagittal':
      planes = [clipPlanes.sagittal];
      break;
    case 'coronal':
      planes = [clipPlanes.coronal];
      break;
    case 'horizontal':
      planes = [clipPlanes.horizontal];
      break;
    case 'triple':
      planes = [clipPlanes.sagittal, clipPlanes.coronal, clipPlanes.horizontal];
      break;
  }

  allOrgans.forEach(mesh => {
    if (mesh.material) {
      mesh.material.clippingPlanes = planes.length > 0 ? planes : null;
    }
  });
}

// ===== 视角预设 =====
function setViewPreset(view) {
  const presets = {
    front: { pos: [0, 3.5, 14], target: [0, 3, 0] },
    side: { pos: [14, 3.5, 0], target: [0, 3, 0] },
    back: { pos: [0, 3.5, -14], target: [0, 3, 0] },
    top: { pos: [0, 16, 0.5], target: [0, 3, 0] },
  };
  const p = presets[view];
  if (!p) return;

  // 简单过渡
  const startPos = camera.position.clone();
  const startTarget = controls.target.clone();
  const endPos = new THREE.Vector3(...p.pos);
  const endTarget = new THREE.Vector3(...p.target);
  const duration = 800;
  const startTime = performance.now();

  function tween() {
    const elapsed = performance.now() - startTime;
    const t = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);

    camera.position.lerpVectors(startPos, endPos, eased);
    controls.target.lerpVectors(startTarget, endTarget, eased);
    controls.update();

    if (t < 1) requestAnimationFrame(tween);
  }
  tween();
}

// ===== 搜索定位 =====
function searchOrgan(query) {
  if (!query.trim()) return;
  const q = query.trim().toLowerCase();
  for (const [id, data] of Object.entries(ORGAN_DATA)) {
    if (data.name.includes(query.trim()) || data.en.toLowerCase().includes(q)) {
      // 找到匹配器官
      const mesh = allOrgans.find(m => m.userData.organId === id);
      if (mesh) {
        // 确保所在系统可见
        const sysId = getSystemOfOrgan(mesh);
        if (sysId && !systemGroups[sysId].visible) {
          toggleSystem(sysId);
        }
        selectOrgan(mesh);
        // 相机聚焦
        const worldPos = new THREE.Vector3();
        mesh.getWorldPosition(worldPos);
        const dir = camera.position.clone().sub(controls.target).normalize();
        camera.position.copy(worldPos).add(dir.multiplyScalar(5));
        controls.target.copy(worldPos);
        controls.update();
        return;
      }
    }
  }
}

// ===== 标签切换 =====
function toggleLabels() {
  showLabels = !showLabels;
  labelSprites.forEach(s => s.visible = showLabels);
  document.getElementById('labelBtn').classList.toggle('active', showLabels);
}

// ===== 动画循环 =====
function animate() {
  requestAnimationFrame(animate);

  const dt = clock.getDelta();

  // 入场动画
  updateEntryAnim();

  // 自动旋转
  if (isSpinning && entryProgress >= 1) {
    humanGroup.rotation.y += dt * 0.15;
  }

  // 背景着色器
  scene.children.forEach(c => {
    if (c.userData.shader) {
      c.userData.shader.uniforms.time.value += dt;
    }
  });

  // 标签跟随
  if (showLabels) {
    labelSprites.forEach(sprite => {
      sprite.lookAt(camera.position);
    });
  }

  controls.update();
  renderer.render(scene, camera);
}

// ===== 窗口大小 =====
function onResize() {
  const container = document.getElementById('canvas-container');
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}

// ===== 事件绑定 =====
window.addEventListener('resize', onResize);

document.addEventListener('DOMContentLoaded', () => {
  init();
  buildSystemList();

  // 画布交互
  const canvas = renderer.domElement;
  canvas.style.cursor = 'grab';
  canvas.addEventListener('click', onCanvasClick);
  canvas.addEventListener('mousemove', onCanvasMove);
  canvas.addEventListener('mousedown', () => { canvas.style.cursor = 'grabbing'; });
  canvas.addEventListener('mouseup', () => { canvas.style.cursor = hoveredOrgan ? 'pointer' : 'grab'; });

  // 触屏支持
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((touch.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(allOrgans, false);
      if (intersects.length > 0) {
        for (const hit of intersects) {
          const organ = hit.object;
          let parentGroup = organ.parent;
          while (parentGroup && parentGroup.parent !== humanGroup) {
            parentGroup = parentGroup.parent;
          }
          if (parentGroup && parentGroup.visible) {
            selectOrgan(organ);
            return;
          }
        }
      }
      deselectOrgan();
    }
  });

  // 自动旋转
  document.getElementById('spinBtn').addEventListener('click', (e) => {
    isSpinning = !isSpinning;
    e.currentTarget.classList.toggle('active', isSpinning);
  });

  // 重置视角
  document.getElementById('resetBtn').addEventListener('click', () => {
    humanGroup.rotation.y = 0;
    setViewPreset('front');
    deselectOrgan();
  });

  // 标签
  document.getElementById('labelBtn').addEventListener('click', (e) => {
    toggleLabels();
  });

  // 全屏
  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });

  // 关闭信息面板
  document.getElementById('organInfoClose').addEventListener('click', deselectOrgan);

  // 显示模式
  document.querySelectorAll('#modeGroup .mini-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#modeGroup .mini-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setDisplayMode(btn.dataset.mode);
    });
  });

  // 剖切视图
  document.querySelectorAll('#clipGroup .mini-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#clipGroup .mini-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setClipping(btn.dataset.clip);
    });
  });

  // 视角预设
  document.querySelectorAll('#viewGroup .mini-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#viewGroup .mini-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setViewPreset(btn.dataset.view);
    });
  });

  // 搜索
  const searchInput = document.getElementById('organSearch');
  let searchTimer;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      if (e.target.value.trim().length >= 1) {
        searchOrgan(e.target.value);
      }
    }, 400);
  });

  // 导航栏滚动
  window.addEventListener('scroll', () => {
    document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 10);
  });

  // 键盘快捷键
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') deselectOrgan();
    if (e.key === ' ') {
      e.preventDefault();
      isSpinning = !isSpinning;
      document.getElementById('spinBtn').classList.toggle('active', isSpinning);
    }
  });
});
</script>
