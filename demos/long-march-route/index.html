<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>红军长征路线图 · 景礴</title>
<link rel="stylesheet" href="/assets/css/design-system.css" />
<link rel="stylesheet" href="/assets/css/demo-framework.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&family=ZCOOL+XiaoWei&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   红军长征路线图 — 专属样式
   革命史诗 × 时空叙事 × 黄土暖调
   ============================================================ */

:root {
  /* 长征配色 */
  --lm-red: #8B0000;
  --lm-red-bright: #D32F2F;
  --lm-red-dark: #6B0000;
  --lm-gray: #555555;
  --lm-paper: #EDE4D3;
  --lm-paper-light: #F5EFE2;
  --lm-paper-dark: #E0D5C0;
  --lm-text: #2A2520;
  --lm-text-muted: #7A7066;
  --lm-border: #D4C9B5;
  --lm-gold: #C9982B;
  --lm-gold-soft: rgba(201, 152, 43, 0.15);
  --lm-river: #1A5276;
  --lm-snow: #8BA8B9;
  --lm-grass: #556B2F;

  /* 字体 */
  --lm-font-cal: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
  --lm-font-serif: 'Noto Serif SC', 'Source Han Serif SC', Georgia, serif;
  --lm-font-sans: 'Noto Sans SC', -apple-system, sans-serif;
  --lm-font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}

* { box-sizing: border-box; }

body {
  font-family: var(--lm-font-sans);
  background: var(--lm-paper);
  color: var(--lm-text);
  margin: 0;
  padding: 0;
  overflow: hidden;
}

/* ---------- 牛皮纸纹理 ---------- */
.paper-texture {
  background-color: var(--lm-paper);
  background-image:
    radial-gradient(circle at 20% 60%, rgba(139, 0, 0, 0.02) 0%, transparent 50%),
    radial-gradient(circle at 80% 30%, rgba(201, 152, 43, 0.025) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
}

/* ---------- 入场动画 ---------- */
.lm-entry {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--lm-paper);
  transition: opacity 1.2s ease;
}
.lm-entry.hidden { opacity: 0; pointer-events: none; }

.lm-entry-star {
  position: absolute;
  width: 80px;
  height: 80px;
  opacity: 0;
  animation: lm-star-appear 1.5s ease forwards;
}
.lm-entry-star svg { width: 100%; height: 100%; }
@keyframes lm-star-appear {
  0% { opacity: 0; transform: scale(0.2) rotate(-180deg); filter: blur(20px); }
  60% { opacity: 1; transform: scale(1.15) rotate(0deg); filter: blur(0); }
  100% { opacity: 0.9; transform: scale(1) rotate(0deg); }
}

.lm-entry-pulse {
  position: absolute;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 2px solid var(--lm-red-bright);
  opacity: 0;
  animation: lm-pulse 2s ease-out 1s infinite;
}
@keyframes lm-pulse {
  0% { opacity: 0.5; transform: scale(0.3); }
  100% { opacity: 0; transform: scale(1.5); }
}

.lm-entry-text {
  position: relative;
  z-index: 1;
  text-align: center;
  margin-top: 130px;
  opacity: 0;
  animation: lm-text-fade 1.5s ease 1s forwards;
}
@keyframes lm-text-fade {
  0% { opacity: 0; transform: translateY(20px); }
  100% { opacity: 1; transform: translateY(0); }
}
.lm-entry-title {
  font-family: var(--lm-font-cal);
  font-size: clamp(30px, 4.5vw, 44px);
  color: var(--lm-red);
  letter-spacing: 0.2em;
  line-height: 1.4;
}
.lm-entry-sub {
  font-family: var(--lm-font-serif);
  font-size: 14px;
  color: var(--lm-text-muted);
  margin-top: 12px;
  letter-spacing: 0.15em;
}

/* ---------- 导航栏 ---------- */
.demo-navbar {
  background-color: rgba(237, 228, 211, 0.88) !important;
  border-bottom: 1px solid var(--lm-border) !important;
}
.demo-navbar.scrolled {
  background-color: rgba(237, 228, 211, 0.95) !important;
}
.demo-nav-logo { font-family: var(--lm-font-serif); }

/* ---------- 主体布局 ---------- */
.framework-narrative {
  background: var(--lm-paper) !important;
  background-image:
    radial-gradient(circle at 20% 60%, rgba(139, 0, 0, 0.02) 0%, transparent 50%),
    radial-gradient(circle at 80% 30%, rgba(201, 152, 43, 0.025) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E") !important;
}

.framework-narrative .narrative-main {
  grid-template-columns: 68% 32% !important;
}

/* ---------- 地图区域 ---------- */
.narrative-map-area {
  background: var(--lm-paper-light) !important;
  border-right: 1px solid var(--lm-border) !important;
  position: relative;
  overflow: hidden;
}

#map {
  width: 100%;
  height: 100%;
  background: var(--lm-paper);
  z-index: 1;
}

/* Leaflet 底图暖色滤镜 */
.leaflet-tile-pane {
  filter: sepia(0.35) brightness(1.06) contrast(0.9) saturate(0.55) hue-rotate(-5deg);
}

.leaflet-container {
  background: var(--lm-paper) !important;
  font-family: var(--lm-font-sans) !important;
}

.leaflet-control-zoom {
  border: 1px solid var(--lm-border) !important;
  border-radius: 6px !important;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(42, 37, 32, 0.1) !important;
}
.leaflet-control-zoom a {
  background: rgba(245, 239, 226, 0.92) !important;
  color: var(--lm-text) !important;
  border-bottom: 1px solid var(--lm-border) !important;
  font-family: var(--lm-font-serif) !important;
}
.leaflet-control-zoom a:hover {
  background: var(--lm-paper-dark) !important;
  color: var(--lm-red) !important;
}

.leaflet-control-attribution {
  background: rgba(237, 228, 211, 0.7) !important;
  color: var(--lm-text-muted) !important;
  font-size: 10px !important;
}
.leaflet-control-attribution a {
  color: var(--lm-gold) !important;
}

/* ---------- 地图标记点 ---------- */
.lm-marker-wrapper {
  background: transparent !important;
  border: none !important;
}

.lm-marker {
  position: relative;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.lm-marker-icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
.lm-marker-icon svg {
  width: 100%;
  height: 100%;
}

.lm-marker.future .lm-marker-icon {
  opacity: 0.35;
  transform: scale(0.75);
  color: var(--lm-border);
}

.lm-marker.past .lm-marker-icon {
  opacity: 0.75;
  transform: scale(0.9);
  color: var(--lm-red);
}

.lm-marker.active .lm-marker-icon {
  opacity: 1;
  transform: scale(1.25);
  color: var(--lm-red-bright);
  filter: drop-shadow(0 2px 8px rgba(139, 0, 0, 0.4));
}

.lm-marker.active::before {
  content: '';
  position: absolute;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px solid var(--lm-red-bright);
  opacity: 0;
  animation: lm-marker-pulse 2s ease-out infinite;
}
@keyframes lm-marker-pulse {
  0% { opacity: 0.6; transform: scale(0.5); }
  100% { opacity: 0; transform: scale(2); }
}

.lm-marker-label {
  position: absolute;
  top: 26px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-family: var(--lm-font-serif);
  font-size: 11px;
  font-weight: 600;
  color: var(--lm-text);
  background: rgba(237, 228, 211, 0.92);
  padding: 2px 8px;
  border-radius: 3px;
  border: 1px solid var(--lm-border);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.lm-marker.active .lm-marker-label,
.lm-marker.past .lm-marker-label {
  opacity: 1;
}
.lm-marker.active .lm-marker-label {
  color: #fff;
  background: var(--lm-red);
  border-color: var(--lm-red-dark);
  font-weight: 700;
}

/* ---------- 地图装饰角花 ---------- */
.lm-corner-deco {
  position: absolute;
  z-index: 5;
  pointer-events: none;
  opacity: 0.2;
}
.lm-corner-deco svg { display: block; }
.lm-corner-tl { top: 80px; left: 16px; }
.lm-corner-br { bottom: 16px; right: 16px; transform: rotate(180deg); }

/* ---------- 地图标题水印 ---------- */
.lm-map-title {
  position: absolute;
  top: 80px;
  right: 20px;
  z-index: 10;
  text-align: right;
  pointer-events: none;
  opacity: 0.12;
}
.lm-map-title-main {
  font-family: var(--lm-font-cal);
  font-size: 28px;
  color: var(--lm-red);
  letter-spacing: 0.15em;
  line-height: 1.3;
}
.lm-map-title-sub {
  font-family: var(--lm-font-serif);
  font-size: 12px;
  color: var(--lm-text-muted);
  margin-top: 4px;
  letter-spacing: 0.1em;
}

/* ---------- 地图图例 ---------- */
.lm-legend {
  position: absolute;
  bottom: 24px;
  right: 20px;
  z-index: 20;
  background: rgba(245, 239, 226, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--lm-border);
  border-radius: 8px;
  padding: 12px 16px;
  box-shadow: 0 4px 16px rgba(42, 37, 32, 0.08);
}
.lm-legend-title {
  font-family: var(--lm-font-serif);
  font-size: 11px;
  font-weight: 700;
  color: var(--lm-text-muted);
  margin-bottom: 8px;
  letter-spacing: 0.1em;
}
.lm-legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--lm-text);
  margin-bottom: 4px;
}
.lm-legend-item:last-child { margin-bottom: 0; }
.lm-legend-line {
  width: 22px;
  height: 3px;
  border-radius: 2px;
}
.lm-legend-star {
  width: 14px;
  height: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lm-legend-star svg { width: 100%; height: 100%; }

/* ---------- 信息卡片 ---------- */
.narrative-info-card {
  position: absolute;
  bottom: 24px;
  left: 24px;
  z-index: 20;
  max-width: 400px;
  padding: 0;
  background: rgba(255, 255, 255, 0.96) !important;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--lm-border) !important;
  border-radius: 10px !important;
  box-shadow: 0 12px 40px rgba(42, 37, 32, 0.12) !important;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.lm-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--lm-border);
  background: linear-gradient(180deg, rgba(237, 228, 211, 0.5), transparent);
}

.lm-card-date-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.narrative-info-year {
  font-family: var(--lm-font-serif) !important;
  font-size: 24px !important;
  font-weight: 700 !important;
  color: var(--lm-red) !important;
  line-height: 1 !important;
  margin: 0 !important;
  letter-spacing: 0.02em;
}

.lm-card-phase {
  font-family: var(--lm-font-sans);
  font-size: 11px;
  font-weight: 500;
  color: var(--lm-gold);
  background: var(--lm-gold-soft);
  padding: 3px 10px;
  border-radius: 999px;
  white-space: nowrap;
}

.lm-card-type-badge {
  width: 36px;
  height: 36px;
  border-radius: 6px;
  background: var(--lm-red);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: #fff;
  box-shadow: 0 2px 8px rgba(139, 0, 0, 0.25);
}
.lm-card-type-badge svg { width: 20px; height: 20px; }

.lm-card-body {
  padding: 14px 22px 16px;
}

.lm-card-place {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--lm-font-sans);
  font-size: 12px;
  color: var(--lm-text-muted);
  margin-bottom: 6px;
}
.lm-card-place svg { width: 12px; height: 12px; flex-shrink: 0; }

.narrative-info-title {
  font-family: var(--lm-font-serif) !important;
  font-size: 18px !important;
  font-weight: 700 !important;
  color: var(--lm-text) !important;
  margin-bottom: 8px !important;
  line-height: 1.3;
}

.narrative-info-desc {
  font-size: 13px !important;
  line-height: 1.7 !important;
  color: var(--lm-text-muted) !important;
}

.lm-card-quote {
  margin-top: 12px;
  padding: 10px 14px;
  border-left: 3px solid var(--lm-red);
  background: rgba(139, 0, 0, 0.03);
  border-radius: 0 6px 6px 0;
}
.lm-card-quote-text {
  font-family: var(--lm-font-cal);
  font-size: 15px;
  line-height: 1.6;
  color: var(--lm-red-dark);
  letter-spacing: 0.05em;
}
.lm-card-quote-source {
  font-family: var(--lm-font-sans);
  font-size: 10px;
  color: var(--lm-text-muted);
  margin-top: 4px;
}

.lm-card-stats {
  display: flex;
  gap: 20px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--lm-border);
}
.lm-stat-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.lm-stat-label {
  font-size: 10px;
  color: var(--lm-text-muted);
  letter-spacing: 0.1em;
}
.lm-stat-value {
  font-family: var(--lm-font-mono);
  font-size: 16px;
  font-weight: 600;
  color: var(--lm-red);
}
.lm-stat-trend {
  font-size: 10px;
  color: var(--lm-text-muted);
}

/* ---------- 时间轴面板 ---------- */
.narrative-timeline-panel {
  background: rgba(255, 255, 255, 0.55) !important;
}

.narrative-timeline-header {
  padding: 20px 24px 16px !important;
  border-bottom: 1px solid var(--lm-border) !important;
  background: linear-gradient(180deg, rgba(237, 228, 211, 0.5), transparent);
}

.narrative-timeline-title {
  font-family: var(--lm-font-serif) !important;
  font-size: 20px !important;
  font-weight: 700 !important;
  color: var(--lm-red) !important;
}

.narrative-timeline-subtitle {
  font-family: var(--lm-font-serif) !important;
  font-size: 12px !important;
  color: var(--lm-text-muted) !important;
  margin-top: 4px !important;
  font-style: italic;
}

.lm-phase-bar {
  display: flex;
  gap: 4px;
  margin-top: 12px;
}
.lm-phase-segment {
  height: 5px;
  border-radius: 3px;
  background: var(--lm-border);
  transition: all 0.3s ease;
  cursor: pointer;
  position: relative;
}
.lm-phase-segment.active {
  background: var(--lm-red-bright);
  box-shadow: 0 0 0 2px rgba(211, 47, 47, 0.15);
}
.lm-phase-segment.past {
  background: var(--lm-red);
  opacity: 0.4;
}

.lm-phase-labels {
  display: flex;
  gap: 4px;
  margin-top: 4px;
}
.lm-phase-label {
  font-size: 9px;
  color: var(--lm-text-muted);
  text-align: center;
  transition: color 0.3s ease;
}
.lm-phase-label.active {
  color: var(--lm-red);
  font-weight: 600;
}

/* ---------- 时间轴列表 ---------- */
.narrative-timeline-list {
  padding: 16px 20px !important;
}

.narrative-timeline-list::-webkit-scrollbar { width: 4px; }
.narrative-timeline-list::-webkit-scrollbar-track { background: transparent; }
.narrative-timeline-list::-webkit-scrollbar-thumb {
  background: var(--lm-border);
  border-radius: 2px;
}
.narrative-timeline-list::-webkit-scrollbar-thumb:hover {
  background: var(--lm-paper-dark);
}

.narrative-timeline-list::before {
  left: 29px !important;
  top: 16px !important;
  bottom: 16px !important;
  width: 2px !important;
  background: var(--lm-border) !important;
}

.timeline-event {
  padding: 8px 0 !important;
  gap: 14px !important;
  cursor: pointer;
  transition: all 0.2s ease;
}

.timeline-event-dot {
  width: 12px !important;
  height: 12px !important;
  margin-left: 14px !important;
  margin-top: 3px !important;
  border: 2px solid var(--lm-border) !important;
  background: #fff !important;
  border-radius: 50% !important;
  transition: all 0.3s ease !important;
}

.timeline-event.active .timeline-event-dot {
  background: var(--lm-red-bright) !important;
  border-color: var(--lm-red-bright) !important;
  box-shadow: 0 0 0 4px rgba(211, 47, 47, 0.18) !important;
  transform: scale(1.15);
}

.timeline-event.past .timeline-event-dot {
  background: var(--lm-red) !important;
  border-color: var(--lm-red) !important;
  opacity: 0.5;
}

.timeline-event-year {
  font-family: var(--lm-font-mono) !important;
  font-size: 11px !important;
  color: var(--lm-text-muted) !important;
}

.timeline-event.active .timeline-event-year {
  color: var(--lm-red) !important;
}

.timeline-event-title {
  font-family: var(--lm-font-serif) !important;
  font-size: 14px !important;
  font-weight: 600 !important;
  color: var(--lm-text) !important;
}

.timeline-event.active .timeline-event-title {
  color: var(--lm-red) !important;
}

.timeline-event-desc {
  font-size: 11px !important;
  color: var(--lm-text-muted) !important;
  line-height: 1.5 !important;
}

.timeline-event.active .timeline-event-desc {
  max-height: 80px !important;
}

.lm-event-place {
  font-family: var(--lm-font-sans);
  font-size: 10px;
  color: var(--lm-gold);
  margin-top: 2px;
}

.lm-event-type-icon {
  display: inline-flex;
  width: 14px;
  height: 14px;
  vertical-align: middle;
  margin-right: 4px;
}
.lm-event-type-icon svg { width: 100%; height: 100%; }
.lm-event-type-icon svg path,
.lm-event-type-icon svg polygon {
  fill: currentColor;
}

/* ---------- 底部播放控件 ---------- */
.narrative-timeline-footer {
  padding: 14px 20px !important;
  border-top: 1px solid var(--lm-border) !important;
  background: rgba(237, 228, 211, 0.4);
}

.narrative-play-btn {
  background: var(--lm-red) !important;
  border-radius: 6px !important;
  padding: 8px 16px !important;
  color: #fff !important;
  border: none !important;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--lm-font-sans);
  font-size: 13px;
  font-weight: 500;
  transition: background 0.2s ease;
}
.narrative-play-btn:hover {
  background: var(--lm-red-dark) !important;
}

.narrative-progress {
  background: var(--lm-border) !important;
}

.narrative-progress-bar {
  background: var(--lm-red-bright) !important;
  transition: width 0.5s ease;
}

.demo-tech-tag {
  background: rgba(201, 152, 43, 0.1) !important;
  color: var(--lm-gold) !important;
  border-color: var(--lm-border) !important;
}

/* ---------- 响应式 ---------- */
@media (max-width: 1024px) {
  .framework-narrative .narrative-main {
    grid-template-columns: 1fr !important;
    grid-template-rows: 58% 42% !important;
  }
  .narrative-map-area {
    border-right: none !important;
    border-bottom: 1px solid var(--lm-border) !important;
  }
  .narrative-info-card {
    max-width: 320px;
    bottom: 16px;
    left: 16px;
  }
  .lm-legend { display: none; }
  .lm-map-title { font-size: 20px; }
}

@media (max-width: 768px) {
  .narrative-info-card {
    left: 12px !important;
    right: 12px !important;
    max-width: none !important;
    bottom: 12px !important;
  }

// ====== 地形路段颜色 ======
const TERRAIN_COLORS = {
  normal: '#D32F2F',
  river:  '#1A5276',
  snow:   '#8BA8B9',
  grass:  '#556B2F',
  gold:   '#C9982B'
};

function getSegmentTerrain(fromEventIdx) {
  if (fromEventIdx === 3) return 'river';   // 四渡赤水→金沙江
  if (fromEventIdx === 5) return 'river';   // 安顺场→泸定桥
  if (fromEventIdx === 6) return 'snow';    // 泸定桥→夹金山
  if (fromEventIdx === 7) return 'grass';   // 夹金山→草地
  if (fromEventIdx === 10) return 'gold';   // 吴起镇→会宁
  return 'normal';
}

// ====== 状态 ======
let currentEvent = 0;
let isPlaying = false;
let playTimer = null;
let map, markers = [], routeLines = [], fullRouteLine, routeArrow;
let isFlying = false;

// ====== 初始化地图 ======
function initMap() {
  map = L.map('map', {
    zoomControl: true,
    attributionControl: true,
    minZoom: 4,
    maxZoom: 9,
    zoomSnap: 0.5,
    fadeAnimation: true,
    zoomAnimation: true,
    scrollWheelZoom: true
  });

  // 高德地图底图（国产瓦片，中文标注，加载快）
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
    attribution: '© 高德地图',
    subdomains: ['1', '2', '3', '4'],
    maxZoom: 18
  }).addTo(map);

  // 适应所有事件边界
  const bounds = L.latLngBounds(events.map(e => [e.lat, e.lng]));
  map.fitBounds(bounds, { padding: [50, 50] });

  // 全路径（淡色虚线背景）
  fullRouteLine = L.polyline(routePath, {
    color: '#8B0000',
    weight: 2,
    opacity: 0.12,
    dashArray: '4 8',
    lineCap: 'round'
  }).addTo(map);

  // 创建标记点
  events.forEach((e, i) => {
    const iconHtml = `<div class="lm-marker future" data-idx="${i}">
      <div class="lm-marker-icon">${ICONS[e.type] || ICONS.battle}</div>
      <div class="lm-marker-label">${e.title}</div>
    </div>`;

    const icon = L.divIcon({
      className: 'lm-marker-wrapper',
      html: iconHtml,
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });

    const marker = L.marker([e.lat, e.lng], { icon }).addTo(map);
    marker.on('click', () => selectEvent(i));
    markers.push(marker);
  });

  map.on('movestart', () => { isFlying = true; });
  map.on('moveend', () => { isFlying = false; });
}

// ====== 清除已走路线 ======
function clearRouteLines() {
  routeLines.forEach(l => map.removeLayer(l));
  routeLines = [];
}

// ====== 更新已走路线（分段彩色） ======
function updateRoute() {
  clearRouteLines();

  // 绘制从事件0到当前事件的所有路段
  for (let seg = 0; seg < currentEvent; seg++) {
    const startIdx = events[seg].routeIdx;
    const endIdx = events[seg + 1].routeIdx;
    const segCoords = routePath.slice(startIdx, endIdx + 1);
    const terrain = getSegmentTerrain(seg);
    const color = TERRAIN_COLORS[terrain];
    const isLastSegment = (seg === currentEvent - 1);

    const line = L.polyline(segCoords, {
      color: color,
      weight: isLastSegment ? 4.5 : 3.5,
      opacity: isLastSegment ? 0.9 : 0.6,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);
    routeLines.push(line);

    // 最新路段的"绘制"动画
    if (isLastSegment && line._path) {
      const pathLen = line._path.getTotalLength ? line._path.getTotalLength() : 0;
      if (pathLen > 0) {
        line._path.style.strokeDasharray = pathLen;
        line._path.style.strokeDashoffset = pathLen;
        gsap.to(line._path, {
          strokeDashoffset: 0,
          duration: 0.8,
          ease: 'power2.out'
        });
      }
    }
  }
}

// ====== 更新标记状态 ======
function updateMarkers() {
  markers.forEach((marker, i) => {
    const el = marker.getElement();
    if (!el) return;
    const inner = el.querySelector('.lm-marker');
    if (!inner) return;

    inner.classList.remove('active', 'past', 'future');
    if (i === currentEvent) {
      inner.classList.add('active');
    } else if (i < currentEvent) {
      inner.classList.add('past');
    } else {
      inner.classList.add('future');
    }
  });
}

// ====== 构建时间轴 ======
function buildTimeline() {
  const list = document.getElementById('timelineList');
  list.innerHTML = events.map((e, i) => `
    <div class="timeline-event ${i === currentEvent ? 'active' : ''}" data-idx="${i}">
      <div class="timeline-event-dot"></div>
      <div class="timeline-event-content">
        <div class="timeline-event-year">${e.dateLabel}</div>
        <div class="timeline-event-title">${e.title}</div>
        <div class="lm-event-place">${e.place}</div>
        <div class="timeline-event-desc">${e.desc.substring(0, 55)}…</div>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.timeline-event').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      selectEvent(idx);
    });
  });
}

// ====== 构建阶段进度条 ======
function buildPhaseBar() {
  const bar = document.getElementById('phaseBar');
  const labelsEl = document.getElementById('phaseLabels');

  bar.innerHTML = phases.map((p, i) => {
    const count = events.filter(e => e.phaseIdx === i).length;
    return `<div class="lm-phase-segment" data-phase="${i}" style="flex:${count}" title="${p.name}"></div>`;
  }).join('');

  labelsEl.innerHTML = phases.map((p, i) => {
    const count = events.filter(e => e.phaseIdx === i).length;
    return `<div class="lm-phase-label" data-phase="${i}" style="flex:${count}">${p.name}</div>`;
  }).join('');
}

// ====== 更新阶段进度条 ======
function updatePhaseBar() {
  const currentPhase = events[currentEvent].phaseIdx;
  document.querySelectorAll('.lm-phase-segment').forEach((el, i) => {
    el.classList.remove('active', 'past');
    if (i === currentPhase) el.classList.add('active');
    else if (i < currentPhase) el.classList.add('past');
  });
  document.querySelectorAll('.lm-phase-label').forEach((el, i) => {
    el.classList.toggle('active', i === currentPhase);
  });
}

// ====== 选中事件 ======
function selectEvent(idx) {
  currentEvent = idx;
  const e = events[idx];

  // 卡片切换动画
  const card = document.getElementById('infoCard');
  gsap.fromTo(card,
    { opacity: 0.6, y: 8 },
    { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }
  );

  // 更新信息卡片
  document.getElementById('infoYear').textContent = e.date;
  document.getElementById('infoPhase').textContent = e.phase;
  document.getElementById('infoPlace').textContent = e.place;
  document.getElementById('infoModernPlace').textContent = '· ' + e.modernPlace;
  document.getElementById('infoTitle').textContent = e.title;
  document.getElementById('infoDesc').textContent = e.desc;
  document.getElementById('infoTypeBadge').innerHTML = ICONS[e.type] || ICONS.battle;

  // 兵力与里程
  document.getElementById('infoTroops').textContent = e.troopsLabel;
  document.getElementById('infoTroopsTrend').textContent = e.troopsTrend;
  document.getElementById('infoMileage').textContent = e.mileage > 0 ? e.mileage.toLocaleString() + ' 里' : '0 里';

  // 诗词展示
  const quoteEl = document.getElementById('infoQuote');
  if (e.quote) {
    quoteEl.style.display = 'block';
    document.getElementById('infoQuoteText').textContent = e.quote.text;
    document.getElementById('infoQuoteSource').textContent = e.quote.source;
    gsap.fromTo(quoteEl,
      { opacity: 0, x: -10 },
      { opacity: 1, x: 0, duration: 0.5, delay: 0.2, ease: 'power2.out' }
    );
  } else {
    quoteEl.style.display = 'none';
  }

  // 更新时间轴高亮
  document.querySelectorAll('.timeline-event').forEach((el, i) => {
    el.classList.remove('active', 'past');
    if (i === idx) el.classList.add('active');
    else if (i < idx) el.classList.add('past');
  });

  // 滚动到当前事件
  const activeEl = document.querySelector('.timeline-event.active');
  if (activeEl) {
    activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // 更新进度条
  const progress = ((idx + 1) / events.length) * 100;
  document.getElementById('progressBar').style.width = `${progress}%`;
  document.getElementById('eventCounter').textContent = `${idx + 1} / ${events.length}`;

  // 更新地图
  updateMarkers();
  updateRoute();
  updatePhaseBar();

  // 飞到当前位置
  if (!isFlying) {
    const zoom = Math.max(map.getZoom(), 5);
    map.flyTo([e.lat, e.lng], zoom, {
      duration: 1.2,
      easeLinearity: 0.25
    });
  }
}

// ====== 播放控制 ======
function togglePlay() {
  isPlaying = !isPlaying;
  const icon = document.getElementById('playIcon');
  const label = document.getElementById('playLabel');

  if (isPlaying) {
    icon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
    label.textContent = '暂停';

    playTimer = setInterval(() => {
      let next = currentEvent + 1;
      if (next >= events.length) {
        next = 0;
      }
      selectEvent(next);
    }, 5000);
  } else {
    icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    label.textContent = '播放';
    clearInterval(playTimer);
  }
}

// ====== 键盘导航 ======
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    if (currentEvent > 0) selectEvent(currentEvent - 1);
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (currentEvent < events.length - 1) selectEvent(currentEvent + 1);
  } else if (e.key === ' ') {
    e.preventDefault();
    togglePlay();
  }
});

// ====== 导航栏滚动 ======
window.addEventListener('scroll', () => {
  document.getElementById('demoNavbar').classList.toggle('scrolled', window.scrollY > 10);
});

// ====== 初始化 ======
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  buildTimeline();
  buildPhaseBar();

  // 延迟选中第一个事件（等地图加载）
  setTimeout(() => {
    selectEvent(0);
  }, 300);

  // 播放按钮
  document.getElementById('playBtn').addEventListener('click', togglePlay);

  // 入场动画淡出
  setTimeout(() => {
    document.getElementById('entryOverlay').classList.add('hidden');
    setTimeout(() => {
      document.getElementById('entryOverlay').style.display = 'none';
    }, 1200);
  }, 2800);
});
