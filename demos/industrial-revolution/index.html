<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工业革命与城市化进程 · 景礴</title>
<link rel="stylesheet" href="/assets/css/design-system.css" />
<link rel="stylesheet" href="/assets/css/demo-framework.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://unpkg.com" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
/* ============================================================
   工业革命与城市化进程 — 专属样式
   工程蓝图 × 蒸汽钢铁 × 时空叙事
   ============================================================ */

:root {
  /* 工业配色 */
  --ir-steel: #4A4A4A;
  --ir-steel-dark: #2C2C2C;
  --ir-steel-light: #6B6B6B;
  --ir-rust: #8B4513;
  --ir-rust-light: #A0522D;
  --ir-brass: #B8860B;
  --ir-brass-light: #DAA520;
  --ir-blueprint: #E8ECF0;
  --ir-blueprint-dark: #D5DCE3;
  --ir-orange: #FF6B35;
  --ir-orange-soft: rgba(255, 107, 53, 0.15);
  --ir-paper: #F0F2F5;
  --ir-text: #2C2C2C;
  --ir-text-muted: #7A7A7A;
  --ir-border: #C5CCD3;
  --ir-white: rgba(255, 255, 255, 0.96);

  /* 字体 */
  --ir-font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', Georgia, 'Times New Roman', serif;
  --ir-font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
  --ir-font-mono: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--ir-font-sans);
  background: var(--ir-blueprint);
  color: var(--ir-text);
}

/* ---------- 蓝图网格背景 ---------- */
.blueprint-bg {
  background-color: var(--ir-blueprint);
  background-image:
    linear-gradient(rgba(74, 74, 74, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(74, 74, 74, 0.04) 1px, transparent 1px),
    linear-gradient(rgba(74, 74, 74, 0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(74, 74, 74, 0.07) 1px, transparent 1px);
  background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
}

/* ---------- 加载动画 ---------- */
.ir-loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--ir-blueprint);
  background-image:
    linear-gradient(rgba(74, 74, 74, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(74, 74, 74, 0.04) 1px, transparent 1px),
    linear-gradient(rgba(74, 74, 74, 0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(74, 74, 74, 0.07) 1px, transparent 1px);
  background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
  transition: opacity 0.8s ease;
}
.ir-loader.hidden { opacity: 0; pointer-events: none; }

.ir-gear-container {
  position: relative;
  width: 120px;
  height: 120px;
}

.ir-gear {
  position: absolute;
  fill: var(--ir-steel);
  opacity: 0.85;
}
.ir-gear-lg {
  width: 80px;
  height: 80px;
  top: 10px;
  left: 0;
  animation: ir-gear-spin 4s linear infinite;
}
.ir-gear-sm {
  width: 50px;
  height: 50px;
  top: 55px;
  left: 60px;
  fill: var(--ir-rust);
  opacity: 0.8;
  animation: ir-gear-spin 3s linear infinite reverse;
}

/* 蒸汽粒子 */
.ir-steam {
  position: absolute;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 80px;
  pointer-events: none;
}
.ir-steam-particle {
  position: absolute;
  bottom: 0;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: rgba(74, 74, 74, 0.08);
  filter: blur(4px);
  animation: ir-steam-rise 3s ease-out infinite;
}
.ir-steam-particle:nth-child(1) { left: 20%; animation-delay: 0s; }
.ir-steam-particle:nth-child(2) { left: 50%; animation-delay: 0.8s; }
.ir-steam-particle:nth-child(3) { left: 75%; animation-delay: 1.5s; }

@keyframes ir-steam-rise {
  0% { bottom: 0; opacity: 0; transform: scale(0.5) translateX(0); }
  20% { opacity: 0.6; }
  100% { bottom: 70px; opacity: 0; transform: scale(2) translateX(10px); }
}

@keyframes ir-gear-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.ir-loader-text {
  position: absolute;
  top: 150px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  white-space: nowrap;
}
.ir-loader-title {
  font-family: var(--ir-font-serif);
  font-size: 18px;
  font-weight: 700;
  color: var(--ir-steel);
  letter-spacing: 0.15em;
}
.ir-loader-sub {
  font-family: var(--ir-font-mono);
  font-size: 11px;
  color: var(--ir-text-muted);
  margin-top: 6px;
  letter-spacing: 0.1em;
}

/* ---------- 导航栏 ---------- */
.demo-navbar {
  background-color: rgba(232, 236, 240, 0.88) !important;
  border-bottom: 1px solid var(--ir-border) !important;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.demo-navbar.scrolled {
  background-color: rgba(232, 236, 240, 0.95) !important;
}
.demo-nav-logo { font-family: var(--ir-font-serif); }

/* ---------- 主体布局 ---------- */
.framework-narrative {
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding-top: 64px;
}

.ir-main {
  display: grid;
  grid-template-columns: 68% 32%;
  height: calc(100vh - 64px);
  overflow: hidden;
}

/* ---------- 地图区域 ---------- */
.ir-map-area {
  position: relative;
  background: var(--ir-blueprint);
  border-right: 1px solid var(--ir-border);
  overflow: hidden;
}

#map {
  width: 100%;
  height: 100%;
  background: var(--ir-blueprint);
  z-index: 1;
}

/* Leaflet 蓝图滤镜 */
.leaflet-tile-pane {
  filter: grayscale(0.6) brightness(1.05) contrast(0.92) saturate(0.3) hue-rotate(185deg);
}

.leaflet-container {
  background: var(--ir-blueprint) !important;
  font-family: var(--ir-font-sans) !important;
}

.leaflet-control-zoom {
  border: 1px solid var(--ir-border) !important;
  border-radius: 4px !important;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(44, 44, 44, 0.1) !important;
}
.leaflet-control-zoom a {
  background: var(--ir-white) !important;
  color: var(--ir-steel) !important;
  border-bottom: 1px solid var(--ir-border) !important;
  font-weight: 600;
}
.leaflet-control-zoom a:hover {
  background: var(--ir-blueprint-dark) !important;
  color: var(--ir-rust) !important;
}

.leaflet-control-attribution {
  background: rgba(232, 236, 240, 0.7) !important;
  color: var(--ir-text-muted) !important;
  font-size: 10px !important;
}
.leaflet-control-attribution a { color: var(--ir-rust) !important; }

/* ---------- 蓝图角标 ---------- */
.ir-blueprint-stamp {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 10;
  padding: 6px 14px;
  background: rgba(232, 236, 240, 0.85);
  border: 1px solid var(--ir-border);
  border-radius: 2px;
  font-family: var(--ir-font-mono);
  font-size: 10px;
  color: var(--ir-steel-light);
  letter-spacing: 0.1em;
  pointer-events: none;
}

/* ---------- 工业图标标记 ---------- */
.ir-marker-wrap {
  background: transparent !important;
  border: none !important;
}

.ir-marker {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.ir-marker-core {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--ir-border);
  border: 2px solid var(--ir-white);
  box-shadow: 0 1px 4px rgba(44, 44, 44, 0.2);
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.ir-marker.past .ir-marker-core {
  background: var(--ir-steel);
  opacity: 0.55;
}

.ir-marker.active .ir-marker-core {
  width: 18px;
  height: 18px;
  background: var(--ir-rust);
  border: 3px solid var(--ir-white);
  box-shadow: 0 0 0 5px rgba(139, 69, 19, 0.18), 0 2px 10px rgba(139, 69, 19, 0.35);
}

.ir-marker.active::before {
  content: '';
  position: absolute;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid var(--ir-rust);
  opacity: 0;
  animation: ir-pulse 2.2s ease-out infinite;
}

@keyframes ir-pulse {
  0% { opacity: 0.5; transform: scale(0.5); }
  100% { opacity: 0; transform: scale(2.2); }
}

/* 标记标签 */
.ir-marker-label {
  position: absolute;
  top: 22px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-family: var(--ir-font-serif);
  font-size: 11px;
  font-weight: 600;
  color: var(--ir-steel);
  background: var(--ir-white);
  padding: 3px 9px;
  border-radius: 2px;
  border: 1px solid var(--ir-border);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
  box-shadow: 0 2px 6px rgba(44, 44, 44, 0.08);
}
.ir-marker.past .ir-marker-label,
.ir-marker.active .ir-marker-label { opacity: 1; }
.ir-marker.active .ir-marker-label {
  color: var(--ir-rust);
  border-color: var(--ir-rust);
  font-weight: 700;
}

/* 工业图标（烟囱/齿轮/火车） */
.ir-marker-icon {
  position: absolute;
  top: -2px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.ir-marker.active .ir-marker-icon { opacity: 1; }

/* ---------- 信息卡片 ---------- */
.ir-info-card {
  position: absolute;
  bottom: 80px;
  left: 20px;
  z-index: 20;
  max-width: 400px;
  background: var(--ir-white);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--ir-border);
  border-radius: 6px;
  box-shadow: 0 12px 40px rgba(44, 44, 44, 0.12);
  overflow: hidden;
  transform: translateY(20px);
  opacity: 0;
  transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
}
.ir-info-card.visible {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}

.ir-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--ir-border);
  background: linear-gradient(180deg, rgba(232, 236, 240, 0.5), transparent);
}

.ir-card-year-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.ir-card-year {
  font-family: var(--ir-font-mono);
  font-size: 24px;
  font-weight: 600;
  color: var(--ir-rust);
  line-height: 1;
}

.ir-card-phase {
  font-family: var(--ir-font-sans);
  font-size: 11px;
  font-weight: 500;
  color: var(--ir-brass);
  background: rgba(184, 134, 11, 0.1);
  padding: 3px 10px;
  border-radius: 999px;
  white-space: nowrap;
}

.ir-card-seal {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: var(--ir-steel);
  border-radius: 2px;
}
.ir-card-seal svg { width: 18px; height: 18px; fill: var(--ir-brass-light); }

.ir-card-body { padding: 14px 20px 18px; }

.ir-card-title {
  font-family: var(--ir-font-serif);
  font-size: 17px;
  font-weight: 700;
  color: var(--ir-steel-dark);
  margin-bottom: 6px;
  line-height: 1.3;
}

.ir-card-location {
  font-family: var(--ir-font-mono);
  font-size: 11px;
  color: var(--ir-text-muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.ir-card-location::before {
  content: '◆';
  color: var(--ir-rust);
  font-size: 8px;
}

.ir-card-desc {
  font-size: 13px;
  line-height: 1.65;
  color: var(--ir-text);
}

/* ---------- 播放控制栏 ---------- */
.ir-playback {
  position: absolute;
  bottom: 20px;
  left: 20px;
  right: 20px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 18px;
  background: var(--ir-white);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--ir-border);
  border-radius: 6px;
  box-shadow: 0 8px 24px rgba(44, 44, 44, 0.08);
}

.ir-playback-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 4px;
  background: var(--ir-steel);
  color: #fff;
  cursor: pointer;
  transition: all 0.2s ease;
  flex-shrink: 0;
}
.ir-playback-btn:hover {
  background: var(--ir-rust);
  transform: scale(1.05);
}
.ir-playback-btn svg { width: 16px; height: 16px; fill: #fff; }

.ir-playback-btn.ir-btn-play { width: 42px; height: 42px; }

.ir-progress-track {
  flex: 1;
  height: 4px;
  background: var(--ir-blueprint-dark);
  border-radius: 2px;
  position: relative;
  cursor: pointer;
  overflow: hidden;
}
.ir-progress-fill {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  background: linear-gradient(90deg, var(--ir-rust), var(--ir-brass));
  border-radius: 2px;
  width: 0%;
  transition: width 0.5s ease;
}

.ir-progress-label {
  font-family: var(--ir-font-mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--ir-steel);
  white-space: nowrap;
  min-width: 90px;
  text-align: right;
}

/* ---------- 右侧时间轴面板 ---------- */
.ir-timeline-panel {
  background: var(--ir-paper);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.ir-timeline-panel::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(74, 74, 74, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(74, 74, 74, 0.025) 1px, transparent 1px);
  background-size: 20px 20px;
  pointer-events: none;
}

.ir-timeline-header {
  padding: 20px 22px 14px;
  border-bottom: 2px solid var(--ir-steel);
  position: relative;
  z-index: 1;
}

.ir-timeline-title {
  font-family: var(--ir-font-serif);
  font-size: 20px;
  font-weight: 700;
  color: var(--ir-steel-dark);
  display: flex;
  align-items: center;
  gap: 8px;
}
.ir-timeline-title svg { width: 22px; height: 22px; fill: var(--ir-rust); }

.ir-timeline-subtitle {
  font-family: var(--ir-font-mono);
  font-size: 11px;
  color: var(--ir-text-muted);
  margin-top: 4px;
  letter-spacing: 0.05em;
}

.ir-phase-tabs {
  display: flex;
  gap: 4px;
  margin-top: 12px;
}

.ir-phase-tab {
  flex: 1;
  padding: 6px 8px;
  font-size: 11px;
  font-weight: 500;
  text-align: center;
  background: transparent;
  border: 1px solid var(--ir-border);
  border-radius: 3px;
  color: var(--ir-text-muted);
  cursor: pointer;
  transition: all 0.25s ease;
  font-family: var(--ir-font-sans);
}
.ir-phase-tab:hover { border-color: var(--ir-steel-light); color: var(--ir-steel); }
.ir-phase-tab.active {
  background: var(--ir-steel);
  border-color: var(--ir-steel);
  color: #fff;
}

.ir-timeline-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px 0 20px;
  position: relative;
  z-index: 1;
}

.ir-timeline-scroll::-webkit-scrollbar { width: 5px; }
.ir-timeline-scroll::-webkit-scrollbar-track { background: transparent; }
.ir-timeline-scroll::-webkit-scrollbar-thumb {
  background: var(--ir-border);
  border-radius: 3px;
}
.ir-timeline-scroll::-webkit-scrollbar-thumb:hover { background: var(--ir-steel-light); }

/* 时间轴竖线 */
.ir-timeline-rail {
  position: absolute;
  left: 44px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--ir-border);
  z-index: 0;
}
.ir-timeline-rail-fill {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 0%;
  background: linear-gradient(180deg, var(--ir-rust), var(--ir-brass));
  transition: height 0.5s ease;
}

/* 事件项 */
.ir-event {
  display: flex;
  align-items: flex-start;
  padding: 10px 20px 10px 30px;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  border-left: 3px solid transparent;
}
.ir-event:hover {
  background: rgba(74, 74, 74, 0.03);
}
.ir-event.active {
  background: rgba(139, 69, 19, 0.06);
  border-left-color: var(--ir-rust);
}
.ir-event.past { opacity: 0.6; }
.ir-event.past .ir-event-dot { background: var(--ir-steel); }

.ir-event-dot-wrap {
  position: relative;
  width: 16px;
  height: 16px;
  margin-right: 14px;
  margin-top: 2px;
  flex-shrink: 0;
  z-index: 1;
}

.ir-event-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--ir-border);
  border: 2px solid var(--ir-paper);
  position: absolute;
  top: 2px;
  left: 2px;
  transition: all 0.3s ease;
  box-shadow: 0 0 0 0 transparent;
}

/* 阶段颜色指示器 */
.ir-event[data-phase="1"] .ir-event-dot { background: var(--ir-steel); }
.ir-event[data-phase="2"] .ir-event-dot { background: var(--ir-brass); }
.ir-event[data-phase="3"] .ir-event-dot { background: var(--ir-rust); }
.ir-event.past[data-phase="1"] .ir-event-dot { background: var(--ir-steel); opacity: 0.5; }
.ir-event.past[data-phase="2"] .ir-event-dot { background: var(--ir-brass); opacity: 0.5; }
.ir-event.past[data-phase="3"] .ir-event-dot { background: var(--ir-rust); opacity: 0.5; }

.ir-event.active .ir-event-dot {
  background: var(--ir-rust);
  border-color: var(--ir-paper);
  box-shadow: 0 0 0 4px rgba(139, 69, 19, 0.15);
  width: 14px;
  height: 14px;
  top: 1px;
  left: 1px;
}

.ir-event.active .ir-event-dot-wrap::after {
  content: '';
  position: absolute;
  top: -2px;
  left: -2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--ir-rust);
  opacity: 0;
  animation: ir-pulse 2s ease-out infinite;
}

.ir-event-content { flex: 1; min-width: 0; }

.ir-event-year {
  font-family: var(--ir-font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--ir-steel);
  line-height: 1.2;
}
.ir-event.active .ir-event-year { color: var(--ir-rust); }

.ir-event-title {
  font-family: var(--ir-font-serif);
  font-size: 13px;
  font-weight: 600;
  color: var(--ir-steel-dark);
  margin-top: 2px;
  line-height: 1.35;
}
.ir-event.active .ir-event-title { color: var(--ir-rust); }

.ir-event-location {
  font-family: var(--ir-font-mono);
  font-size: 10px;
  color: var(--ir-text-muted);
  margin-top: 2px;
}

/* ---------- 扩散路径动画样式 ---------- */
.ir-diffusion-path {
  stroke-dasharray: 8 6;
  animation: ir-dash-flow 2s linear infinite;
}
@keyframes ir-dash-flow {
  to { stroke-dashoffset: -28; }
}

/* ---------- 统计信息浮窗 ---------- */
.ir-stats-overlay {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 10;
  display: flex;
  gap: 8px;
}

.ir-stat-chip {
  padding: 8px 14px;
  background: var(--ir-white);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--ir-border);
  border-radius: 4px;
  text-align: center;
  min-width: 70px;
}

.ir-stat-value {
  font-family: var(--ir-font-mono);
  font-size: 18px;

// ============================================================
// 地图初始化
// ============================================================
const map = L.map('map', {
  center: [52, -5],
  zoom: 4,
  minZoom: 3,
  maxZoom: 7,
  zoomControl: true,
  scrollWheelZoom: true,
  attributionControl: true
});

// 高德地图底图（国产瓦片，中文标注）
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  attribution: '© 高德地图',
  subdomains: ['1', '2', '3', '4'],
  maxZoom: 18
}).addTo(map);

// ============================================================
// 状态管理
// ============================================================
let currentEventIndex = 0;
let isPlaying = false;
let playTimer = null;
let markers = [];
let diffusionLayers = [];
let railwayLayers = [];
let cityGrowthLayers = [];
let activeFilterPhase = 'all';

// ============================================================
// 创建标记
// ============================================================
function createMarkers() {
  EVENTS.forEach((evt, idx) => {
    const icon = L.divIcon({
      className: 'ir-marker-wrap',
      html: `<div class="ir-marker future" data-idx="${idx}">
               <div class="ir-marker-icon">${evt.icon || ''}</div>
               <div class="ir-marker-core"></div>
               <div class="ir-marker-label">${evt.location}</div>
             </div>`,
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    const marker = L.marker([evt.lat, evt.lng], { icon }).addTo(map);
    marker.on('click', () => goToEvent(idx));
    markers.push(marker);
  });
}

// ============================================================
// 更新标记状态
// ============================================================
function updateMarkers(activeIdx) {
  markers.forEach((marker, idx) => {
    const el = marker.getElement();
    if (!el) return;
    const inner = el.querySelector('.ir-marker');
    if (!inner) return;
    inner.classList.remove('active', 'past', 'future');
    if (idx === activeIdx) {
      inner.classList.add('active');
    } else if (idx < activeIdx) {
      inner.classList.add('past');
    } else {
      inner.classList.add('future');
    }
  });
}

// ============================================================
// 扩散路径动画
// ============================================================
function showDiffusion(evt) {
  clearDiffusion();
  if (!evt.diffusion) return;

  const from = evt.diffusion.from;
  const to = evt.diffusion.to;

  // 弧线扩散路径
  const latlngs = [from, to];
  const path = L.polyline(latlngs, {
    color: '#8B4513',
    weight: 2,
    opacity: 0.7,
    dashArray: '8 6',
    className: 'ir-diffusion-path'
  }).addTo(map);

  diffusionLayers.push(path);

  // 起点和终点波纹
  const fromRipple = L.circleMarker(from, {
    radius: 8,
    color: '#8B4513',
    fillColor: '#8B4513',
    fillOpacity: 0.1,
    weight: 1
  }).addTo(map);
  diffusionLayers.push(fromRipple);

  // 动画扩散波纹
  let rippleRadius = 8;
  const rippleInterval = setInterval(() => {
    rippleRadius += 3;
    if (rippleRadius > 30) {
      rippleRadius = 8;
    }
    fromRipple.setRadius(rippleRadius);
  }, 50);
  diffusionLayers.push({ _interval: rippleInterval, _isAnim: true });

  // 移动粒子
  let progress = 0;
  const particle = L.circleMarker(from, {
    radius: 4,
    color: '#B8860B',
    fillColor: '#DAA520',
    fillOpacity: 0.9,
    weight: 1
  }).addTo(map);
  diffusionLayers.push(particle);

  const particleInterval = setInterval(() => {
    progress += 0.02;
    if (progress >= 1) {
      progress = 0;
    }
    const lat = from[0] + (to[0] - from[0]) * progress;
    const lng = from[1] + (to[1] - from[1]) * progress;
    particle.setLatLng([lat, lng]);
  }, 30);
  diffusionLayers.push({ _interval: particleInterval, _isAnim: true });
}

function clearDiffusion() {
  diffusionLayers.forEach(layer => {
    if (layer._interval) {
      clearInterval(layer._interval);
    } else {
      map.removeLayer(layer);
    }
  });
  diffusionLayers = [];
}

// ============================================================
// 铁路线
// ============================================================
function showRailway(evt) {
  // 保留所有已触发事件的铁路
  clearRailways();

  EVENTS.forEach((e, idx) => {
    if (idx <= currentEventIndex && e.railway) {
      const line = L.polyline(e.railway, {
        color: '#2C2C2C',
        weight: 2.5,
        opacity: 0.6,
        lineCap: 'round'
      }).addTo(map);
      railwayLayers.push(line);
    }
  });
}

function clearRailways() {
  railwayLayers.forEach(layer => map.removeLayer(layer));
  railwayLayers = [];
}

// ============================================================
// 城市增长可视化
// ============================================================
function showCityGrowth(evt) {
  if (!evt.cityGrowth) return;

  const [y1800, v1800] = [1800, evt.cityGrowth[1800]];
  const [y1900, v1900] = [1900, evt.cityGrowth[1900]];

  // 当前事件年份对应的城市规模
  const ratio = (evt.year - y1800) / (y1900 - y1800);
  const currentSize = v1800 + (v1900 - v1800) * Math.min(1, ratio);

  const radius = Math.max(15, Math.min(60, currentSize / 12));

  const growthCircle = L.circle([evt.lat, evt.lng], {
    radius: radius * 1000,
    color: '#FF6B35',
    fillColor: '#FF6B35',
    fillOpacity: 0.1,
    weight: 1.5,
    dashArray: '4 4'
  }).addTo(map);
  cityGrowthLayers.push(growthCircle);

  // 标注人口
  const popLabel = L.marker([evt.lat, evt.lng], {
    icon: L.divIcon({
      className: 'ir-pop-label',
      html: `<div style="position:absolute; top:-40px; left:50%; transform:translateX(-50%); white-space:nowrap; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; color:#FF6B35; background:rgba(255,255,255,0.9); padding:2px 8px; border-radius:2px; border:1px solid #FF6B35; pointer-events:none;">≈${Math.round(currentSize)}万人口</div>`,
      iconSize: [0, 0]
    })
  }).addTo(map);
  cityGrowthLayers.push(popLabel);
}

function clearCityGrowth() {
  cityGrowthLayers.forEach(layer => map.removeLayer(layer));
  cityGrowthLayers = [];
}

// ============================================================
// 时间轴渲染
// ============================================================
function renderTimeline() {
  const scroll = document.getElementById('timelineScroll');
  // 保留竖线
  const rail = scroll.querySelector('.ir-timeline-rail');
  scroll.innerHTML = '';
  scroll.appendChild(rail);

  EVENTS.forEach((evt, idx) => {
    if (activeFilterPhase !== 'all' && evt.phase !== parseInt(activeFilterPhase)) return;

    const item = document.createElement('div');
    item.className = 'ir-event';
    item.dataset.idx = idx;
    item.dataset.phase = evt.phase;
    item.innerHTML = `
      <div class="ir-event-dot-wrap">
        <div class="ir-event-dot"></div>
      </div>
      <div class="ir-event-content">
        <div class="ir-event-year">${evt.year}年</div>
        <div class="ir-event-title">${evt.title}</div>
        <div class="ir-event-location">${evt.location} · ${evt.region}</div>
      </div>
    `;
    item.addEventListener('click', () => goToEvent(idx));
    scroll.appendChild(item);
  });

  updateTimelineState(currentEventIndex);
}

function updateTimelineState(activeIdx) {
  const items = document.querySelectorAll('.ir-event');
  items.forEach(item => {
    const idx = parseInt(item.dataset.idx);
    item.classList.remove('active', 'past');
    if (idx === activeIdx) {
      item.classList.add('active');
      // 滚动到可见
      item.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else if (idx < activeIdx) {
      item.classList.add('past');
    }
  });

  // 更新进度条
  const progress = ((activeIdx + 1) / EVENTS.length) * 100;
  document.getElementById('railFill').style.height = progress + '%';
}

// ============================================================
// 跳转到事件
// ============================================================
function goToEvent(idx) {
  if (idx < 0 || idx >= EVENTS.length) return;

  currentEventIndex = idx;
  const evt = EVENTS[idx];

  // 更新标记
  updateMarkers(idx);

  // 地图飞行
  const targetLat = evt.lat;
  const targetLng = evt.lng;
  let zoomLevel = 5;
  if (evt.id === 13) zoomLevel = 3; // 全球事件缩小
  map.flyTo([targetLat, targetLng], zoomLevel, { duration: 1.2 });

  // 信息卡片
  showInfoCard(evt);

  // 扩散路径
  setTimeout(() => showDiffusion(evt), 300);

  // 铁路线
  showRailway(evt);

  // 城市增长
  clearCityGrowth();
  if (evt.cityGrowth) {
    setTimeout(() => showCityGrowth(evt), 500);
  }

  // 时间轴
  updateTimelineState(idx);

  // 播放进度
  updateProgress(idx);

  // 统计
  updateStats(evt);
}

// ============================================================
// 信息卡片
// ============================================================
function showInfoCard(evt) {
  const card = document.getElementById('infoCard');
  document.getElementById('cardYear').textContent = evt.year;
  document.getElementById('cardPhase').textContent = evt.phaseName;
  document.getElementById('cardTitle').textContent = evt.title;
  document.getElementById('cardLocation').textContent = `${evt.location} · ${evt.region}`;
  document.getElementById('cardDesc').textContent = evt.desc;

  // 先隐藏再显示，触发 CSS 过渡动画
  card.classList.remove('visible');
  void card.offsetWidth; // 强制重排
  requestAnimationFrame(() => {
    card.classList.add('visible');
  });
}

// ============================================================
// 进度条
// ============================================================
function updateProgress(idx) {
  const progress = ((idx + 1) / EVENTS.length) * 100;
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('progressLabel').textContent = `${idx + 1} / ${EVENTS.length}`;
}

// ============================================================
// 统计
// ============================================================
function updateStats(evt) {
  document.getElementById('statYear').textContent = evt.year;
  document.getElementById('statCities').textContent = currentEventIndex + 1;
  document.getElementById('statPhase').textContent =
    evt.phase === 1 ? 'I' : evt.phase === 2 ? 'II' : 'III';
}

// ============================================================
// 播放控制
// ============================================================
function togglePlay() {
  isPlaying = !isPlaying;
  const icon = document.getElementById('playIcon');

  if (isPlaying) {
    icon.innerHTML = '<path d="M4 3H7V13H4Z M9 3H12V13H9Z"/>';
    startPlayback();
  } else {
    icon.innerHTML = '<path d="M4 3L13 8L4 13Z"/>';
    stopPlayback();
  }
}

function startPlayback() {
  if (currentEventIndex >= EVENTS.length - 1) {
    currentEventIndex = 0;
  }
  goToEvent(currentEventIndex);

  playTimer = setInterval(() => {
    if (currentEventIndex < EVENTS.length - 1) {
      goToEvent(currentEventIndex + 1);
    } else {
      stopPlayback();
      isPlaying = false;
      document.getElementById('playIcon').innerHTML = '<path d="M4 3L13 8L4 13Z"/>';
    }
  }, 7000);
}

function stopPlayback() {
  if (playTimer) {
    clearInterval(playTimer);
    playTimer = null;
  }
}

// ============================================================
// 阶段筛选
// ============================================================
function filterPhase(phase) {
  activeFilterPhase = phase;
  document.querySelectorAll('.ir-phase-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.phase === phase);
  });
  renderTimeline();
}

// ============================================================
// 事件绑定
// ============================================================
document.getElementById('btnPlay').addEventListener('click', togglePlay);
document.getElementById('btnPrev').addEventListener('click', () => {
  if (currentEventIndex > 0) goToEvent(currentEventIndex - 1);
});
document.getElementById('btnNext').addEventListener('click', () => {
  if (currentEventIndex < EVENTS.length - 1) goToEvent(currentEventIndex + 1);
});

document.getElementById('progressTrack').addEventListener('click', (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  const idx = Math.floor(ratio * EVENTS.length);
  if (idx >= 0 && idx < EVENTS.length) goToEvent(idx);
});

document.querySelectorAll('.ir-phase-tab').forEach(tab => {
  tab.addEventListener('click', () => filterPhase(tab.dataset.phase));
});

// 键盘控制
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' && currentEventIndex > 0) goToEvent(currentEventIndex - 1);
  if (e.key === 'ArrowRight' && currentEventIndex < EVENTS.length - 1) goToEvent(currentEventIndex + 1);
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});

// 导航栏滚动效果（虽然页面不滚动，但保留交互）
window.addEventListener('wheel', () => {
  document.getElementById('navbar').classList.add('scrolled');
});

// ============================================================
// 初始化
// ============================================================
createMarkers();
renderTimeline();

// 延迟开始第一个事件
setTimeout(() => {
  goToEvent(0);
}, 800);

// 隐藏加载动画 — 不依赖 window.load，避免外部资源阻塞
setTimeout(() => {
  document.getElementById('loader').classList.add('hidden');
}, 1500);

// 确保地图尺寸正确
setTimeout(() => {
  map.invalidateSize();
}, 200);
setTimeout(() => {
  map.invalidateSize();
}, 2000);
</script>
