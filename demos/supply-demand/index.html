<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>经济学：供需曲线 · 景礴</title>
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <link rel="stylesheet" href="/assets/css/demo-framework.css">
  <style>
    /* ===== D114 供需曲线 Demo 专属样式 ===== */
    :root {
      --econ-demand: #c2410c;     /* 需求曲线：赤陶色 */
      --econ-supply: #0d9488;     /* 供给曲线：Teal */
      --econ-equilibrium: #d97706; /* 均衡点：金色 */
      --econ-grid: #ede8de;
      --econ-axis: #475569;
      --econ-shortage: rgba(30, 64, 175, 0.12);
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
    }
    body.has-info-bar { padding-bottom: 0; }

    .page-wrapper {
      padding-top: 64px;
      padding-bottom: 52px;
      min-height: 100vh;
    }

    /* ===== 杂志布局 ===== */
    .magazine-layout {
      display: grid;
      grid-template-columns: 40% 60%;
      gap: var(--spacer-40, 40px);
      max-width: 1440px;
      margin: 0 auto;
      padding: var(--spacer-32) var(--spacer-32);
      min-height: calc(100vh - 116px);
    }

    /* ===== 左侧文章区 ===== */
    .article-side {
      display: flex;
      flex-direction: column;
      gap: var(--spacer-20);
    }

    .article-header {
      display: flex;
      flex-direction: column;
      gap: var(--spacer-12);
    }

    .article-kicker {
      font-family: var(--font-mono);
      font-size: var(--fs-tiny);
      letter-spacing: 0.12em;
      color: var(--econ-demand, var(--brand));
      text-transform: uppercase;
      font-weight: 600;
    }

    .article-title {
      font-family: var(--font-serif);
      font-size: var(--fs-h1);
      font-weight: 700;
      line-height: 1.25;
      color: var(--text);
    }

    .article-subtitle {
      font-size: var(--fs-body);
      color: var(--text-muted);
      line-height: var(--lh-relaxed);
      font-style: italic;
      font-family: var(--font-serif);
    }

    .article-body {
      display: flex;
      flex-direction: column;
      gap: var(--spacer-16);
    }

    .article-body p {
      font-size: var(--fs-body);
      line-height: 1.85;
      color: var(--text);
    }

    .article-body p.lead {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.7;
      color: var(--text);
    }

    .article-body strong { font-weight: 600; }
    .article-body .demand-text { color: var(--econ-demand); font-weight: 600; }
    .article-body .supply-text { color: var(--econ-supply); font-weight: 600; }
    .article-body .equilibrium-text { color: var(--econ-equilibrium); font-weight: 600; }

    /* ===== 概念高亮框 ===== */
    .concept-box {
      background: linear-gradient(135deg, rgba(194, 65, 12, 0.04), rgba(194, 65, 12, 0.08));
      border: 1px solid rgba(194, 65, 12, 0.15);
      border-radius: var(--radius-card);
      padding: var(--spacer-20);
      margin: var(--spacer-12) 0;
    }

    .concept-box-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 15px;
      color: var(--brand);
      margin-bottom: var(--spacer-8);
    }

    .concept-box-text {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
    }

    /* ===== 步骤指示器 ===== */
    .step-indicator {
      display: flex;
      align-items: center;
      gap: var(--spacer-12);
      margin: var(--spacer-4) 0;
    }

    .step-dots { display: flex; gap: 10px; }

    .step-dot {
      width: 10px; height: 10px;
      border-radius: var(--radius-full);
      background-color: var(--border);
      transition: all var(--duration-base) var(--ease);
      cursor: pointer;
    }
    .step-dot.active {
      background-color: var(--brand);
      transform: scale(1.3);
    }
    .step-dot.completed { background-color: var(--text-faint); }

    .step-label {
      font-family: var(--font-mono);
      font-size: var(--fs-tiny);
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    /* ===== 步骤内容 ===== */
    .step-content {
      max-height: 480px;
      overflow-y: auto;
      padding-right: var(--spacer-8);
      transition: opacity var(--duration-slow) var(--ease);
    }
    .step-content.fade-out { opacity: 0; }

    .step-content::-webkit-scrollbar { width: 4px; }
    .step-content::-webkit-scrollbar-track { background: transparent; }
    .step-content::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .step-title {
      font-family: var(--font-serif);
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--text);
      margin-bottom: var(--spacer-16);
    }

    /* ===== 上一步/下一步 ===== */
    .step-nav {
      display: flex;
      gap: var(--spacer-12);
      margin-top: var(--spacer-8);
    }
    .step-nav .btn { flex: 1; }

    /* ===== 右侧可视化区 ===== */
    .visual-side {
      display: flex;
      flex-direction: column;
      gap: var(--spacer-20);
    }

    .visual-wrapper {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      position: relative;
      flex: 1;
      min-height: 460px;
      display: flex;
      flex-direction: column;
    }

    .visual-canvas {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacer-16);
      position: relative;
    }

    .visual-canvas svg {
      width: 100%;
      height: auto;
      max-height: 100%;
    }

    .visual-caption {
      font-size: var(--fs-small);
      color: var(--text-muted);
      text-align: center;
      font-style: italic;
      font-family: var(--font-serif);
      padding: 0 var(--spacer-16) var(--spacer-16);
    }

    /* ===== SVG 元素样式 ===== */
    .axis-line { stroke: var(--econ-axis); stroke-width: 1.5; }
    .axis-label {
      font-family: var(--font-sans);
      font-size: 12px;
      fill: var(--text-muted);
    }
    .axis-title {
      font-family: var(--font-serif);
      font-size: 13px;
      font-weight: 600;
      fill: var(--text);
    }
    .grid-line { stroke: var(--econ-grid); stroke-width: 1; }
    .grid-line.major { stroke: #e0d9cd; }

    .demand-curve {
      stroke: var(--econ-demand);
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
    }
    .supply-curve {
      stroke: var(--econ-supply);
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
    }
    .demand-curve.old, .supply-curve.old {
      stroke-dasharray: 6 4;
      opacity: 0.4;
    }

    .curve-label {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 700;
    }
    .curve-label.demand { fill: var(--econ-demand); }
    .curve-label.supply { fill: var(--econ-supply); }

    .equilibrium-point {
      fill: var(--econ-equilibrium);
      stroke: white;
      stroke-width: 3;
      transition: r var(--duration-base) var(--ease);
    }
    .equilibrium-line {
      stroke: var(--econ-equilibrium);
      stroke-width: 1.5;
      stroke-dasharray: 5 4;
      opacity: 0.6;
    }
    .equilibrium-label {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      fill: var(--econ-equilibrium);
    }

    .draggable-point {
      fill: var(--brand);
      stroke: white;
      stroke-width: 2.5;
      cursor: grab;
      transition: r var(--duration-fast) var(--ease);
    }
    .draggable-point:hover { r: 8; }
    .draggable-point:active { cursor: grabbing; }

    .value-tag {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
    }
    .value-tag-box {
      fill: var(--surface);
      stroke: var(--border);
      stroke-width: 1;
      rx: 4;
    }

    .shift-arrow {
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ===== 交互按钮组 ===== */
    .visual-controls {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacer-8);
      padding: var(--spacer-12) var(--spacer-16);
      border-top: 1px solid var(--border-soft);
      background: var(--surface-muted);
    }

    .shift-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: var(--fs-tiny);
      font-weight: 500;
      font-family: var(--font-sans);
      color: var(--text);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease);
      white-space: nowrap;
    }
    .shift-btn:hover {
      border-color: var(--text-faint);
      background-color: var(--bg);
    }
    .shift-btn.active {
      background-color: var(--brand-soft);
      border-color: rgba(194, 65, 12, 0.3);
      color: var(--brand);
    }
    .shift-btn .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .shift-btn .dot.demand { background: var(--econ-demand); }
    .shift-btn .dot.supply { background: var(--econ-supply); }

    /* ===== 价格滑块 ===== */
    .price-slider-container {
      padding: var(--spacer-12) var(--spacer-16);
      border-top: 1px solid var(--border-soft);
      background: var(--surface-muted);
    }

    .price-slider-row {
      display: flex;
      align-items: center;
      gap: var(--spacer-12);
    }

    .price-slider-label {
      font-size: var(--fs-tiny);
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .price-slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      border-radius: var(--radius-full);
      background: linear-gradient(to right, var(--econ-supply) 0%, var(--econ-equilibrium) 50%, var(--econ-demand) 100%);
      outline: none;
      cursor: pointer;
    }
    .price-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--econ-equilibrium);
      border: 3px solid var(--surface);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer;
    }
    .price-slider::-moz-range-thumb {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--econ-equilibrium);
      border: 3px solid var(--surface);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      border: none;
    }

    .price-slider-value {
      font-family: var(--font-mono);
      font-size: var(--fs-small);
      font-weight: 700;
      color: var(--econ-equilibrium);
      min-width: 70px;
      text-align: right;
    }

    /* ===== 市场场景插画 ===== */
    .market-scene-icon {
      fill: var(--econ-demand);
      opacity: 0.85;
    }
    .market-scene-icon.supply { fill: var(--econ-supply); }
    .market-scene-label {
      font-family: var(--font-serif);
      font-size: 12px;
      font-weight: 600;
      fill: var(--text-muted);
    }

    /* ===== 短缺/过剩区域 ===== */
    .shortage-area { fill: rgba(30, 64, 175, 0.12); }
    .surplus-area { fill: rgba(234, 88, 12, 0.12); }
    .area-label {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 700;
    }
    .area-label.shortage { fill: #1e40af; }
    .area-label.surplus { fill: #ea580c; }

    /* ===== 动画 ===== */
    @keyframes drawLine {
      from { stroke-dashoffset: 600; }
      to { stroke-dashoffset: 0; }
    }

    .animate-draw {
      stroke-dasharray: 600;
      animation: drawLine 1.2s var(--ease) forwards;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate-pop {
      opacity: 0;
      animation: fadeInScale 0.6s var(--ease) 0.8s forwards;
      transform-origin: center;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 1024px) {
      .magazine-layout {
        grid-template-columns: 1fr;
        gap: var(--spacer-24);
      }
      .visual-wrapper { min-height: 380px; }
      .step-content { max-height: 400px; }
    }

    @media (max-width: 768px) {
      .magazine-layout {
        padding: var(--spacer-20) var(--spacer-16);
      }
      .visual-wrapper { min-height: 320px; }
      .step-content { max-height: 350px; }
    }
  </style>

<script>
/* ============================================================
   D114 · 经济学：供需曲线 — 交互式杂志讲解
   ============================================================ */

// ====== 图表坐标系配置 ======
const CHART = {
  marginLeft: 70,
  marginRight: 40,
  marginTop: 30,
  marginBottom: 50,
  width: 600,
  height: 420,
  pMax: 50,   // 价格最大值
  qMax: 200,  // 数量最大值
};

// 绘图区域
const PLOT = {
  x: CHART.marginLeft,
  y: CHART.marginTop,
  w: CHART.width - CHART.marginLeft - CHART.marginRight,
  h: CHART.height - CHART.marginTop - CHART.marginBottom,
};

// 坐标转换函数
function toX(q) { return PLOT.x + (q / CHART.qMax) * PLOT.w; }
function toY(p) { return PLOT.y + PLOT.h - (p / CHART.pMax) * PLOT.h; }

// ====== 供需模型参数 ======
// 需求曲线: P = 40 - 0.2Q  (向下倾斜)
// 供给曲线: P = 0.2Q       (向上倾斜)
// 均衡点:   P* = 20, Q* = 100

function demandP(q) { return Math.max(0, 40 - 0.2 * q); }
function supplyP(q) { return 0.2 * q; }
function demandQ(p) { return Math.max(0, (40 - p) / 0.2); }
function supplyQ(p) { return Math.min(CHART.qMax, p / 0.2); }

// 均衡点
const EQ_P = 20;
const EQ_Q = 100;

// 可变状态：曲线偏移量（用于步骤5/6的曲线移动）
let demandShift = 0;  // 正值=右移(需求增加)
let supplyShift = 0;  // 正值=右移(供给增加)

function demandP_shifted(q) { return Math.max(0, 40 - 0.2 * (q - demandShift)); }
function supplyP_shifted(q) { return 0.2 * Math.max(0, (q - supplyShift)); }

// ====== SVG 辅助函数 ======
const svg = document.getElementById('chartSvg');
const SVG_NS = 'http://www.w3.org/2000/svg';

function createEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    el.setAttribute(k, v);
  }
  return el;
}

function clearSvg() {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

// ====== 绘制坐标轴 ======
function drawAxes() {
  const g = createEl('g', {});

  // 网格线
  for (let p = 10; p <= 40; p += 10) {
    const y = toY(p);
    g.appendChild(createEl('line', {
      x1: PLOT.x, y1: y, x2: PLOT.x + PLOT.w, y2: y,
      class: 'grid-line'
    }));
    g.appendChild(createEl('text', {
      x: PLOT.x - 10, y: y + 4, class: 'axis-label',
      'text-anchor': 'end'
    })).textContent = '¥' + p;
  }
  for (let q = 50; q <= 200; q += 50) {
    const x = toX(q);
    g.appendChild(createEl('line', {
      x1: x, y1: PLOT.y, x2: x, y2: PLOT.y + PLOT.h,
      class: 'grid-line'
    }));
    g.appendChild(createEl('text', {
      x: x, y: PLOT.y + PLOT.h + 20, class: 'axis-label',
      'text-anchor': 'middle'
    })).textContent = q;
  }

  // Y轴
  g.appendChild(createEl('line', {
    x1: PLOT.x, y1: PLOT.y, x2: PLOT.x, y2: PLOT.y + PLOT.h,
    class: 'axis-line'
  }));
  // X轴
  g.appendChild(createEl('line', {
    x1: PLOT.x, y1: PLOT.y + PLOT.h, x2: PLOT.x + PLOT.w, y2: PLOT.y + PLOT.h,
    class: 'axis-line'
  }));

  // 轴标题
  const pTitle = createEl('text', {
    x: PLOT.x - 45, y: PLOT.y - 8, class: 'axis-title'
  });
  pTitle.textContent = 'P (价格)';
  g.appendChild(pTitle);

  const qTitle = createEl('text', {
    x: PLOT.x + PLOT.w, y: PLOT.y + PLOT.h + 38, class: 'axis-title',
    'text-anchor': 'end'
  });
  qTitle.textContent = 'Q (数量)';
  g.appendChild(qTitle);

  svg.appendChild(g);
}

// ====== 绘制需求曲线 ======
function drawDemandCurve(opts = {}) {
  const { shifted = false, old = false, animated = false, label = true } = opts;
  const g = createEl('g', {});

  const shift = shifted ? demandShift : 0;
  const qStart = shift;
  const qEnd = Math.min(CHART.qMax, shift + 200);
  const pStart = 40 - 0.2 * 0;
  const pEnd = Math.max(0, 40 - 0.2 * (qEnd - shift));

  const x1 = toX(qStart), y1 = toY(pStart);
  const x2 = toX(qEnd), y2 = toY(pEnd);

  const line = createEl('line', {
    x1, y1, x2, y2,
    class: 'demand-curve' + (old ? ' old' : '')
  });

  if (animated) {
    line.setAttribute('stroke-dasharray', '600');
    line.style.animation = 'drawLine 1.2s var(--ease) forwards';
  }

  g.appendChild(line);

  if (label) {
    const lbl = createEl('text', {
      x: x2 - 30, y: y2 + 20, class: 'curve-label demand'
    });
    lbl.textContent = shifted ? "D'" : 'D';
    g.appendChild(lbl);
  }

  svg.appendChild(g);
  return { x1, y1, x2, y2 };
}

// ====== 绘制供给曲线 ======
function drawSupplyCurve(opts = {}) {
  const { shifted = false, old = false, animated = false, label = true } = opts;
  const g = createEl('g', {});

  const shift = shifted ? supplyShift : 0;
  const qStart = shift;
  const qEnd = Math.min(CHART.qMax, shift + 200);
  const pStart = 0;
  const pEnd = Math.min(CHART.pMax, 0.2 * (qEnd - shift));

  const x1 = toX(qStart), y1 = toY(pStart);
  const x2 = toX(qEnd), y2 = toY(pEnd);

  const line = createEl('line', {
    x1, y1, x2, y2,
    class: 'supply-curve' + (old ? ' old' : '')
  });

  if (animated) {
    line.setAttribute('stroke-dasharray', '600');
    line.style.animation = 'drawLine 1.2s var(--ease) 0.3s forwards';
    line.style.opacity = '0';
    setTimeout(() => { line.style.opacity = '1'; }, 300);
  }

  g.appendChild(line);

  if (label) {
    const lbl = createEl('text', {
      x: x2 - 30, y: y2 - 12, class: 'curve-label supply'
    });
    lbl.textContent = shifted ? "S'" : 'S';
    g.appendChild(lbl);
  }

  svg.appendChild(g);
  return { x1, y1, x2, y2 };
}

// ====== 绘制均衡点 ======
function drawEquilibrium(p, q, opts = {}) {
  const { animated = false, label = true } = opts;
  const g = createEl('g', {});

  const ex = toX(q);
  const ey = toY(p);

  // 虚线
  g.appendChild(createEl('line', {
    x1: PLOT.x, y1: ey, x2: ex, y2: ey,
    class: 'equilibrium-line'
  }));
  g.appendChild(createEl('line', {
    x1: ex, y1: PLOT.y + PLOT.h, x2: ex, y2: ey,
    class: 'equilibrium-line'
  }));

  // 均衡点
  const circle = createEl('circle', {
    cx: ex, cy: ey, r: 7, class: 'equilibrium-point'
  });
  if (animated) {
    circle.classList.add('animate-pop');
  }
  g.appendChild(circle);

  if (label) {
    // P* 标签
    const pLbl = createEl('text', {
      x: PLOT.x - 10, y: ey + 4, class: 'equilibrium-label',
      'text-anchor': 'end'
    });
    pLbl.textContent = 'P*=' + p;
    g.appendChild(pLbl);

    // Q* 标签
    const qLbl = createEl('text', {
      x: ex, y: PLOT.y + PLOT.h + 20, class: 'equilibrium-label',
      'text-anchor': 'middle'
    });
    qLbl.textContent = 'Q*=' + q;
    g.appendChild(qLbl);
  }

  svg.appendChild(g);
  return { ex, ey };
}

// ====== 绘制可拖动点 ======
let dragPoint = null;
let dragInfo = null;

function drawDraggablePoint(curveType) {
  const g = createEl('g', { id: 'dragGroup' });

  // 初始位置在曲线中点
  const initP = 20;
  let q;
  if (curveType === 'demand') {
    q = demandQ(initP);
  } else {
    q = supplyQ(initP);
  }

  const px = toX(q);
  const py = toY(initP);

  // 数值标签背景
  const tagBg = createEl('rect', {
    x: px + 14, y: py - 30, width: 80, height: 44, rx: 6,
    class: 'value-tag-box'
  });
  g.appendChild(tagBg);

  // P 标签
  const pTag = createEl('text', {
    x: px + 22, y: py - 14, class: 'value-tag',
    fill: 'var(--text)'
  });
  pTag.textContent = 'P = ¥' + initP;
  pTag.id = 'dragPVal';
  g.appendChild(pTag);

  // Q 标签
  const qTag = createEl('text', {
    x: px + 22, y: py + 2, class: 'value-tag',
    fill: 'var(--text-muted)'
  });
  qTag.textContent = 'Q = ' + Math.round(q);
  qTag.id = 'dragQVal';
  g.appendChild(qTag);

  // 拖动点
  const point = createEl('circle', {
    cx: px, cy: py, r: 6, class: 'draggable-point',
    id: 'dragPoint'
  });

  // 拖动事件
  point.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    point.setPointerCapture(e.pointerId);
    dragInfo = { curveType, point, tagBg, pTag, qTag };
  });

  point.addEventListener('pointermove', (e) => {
    if (!dragInfo) return;
    const rect = svg.getBoundingClientRect();
    const scale = CHART.width / rect.width;
    const svgX = (e.clientX - rect.left) * scale;
    const svgY = (e.clientY - rect.top) * scale;

    // 限制在绘图区域内
    const clampedY = Math.max(PLOT.y, Math.min(PLOT.y + PLOT.h, svgY));
    const p = ((PLOT.y + PLOT.h) - clampedY) / PLOT.h * CHART.pMax;
    const clampedP = Math.max(0, Math.min(40, p));

    let q;
    if (dragInfo.curveType === 'demand') {
      q = demandQ(clampedP);
    } else {
      q = supplyQ(clampedP);
    }

    const nx = toX(q);
    const ny = toY(clampedP);

    dragInfo.point.setAttribute('cx', nx);
    dragInfo.point.setAttribute('cy', ny);
    dragInfo.tagBg.setAttribute('x', nx + 14);
    dragInfo.tagBg.setAttribute('y', ny - 30);
    dragInfo.pTag.setAttribute('x', nx + 22);
    dragInfo.pTag.setAttribute('y', ny - 14);
    dragInfo.pTag.textContent = 'P = ¥' + Math.round(clampedP);
    dragInfo.qTag.setAttribute('x', nx + 22);
    dragInfo.qTag.setAttribute('y', ny + 2);
    dragInfo.qTag.textContent = 'Q = ' + Math.round(q);
  });

  point.addEventListener('pointerup', () => { dragInfo = null; });
  point.addEventListener('pointercancel', () => { dragInfo = null; });

  g.appendChild(point);
  svg.appendChild(g);
}

// ====== 绘制价格管制线 ======
function drawPriceControl(price, type) {
  const g = createEl('g', {});
  const y = toY(price);

  const color = type === 'ceiling' ? '#1e40af' : '#ea580c';
  const label = type === 'ceiling' ? '最高限价' : '最低限价';

  // 价格线
  g.appendChild(createEl('line', {
    x1: PLOT.x, y1: y, x2: PLOT.x + PLOT.w, y2: y,
    stroke: color, 'stroke-width': 2, 'stroke-dasharray': '8 4'
  }));

  // 标签
  const lbl = createEl('text', {
    x: PLOT.x + PLOT.w - 8, y: y - 8,
    'text-anchor': 'end',
    'font-family': 'var(--font-sans)', 'font-size': '12px',
    'font-weight': '600', fill: color
  });
  lbl.textContent = label + ' ¥' + price;
  g.appendChild(lbl);

  // 计算短缺或过剩
  const qD = demandQ(price);
  const qS = supplyQ(price);

  if (type === 'ceiling' && price < EQ_P) {
    // 短缺
    const xS = toX(qS);
    const xD = toX(qD);
    g.appendChild(createEl('rect', {
      x: xS, y: y - 12, width: xD - xS, height: 24,
      class: 'shortage-area', rx: 3
    }));
    const sLbl = createEl('text', {
      x: (xS + xD) / 2, y: y + 28, class: 'area-label shortage',
      'text-anchor': 'middle'
    });
    sLbl.textContent = '短缺 ' + Math.round(qD - qS);
    g.appendChild(sLbl);
  } else if (type === 'floor' && price > EQ_P) {
    // 过剩
    const xS = toX(qS);
    const xD = toX(qD);
    g.appendChild(createEl('rect', {
      x: xD, y: y - 12, width: xS - xD, height: 24,
      class: 'surplus-area', rx: 3
    }));
    const sLbl = createEl('text', {
      x: (xD + xS) / 2, y: y + 28, class: 'area-label surplus',
      'text-anchor': 'middle'
    });
    sLbl.textContent = '过剩 ' + Math.round(qS - qD);
    g.appendChild(sLbl);
  }

  svg.appendChild(g);
}

// ====== 绘制移动箭头 ======
function drawShiftArrow(fromX, fromY, toX, toY, color) {
  const g = createEl('g', {});
  const midX = (fromX + toX) / 2;
  const midY = (fromY + toY) / 2 - 20;

  g.appendChild(createEl('path', {
    d: `M ${fromX} ${fromY} Q ${midX} ${midY} ${toX} ${toY}`,
    stroke: color, class: 'shift-arrow',
    'stroke-dasharray': '5 3', opacity: 0.7
  }));

  // 箭头
  const angle = Math.atan2(toY - midY, toX - midX);
  const arrSize = 10;
  g.appendChild(createEl('path', {
    d: `M ${toX} ${toY} L ${toX - arrSize * Math.cos(angle - 0.5)} ${toY - arrSize * Math.sin(angle - 0.5)} M ${toX} ${toY} L ${toX - arrSize * Math.cos(angle + 0.5)} ${toY - arrSize * Math.sin(angle + 0.5)}`,
    stroke: color, 'stroke-width': 2.5, fill: 'none', opacity: 0.7
  }));

  svg.appendChild(g);
}

// ====== 步骤绘制函数 ======
function drawStep(step) {
  clearSvg();
  drawAxes();
  demandShift = 0;
  supplyShift = 0;

  const controls = document.getElementById('visualControls');
  const sliderContainer = document.getElementById('priceSliderContainer');
  controls.style.display = 'none';
  sliderContainer.style.display = 'none';

  if (step === 0) {
    drawMarketScene();
  } else if (step === 1) {
    drawDemandCurve({ animated: true });
    drawDraggablePoint('demand');
  } else if (step === 2) {
    drawDemandCurve({ label: false });
    drawSupplyCurve({ animated: true });
    drawDraggablePoint('supply');
  } else if (step === 3) {
    drawDemandCurve({ animated: true });
    drawSupplyCurve({ animated: true });
    setTimeout(() => drawEquilibrium(EQ_P, EQ_Q, { animated: true }), 1200);
  } else if (step === 4) {
    // 需求移动：初始状态显示原始曲线和均衡点
    drawDemandCurve({});
    drawSupplyCurve({});
    drawEquilibrium(EQ_P, EQ_Q);
    setupShiftControls('demand');
  } else if (step === 5) {
    // 供给移动：初始状态显示原始曲线和均衡点
    drawDemandCurve({});
    drawSupplyCurve({});
    drawEquilibrium(EQ_P, EQ_Q);
    setupShiftControls('supply');
  } else if (step === 6) {
    drawDemandCurve({});
    drawSupplyCurve({});
    drawEquilibrium(EQ_P, EQ_Q, { animated: false });
    setupPriceSlider();
  } else if (step === 7) {
    drawDemandCurve({});
    drawSupplyCurve({});
    drawEquilibrium(EQ_P, EQ_Q, { animated: false });
  }
}

// ====== 设置曲线移动控制按钮 ======
function setupShiftControls(type) {
  const controls = document.getElementById('visualControls');
  controls.style.display = 'flex';
  controls.innerHTML = '';

  const scenarios = type === 'demand'
    ? [
        { label: '收入增加', shift: 40, color: 'demand' },
        { label: '替代品涨价', shift: 30, color: 'demand' },
        { label: '偏好增强', shift: 20, color: 'demand' },
        { label: '恢复正常', shift: 0, color: 'demand' },
      ]
    : [
        { label: '成本下降', shift: 40, color: 'supply' },
        { label: '技术进步', shift: 30, color: 'supply' },
        { label: '卖者增加', shift: 20, color: 'supply' },
        { label: '恢复正常', shift: 0, color: 'supply' },
      ];

  scenarios.forEach(s => {
    const btn = createEl_('button', { class: 'shift-btn' });
    const dot = createEl_('span', { class: 'dot ' + s.color });
    dot.style.background = s.color === 'demand' ? 'var(--econ-demand)' : 'var(--econ-supply)';
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode(s.label));
    btn.addEventListener('click', () => {
      if (type === 'demand') demandShift = s.shift;
      else supplyShift = s.shift;

      // 重绘
      clearSvg();
      drawAxes();

      if (s.shift === 0) {
        // 恢复正常：只画原始曲线和均衡点
        drawDemandCurve({});
        drawSupplyCurve({});
        drawEquilibrium(EQ_P, EQ_Q);
      } else {
        // 曲线移动：旧曲线（虚线）+ 新曲线（实线）+ 移动箭头 + 新均衡
        drawDemandCurve({ old: type === 'demand' });
        drawSupplyCurve({ old: type === 'supply' });

        let newCurveEnd;
        if (type === 'demand') {
          newCurveEnd = drawDemandCurve({ shifted: true, label: true });
        } else {
          newCurveEnd = drawSupplyCurve({ shifted: true, label: true });
        }

        // 绘制移动方向箭头（从旧曲线中点指向新曲线中点）
        const midP = 20;
        const oldMidQ = type === 'demand' ? demandQ(midP) : supplyQ(midP);
        const newMidQ = type === 'demand'
          ? demandQ(midP) + demandShift
          : supplyQ(midP) + supplyShift;
        const arrowColor = type === 'demand' ? '#c2410c' : '#0d9488';
        drawShiftArrow(toX(oldMidQ), toY(midP), toX(newMidQ), toY(midP), arrowColor);

        // 计算新均衡
        // 需求: P = 40 - 0.2(Q - demandShift)
        // 供给: P = 0.2(Q - supplyShift)
        // 联立: Q = (40 + 0.2*(demandShift + supplyShift)) / 0.4
        const newQ = (40 + 0.2 * (demandShift + supplyShift)) / 0.4;
        const newP = 0.2 * (newQ - supplyShift);

        drawEquilibrium(Math.round(newP), Math.round(newQ), { animated: false });
      }

      // 高亮当前按钮
      controls.querySelectorAll('.shift-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
    controls.appendChild(btn);
  });
}

// HTML 元素创建辅助
function createEl_(tag, attrs) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    el.setAttribute(k, v);
  }
  return el;
}

// ====== 设置价格滑块 ======
function setupPriceSlider() {
  const slider = document.getElementById('priceSlider');
  const valDisplay = document.getElementById('priceSliderValue');
  const container = document.getElementById('priceSliderContainer');
  container.style.display = 'block';
  slider.value = 20;
  valDisplay.textContent = '¥20 /杯 (均衡)';

  slider.oninput = () => {
    const price = parseInt(slider.value);
    valDisplay.textContent = '¥' + price + ' /杯';

    clearSvg();
    drawAxes();
    drawDemandCurve({});
    drawSupplyCurve({});

    if (price < EQ_P) {
      drawPriceControl(price, 'ceiling');
    } else if (price > EQ_P) {
      drawPriceControl(price, 'floor');
    } else {
      drawEquilibrium(EQ_P, EQ_Q);
    }
  };
}

// ====== 步骤导航逻辑 ======
let currentStep = 0;
const stepContent = document.getElementById('stepContent');
const stepLabel = document.getElementById('stepLabel');
const stepDotsContainer = document.getElementById('stepDots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

// 生成步骤圆点
steps.forEach((_, i) => {
  const dot = createEl_('div', { class: 'step-dot' + (i === 0 ? ' active' : '') });
  dot.dataset.step = i;
  dot.addEventListener('click', () => goToStep(i));
  stepDotsContainer.appendChild(dot);
});

const stepDots = stepDotsContainer.querySelectorAll('.step-dot');

function goToStep(step) {
  if (step < 0 || step >= steps.length) return;
  currentStep = step;

  // 淡出
  stepContent.classList.add('fade-out');

  setTimeout(() => {
    const s = steps[currentStep];
    stepContent.innerHTML = `<h3 class="step-title">${s.title}</h3><div class="article-body">${s.content}</div>`;
    stepContent.classList.remove('fade-out');

    document.getElementById('visualCaption').textContent = s.caption;
  }, 200);

  stepLabel.textContent = `第 ${currentStep + 1} / ${steps.length} 步`;

  stepDots.forEach((dot, i) => {
    dot.classList.remove('active', 'completed');
    if (i === currentStep) dot.classList.add('active');
    else if (i < currentStep) dot.classList.add('completed');
  });

  prevBtn.disabled = currentStep === 0;
  prevBtn.style.opacity = currentStep === 0 ? '0.5' : '1';
  prevBtn.style.cursor = currentStep === 0 ? 'not-allowed' : 'pointer';

  nextBtn.innerHTML = currentStep === steps.length - 1
    ? '完成 ✓'
    : '下一步 <span>→</span>';

  drawStep(currentStep);
}

prevBtn.addEventListener('click', () => {
  if (currentStep > 0) goToStep(currentStep - 1);
});

nextBtn.addEventListener('click', () => {
  if (currentStep < steps.length - 1) goToStep(currentStep + 1);
});

// ====== 导航栏滚动效果 ======
const navbar = document.getElementById('demoNavbar');
window.addEventListener('scroll', () => {
  navbar.classList.toggle('scrolled', window.scrollY > 10);
});

// ====== 初始化 ======
goToStep(0);
</script>
