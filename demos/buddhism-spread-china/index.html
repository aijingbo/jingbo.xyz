<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中国佛教传播路线 · 景礴</title>
<link rel="stylesheet" href="/assets/css/design-system.css" />
<link rel="stylesheet" href="/assets/css/demo-framework.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   中国佛教传播路线 — 专属样式
   禅意经卷 × 时空叙事
   ============================================================ */

:root {
  /* 禅意配色 */
  --bd-gold: #B8860B;
  --bd-gold-light: #DAA520;
  --bd-gold-dark: #9B7508;
  --bd-saffron: #8B0000;
  --bd-saffron-dark: #6B0000;
  --bd-paper: #F8F4EC;
  --bd-paper-dark: #EFE9DC;
  --bd-stone-blue: #4682B4;
  --bd-stone-green: #2E8B57;
  --bd-ink: #3D3522;
  --bd-ink-light: #6B5D3F;
  --bd-text: #3D3522;
  --bd-text-muted: #8B7E5A;
  --bd-border: #E0D6C2;
  --bd-border-soft: #EDE7D8;

  /* 字体 */
  --bd-font-cal: 'Ma Shan Zheng', 'Noto Serif SC', serif;
  --bd-font-serif: 'Noto Serif SC', 'Source Han Serif SC', Georgia, serif;
  --bd-font-sans: 'Noto Sans SC', -apple-system, sans-serif;
  --bd-font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}

* { box-sizing: border-box; }

body {
  font-family: var(--bd-font-sans);
  background: var(--bd-paper);
  color: var(--bd-text);
  margin: 0;
  padding: 0;
  overflow: hidden;
}

/* ---------- 经卷纹理 ---------- */
.paper-texture {
  background-color: var(--bd-paper);
  background-image:
    radial-gradient(circle at 15% 50%, rgba(184, 134, 11, 0.03) 0%, transparent 50%),
    radial-gradient(circle at 85% 30%, rgba(139, 0, 0, 0.02) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
}

/* ---------- 入场莲花动画 ---------- */
.bd-entry {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bd-paper);
  transition: opacity 1.2s ease;
}
.bd-entry.hidden { opacity: 0; pointer-events: none; }

.bd-entry-glow {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(218, 165, 32, 0.15) 0%, rgba(184, 134, 11, 0.05) 40%, transparent 70%);
  opacity: 0;
  animation: bd-glow-spread 2.5s ease forwards;
}
@keyframes bd-glow-spread {
  0% { opacity: 0; transform: scale(0.3); }
  40% { opacity: 0.8; transform: scale(0.8); }
  100% { opacity: 0.2; transform: scale(1.5); }
}

.bd-entry-lotus {
  position: relative;
  z-index: 1;
  width: 120px;
  height: 120px;
  opacity: 0;
  animation: bd-lotus-bloom 2s ease 0.5s forwards;
}
@keyframes bd-lotus-bloom {
  0% { opacity: 0; transform: scale(0.3) rotate(-30deg); }
  60% { opacity: 0.8; transform: scale(1.1) rotate(5deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

.bd-entry-text {
  position: relative;
  z-index: 1;
  text-align: center;
  opacity: 0;
  animation: bd-text-fade 1.5s ease 1.2s forwards;
  margin-top: 24px;
}
@keyframes bd-text-fade {
  0% { opacity: 0; transform: translateY(20px); filter: blur(10px); }
  100% { opacity: 1; transform: translateY(0); filter: blur(0); }
}
.bd-entry-title {
  font-family: var(--bd-font-serif);
  font-size: clamp(28px, 4vw, 40px);
  font-weight: 700;
  color: var(--bd-ink);
  letter-spacing: 0.2em;
  line-height: 1.4;
}
.bd-entry-sub {
  font-family: var(--bd-font-cal);
  font-size: 18px;
  color: var(--bd-gold);
  margin-top: 10px;
  letter-spacing: 0.15em;
}

/* ---------- 导航栏覆盖 ---------- */
.demo-navbar {
  background-color: rgba(248, 244, 236, 0.88) !important;
  border-bottom: 1px solid var(--bd-border) !important;
}
.demo-navbar.scrolled {
  background-color: rgba(248, 244, 236, 0.95) !important;
}
.demo-nav-logo { font-family: var(--bd-font-serif); }

/* ---------- 主体布局 ---------- */
.framework-narrative {
  background: var(--bd-paper) !important;
  background-image:
    radial-gradient(circle at 15% 50%, rgba(184, 134, 11, 0.03) 0%, transparent 50%),
    radial-gradient(circle at 85% 30%, rgba(139, 0, 0, 0.02) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E") !important;
}

.framework-narrative .narrative-main {
  grid-template-columns: 68% 32% !important;
}

/* ---------- 地图区域 ---------- */
.narrative-map-area {
  background: var(--bd-paper-dark) !important;
  border-right: 1px solid var(--bd-border) !important;
  position: relative;
}

#map {
  width: 100%;
  height: 100%;
  background: var(--bd-paper);
  z-index: 1;
}

/* Leaflet 底图禅意暖色滤镜 */
.leaflet-tile-pane {
  filter: sepia(0.5) brightness(1.05) contrast(0.82) saturate(0.55) hue-rotate(-5deg);
}

.leaflet-container {
  background: var(--bd-paper) !important;
  font-family: var(--bd-font-sans) !important;
}

/* 防止框架CSS影响Leaflet内部SVG尺寸 */
.leaflet-overlay-pane svg,
.leaflet-marker-pane svg,
.leaflet-shadow-pane svg {
  width: auto !important;
  height: auto !important;
}

.leaflet-control-zoom {
  border: 1px solid var(--bd-border) !important;
  border-radius: 6px !important;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(61, 53, 34, 0.08) !important;
}
.leaflet-control-zoom a {
  background: rgba(255, 255, 255, 0.92) !important;
  color: var(--bd-ink) !important;
  border-bottom: 1px solid var(--bd-border) !important;
  font-family: var(--bd-font-serif) !important;
}
.leaflet-control-zoom a:hover {
  background: var(--bd-paper-dark) !important;
  color: var(--bd-saffron) !important;
}

.leaflet-control-attribution {
  background: rgba(248, 244, 236, 0.7) !important;
  color: var(--bd-text-muted) !important;
  font-size: 10px !important;
}
.leaflet-control-attribution a {
  color: var(--bd-gold) !important;
}

/* ---------- 自定义标记点 ---------- */
.bd-marker {
  position: relative;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bd-marker-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--bd-gold);
  border: 2px solid var(--bd-paper);
  box-shadow: 0 1px 4px rgba(61, 53, 34, 0.2);
  transition: all 0.3s ease;
}
.bd-marker.past .bd-marker-dot {
  background: var(--bd-gold);
  opacity: 0.65;
}
.bd-marker.future .bd-marker-dot {
  background: var(--bd-border);
  opacity: 0.45;
}
.bd-marker.active .bd-marker-dot {
  width: 16px;
  height: 16px;
  background: var(--bd-saffron);
  border: 3px solid var(--bd-paper);
  box-shadow: 0 0 0 4px rgba(139, 0, 0, 0.18), 0 2px 8px rgba(139, 0, 0, 0.3);
}
.bd-marker.active::before {
  content: '';
  position: absolute;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid var(--bd-saffron);
  opacity: 0;
  animation: bd-marker-pulse 2s ease-out infinite;
}
@keyframes bd-marker-pulse {
  0% { opacity: 0.5; transform: scale(0.6); }
  100% { opacity: 0; transform: scale(1.8); }
}

/* 石窟标记 — 方形旋转 */
.bd-marker[data-type="grotto"] .bd-marker-dot {
  border-radius: 2px;
  transform: rotate(45deg);
}
.bd-marker[data-type="grotto"].active .bd-marker-dot {
  border-radius: 3px;
}

/* 重要寺院标记 — 金色边框 */
.bd-marker[data-type="temple"] .bd-marker-dot {
  border-color: var(--bd-gold-light);
}

.bd-marker-label {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-family: var(--bd-font-serif);
  font-size: 11px;
  font-weight: 600;
  color: var(--bd-ink);
  background: rgba(248, 244, 236, 0.92);
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--bd-border);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.bd-marker.active .bd-marker-label,
.bd-marker.past .bd-marker-label {
  opacity: 1;
}
.bd-marker.active .bd-marker-label {
  color: var(--bd-saffron);
  border-color: var(--bd-saffron);
  background: rgba(248, 244, 236, 0.95);
}

/* ---------- 地图装饰角花（莲花纹） ---------- */
.bd-corner-deco {
  position: absolute;
  z-index: 5;
  pointer-events: none;
  opacity: 0.2;
}
.bd-corner-deco svg { display: block; }
.bd-corner-tl { top: 80px; left: 16px; }
.bd-corner-br { bottom: 16px; right: 16px; transform: rotate(180deg); }

/* ---------- 路线图例 ---------- */
.bd-route-legend {
  position: absolute;
  top: 80px;
  right: 16px;
  z-index: 10;
  padding: 10px 14px;
  background: rgba(248, 244, 236, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--bd-border);
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(61, 53, 34, 0.06);
}
.bd-legend-title {
  font-family: var(--bd-font-serif);
  font-size: 11px;
  font-weight: 600;
  color: var(--bd-ink);
  margin-bottom: 6px;
}
.bd-legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: var(--bd-text-muted);
  margin-bottom: 3px;
}
.bd-legend-item:last-child { margin-bottom: 0; }
.bd-legend-line {
  display: inline-block;
  width: 24px;
  height: 0;
  border-top: 2px dashed currentColor;
}
.bd-legend-line.land { color: var(--bd-saffron); }
.bd-legend-line.sea { color: var(--bd-stone-blue); border-top-style: solid; }
.bd-legend-line.south { color: var(--bd-stone-green); }

/* ---------- 信息卡片 ---------- */
.narrative-info-card {
  position: absolute;
  bottom: 24px;
  left: 24px;
  z-index: 20;
  max-width: 380px;
  padding: 0;
  background: rgba(255, 255, 255, 0.96) !important;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--bd-border) !important;
  border-radius: 12px !important;
  box-shadow: 0 12px 40px rgba(61, 53, 34, 0.1) !important;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.bd-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--bd-border);
  background: linear-gradient(180deg, rgba(248, 244, 236, 0.6), transparent);
}

.bd-card-year-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.narrative-info-year {
  font-family: var(--bd-font-serif) !important;
  font-size: 26px !important;
  font-weight: 700 !important;
  color: var(--bd-saffron) !important;
  line-height: 1 !important;
  margin: 0 !important;
}

.bd-card-phase {
  font-family: var(--bd-font-sans);
  font-size: 11px;
  font-weight: 500;
  color: var(--bd-gold);
  background: rgba(184, 134, 11, 0.08);
  padding: 3px 10px;
  border-radius: 999px;
  white-space: nowrap;
}

.bd-card-seal {
  width: 34px;
  height: 34px;
  border-radius: 4px;
  background: var(--bd-saffron);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--bd-font-cal);
  font-size: 16px;
  color: #fff;
  flex-shrink: 0;
  line-height: 1;
  text-align: center;
  box-shadow: 0 2px 6px rgba(139, 0, 0, 0.25);
}

.bd-card-body {
  padding: 14px 22px 18px;
}

.bd-card-place {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--bd-font-sans);
  font-size: 12px;
  color: var(--bd-text-muted);
  margin-bottom: 6px;
}
.bd-card-place svg { width: 12px; height: 12px; flex-shrink: 0; }

.narrative-info-title {
  font-family: var(--bd-font-serif) !important;
  font-size: 18px !important;
  font-weight: 700 !important;
  color: var(--bd-ink) !important;
  margin-bottom: 8px !important;
  line-height: 1.3;
}

.narrative-info-desc {
  font-size: 13px !important;
  line-height: 1.7 !important;
  color: var(--bd-text-muted) !important;
}

.bd-card-sutra {
  margin-top: 12px;
  padding: 10px 14px;
  border-left: 3px solid var(--bd-gold);
  background: rgba(184, 134, 11, 0.05);
  border-radius: 0 6px 6px 0;
}
.bd-card-sutra-text {
  font-family: var(--bd-font-cal);
  font-size: 15px;
  line-height: 1.7;
  color: var(--bd-gold-dark);
  letter-spacing: 0.05em;
}
.bd-card-sutra-source {
  font-family: var(--bd-font-sans);
  font-size: 10px;
  color: var(--bd-text-muted);
  margin-top: 4px;
}

/* ---------- 时间轴面板 ---------- */
.narrative-timeline-panel {
  background: rgba(255, 255, 255, 0.6) !important;
}

.narrative-timeline-header {
  padding: 20px 24px 16px !important;
  border-bottom: 1px solid var(--bd-border) !important;
  background: linear-gradient(180deg, rgba(248, 244, 236, 0.5), transparent);
}

.narrative-timeline-title {
  font-family: var(--bd-font-serif) !important;
  font-size: 20px !important;
  font-weight: 700 !important;
  color: var(--bd-ink) !important;
}

.narrative-timeline-subtitle {
  font-family: var(--bd-font-serif) !important;
  font-size: 12px !important;
  color: var(--bd-text-muted) !important;
  margin-top: 4px !important;
  font-style: italic;
}

.bd-timeline-phase-bar {
  display: flex;
  gap: 4px;
  margin-top: 12px;
}
.bd-phase-segment {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--bd-border);
  transition: all 0.3s ease;
  cursor: pointer;
}
.bd-phase-segment.active {
  background: var(--bd-saffron);
}
.bd-phase-segment.past {
  background: var(--bd-gold);
  opacity: 0.5;
}

/* ---------- 时间轴列表 ---------- */
.narrative-timeline-list {
  padding: 16px 20px !important;
}

.narrative-timeline-list::before {
  left: 39px !important;
  top: 16px !important;
  bottom: 16px !important;
  width: 2px !important;
  background: var(--bd-border) !important;
}

.timeline-event {
  padding: 8px 0 !important;
  gap: 14px !important;
}

.timeline-event-dot {
  width: 10px !important;
  height: 10px !important;
  margin-left: 15px !important;
  margin-top: 4px !important;
  border: 2px solid var(--bd-border) !important;
  background: #fff !important;
}

.timeline-event.active .timeline-event-dot {
  background: var(--bd-saffron) !important;
  border-color: var(--bd-saffron) !important;
  box-shadow: 0 0 0 4px rgba(139, 0, 0, 0.15) !important;
}

.timeline-event.past .timeline-event-dot {
  background: var(--bd-gold) !important;
  border-color: var(--bd-gold) !important;
  opacity: 0.5;
}

/* 石窟事件用方形点 */
.timeline-event[data-type="grotto"] .timeline-event-dot {
  border-radius: 2px !important;
  transform: rotate(45deg) !important;
}

.timeline-event-year {
  font-family: var(--bd-font-mono) !important;
  font-size: 11px !important;
  color: var(--bd-text-muted) !important;
}

.timeline-event.active .timeline-event-year {
  color: var(--bd-saffron) !important;
}

.timeline-event-title {
  font-family: var(--bd-font-serif) !important;
  font-size: 14px !important;
  font-weight: 600 !important;
  color: var(--bd-ink) !important;
}

.timeline-event.active .timeline-event-title {
  color: var(--bd-saffron) !important;
}

.timeline-event-desc {
  font-size: 11px !important;
  color: var(--bd-text-muted) !important;
  line-height: 1.5 !important;
}

.timeline-event.active .timeline-event-desc {
  max-height: 80px !important;
}

.bd-event-place {
  font-family: var(--bd-font-sans);
  font-size: 10px;
  color: var(--bd-gold);
  margin-top: 2px;
}

/* 路线类型标记 */
.bd-route-tag {
  display: inline-block;
  font-size: 9px;
  font-weight: 500;
  padding: 1px 6px;
  border-radius: 999px;
  margin-left: 4px;
  vertical-align: middle;
}
.bd-route-tag.land { background: rgba(139, 0, 0, 0.08); color: var(--bd-saffron); }
.bd-route-tag.sea { background: rgba(70, 130, 180, 0.08); color: var(--bd-stone-blue); }
.bd-route-tag.south { background: rgba(46, 139, 87, 0.08); color: var(--bd-stone-green); }

/* ---------- 底部播放控件 ---------- */
.narrative-timeline-footer {
  padding: 14px 20px !important;
  border-top: 1px solid var(--bd-border) !important;
  background: rgba(248, 244, 236, 0.5);
}

.narrative-play-btn {
  background: var(--bd-saffron) !important;
  border-radius: 6px !important;
  padding: 8px 16px !important;
}
.narrative-play-btn:hover {
  background: var(--bd-saffron-dark) !important;
}

.narrative-progress {
  background: var(--bd-border) !important;
}

.narrative-progress-bar {
  background: var(--bd-saffron) !important;
}

.demo-tech-tag {
  background: rgba(184, 134, 11, 0.08) !important;
  color: var(--bd-gold) !important;
  border-color: var(--bd-border) !important;
}

/* ---------- 响应式 ---------- */
@media (max-width: 1024px) {
  .framework-narrative .narrative-main {
    grid-template-columns: 1fr !important;
    grid-template-rows: 58% 42% !important;
  }
  .narrative-map-area {
    border-right: none !important;
    border-bottom: 1px solid var(--bd-border) !important;
  }
  .narrative-info-card {
    max-width: 300px;
    bottom: 16px;
    left: 16px;
  }
  .bd-route-legend { display: none; }
}

@media (max-width: 768px) {
  .narrative-info-card {
    left: 12px !important;
    right: 12px !important;
    max-width: none !important;
    bottom: 12px !important;
  }
  .bd-card-body { padding: 12px 16px 14px; }
  .bd-card-header { padding: 14px 16px 10px; }
  .narrative-info-year { font-size: 22px !important; }
  .narrative-info-title { font-size: 16px !important; }
  .narrative-info-desc { font-size: 12px !important; }
  .bd-card-sutra-text { font-size: 13px; }
  .bd-corner-deco { display: none; }
  .narrative-timeline-list { padding: 12px 16px !important; }
  .narrative-timeline-list::before { left: 30px !important; }
  .timeline-event-dot { margin-left: 10px !important; }
}
</style>
</head>
<body>

<!-- ====== 入场莲花动画 ====== -->
<div class="bd-entry" id="entryOverlay">
  <div class="bd-entry-glow"></div>
  <div style="display:flex;flex-direction:column;align-items:center;">
    <svg class="bd-entry-lotus" viewBox="0 0 100 100" fill="none">
      <!-- 莲花花瓣 -->
      <path d="M50 20 Q55 35 50 50 Q45 35 50 20" fill="#DAA520" opacity="0.8"/>
      <path d="M50 50 Q65 35 75 40 Q65 50 50 50" fill="#B8860B" opacity="0.7"/>
      <path d="M50 50 Q35 35 25 40 Q35 50 50 50" fill="#B8860B" opacity="0.7"/>

    if (e.route) {
      const isSea = e.route.type === 'sea';
      const line = L.polyline(e.route.coords, {
        color: e.route.color,
        weight: 1.5,
        opacity: 0.12,
        dashArray: isSea ? null : '4 8',
        lineCap: 'round'
      }).addTo(map);
      allRouteLines.push(line);
    }
  });

  // 创建标记点
  events.forEach((e, i) => {
    const icon = L.divIcon({
      className: 'bd-marker-wrapper',
      html: `<div class="bd-marker future" data-idx="${i}" data-type="${e.markerType}">
              <div class="bd-marker-dot"></div>
              <div class="bd-marker-label">${e.place}</div>
            </div>`,
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    const marker = L.marker([e.lat, e.lng], { icon }).addTo(map);
    marker.on('click', () => selectEvent(i));
    markers.push(marker);
  });

  map.on('movestart', () => { isFlying = true; });
  map.on('moveend', () => { isFlying = false; });

  // 窗口resize时重新计算地图尺寸
  window.addEventListener('resize', () => {
    if (map) {
      map.invalidateSize();
    }
  });
}

// ====== 更新标记状态 ======
function updateMarkers() {
  markers.forEach((marker, i) => {
    const el = marker.getElement();
    if (!el) return;
    const inner = el.querySelector('.bd-marker');
    if (!inner) return;

    inner.classList.remove('active', 'past', 'future');
    if (i === currentEvent) {
      inner.classList.add('active');
    } else if (i < currentEvent) {
      inner.classList.add('past');
    } else {
      inner.classList.add('future');
    }
  });
}

// ====== 更新路线 ======
function updateRoute() {
  // 移除当前高亮路线
  if (currentRouteLine) {
    map.removeLayer(currentRouteLine);
    currentRouteLine = null;
  }

  const e = events[currentEvent];
  if (e.route) {
    const isSea = e.route.type === 'sea';
    currentRouteLine = L.polyline(e.route.coords, {
      color: e.route.color,
      weight: 2.5,
      opacity: 0.65,
      dashArray: isSea ? null : '6 8',
      lineCap: 'round'
    }).addTo(map);

    // 路线绘制动画效果
    if (currentRouteLine._path) {
      const pathLength = currentRouteLine._path.getTotalLength();
      currentRouteLine._path.style.strokeDasharray = isSea ? pathLength : `${pathLength} ${pathLength}`;
      currentRouteLine._path.style.strokeDashoffset = pathLength;
      gsap.to(currentRouteLine._path, {
        strokeDashoffset: 0,
        duration: 1.2,
        ease: 'power2.out',
        onComplete: () => {
          if (!isSea && currentRouteLine && currentRouteLine._path) {
            currentRouteLine._path.style.strokeDasharray = '6 8';
            currentRouteLine._path.style.strokeDashoffset = '0';
          }
        }
      });
    }
  }
}

// ====== 构建时间轴 ======
function buildTimeline() {
  const list = document.getElementById('timelineList');
  list.innerHTML = events.map((e, i) => {
    const routeTag = e.route ? `<span class="bd-route-tag ${e.route.type === 'land-sea' ? 'land' : e.route.type}">${routeTypeNames[e.route.type] || ''}</span>` : '';
    return `
    <div class="timeline-event ${i === currentEvent ? 'active' : ''}" data-idx="${i}" data-type="${e.markerType}">
      <div class="timeline-event-dot"></div>
      <div class="timeline-event-content">
        <div class="timeline-event-year">${e.yearLabel}${routeTag}</div>
        <div class="timeline-event-title">${e.title}</div>
        <div class="bd-event-place">${e.place}</div>
        <div class="timeline-event-desc">${e.desc.substring(0, 60)}…</div>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.timeline-event').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      selectEvent(idx);
    });
  });
}

// ====== 构建阶段进度条 ======
function buildPhaseBar() {
  const bar = document.getElementById('phaseBar');
  bar.innerHTML = phases.map((p, i) => {
    const eventCount = events.filter(e => e.phaseIdx === i).length;
    return `<div class="bd-phase-segment" data-phase="${i}"
             style="flex: ${eventCount};"
             title="${p.name}"></div>`;
  }).join('');
}

// ====== 更新阶段进度条 ======
function updatePhaseBar() {
  const currentPhase = events[currentEvent].phaseIdx;
  document.querySelectorAll('.bd-phase-segment').forEach((el, i) => {
    el.classList.remove('active', 'past');
    if (i === currentPhase) el.classList.add('active');
    else if (i < currentPhase) el.classList.add('past');
  });
}

// ====== 选中事件 ======
function selectEvent(idx) {
  currentEvent = idx;
  const e = events[idx];

  // 更新信息卡片
  const card = document.getElementById('infoCard');
  gsap.fromTo(card,
    { opacity: 0.6, y: 8 },
    { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }
  );

  document.getElementById('infoYear').textContent = e.year;
  document.getElementById('infoPhase').textContent = e.phase;
  document.getElementById('infoPlace').textContent = e.place;
  document.getElementById('infoModernPlace').textContent = '· ' + e.modernPlace;
  document.getElementById('infoTitle').textContent = e.title;
  document.getElementById('infoDesc').textContent = e.desc;
  document.getElementById('infoSeal').textContent = e.seal;

  // 经文展示
  const sutraEl = document.getElementById('infoSutra');
  if (e.sutra) {
    sutraEl.style.display = 'block';
    document.getElementById('infoSutraText').textContent = e.sutra.text;
    document.getElementById('infoSutraSource').textContent = e.sutra.source;
    gsap.fromTo(sutraEl,
      { opacity: 0, x: -10 },
      { opacity: 1, x: 0, duration: 0.5, delay: 0.2, ease: 'power2.out' }
    );
  } else {
    sutraEl.style.display = 'none';
  }

  // 更新时间轴高亮
  document.querySelectorAll('.timeline-event').forEach((el, i) => {
    el.classList.remove('active', 'past');
    if (i === idx) el.classList.add('active');
    else if (i < idx) el.classList.add('past');
  });

  // 滚动到当前事件
  const activeEl = document.querySelector('.timeline-event.active');
  if (activeEl) {
    activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // 更新进度条
  const progress = ((idx + 1) / events.length) * 100;
  document.getElementById('progressBar').style.width = `${progress}%`;
  document.getElementById('eventCounter').textContent = `${idx + 1} / ${events.length}`;

  // 更新地图
  updateMarkers();
  updateRoute();
  updatePhaseBar();

  // 飞到当前位置
  if (!isFlying) {
    const zoomLevel = e.route && e.route.coords.length > 3 ? 4 : Math.max(map.getZoom(), 5);
    map.flyTo([e.lat, e.lng], zoomLevel, {
      duration: 1.2,
      easeLinearity: 0.25
    });
  }
}

// ====== 播放控制 ======
function togglePlay() {
  isPlaying = !isPlaying;
  const icon = document.getElementById('playIcon');
  const label = document.getElementById('playLabel');

  if (isPlaying) {
    icon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
    label.textContent = '暂停';

    playTimer = setInterval(() => {
      let next = currentEvent + 1;
      if (next >= events.length) {
        next = 0;
      }
      selectEvent(next);
    }, 5000);
  } else {
    icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    label.textContent = '播放';
    clearInterval(playTimer);
  }
}

// ====== 键盘导航 ======
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    if (currentEvent > 0) selectEvent(currentEvent - 1);
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (currentEvent < events.length - 1) selectEvent(currentEvent + 1);
  } else if (e.key === ' ') {
    e.preventDefault();
    togglePlay();
  }
});

// ====== 导航栏滚动 ======
window.addEventListener('scroll', () => {
  document.getElementById('demoNavbar').classList.toggle('scrolled', window.scrollY > 10);
});

// ====== 初始化 ======
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  buildTimeline();
  buildPhaseBar();

  // 确保地图容器尺寸正确
  setTimeout(() => {
    if (map) map.invalidateSize();
  }, 100);

  // 延迟选中第一个事件（等地图加载）
  setTimeout(() => {
    selectEvent(0);
  }, 300);

  // 播放按钮
  document.getElementById('playBtn').addEventListener('click', togglePlay);

  // 入场动画淡出
  setTimeout(() => {
    document.getElementById('entryOverlay').classList.add('hidden');
    // 入场动画隐藏后重新计算地图尺寸
    setTimeout(() => {
      document.getElementById('entryOverlay').style.display = 'none';
      if (map) map.invalidateSize();
    }, 1200);
  }, 3000);
});
</script>
