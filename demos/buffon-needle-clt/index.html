<script>
/* ============================================================
   蒲丰投针与中心极限定理 · 杂志讲解型 Demo
   5 步：引言 → 几何设置 → 概率推导 → 蒙特卡洛实验 → CLT
   ============================================================ */

// ====== 工具函数 ======
function gaussRandom() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function normalPDF(x, mu, sigma) {
  return (1 / (sigma * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * ((x - mu) / sigma) ** 2);
}

// ====== 步骤内容数据（左侧文章） ======
const steps = [
  {
    title: '当投针遇上 π',
    content: `
      <p class="lead">1733 年，法国博物学家蒲丰提出了一个看似无聊的问题：把针随机扔在画了平行线的地板上，针压线的概率是多少？</p>
      <p>答案令人吃惊——这个概率里竟然藏着 <span class="buffon-inline-formula">π</span>。也就是说，只要你扔足够多的针，数一数有多少根压住了线，就能估算出圆周率。</p>
      <div class="buffon-callout">
        随机性，居然能用来计算一个确定的数学常数。这是人类历史上最早的<strong>蒙特卡洛方法</strong>实例——比计算机诞生早了两百年。
      </div>
      <p>右侧动画正在模拟投针过程：粉色针压住了线，灰色针没有。随着针数增加，估算的 π 值会越来越接近真实值。</p>
      <p>但这只是故事的一半。当我们反复进行这个实验时，一个更深刻的规律会浮现——<strong>中心极限定理</strong>。</p>
    `
  },
  {
    title: '问题的几何',
    content: `
      <p class="lead">先把问题说清楚：地板上画着间距为 <span class="buffon-inline-formula">d</span> 的平行线，针的长度为 <span class="buffon-inline-formula">l</span>（且 l ≤ d）。随机投下一根针，它压住线的概率是多少？</p>
      <div class="buffon-stat-row">
        <div class="buffon-stat">
          <span class="num" style="color:var(--buffon-violet)">θ</span>
          <span class="desc"><strong>针与线的夹角</strong><br>均匀分布于 0 到 π</span>
        </div>
        <div class="buffon-stat">
          <span class="num" style="color:var(--buffon-pink)">y</span>
          <span class="desc"><strong>针中心到最近线的距离</strong><br>均匀分布于 0 到 d/2</span>
        </div>
      </div>
      <p>"随机"意味着两个变量各自均匀分布且相互独立。关键洞察是：针是否压线，完全由 θ 和 y 决定。</p>
      <div class="buffon-callout">
        <strong>压线条件</strong>：当针中心到线的距离 <span class="buffon-inline-formula">y ≤ (l/2)·sin θ</span> 时，针压住线。<br><br>
        也就是说，角度越接近水平（θ → π/2），针越容易压线；越接近垂直（θ → 0），越不容易。

  '概率的几何意义：sin 曲线下方面积与矩形面积之比',
  '蒙特卡洛实验：亲手投针估算 π，直方图记录每批估计值',
  '中心极限定理：批次估计值收敛为正态分布'
];

// ====== 状态 ======
let currentStep = 0;
let isAutoPlaying = false;
let autoPlayTimer = null;
let progressAnimId = null;
let stepCleanup = []; // 清理函数数组

// ====== 导航逻辑 ======
const stepContent = document.getElementById('stepContent');
const stepLabel = document.getElementById('stepLabel');
const stepDots = document.querySelectorAll('.magazine-step-dot');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const visualWrapper = document.getElementById('visualWrapper');
const visualCaption = document.getElementById('visualCaption');
const autoplayBtn = document.getElementById('autoplayBtn');
const progressTrack = document.getElementById('progressTrack');
const progressFill = document.getElementById('progressFill');

function cleanupStep() {
  stepCleanup.forEach(fn => { try { fn(); } catch(e){} });
  stepCleanup = [];
}

function updateStep() {
  cleanupStep();

  stepContent.classList.add('fade-out');
  setTimeout(() => {
    const step = steps[currentStep];
    stepContent.innerHTML = `<h3 style="font-family:var(--font-serif);font-size:var(--fs-h2);margin-bottom:12px;color:var(--text);">${step.title}</h3>${step.content}`;
    stepContent.classList.remove('fade-out');
    stepContent.classList.add('fade-in');
    setTimeout(() => stepContent.classList.remove('fade-in'), 300);
  }, 200);

  stepLabel.textContent = `第 ${currentStep + 1} / ${steps.length} 步`;

  stepDots.forEach((dot, i) => {
    dot.classList.remove('active', 'completed');
    if (i === currentStep) dot.classList.add('active');
    else if (i < currentStep) dot.classList.add('completed');
  });

  prevBtn.disabled = currentStep === 0;
  prevBtn.style.opacity = currentStep === 0 ? '0.4' : '1';
  prevBtn.style.cursor = currentStep === 0 ? 'not-allowed' : 'pointer';
  nextBtn.innerHTML = currentStep === steps.length - 1
    ? '完成 ✓'
    : '下一步 <span>→</span>';

  visualCaption.textContent = captions[currentStep];
  renderVisual(currentStep);
}

prevBtn.addEventListener('click', () => {
  if (currentStep > 0) { currentStep--; updateStep(); resetAutoPlayProgress(); }
});
nextBtn.addEventListener('click', () => {
  if (currentStep < steps.length - 1) { currentStep++; updateStep(); resetAutoPlayProgress(); }
});
stepDots.forEach(dot => {
  dot.addEventListener('click', () => {
    const s = parseInt(dot.dataset.step);
    if (s !== currentStep) { currentStep = s; updateStep(); resetAutoPlayProgress(); }
  });
});

// ====== 自动播放 ======
function toggleAutoPlay() {
  if (isAutoPlaying) stopAutoPlay();
  else startAutoPlay();
}
function startAutoPlay() {
  isAutoPlaying = true;
  autoplayBtn.classList.add('playing');
  autoplayBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>暂停';
  progressTrack.style.display = 'block';
  startProgressAnimation();
  autoPlayTimer = setTimeout(() => {
    if (currentStep < steps.length - 1) {
      currentStep++; updateStep(); startAutoPlay();
    } else { stopAutoPlay(); }
  }, 9000);
}
function stopAutoPlay() {
  isAutoPlaying = false;
  autoplayBtn.classList.remove('playing');
  autoplayBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>自动播放';
  progressTrack.style.display = 'none';
  progressFill.style.width = '0%';
  if (autoPlayTimer) { clearTimeout(autoPlayTimer); autoPlayTimer = null; }
  if (progressAnimId) { cancelAnimationFrame(progressAnimId); progressAnimId = null; }
}
function resetAutoPlayProgress() { if (isAutoPlaying) stopAutoPlay(); }
function startProgressAnimation() {
  const startTime = performance.now();
  const duration = 9000;
  function animate(now) {
    if (!isAutoPlaying) return;
    const elapsed = now - startTime;
    progressFill.style.width = Math.min(elapsed / duration * 100, 100) + '%';
    if (elapsed < duration) progressAnimId = requestAnimationFrame(animate);
  }
  progressAnimId = requestAnimationFrame(animate);
}
autoplayBtn.addEventListener('click', toggleAutoPlay);

const navbar = document.getElementById('demoNavbar');
window.addEventListener('scroll', () => {
  navbar.classList.toggle('scrolled', window.scrollY > 10);
});

// ====== 可视化渲染分发 ======
function renderVisual(step) {
  visualWrapper.innerHTML = '';
  switch (step) {
    case 0: renderStep1(); break;
    case 1: renderStep2(); break;
    case 2: renderStep3(); break;
    case 3: renderStep4(); break;
    case 4: renderStep5(); break;
  }
}

// 步骤 1：投针动画
// ============================================================
function renderStep1() {
  visualWrapper.innerHTML = `
    <canvas class="buffon-hero-canvas" id="heroCanvas"></canvas>
    <div class="buffon-hero-stats">
      <div class="buffon-hero-stat">
        <span class="num" id="heroTotal" style="color:var(--buffon-violet)">0</span>
        <span class="desc">投针总数</span>
      </div>
      <div class="buffon-hero-stat">
        <span class="num" id="heroCross" style="color:var(--buffon-pink)">0</span>
        <span class="desc">压线数</span>
      </div>
      <div class="buffon-hero-stat">
        <span class="num" id="heroPi" style="color:var(--buffon-emerald)">—</span>
        <span class="desc">π 估计值</span>
      </div>
    </div>
    <div class="buffon-legend">
      <div class="buffon-legend-item"><span class="buffon-legend-line" style="background:var(--buffon-pink);"></span>压线</div>
      <div class="buffon-legend-item"><span class="buffon-legend-line" style="background:var(--buffon-slate);"></span>未压线</div>
      <div class="buffon-legend-item"><span class="buffon-legend-line" style="background:var(--buffon-line);"></span>平行线</div>
    </div>
  `;

  const canvas = document.getElementById('heroCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;

  const W = 560, H = 380;
  canvas.style.height = H + 'px';
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const lineSpacing = 50;
  const needleLen = 40;
  const lineCount = Math.floor(H / lineSpacing) + 1;

  let needles = [];
  let totalNeedles = 0;
  let crossingCount = 0;
  let animId = null;
  let dropCounter = 0;

  function drawBackground() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#CBD5E1';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < lineCount; i++) {
      const y = i * lineSpacing + 20;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  }

  function dropNeedle() {
    const cx = Math.random() * (W - 40) + 20;
    const cy = Math.random() * (H - 40) + 20;
    const angle = Math.random() * Math.PI;
    const dx = (needleLen / 2) * Math.cos(angle);
    const dy = (needleLen / 2) * Math.sin(angle);

    const distToLine = Math.abs((cy - 20) % lineSpacing);
    const minDist = Math.min(distToLine, lineSpacing - distToLine);
    const crosses = minDist <= Math.abs(dy);

    needles.push({
      x1: cx - dx, y1: cy - dy, x2: cx + dx, y2: cy + dy,
      crosses, opacity: 0, age: 0
    });
    totalNeedles++;
    if (crosses) crossingCount++;

    const piEst = crossingCount > 0 ? (2 * needleLen * totalNeedles) / (lineSpacing * crossingCount) : 0;
    document.getElementById('heroTotal').textContent = totalNeedles;
    document.getElementById('heroCross').textContent = crossingCount;
    document.getElementById('heroPi').textContent = crossingCount > 0 ? piEst.toFixed(3) : '—';
  }

  function animate() {
    drawBackground();

    // 逐渐老化旧针，最多保留 200 根
    if (needles.length > 200) needles = needles.slice(-200);

    for (let n of needles) {
      n.age++;
      if (n.opacity < 1) n.opacity = Math.min(1, n.opacity + 0.08);
      ctx.globalAlpha = n.opacity * Math.max(0.3, 1 - (n.age - 200) / 100);
      ctx.strokeStyle = n.crosses ? '#EC4899' : '#94A3B8';
      ctx.lineWidth = n.crosses ? 2.5 : 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(n.x1, n.y1);
      ctx.lineTo(n.x2, n.y2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    dropCounter++;
    if (dropCounter % 8 === 0 && totalNeedles < 500) dropNeedle();

    animId = requestAnimationFrame(animate);
  }

  drawBackground();
  animate();

  stepCleanup.push(() => { if (animId) cancelAnimationFrame(animId); });
}

function renderStep2() {
  visualWrapper.innerHTML = `

    const x1 = cx - dx, y1 = cy - dy2;
    const x2 = cx + dx, y2 = cy + dy2;

    // Threshold curve y = (l/2)sin θ
    let curvePath = '';
    for (let a = 0; a <= 180; a += 2) {

      const py = (l / 2) * Math.sin(rad);

      <line x1="440" y1="${baseY}" x2="440" y2="${baseY + d}" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="448" y="${baseY + d/2 + 4}" font-family="JetBrains Mono" font-size="13" fill="#6b7b6b">d</text>

      <!-- Threshold curve -->
      <path d="${curvePath}" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,3" opacity="0.5"/>
      <text x="180" y="${baseY + d/2 - 35}" font-family="Noto Serif SC" font-size="12" fill="#8B5CF6" font-style="italic">y = (l/2)·sin θ</text>

      <!-- Current point on curve -->
      <circle cx="${angleDeg * 2 + 20}" cy="${baseY + d/2 - dy}" r="4" fill="#8B5CF6" opacity="0.6"/>

      <line x1="${cx - 80}" y1="${baseY}" x2="${cx - 80}" y2="${cy}" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="2,2"/>
      <text x="${cx - 95}" y="${(baseY + cy) / 2 + 4}" font-family="JetBrains Mono" font-size="12" fill="#EC4899">y</text>

      <!-- Angle arc -->
      <path d="M ${cx + 25} ${cy} A 25 25 0 0 ${angleDeg > 180 ? 1 : 0} ${cx + 25 * Math.cos(angleRad)} ${cy + 25 * Math.sin(angleRad)}"
            fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="${cx + 35}" y="${cy + 8}" font-family="JetBrains Mono" font-size="12" fill="#8B5CF6">θ</text>

  angleSlider.addEventListener('input', updateGeo);

// 步骤 3：概率推导图
// ============================================================
function renderStep3() {
  visualWrapper.innerHTML = `
    <div class="buffon-deriv-container">
      <svg class="buffon-deriv-svg" id="derivSvg" viewBox="0 0 460 300"></svg>
      <div class="buffon-formula-box">
        <div class="formula">
          P = <span class="frac"><span class="num">2l</span><span class="den">πd</span></span>
          &nbsp;⟹&nbsp; π ≈ <span class="frac"><span class="num">2lN</span><span class="den">dM</span></span>
        </div>
        <div style="font-size:var(--fs-small);color:var(--text-muted);font-family:var(--font-serif);font-style:italic;">
          N = 总投针数, M = 压线数
        </div>
      </div>
      <div class="buffon-calc-steps">
        <div class="calc-line"><span class="calc-highlight">∫₀^π</span> sin θ dθ = [-cos θ]₀^π = 1 - (-1) = <span class="calc-highlight">2</span></div>
        <div class="calc-line">压线面积 = (l/2) × 2 = <span class="calc-highlight">l</span></div>
        <div class="calc-line">总面积 = π × (d/2) = <span class="calc-highlight">πd/2</span></div>
        <div class="calc-line" style="border-top:1px solid var(--border);padding-top:8px;margin-top:4px;">
          P = l / (πd/2) = <span class="calc-highlight">2l / (πd)</span>
        </div>
      </div>
    </div>
  `;

  const svg = document.getElementById('derivSvg');
  const padL = 50, padB = 40, padT = 20, padR = 20;
  const plotW = 460 - padL - padR;
  const plotH = 300 - padB - padT;
  const l = 1; // normalized

  // θ axis: 0 to π, y axis: 0 to 0.5 (d/2 with d=1)
  function thetaToX(t) { return padL + (t / Math.PI) * plotW; }
  function yToY(y) { return padT + plotH - (y / 0.5) * plotH; }

  // Curve y = (l/2) sin θ, l=1 → y = 0.5 sin θ
  let curvePath = '';
  let areaPath = '';
  for (let i = 0; i <= 100; i++) {
    const t = (i / 100) * Math.PI;
    const y = 0.5 * Math.sin(t);
    const px = thetaToX(t);
    const py = yToY(y);
    curvePath += (i === 0 ? 'M' : 'L') + px + ',' + py + ' ';
    areaPath += (i === 0 ? 'M' : 'L') + px + ',' + py + ' ';
  }
  areaPath += `L ${thetaToX(Math.PI)},${yToY(0)} L ${thetaToX(0)},${yToY(0)} Z`;

  // π tick marks on x-axis
  const xTicks = [
    { val: 0, label: '0' },
    { val: Math.PI / 4, label: 'π/4' },
    { val: Math.PI / 2, label: 'π/2' },
    { val: 3 * Math.PI / 4, label: '3π/4' },
    { val: Math.PI, label: 'π' }
  ];

  let xTickEls = '';
  for (let tick of xTicks) {
    const x = thetaToX(tick.val);
    xTickEls += `<line x1="${x}" y1="${padT + plotH}" x2="${x}" y2="${padT + plotH + 5}" stroke="#a3a3a3" stroke-width="1"/>`;
    xTickEls += `<text x="${x}" y="${padT + plotH + 18}" font-family="JetBrains Mono" font-size="11" fill="#6b7b6b" text-anchor="middle">${tick.label}</text>`;
  }

  svg.innerHTML = `
    <!-- Area under curve (压线区域) -->
    <path d="${areaPath}" fill="rgba(139,92,246,0.12)"/>

    <!-- Rectangle outline (总面积) -->
    <rect x="${thetaToX(0)}" y="${yToY(0.5)}" width="${plotW}" height="${plotH}" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Curve -->
    <path d="${curvePath}" fill="none" stroke="#8B5CF6" stroke-width="2.5"/>

    <!-- Axes -->
    <line x1="${padL}" y1="${padT + plotH}" x2="${padL + plotW}" y2="${padT + plotH}" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- X ticks -->
    ${xTickEls}

    <!-- Y label -->
    <text x="${padL - 10}" y="${yToY(0.25) + 4}" font-family="JetBrains Mono" font-size="11" fill="#6b7b6b" text-anchor="end">d/2</text>
    <text x="${padL - 10}" y="${yToY(0) + 4}" font-family="JetBrains Mono" font-size="11" fill="#6b7b6b" text-anchor="end">0</text>

    <!-- Axis labels -->
    <text x="${padL + plotW / 2}" y="${300 - 8}" font-family="Noto Serif SC" font-size="13" fill="#1a1a1a" text-anchor="middle" font-style="italic">θ</text>
    <text x="15" y="${padT + plotH / 2}" font-family="Noto Serif SC" font-size="13" fill="#1a1a1a" text-anchor="middle" font-style="italic" transform="rotate(-90 15 ${padT + plotH / 2})">y</text>

    <!-- Area label -->
    <text x="${thetaToX(Math.PI / 2)}" y="${yToY(0.2)}" font-family="Noto Serif SC" font-size="13" fill="#8B5CF6" text-anchor="middle" font-weight="600">压线面积 = l</text>

    <!-- Rectangle label -->
    <text x="${thetaToX(Math.PI * 0.85)}" y="${yToY(0.45)}" font-family="Noto Serif SC" font-size="11" fill="#94A3B8" text-anchor="middle">总面积 = πd/2</text>

    <!-- Curve label -->
    <text x="${thetaToX(Math.PI / 4)}" y="${yToY(0.5 * Math.sin(Math.PI/4)) - 10}" font-family="Noto Serif SC" font-size="12" fill="#8B5CF6" font-style="italic">y = (l/2)sin θ</text>
  `;
}

// ============================================================
// 步骤 4：蒙特卡洛实验
// ============================================================
function renderStep4() {
  visualWrapper.innerHTML = `
    <div class="buffon-sim-container">
      <div class="buffon-sim-canvas-wrapper">
        <canvas class="buffon-sim-canvas" id="simCanvas"></canvas>
      </div>
      <div class="buffon-sim-controls">
        <div class="buffon-slider-row" style="flex:1;min-width:140px;margin:0;">
          <div class="buffon-slider-header">
            <span class="buffon-slider-name">针长 l</span>
            <span class="buffon-slider-val" id="simLenVal" style="color:var(--buffon-violet)">40</span>
          </div>
          <input type="range" class="buffon-slider violet" id="simLen" min="10" max="45" step="1" value="40">
        </div>
        <button class="buffon-sim-btn primary" id="simDrop10">投 10 根</button>
        <button class="buffon-sim-btn primary" id="simDrop100">投 100 根</button>
        <button class="buffon-sim-btn" id="simReset">重置</button>
      </div>
      <div class="buffon-sim-stats">
        <div class="buffon-sim-stat">
          <span class="num violet" id="simTotal">0</span>
          <span class="desc">总针数 N</span>
        </div>
        <div class="buffon-sim-stat">
          <span class="num pink" id="simCross">0</span>
          <span class="desc">压线数 M</span>
        </div>
        <div class="buffon-sim-stat">
          <span class="num emerald" id="simPi">—</span>
          <span class="desc">π 估计值</span>
        </div>
      </div>
      <div class="buffon-sim-histogram-wrapper">
        <div class="buffon-sim-histogram-title">每 100 根针一组的 π 估计值分布</div>
        <canvas class="buffon-sim-histogram-canvas" id="simHistogram"></canvas>
      </div>
    </div>
  `;

  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = 540, H = 280;
  canvas.style.height = H + 'px';
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const histCanvas = document.getElementById('simHistogram');
  const histCtx = histCanvas.getContext('2d');
  const histW = 540, histH = 80;
  histCanvas.style.height = histH + 'px';
  histCanvas.width = histW * dpr;
  histCanvas.height = histH * dpr;
  histCtx.scale(dpr, dpr);

  const lineSpacing = 50;
  let needleLen = 40;
  let needles = [];
  let totalNeedles = 0;
  let crossingCount = 0;
  let batchEstimates = []; // π estimates per batch of 100
  let batchNeedleCount = 0; // needles in current batch (independent of array trimming)
  let batchCrossCount = 0;  // crossings in current batch

  function drawSim() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    // Draw lines
    ctx.strokeStyle = '#CBD5E1';
    ctx.lineWidth = 1.5;
    const lineCount = Math.floor(H / lineSpacing) + 1;
    for (let i = 0; i < lineCount; i++) {
      const y = i * lineSpacing + 20;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    // Draw needles
    for (let n of needles) {
      ctx.strokeStyle = n.crosses ? '#EC4899' : '#94A3B8';
      ctx.lineWidth = n.crosses ? 2 : 1.5;
      ctx.lineCap = 'round';
      ctx.globalAlpha = 0.7;
      ctx.beginPath();
      ctx.moveTo(n.x1, n.y1);
      ctx.lineTo(n.x2, n.y2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function dropNeedles(count) {
    for (let i = 0; i < count; i++) {
      const cx = Math.random() * (W - 40) + 20;
      const cy = Math.random() * (H - 40) + 20;
      const angle = Math.random() * Math.PI;
      const dx = (needleLen / 2) * Math.cos(angle);
      const dy = (needleLen / 2) * Math.sin(angle);

      const distToLine = Math.abs((cy - 20) % lineSpacing);
      const minDist = Math.min(distToLine, lineSpacing - distToLine);
      const crosses = minDist <= Math.abs(dy);

      needles.push({
        x1: cx - dx, y1: cy - dy, x2: cx + dx, y2: cy + dy, crosses
      });
      totalNeedles++;
      if (crosses) crossingCount++;

      // Batch tracking (independent of needles array trimming)
      batchNeedleCount++;
      if (crosses) batchCrossCount++;
      if (batchNeedleCount >= 100) {
        if (batchCrossCount > 0) {
          const piEst = (2 * needleLen * 100) / (lineSpacing * batchCrossCount);
          batchEstimates.push(piEst);
          if (batchEstimates.length > 200) batchEstimates.shift();
        }
        batchNeedleCount = 0;
        batchCrossCount = 0;
      }
    }

    // Keep needle array manageable
    if (needles.length > 2000) needles = needles.slice(-2000);

    updateStats();
    drawSim();
    drawHistogram();
  }

  function updateStats() {
    document.getElementById('simTotal').textContent = totalNeedles;
    document.getElementById('simCross').textContent = crossingCount;
    const piEst = crossingCount > 0 ? (2 * needleLen * totalNeedles) / (lineSpacing * crossingCount) : 0;
    document.getElementById('simPi').textContent = crossingCount > 0 ? piEst.toFixed(4) : '—';
  }

  function drawHistogram() {
    histCtx.fillStyle = '#f3efe9';
    histCtx.fillRect(0, 0, histW, histH);

    if (batchEstimates.length < 2) {
      histCtx.fillStyle = '#a3a3a3';
      histCtx.font = '12px sans-serif';
      histCtx.textAlign = 'center';
      histCtx.fillText('投满 100 根针后开始记录', histW / 2, histH / 2);
      return;
    }

    // Range: 1 to 6
    const minVal = 1, maxVal = 6;
    const bins = 50;
    const binWidth = (maxVal - minVal) / bins;
    const counts = new Array(bins).fill(0);
    for (let v of batchEstimates) {
      let bin = Math.floor((v - minVal) / binWidth);
      if (bin < 0) bin = 0;
      if (bin >= bins) bin = bins - 1;
      counts[bin]++;
    }
    const maxCount = Math.max(...counts, 1);
    const barW = histW / bins;

    for (let i = 0; i < bins; i++) {
      const x = i * barW;
      const barH = (counts[i] / maxCount) * (histH - 10);
      // Color gradient: far from π = red, close = green
      const binCenter = minVal + (i + 0.5) * binWidth;
      const dist = Math.abs(binCenter - Math.PI);
      if (dist < 0.3) {
        histCtx.fillStyle = '#10B981';
      } else if (dist < 0.8) {
        histCtx.fillStyle = '#8B5CF6';
      } else {
        histCtx.fillStyle = '#EC4899';
      }
      histCtx.fillRect(x, histH - barH, barW - 1, barH);
    }

    // π line
    const piX = ((Math.PI - minVal) / (maxVal - minVal)) * histW;
    histCtx.strokeStyle = '#1a1a1a';
    histCtx.lineWidth = 1.5;
    histCtx.setLineDash([3, 3]);
    histCtx.beginPath();
    histCtx.moveTo(piX, 0);
    histCtx.lineTo(piX, histH);
    histCtx.stroke();
    histCtx.setLineDash([]);
    histCtx.fillStyle = '#1a1a1a';
    histCtx.font = 'bold 11px JetBrains Mono';
    histCtx.textAlign = 'left';
    histCtx.fillText('π', piX + 3, 12);
  }

  function reset() {
    needles = [];
    totalNeedles = 0;
    crossingCount = 0;
    batchEstimates = [];
    batchNeedleCount = 0;
    batchCrossCount = 0;
    updateStats();
    drawSim();
    drawHistogram();
  }

  document.getElementById('simDrop10').addEventListener('click', () => dropNeedles(10));
  document.getElementById('simDrop100').addEventListener('click', () => dropNeedles(100));
  document.getElementById('simReset').addEventListener('click', reset);

  const lenSlider = document.getElementById('simLen');
  const lenVal = document.getElementById('simLenVal');
  lenSlider.addEventListener('input', () => {
    needleLen = parseInt(lenSlider.value);
    lenVal.textContent = needleLen;
  });

  drawSim();
  drawHistogram();

  // Auto-drop some needles for initial display
  setTimeout(() => dropNeedles(50), 300);
}

// ============================================================
// 步骤 5：CLT 演示
// ============================================================
function renderStep5() {
  visualWrapper.innerHTML = `
    <div class="buffon-clt-container">
      <div class="buffon-clt-canvas-wrapper">
        <canvas class="buffon-clt-canvas" id="cltCanvas"></canvas>
      </div>
      <div class="buffon-geo-controls">
        <div class="buffon-slider-row" style="margin:0;">
          <div class="buffon-slider-header">
            <span class="buffon-slider-name">批次大小（每组针数）</span>
            <span class="buffon-slider-val" id="cltBatchVal" style="color:var(--buffon-violet)">50</span>
          </div>
          <input type="range" class="buffon-slider violet" id="cltBatch" min="10" max="500" step="10" value="50">
        </div>
        <button class="buffon-sim-btn primary" id="cltRun" style="width:100%;justify-content:center;margin-top:8px;">运行 200 次实验</button>
      </div>
      <div class="buffon-clt-info">
        <div class="buffon-clt-info-card">
          <span class="num" id="cltMean" style="color:var(--buffon-violet)">—</span>
          <span class="desc">分布均值</span>
        </div>
        <div class="buffon-clt-info-card">
          <span class="num" id="cltStd" style="color:var(--buffon-pink)">—</span>
          <span class="desc">标准差</span>
        </div>
        <div class="buffon-clt-info-card">
          <span class="num" id="cltCount" style="color:var(--buffon-emerald)">0</span>
          <span class="desc">实验次数</span>
        </div>
      </div>
    </div>
  `;

  const canvas = document.getElementById('cltCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = 540, H = 280;
  canvas.style.height = H + 'px';
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const batchSlider = document.getElementById('cltBatch');
  const batchVal = document.getElementById('cltBatchVal');
  const runBtn = document.getElementById('cltRun');

  let estimates = [];
  let batchSize = 50;
  const l = 0.8; // l/d ratio
  const trueProb = 2 * l / Math.PI;
  let animId = null;

  batchSlider.addEventListener('input', () => {
    batchSize = parseInt(batchSlider.value);
    batchVal.textContent = batchSize;
  });

  function runOneExperiment() {
    let crosses = 0;
    for (let i = 0; i < batchSize; i++) {
      const theta = Math.random() * Math.PI;
      const y = Math.random() * 0.5; // y in [0, d/2], d=1
      if (y <= (l / 2) * Math.sin(theta)) crosses++;
    }
    if (crosses > 0) {
      return (2 * l * batchSize) / (1 * crosses);
    }
    return 4.0; // fallback
  }

  function drawCLT() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    const padL = 40, padR = 20, padT = 20, padB = 40;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    // X range: 1.5 to 5
    const xMin = 1.5, xMax = 5;

    // Axes
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(padL, padT + plotH);
    ctx.lineTo(padL + plotW, padT + plotH);
    ctx.moveTo(padL, padT);
    ctx.lineTo(padL, padT + plotH);
    ctx.stroke();

    // π line
    const piX = padL + ((Math.PI - xMin) / (xMax - xMin)) * plotW;
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(piX, padT);
    ctx.lineTo(piX, padT + plotH);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 12px JetBrains Mono';
    ctx.textAlign = 'center';
    ctx.fillText('π', piX, padT + plotH + 18);

    // X ticks
    ctx.font = '10px JetBrains Mono';
    ctx.fillStyle = '#6b7b6b';
    for (let v = 2; v <= 5; v++) {
      const x = padL + ((v - xMin) / (xMax - xMin)) * plotW;
      ctx.fillText(v.toString(), x, padT + plotH + 18);
    }

    if (estimates.length < 2) {
      ctx.fillStyle = '#a3a3a3';
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('点击"运行 200 次实验"开始', W / 2, H / 2);
      return;
    }

    // Histogram
    const bins = 40;
    const binWidth = (xMax - xMin) / bins;
    const counts = new Array(bins).fill(0);
    for (let v of estimates) {
      let bin = Math.floor((v - xMin) / binWidth);
      if (bin < 0) bin = 0;
      if (bin >= bins) bin = bins - 1;
      counts[bin]++;
    }
    const maxCount = Math.max(...counts, 1);

    const barW = plotW / bins;
    for (let i = 0; i < bins; i++) {
      const x = padL + i * barW;
      const barH = (counts[i] / maxCount) * (plotH - 10);
      const binCenter = xMin + (i + 0.5) * binWidth;
      const dist = Math.abs(binCenter - Math.PI);
      ctx.fillStyle = dist < 0.2 ? '#10B981' : (dist < 0.5 ? '#8B5CF6' : '#EC4899');
      ctx.fillRect(x, padT + plotH - barH, barW - 1, barH);
    }

    // Normal curve overlay
    const mean = estimates.reduce((a, b) => a + b, 0) / estimates.length;
    const variance = estimates.reduce((a, b) => a + (b - mean) ** 2, 0) / estimates.length;
    const std = Math.sqrt(variance);

    if (std > 0.001) {
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let i = 0; i <= 200; i++) {
        const x = xMin + (i / 200) * (xMax - xMin);
        const pdf = normalPDF(x, mean, std);
        const px = padL + ((x - xMin) / (xMax - xMin)) * plotW;
        const expectedCount = estimates.length * binWidth * pdf;
        const py = padT + plotH - (expectedCount / maxCount) * (plotH - 10);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }

    // Labels
    ctx.fillStyle = '#1a1a1a';
    ctx.font = '11px Noto Serif SC';
    ctx.textAlign = 'left';
    ctx.fillText('正态曲线', padL + plotW - 70, padT + 15);

    // Update info
    document.getElementById('cltMean').textContent = mean.toFixed(3);
    document.getElementById('cltStd').textContent = std.toFixed(3);
    document.getElementById('cltCount').textContent = estimates.length;
  }

  function runExperiments() {
    runBtn.disabled = true;
    runBtn.textContent = '运行中...';
    let count = 0;
    const target = 200;

    function step() {
      const batch = Math.min(10, target - count);
      for (let i = 0; i < batch; i++) {
        estimates.push(runOneExperiment());
      }
      count += batch;
      drawCLT();

      if (count < target) {
        animId = requestAnimationFrame(step);
      } else {
        runBtn.disabled = false;
        runBtn.textContent = '再运行 200 次';
        animId = null;
      }
    }
    step();
  }

  runBtn.addEventListener('click', runExperiments);

  // Initial empty draw
  drawCLT();

  // Auto-run after a moment
  setTimeout(() => runExperiments(), 500);

  stepCleanup.push(() => { if (animId) cancelAnimationFrame(animId); });
}

  if (e.key === 'ArrowRight' && currentStep < steps.length - 1) { currentStep++; updateStep(); resetAutoPlayProgress(); }
