.article-subtitle {

.article-body { display: flex; flex-direction: column; gap: var(--spacer-16); }

}

.article-body strong { color: var(--ri-violet); font-weight: 600; }

  gap: var(--spacer-12);

.step-dot {

}

.step-label {

}

<script>
/* ============================================================
   定积分的本质：黎曼和可视化
   杂志讲解型 · 5 步交互可视化
   ============================================================ */

// ====== 全局配置 ======
const COLORS = {
  violet: '#7c3aed',
  violetLight: '#8b5cf6',
  violetSoft: 'rgba(124, 58, 237, 0.12)',
  violetFill: 'rgba(124, 58, 237, 0.08)',
  coral: '#f43f5e',
  coralSoft: 'rgba(244, 63, 94, 0.12)',
  teal: '#0d9488',
  tealSoft: 'rgba(13, 148, 136, 0.12)',
  gray: '#94a3b8',
  axis: '#334155',
  grid: 'rgba(51, 65, 85, 0.06)',
  bg: '#ffffff',
  text: '#1a1a1a',
  textMuted: '#6b6b6b',
  surface: '#f3efe9',
  amber: '#d97706',
  amberSoft: 'rgba(217, 119, 6, 0.12)'
};

const canvas = document.getElementById('demoCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ====== 可用函数 ======
const FUNCTIONS = {
  'x²': { fn: x => x * x, label: 'x²', integral: (a, b) => (b**3 - a**3) / 3 },
  'sin(x)': { fn: x => Math.sin(x), label: 'sin(x)', integral: (a, b) => Math.cos(a) - Math.cos(b) },
  'x³−x': { fn: x => x*x*x - x, label: 'x³ − x', integral: (a, b) => (b**4/4 - b**2/2) - (a**4/4 - a**2/2) },
  '√x': { fn: x => Math.sqrt(Math.max(0, x)), label: '√x', integral: (a, b) => (2/3) * (b**1.5 - a**1.5) },
  'eˣ': { fn: x => Math.exp(x), label: 'eˣ', integral: (a, b) => Math.exp(b) - Math.exp(a) }
};

// ====== 步骤内容数据 ======
const steps = [
  {
    title: '面积之谜——古老的难题',
    content: `
      <p class="lead">我们知道如何求矩形、三角形的面积。但如果边界是一条曲线呢？</p>
      <p>古希腊的阿基米德用"穷竭法"来逼近曲线图形的面积：用多边形填充曲线内部，不断增加边数，让多边形面积"穷竭"曲线面积。这个两千多年前的思路，正是积分学的萌芽。</p>
      <div class="theorem-box">
        <div class="theorem-title">核心问题</div>
        <div class="theorem-text">

let currentStep = 0;
const stepContent = document.getElementById('stepContent');
const stepLabel = document.getElementById('stepLabel');
const stepDots = document.querySelectorAll('.step-dot');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const visualCaption = document.getElementById('visualCaption');
const dataOverlay = document.getElementById('dataOverlay');
const vizControls = document.getElementById('vizControls');
const autoplayBtn = document.getElementById('autoplayBtn');

let autoplayTimer = null;
let isAutoplaying = false;

const captions = [
  '图 1 · 面积之谜：从粗糙分割到精细逼近',
  '图 2 · 矩形逼近：左端点 / 右端点 / 中点',
  '图 3 · 黎曼和定义：n 增大，近似值收敛',
  '图 4 · 互动实验：自由选择函数与参数',
  '图 5 · 微积分基本定理：从和到积'
];

function updateStep(step) {
  currentStep = step;
  const s = steps[step];

  stepContent.classList.add('fade-out');
  setTimeout(() => {
    stepContent.innerHTML = `<h3 style="font-family:var(--font-serif);font-size:var(--fs-h2);margin-bottom:16px;color:var(--text);">${s.title}</h3>${s.content}`;
    stepContent.classList.remove('fade-out');
    stepContent.classList.add('fade-in');
    setTimeout(() => stepContent.classList.remove('fade-in'), 400);

    // 触发公式行逐行显示动画
    if (step === 2) {
      const lines = document.querySelectorAll('#formulaArea .formula-line');
      lines.forEach((line, i) => {
        setTimeout(() => line.classList.add('visible'), 300 + i * 400);
      });
    }
  }, 200);

  stepLabel.textContent = `第 ${step + 1} / ${steps.length} 步`;
  visualCaption.textContent = captions[step];

  stepDots.forEach((dot, i) => {
    dot.classList.remove('active', 'completed');
    if (i === step) dot.classList.add('active');
    else if (i < step) dot.classList.add('completed');
  });

  prevBtn.disabled = step === 0;
  prevBtn.style.opacity = step === 0 ? '0.5' : '1';
  prevBtn.style.cursor = step === 0 ? 'not-allowed' : 'pointer';

  nextBtn.innerHTML = step === steps.length - 1
    ? '完成 ✓'
    : '下一步 <span>→</span>';

  cleanupStep();
  renderStep(step);
}

prevBtn.addEventListener('click', () => {
  if (currentStep > 0) updateStep(currentStep - 1);
});

nextBtn.addEventListener('click', () => {
  if (currentStep < steps.length - 1) updateStep(currentStep + 1);
});

stepDots.forEach(dot => {
  dot.addEventListener('click', () => {
    const s = parseInt(dot.dataset.step);
    if (s !== currentStep) updateStep(s);
  });
});

// 键盘导航
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' && currentStep > 0) updateStep(currentStep - 1);
  if (e.key === 'ArrowRight' && currentStep < steps.length - 1) updateStep(currentStep + 1);
});

// ====== 自动播放 ======
autoplayBtn.addEventListener('click', () => {
  if (isAutoplaying) {
    stopAutoplay();
  } else {
    startAutoplay();
  }
});

function startAutoplay() {
  isAutoplaying = true;
  autoplayBtn.classList.add('playing');
  autoplayBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg><span>暂停</span>';
  autoplayTimer = setInterval(() => {
    if (currentStep < steps.length - 1) {
      updateStep(currentStep + 1);
    } else {
      stopAutoplay();
    }
  }, 9000);
}

function stopAutoplay() {
  isAutoplaying = false;
  autoplayBtn.classList.remove('playing');
  autoplayBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>自动播放</span>';
  if (autoplayTimer) clearInterval(autoplayTimer);
  autoplayTimer = null;
}

// ============================================================
//  通用绘图工具函数
// ============================================================

function clearCanvas() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, W, H);
}

function drawGrid(x0, y0, xScale, yScale, xMin, xMax, yMin, yMax) {
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 1;

  // 竖线
  for (let x = Math.ceil(xMin); x <= xMax; x++) {
    const px = x0 + x * xScale;
    if (px >= 0 && px <= W) {
      ctx.beginPath();
      ctx.moveTo(px, 0);
      ctx.lineTo(px, H);
      ctx.stroke();
    }
  }

  // 横线
  for (let y = Math.ceil(yMin); y <= yMax; y++) {
    const py = y0 - y * yScale;
    if (py >= 0 && py <= H) {
      ctx.beginPath();
      ctx.moveTo(0, py);
      ctx.lineTo(W, py);
      ctx.stroke();
    }
  }
}

function drawAxes(x0, y0, xScale, yScale, xLabel, yLabel, xMin, xMax, yMin, yMax) {
  ctx.strokeStyle = COLORS.axis;
  ctx.lineWidth = 1.5;
  ctx.fillStyle = COLORS.axis;
  ctx.font = '12px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  // X 轴
  if (y0 >= 0 && y0 <= H) {
    ctx.beginPath();
    ctx.moveTo(Math.max(0, x0 + xMin * xScale), y0);
    ctx.lineTo(Math.min(W, x0 + xMax * xScale), y0);
    ctx.stroke();

    // X 轴刻度
    ctx.font = '11px "JetBrains Mono", monospace';
    for (let x = Math.ceil(xMin); x <= xMax; x++) {
      const px = x0 + x * xScale;
      if (px >= 10 && px <= W - 10) {
        ctx.beginPath();
        ctx.moveTo(px, y0 - 3);
        ctx.lineTo(px, y0 + 3);
        ctx.stroke();
        ctx.fillText(String(x), px, y0 + 6);
      }
    }
  }

  // Y 轴
  if (x0 >= 0 && x0 <= W) {
    ctx.beginPath();
    ctx.moveTo(x0, Math.max(0, y0 - yMax * yScale));
    ctx.lineTo(x0, Math.min(H, y0 - yMin * yScale));
    ctx.stroke();

    // Y 轴刻度
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let y = Math.ceil(yMin); y <= yMax; y++) {
      if (y === 0) continue;
      const py = y0 - y * yScale;
      if (py >= 10 && py <= H - 10) {
        ctx.beginPath();
        ctx.moveTo(x0 - 3, py);
        ctx.lineTo(x0 + 3, py);
        ctx.stroke();
        ctx.fillText(String(y), x0 - 6, py);
      }
    }
  }

  // 箭头与标签
  ctx.strokeStyle = COLORS.axis;
  ctx.fillStyle = COLORS.axis;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  if (xLabel) {
    ctx.font = 'italic 14px serif';
    ctx.fillText(xLabel, W - 20, y0 + 18);
  }
  if (yLabel) {
    ctx.font = 'italic 14px serif';
    ctx.save();
    ctx.translate(x0 - 20, 20);
    ctx.fillText(yLabel, 0, 0);
    ctx.restore();
  }
}

function drawCurve(fn, x0, y0, xScale, yScale, a, b, color, lineWidth) {
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth || 2.5;
  ctx.beginPath();
  const steps = 200;
  for (let i = 0; i <= steps; i++) {
    const x = a + (b - a) * i / steps;
    const y = fn(x);
    const px = x0 + x * xScale;
    const py = y0 - y * yScale;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
}

// ====== 状态管理 ======
let animationId = null;
let stepState = {};

function cleanupStep() {
  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }
  dataOverlay.style.display = 'none';
  dataOverlay.innerHTML = '';
  vizControls.style.display = 'none';
  vizControls.innerHTML = '';
  stepState = {};
}

// ============================================================
//  Step 0: 面积之谜——分割动画
// ============================================================
function renderAreaProblem() {
  const fn = FUNCTIONS['x²'].fn;
  const a = 0, b = 2;
  const x0 = 80, y0 = H - 60;
  const xScale = 100, yScale = 50;
  const xMin = -0.3, xMax = 2.5, yMin = -0.3, yMax = 4.5;

  stepState = { n: 2, phase: 0, animProgress: 0 };

  function draw() {
    clearCanvas();
    drawGrid(x0, y0, xScale, yScale, xMin, xMax, yMin, yMax);
    drawAxes(x0, y0, xScale, yScale, 'x', 'y', xMin, xMax, yMin, yMax);

    const n = stepState.n;
    const dx = (b - a) / n;

    // 画矩形（从左端点取高度）
    for (let i = 0; i < n; i++) {
      const xi = a + i * dx;
      const yi = fn(xi);
      const px = x0 + xi * xScale;
      const py = y0 - yi * yScale;
      const pw = dx * xScale;
      const ph = yi * yScale;

      // 矩形填充
      ctx.fillStyle = stepState.phase === 0
        ? `rgba(124, 58, 237, ${0.08 + stepState.animProgress * 0.15})`
        : 'rgba(124, 58, 237, 0.15)';
      ctx.fillRect(px, py, pw, ph);

      // 矩形边框
      ctx.strokeStyle = COLORS.violetLight;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(px, py, pw, ph);
    }

    // 画曲线
    drawCurve(fn, x0, y0, xScale, yScale, a, b, COLORS.violet, 2.5);

    // 画精确面积填充（半透明）
    ctx.fillStyle = 'rgba(244, 63, 94, 0.05)';
    ctx.beginPath();
    ctx.moveTo(x0 + a * xScale, y0);
    const steps = 200;
    for (let i = 0; i <= steps; i++) {
      const x = a + (b - a) * i / steps;
      const y = fn(x);
      ctx.lineTo(x0 + x * xScale, y0 - y * yScale);
    }
    ctx.lineTo(x0 + b * xScale, y0);
    ctx.closePath();
    ctx.fill();

    // 标注
    ctx.font = 'bold 14px "Noto Serif SC", serif';
    ctx.fillStyle = COLORS.violet;
    ctx.textAlign = 'center';
    ctx.fillText(`n = ${n} 个矩形`, W / 2, 30);

    // 计算并显示近似面积
    let sum = 0;
    for (let i = 0; i < n; i++) {
      sum += fn(a + i * dx) * dx;
    }
    const exact = 8 / 3;

    ctx.font = '13px "JetBrains Mono", monospace';
    ctx.fillStyle = COLORS.textMuted;
    ctx.fillText(`近似面积 ≈ ${sum.toFixed(4)}`, W / 2, 52);
    ctx.fillStyle = COLORS.coral;
    ctx.fillText(`精确面积 = ${exact.toFixed(4)}`, W / 2, 70);
  }

  // 动画：n 递增
  let lastTime = 0;
  function animate(time) {
    if (currentStep !== 0) return;
    const dt = time - lastTime;
    lastTime = time;

    if (stepState.phase === 0) {
      stepState.animProgress += dt / 800;
      if (stepState.animProgress >= 1) {
        stepState.animProgress = 0;
        stepState.n = stepState.n * 2;
        if (stepState.n > 64) {
          stepState.n = 2;
        }
      }
    }

    draw();
    animationId = requestAnimationFrame(animate);
  }

  draw();
  animationId = requestAnimationFrame(animate);
}

// ============================================================
//  Step 1: 矩形逼近——三种取法
// ============================================================
function renderRectangleMethods() {
  const fn = FUNCTIONS['x²'].fn;
  const a = 0, b = 2;
  const x0 = 80, y0 = H - 60;
  const xScale = 100, yScale = 50;
  const xMin = -0.3, xMax = 2.5, yMin = -0.3, yMax = 4.5;
  let sampleMode = 'left'; // left, right, mid
  let n = 8;

  const colors = {
    left: { fill: 'rgba(124, 58, 237, 0.15)', stroke: COLORS.violetLight, label: '左端点' },
    right: { fill: 'rgba(244, 63, 94, 0.15)', stroke: COLORS.coral, label: '右端点' },
    mid: { fill: 'rgba(13, 148, 136, 0.15)', stroke: COLORS.teal, label: '中点' }
  };

  function draw() {
    clearCanvas();
    drawGrid(x0, y0, xScale, yScale, xMin, xMax, yMin, yMax);
    drawAxes(x0, y0, xScale, yScale, 'x', 'y', xMin, xMax, yMin, yMax);

    const dx = (b - a) / n;
    const c = colors[sampleMode];

    // 画矩形
    for (let i = 0; i < n; i++) {
      const xi = a + i * dx;
      let ci;
      if (sampleMode === 'left') ci = xi;
      else if (sampleMode === 'right') ci = xi + dx;
      else ci = xi + dx / 2;

      const yi = fn(ci);
      const px = x0 + xi * xScale;
      const py = y0 - yi * yScale;
      const pw = dx * xScale;
      const ph = yi * yScale;

      ctx.fillStyle = c.fill;
      ctx.fillRect(px, py, pw, ph);
      ctx.strokeStyle = c.stroke;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(px, py, pw, ph);

      // 采样点标记
      const cpx = x0 + ci * xScale;
      const cpy = y0 - yi * yScale;
      ctx.fillStyle = c.stroke;
      ctx.beginPath();
      ctx.arc(cpx, cpy, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // 画曲线
    drawCurve(fn, x0, y0, xScale, yScale, a, b, COLORS.axis, 2);

    // 计算近似面积
    let sum = 0;
    for (let i = 0; i < n; i++) {
      const xi = a + i * dx;
      let ci;
      if (sampleMode === 'left') ci = xi;
      else if (sampleMode === 'right') ci = xi + dx;
      else ci = xi + dx / 2;
      sum += fn(ci) * dx;
    }
    const exact = 8 / 3;

    // 数据浮窗
    dataOverlay.style.display = 'flex';
    dataOverlay.innerHTML = `
      <div class="data-row"><span class="data-label">采样方式</span><span class="data-value" style="color:${c.stroke}">${c.label}</span></div>
      <div class="data-row"><span class="data-label">分割数 n</span><span class="data-value">${n}</span></div>
      <div class="data-row"><span class="data-label">近似值</span><span class="data-value">${sum.toFixed(4)}</span></div>
      <div class="data-row"><span class="data-label">精确值</span><span class="data-value coral">${exact.toFixed(4)}</span></div>
      <div class="data-row"><span class="data-label">误差</span><span class="data-value teal">${Math.abs(sum - exact).toFixed(4)}</span></div>
    `;

    // 标注
    ctx.font = 'bold 14px "Noto Serif SC", serif';
    ctx.fillStyle = c.stroke;
    ctx.textAlign = 'center';
    ctx.fillText(`${c.label}法则 · n = ${n}`, W / 2, 30);
  }

  // 控件
  vizControls.style.display = 'flex';
  vizControls.innerHTML = `
    <div class="sample-selector">
      <button class="sample-btn active" data-mode="left">左端点</button>
      <button class="sample-btn" data-mode="right">右端点</button>
      <button class="sample-btn" data-mode="mid">中点</button>
    </div>
    <div class="viz-slider-group">
      <div class="viz-slider-header">
        <span class="viz-slider-label">分割数 n</span>
        <span class="viz-slider-value" id="nVal">8</span>
      </div>
      <input type="range" class="viz-slider" id="nSlider" min="1" max="50" value="8">
    </div>
  `;

  vizControls.querySelectorAll('.sample-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      vizControls.querySelectorAll('.sample-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sampleMode = btn.dataset.mode;
      draw();
    });
  });

  const nSlider = document.getElementById('nSlider');
  const nVal = document.getElementById('nVal');
  nSlider.addEventListener('input', () => {
    n = parseInt(nSlider.value);
    nVal.textContent = n;
    draw();
  });

  draw();
}

// ============================================================
//  Step 2: 黎曼和定义——收敛过程
// ============================================================
function renderRiemannDefinition() {
  const fn = FUNCTIONS['x²'].fn;
  const a = 0, b = 2;
  const x0 = 80, y0 = H - 60;
  const xScale = 100, yScale = 50;
  const xMin = -0.3, xMax = 2.5, yMin = -0.3, yMax = 4.5;
  let n = 4;

  function draw() {
    clearCanvas();
    drawGrid(x0, y0, xScale, yScale, xMin, xMax, yMin, yMax);
    drawAxes(x0, y0, xScale, yScale, 'x', 'y', xMin, xMax, yMin, yMax);

    const dx = (b - a) / n;

    // 画矩形（左端点）
    for (let i = 0; i < n; i++) {
      const xi = a + i * dx;
      const yi = fn(xi);
      const px = x0 + xi * xScale;
      const py = y0 - yi * yScale;
      const pw = dx * xScale;
      const ph = yi * yScale;

      ctx.fillStyle = 'rgba(124, 58, 237, 0.15)';
      ctx.fillRect(px, py, pw, ph);
      ctx.strokeStyle = COLORS.violetLight;
      ctx.lineWidth = 1;
      ctx.strokeRect(px, py, pw, ph);
    }

    // 画精确面积填充
    ctx.fillStyle = 'rgba(244, 63, 94, 0.06)';
    ctx.beginPath();
    ctx.moveTo(x0 + a * xScale, y0);
    const steps = 200;
    for (let i = 0; i <= steps; i++) {
      const x = a + (b - a) * i / steps;
      const y = fn(x);
      ctx.lineTo(x0 + x * xScale, y0 - y * yScale);
    }
    ctx.lineTo(x0 + b * xScale, y0);
    ctx.closePath();
    ctx.fill();

    // 画曲线
    drawCurve(fn, x0, y0, xScale, yScale, a, b, COLORS.coral, 2.5);

    // 计算近似面积
    let sum = 0;
    for (let i = 0; i < n; i++) {
      sum += fn(a + i * dx) * dx;
    }
    const exact = 8 / 3;
    const error = Math.abs(sum - exact);
    const converged = error < 0.01;

    // 数据浮窗
    dataOverlay.style.display = 'flex';
    dataOverlay.innerHTML = `
      <div class="data-row"><span class="data-label">分割数 n</span><span class="data-value">${n}</span></div>
      <div class="data-row"><span class="data-label">Δx</span><span class="data-value">${dx.toFixed(4)}</span></div>
      <div class="data-row"><span class="data-label">黎曼和 S<sub>n</sub></span><span class="data-value">${sum.toFixed(4)}</span></div>
      <div class="data-row"><span class="data-label">精确值</span><span class="data-value coral">${exact.toFixed(4)}</span></div>
      <div class="data-row"><span class="data-label">误差</span><span class="data-value teal">${error.toFixed(4)}</span></div>
    `;

    // Sigma 表达式
    ctx.font = 'bold 13px "JetBrains Mono", monospace';
    ctx.fillStyle = COLORS.violet;
    ctx.textAlign = 'center';
    ctx.fillText(`S${subscript(n)} = Σ f(xᵢ)·Δx ≈ ${sum.toFixed(4)}`, W / 2, 30);

    if (converged) {
      ctx.font = '12px "Noto Sans SC", sans-serif';
      ctx.fillStyle = COLORS.teal;
      ctx.fillText(`✓ 已收敛：误差 < 0.01`, W / 2, 50);
    }
  }

  // 控件
  vizControls.style.display = 'flex';
  vizControls.innerHTML = `
    <div class="viz-slider-group">
      <div class="viz-slider-header">
        <span class="viz-slider-label">分割数 n（对数刻度）</span>
        <span class="viz-slider-value" id="nVal">4</span>
      </div>
      <input type="range" class="viz-slider" id="nSlider" min="0" max="100" value="6">
    </div>
    <div class="convergence-bar" id="convBar" style="display:none;">
      <span class="convergence-dot"></span>
      <span>已收敛</span>
    </div>
  `;

  const nSlider = document.getElementById('nSlider');
  const nVal = document.getElementById('nVal');
  const convBar = document.getElementById('convBar');

  function updateFromSlider() {
    const v = parseInt(nSlider.value);
    // 对数映射：0→1, 100→500
    n = Math.round(Math.pow(10, v / 100 * 2.7));
    n = Math.max(1, n);
    nVal.textContent = n;
    const error = Math.abs(computeSum(n) - 8/3);
    convBar.style.display = error < 0.01 ? 'flex' : 'none';
    draw();
  }

  function computeSum(n) {
    const dx = (b - a) / n;
    let sum = 0;
    for (let i = 0; i < n; i++) {
      sum += fn(a + i * dx) * dx;
    }
    return sum;
  }

  nSlider.addEventListener('input', updateFromSlider);
  updateFromSlider();
}

// ============================================================
//  Step 3: 互动实验——自由探索
// ============================================================
function renderInteractiveLab() {
  const x0 = 80, y0 = H - 60;
  const xScale = 80, yScale = 60;
  const xMin = -0.3, xMax = 5, yMin = -2.5, yMax = 6;

  let funcKey = 'x²';
  let sampleMode = 'left';
  let n = 10;
  let a = 0, b = 2;

  // 不同函数的默认区间
  const ranges = {
    'x²': [0, 2],
    'sin(x)': [0, Math.PI],
    'x³−x': [-1, 1],
    '√x': [0, 4],
    'eˣ': [-1, 1]
  };

  const sampleColors = {
    left: { fill: 'rgba(124, 58, 237, 0.15)', stroke: COLORS.violetLight, label: '左端点' },
    right: { fill: 'rgba(244, 63, 94, 0.15)', stroke: COLORS.coral, label: '右端点' },
    mid: { fill: 'rgba(13, 148, 136, 0.15)', stroke: COLORS.teal, label: '中点' }
  };

  function draw() {
    const fn = FUNCTIONS[funcKey].fn;
    [a, b] = ranges[funcKey];

    clearCanvas();
    drawGrid(x0, y0, xScale, yScale, xMin, xMax, yMin, yMax);
    drawAxes(x0, y0, xScale, yScale, 'x', 'y', xMin, xMax, yMin, yMax);

    const dx = (b - a) / n;
    const c = sampleColors[sampleMode];

    // 画矩形
    for (let i = 0; i < n; i++) {
      const xi = a + i * dx;
      let ci;
      if (sampleMode === 'left') ci = xi;
      else if (sampleMode === 'right') ci = xi + dx;
      else ci = xi + dx / 2;

      const yi = fn(ci);
      const px = x0 + xi * xScale;
      const py = y0 - yi * yScale;
      const pw = dx * xScale;
      const ph = y0 - py;

      if (yi >= 0) {
        ctx.fillStyle = c.fill;
        ctx.fillRect(px, py, pw, ph);
      } else {
        ctx.fillStyle = c.fill.replace('0.15', '0.08');
        ctx.fillRect(px, y0, pw, Math.abs(ph));
      }
      ctx.strokeStyle = c.stroke;
      ctx.lineWidth = 1;
      ctx.strokeRect(px, Math.min(py, y0), pw, Math.abs(ph));
    }

    // 画曲线
    drawCurve(fn, x0, y0, xScale, yScale, Math.max(xMin, a - 0.5), Math.min(xMax, b + 0.5), COLORS.axis, 2);

    // 高亮 [a, b] 区间
    ctx.strokeStyle = COLORS.coral;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(x0 + a * xScale, 0);
    ctx.lineTo(x0 + a * xScale, H);
    ctx.moveTo(x0 + b * xScale, 0);
    ctx.lineTo(x0 + b * xScale, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // a, b 标签
    ctx.font = 'bold 13px "JetBrains Mono", monospace';
    ctx.fillStyle = COLORS.coral;
    ctx.textAlign = 'center';
    ctx.fillText('a', x0 + a * xScale, y0 + 20);
    ctx.fillText('b', x0 + b * xScale, y0 + 20);

    // 计算近似面积
    let sum = 0;
    for (let i = 0; i < n; i++) {
      const xi = a + i * dx;
      let ci;
      if (sampleMode === 'left') ci = xi;
      else if (sampleMode === 'right') ci = xi + dx;
      else ci = xi + dx / 2;
      sum += fn(ci) * dx;
    }
    const exact = FUNCTIONS[funcKey].integral(a, b);
    const error = Math.abs(sum - exact);

    // 数据浮窗
    dataOverlay.style.display = 'flex';
    dataOverlay.innerHTML = `
      <div class="data-row"><span class="data-label">函数</span><span class="data-value">${FUNCTIONS[funcKey].label}</span></div>
      <div class="data-row"><span class="data-label">区间</span><span class="data-value">[${a.toFixed(1)}, ${b.toFixed(2)}]</span></div>
      <div class="data-row"><span class="data-label">采样</span><span class="data-value" style="color:${c.stroke}">${c.label}</span></div>
      <div class="data-row"><span class="data-label">n</span><span class="data-value">${n}</span></div>
      <div class="data-row"><span class="data-label">近似值</span><span class="data-value">${sum.toFixed(4)}</span></div>
      <div class="data-row"><span class="data-label">精确值</span><span class="data-value coral">${exact.toFixed(4)}</span></div>
      <div class="data-row"><span class="data-label">误差</span><span class="data-value teal">${error.toFixed(4)}</span></div>
    `;

    // 标题
    ctx.font = 'bold 14px "Noto Serif SC", serif';
    ctx.fillStyle = COLORS.violet;
    ctx.textAlign = 'center';
    ctx.fillText(`f(x) = ${FUNCTIONS[funcKey].label} · ${c.label} · n = ${n}`, W / 2, 30);
  }

  // 控件
  vizControls.style.display = 'flex';
  vizControls.innerHTML = `
    <div class="func-selector">
      ${Object.keys(FUNCTIONS).map(k => `<button class="func-btn ${k === funcKey ? 'active' : ''}" data-fn="${k}">${FUNCTIONS[k].label}</button>`).join('')}
    </div>
    <div class="sample-selector">
      <button class="sample-btn active" data-mode="left">左</button>
      <button class="sample-btn" data-mode="right">右</button>
      <button class="sample-btn" data-mode="mid">中</button>
    </div>
    <div class="viz-slider-group">
      <div class="viz-slider-header">
        <span class="viz-slider-label">分割数 n</span>
        <span class="viz-slider-value" id="nVal">${n}</span>
      </div>
      <input type="range" class="viz-slider" id="nSlider" min="1" max="100" value="${n}">
    </div>
  `;

  vizControls.querySelectorAll('.func-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      vizControls.querySelectorAll('.func-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      funcKey = btn.dataset.fn;
      draw();
    });
  });

  vizControls.querySelectorAll('.sample-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      vizControls.querySelectorAll('.sample-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sampleMode = btn.dataset.mode;
      draw();
    });
  });

  const nSlider = document.getElementById('nSlider');
  const nVal = document.getElementById('nVal');
  nSlider.addEventListener('input', () => {
    n = parseInt(nSlider.value);
    nVal.textContent = n;
    draw();
  });

  draw();
}

// ============================================================
//  Step 4: 微积分基本定理——应用展示
// ============================================================
function renderFundamentalTheorem() {
  // 速度函数 v(t) = t (匀加速运动)
  const fn = t => t;
  const a = 0, b = 4;
  const x0 = 80, y0 = H - 60;
  const xScale = 80, yScale = 50;
  const xMin = -0.3, xMax = 5, yMin = -0.5, yMax = 5;

  stepState = { n: 4, animProgress: 0, isAnimating: true, particleT: 0 };

  function draw() {
    clearCanvas();
    drawGrid(x0, y0, xScale, yScale, xMin, xMax, yMin, yMax);

    // 自定义坐标轴标签
    ctx.strokeStyle = COLORS.axis;
    ctx.lineWidth = 1.5;
    ctx.fillStyle = COLORS.axis;
    ctx.font = '12px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

    // X 轴
    ctx.beginPath();
    ctx.moveTo(0, y0);
    ctx.lineTo(W, y0);
    ctx.stroke();
    for (let x = 0; x <= 5; x++) {
      const px = x0 + x * xScale;
      ctx.beginPath();
      ctx.moveTo(px, y0 - 3);
      ctx.lineTo(px, y0 + 3);
      ctx.stroke();
      ctx.fillText(String(x), px, y0 + 6);
    }

    // Y 轴
    ctx.beginPath();
    ctx.moveTo(x0, 0);
    ctx.lineTo(x0, H);
    ctx.stroke();
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let y = 0; y <= 5; y++) {
      if (y === 0) continue;
      const py = y0 - y * yScale;
      ctx.beginPath();
      ctx.moveTo(x0 - 3, py);
      ctx.lineTo(x0 + 3, py);
      ctx.stroke();
      ctx.fillText(String(y), x0 - 6, py);
    }

    // 标签
    ctx.font = 'italic 14px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('t (时间)', W - 40, y0 + 18);
    ctx.save();
    ctx.translate(x0 - 22, 20);
    ctx.fillText('v (速度)', 0, 0);
    ctx.restore();

    // 画精确面积填充
    const n = stepState.n;
    const dx = (b - a) / n;

    // 画矩形
    for (let i = 0; i < n; i++) {
      const xi = a + i * dx;
      const yi = fn(xi);
      const px = x0 + xi * xScale;
      const py = y0 - yi * yScale;
      const pw = dx * xScale;
      const ph = yi * yScale;

      ctx.fillStyle = 'rgba(124, 58, 237, 0.12)';
      ctx.fillRect(px, py, pw, ph);
      ctx.strokeStyle = COLORS.violetLight;
      ctx.lineWidth = 1;
      ctx.strokeRect(px, py, pw, ph);
    }

    // 画曲线（速度函数）
    drawCurve(fn, x0, y0, xScale, yScale, a, b, COLORS.violet, 2.5);

    // 精确面积填充
    ctx.fillStyle = 'rgba(244, 63, 94, 0.06)';
    ctx.beginPath();
    ctx.moveTo(x0 + a * xScale, y0);
    const steps = 100;
    for (let i = 0; i <= steps; i++) {
      const t = a + (b - a) * i / steps;
      ctx.lineTo(x0 + t * xScale, y0 - fn(t) * yScale);
    }
    ctx.lineTo(x0 + b * xScale, y0);
    ctx.closePath();
    ctx.fill();

    // 运动粒子（沿曲线移动）
    if (stepState.isAnimating) {
      const t = stepState.particleT;
      const px = x0 + t * xScale;
      const py = y0 - fn(t) * yScale;

      // 粒子轨迹线（垂直）
      ctx.strokeStyle = 'rgba(13, 148, 136, 0.3)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(px, y0);
      ctx.lineTo(px, py);
      ctx.stroke();
      ctx.setLineDash([]);

      // 粒子
      ctx.fillStyle = COLORS.teal;
      ctx.beginPath();
      ctx.arc(px, py, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 累积面积高亮
      ctx.fillStyle = 'rgba(13, 148, 136, 0.15)';
      ctx.beginPath();
      ctx.moveTo(x0 + a * xScale, y0);
      for (let i = 0; i <= 50; i++) {
        const tt = a + (t - a) * i / 50;
        ctx.lineTo(x0 + tt * xScale, y0 - fn(tt) * yScale);
      }
      ctx.lineTo(x0 + t * xScale, y0);
      ctx.closePath();
      ctx.fill();
    }

    // 计算面积
    const exact = FUNCTIONS['x²'].integral ? (b * b / 2) : 0; // ∫₀⁴ t dt = t²/2 = 8
    const exactVal = b * b / 2 - a * a / 2;
    let sum = 0;
    for (let i = 0; i < n; i++) {
      sum += fn(a + i * dx) * dx;
    }

    // 累积路程
    const traveledDist = stepState.particleT * stepState.particleT / 2;

    // 数据浮窗
    dataOverlay.style.display = 'flex';
    dataOverlay.innerHTML = `
      <div class="data-row"><span class="data-label">速度函数</span><span class="data-value">v(t) = t</span></div>
      <div class="data-row"><span class="data-label">当前时刻 t</span><span class="data-value teal">${stepState.particleT.toFixed(2)}s</span></div>
      <div class="data-row"><span class="data-label">当前速度</span><span class="data-value">${fn(stepState.particleT).toFixed(2)} m/s</span></div>
      <div class="data-row"><span class="data-label">已走路程</span><span class="data-value coral">${traveledDist.toFixed(2)} m</span></div>
      <div class="data-row"><span class="data-label">总路程</span><span class="data-value">${exactVal.toFixed(2)} m</span></div>
    `;

    // 公式标注
    ctx.font = 'bold 13px "JetBrains Mono", monospace';
    ctx.fillStyle = COLORS.violet;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(`路程 = ∫₀⁴ v(t)dt = t²/2 |₀⁴ = ${exactVal}`, W / 2, 24);

    ctx.font = '12px "Noto Sans SC", sans-serif';
    ctx.fillStyle = COLORS.teal;
    ctx.fillText(`矩形面积 ≈ ${sum.toFixed(2)} · 拖动 n 滑块增加精度`, W / 2, 44);
  }

  // 动画循环
  function animate() {
    if (currentStep !== 4) return;

    if (stepState.isAnimating) {
      stepState.particleT += 0.015;
      if (stepState.particleT > b) {
        stepState.particleT = a;
      }
    }

    draw();
    animationId = requestAnimationFrame(animate);
  }

  // 控件
  vizControls.style.display = 'flex';
  vizControls.innerHTML = `
    <div class="viz-slider-group">
      <div class="viz-slider-header">
        <span class="viz-slider-label">分割数 n</span>
        <span class="viz-slider-value" id="nVal">4</span>
      </div>
      <input type="range" class="viz-slider" id="nSlider" min="1" max="50" value="4">
    </div>
    <button class="autoplay-btn" id="pauseBtn">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      <span>暂停运动</span>
    </button>
  `;

  const nSlider = document.getElementById('nSlider');
  const nVal = document.getElementById('nVal');
  nSlider.addEventListener('input', () => {
    stepState.n = parseInt(nSlider.value);
    nVal.textContent = stepState.n;
  });

  const pauseBtn = document.getElementById('pauseBtn');
  pauseBtn.addEventListener('click', () => {
    stepState.isAnimating = !stepState.isAnimating;
    if (stepState.isAnimating) {
      pauseBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg><span>暂停运动</span>';
    } else {
      pauseBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>播放运动</span>';
    }
  });

  draw();
  animationId = requestAnimationFrame(animate);
}

// 辅助函数：下标数字
function subscript(n) {
  const subs = '₀₁₂₃₄₅₆₇₈₉';
  return String(n).split('').map(d => subs[parseInt(d)] || d).join('');
}

updateStep(0);
