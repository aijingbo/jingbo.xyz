/* ============================================
   朝代疆域演变 · 主题样式
   古地图质感 · 历史厚重 · 暖陶配色
   ============================================ */

:root {
  --dt-parchment: #f0e8d8;
  --dt-parchment-dark: #e0d4bc;
  --dt-parchment-light: #f7f0e0;
  --dt-ink: #3a2f1f;
  --dt-ink-light: #5a4f3f;
  --dt-ink-muted: #8a7f6f;
  --dt-ochre: #B45309;
  --dt-ochre-dark: #92400E;
  --dt-ochre-light: #d97706;
  --dt-rust: #92400E;
  --dt-gold: #b8923c;
  --dt-sepia: rgba(146, 64, 14, 0.12);
  --dt-border-soft: #d4c4b0;
}

/* ---------- 加载屏 ---------- */
.dt-loading {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: linear-gradient(135deg, #f0e8d8 0%, #e0d4bc 50%, #d4c4b0 100%);
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
.dt-loading.hidden {
  opacity: 0;
  visibility: hidden;
}
.dt-loading-seal {
  width: 80px;
  height: 80px;
  border: 3px solid var(--dt-ochre);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-size: 42px;
  font-weight: 700;
  color: var(--dt-ochre);
  margin-bottom: 28px;
  animation: dt-seal-pulse 1.6s ease-in-out infinite;
  background: rgba(180, 83, 9, 0.05);
}
@keyframes dt-seal-pulse {
  0%, 100% { transform: scale(1); opacity: 0.85; box-shadow: 0 0 0 0 rgba(180, 83, 9, 0.3); }
  50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 0 12px rgba(180, 83, 9, 0); }
}
.dt-loading-title {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 700;
  color: var(--dt-ink);
  letter-spacing: 0.15em;
  margin-bottom: 6px;
}
.dt-loading-sub {
  font-family: var(--font-serif);
  font-size: 12px;
  color: var(--dt-ink-muted);
  letter-spacing: 0.3em;
  margin-bottom: 28px;
}
.dt-loading-bar {
  width: 140px;
  height: 2px;
  background: rgba(146, 64, 14, 0.15);
  border-radius: 1px;
  overflow: hidden;
}
.dt-loading-bar-fill {
  height: 100%;
  width: 40%;
  background: var(--dt-ochre);
  border-radius: 1px;
  animation: dt-bar-slide 1.2s ease-in-out infinite;
}
@keyframes dt-bar-slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

/* ---------- 主体框架覆盖 ---------- */
.framework-narrative {
  background: var(--dt-parchment);
}

/* ---------- 导航栏覆盖 ---------- */
.demo-navbar {
  background-color: rgba(240, 232, 216, 0.88);
}
.demo-navbar.scrolled {
  background-color: rgba(240, 232, 216, 0.95);
}

/* ---------- 地图区域 ---------- */
.narrative-map-area {
  background: var(--dt-parchment);
  border-right: 1px solid var(--dt-border-soft);
  position: relative;
  overflow: hidden;
}

#mapCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
}
#mapCanvas:active {
  cursor: grabbing;
}

/* ---------- 地图叠加层 ---------- */
.dt-map-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

/* 朝代印章（右上角） */
.dt-dynasty-seal {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 72px;
  height: 72px;
  border: 2.5px solid var(--dt-ochre);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-size: 38px;
  font-weight: 700;
  color: var(--dt-ochre);
  background: rgba(240, 232, 216, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: all 0.4s var(--ease);
  box-shadow: 0 4px 16px rgba(146, 64, 14, 0.12);
}
.dt-dynasty-seal.changing {
  transform: scale(0.8) rotate(-5deg);
  opacity: 0;
}

/* 比例尺（左下角） */
.dt-scale-bar {
  position: absolute;
  bottom: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--dt-ink-muted);
  letter-spacing: 0.05em;
}
.dt-scale-bar-line {
  width: 80px;
  height: 6px;
  border: 1px solid var(--dt-ink-muted);
  border-top: none;
  position: relative;
}
.dt-scale-bar-line::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  width: 1px;
  height: 4px;
  background: var(--dt-ink-muted);
}

/* 罗盘（左上角） */

  position: absolute;
  top: 20px;
  left: 20px;
  width: 56px;
  height: 56px;

/* ---------- 信息卡片覆盖 ---------- */

  border: 1px solid var(--dt-border-soft);
  border-left: 3px solid var(--dt-ochre);

.narrative-info-year {

.dt-info-meta {

.dt-info-meta-item {

.dt-info-facts {

/* ---------- 时间轴面板覆盖 ---------- */

/* 时间轴列表覆盖 */

.timeline-event {

.timeline-event.active .timeline-event-dot {

.timeline-event-year {

}

.timeline-event-title {

.timeline-event-desc {

.dt-dynasty-area {

/* ---------- 底部播放控件覆盖 ---------- */
.narrative-timeline-footer {

}

.narrative-play-btn {

.narrative-play-btn:hover {

.narrative-progress {

/* ---------- 朝代切换指示器 ---------- */

/* ---------- 响应式覆盖 ---------- */
@media (max-width: 1024px) {

@media (max-width: 768px) {

  }

  }
}
</style>

// 每个朝代领土用16个极坐标点定义（中心 + 16个半径），保证形变动画平滑
function makeTerritory(cx, cy, radii) {
  return radii.map((r, i) => {
    const angle = (i / 16) * Math.PI * 2 - Math.PI / 2;
    return {
      x: cx + Math.cos(angle) * r,
      y: cy + Math.sin(angle) * r * 0.82
    };
  });
}

// 预计算领土多边形
dynasties.forEach(d => {
  d.territory = makeTerritory(d.center.x, d.center.y, d.radii);
});

// ====== 状态 ======
let currentIdx = 0;
let currentPoints = dynasties[0].territory.map(p => ({ x: p.x, y: p.y }));
let currentCapital = { x: dynasties[0].capitalPos.x, y: dynasties[0].capitalPos.y };
let isPlaying = false;
let playTimer = null;
let pulsePhase = 0;

// ====== Canvas 初始化 ======
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
let canvasW = 0, canvasH = 0;

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvasW = rect.width;
  canvasH = rect.height;
}

window.addEventListener('resize', () => {
  resizeCanvas();
  render();
});

// ====== 地理参考线（简化中国轮廓） ======
// 简化的东亚海岸线和河流，用于地图背景参考
const geoRef = {
  // 东海岸线（从北到南）
  coastline: [
    [0.72, 0.18], [0.74, 0.22], [0.73, 0.28], [0.76, 0.33],
    [0.78, 0.38], [0.80, 0.43], [0.79, 0.48], [0.82, 0.53],
    [0.83, 0.58], [0.81, 0.63], [0.80, 0.68], [0.78, 0.72],
    [0.76, 0.76], [0.73, 0.78]
  ],
  // 黄河
  yellowRiver: [
    [0.40, 0.30], [0.46, 0.33], [0.50, 0.31], [0.54, 0.35],
    [0.52, 0.39], [0.56, 0.42], [0.60, 0.44], [0.64, 0.43],
    [0.68, 0.46], [0.72, 0.48]
  ],
  // 长江
  yangtze: [
    [0.32, 0.52], [0.38, 0.53], [0.44, 0.54], [0.50, 0.56],
    [0.56, 0.57], [0.62, 0.59], [0.68, 0.61], [0.74, 0.63],
    [0.78, 0.65]
  ],
  // 北方草原线（长城参考）
  greatWall: [
    [0.35, 0.28], [0.42, 0.26], [0.50, 0.28], [0.58, 0.27],
    [0.64, 0.29], [0.70, 0.28]
  ]
};

// ====== 渲染函数 ======
function render() {
  if (canvasW === 0) return;
  ctx.clearRect(0, 0, canvasW, canvasH);

  drawParchmentBg();
  drawGrid();
  drawGeoRef();
  drawTerritory();
  drawCapital();
  drawDynastyLabel();
}

// 羊皮纸背景
function drawParchmentBg() {
  const grad = ctx.createRadialGradient(
    canvasW * 0.5, canvasH * 0.4, 0,
    canvasW * 0.5, canvasH * 0.4, Math.max(canvasW, canvasH) * 0.7
  );
  grad.addColorStop(0, '#f7f0e0');
  grad.addColorStop(0.5, '#f0e8d8');
  grad.addColorStop(1, '#e5d9c0');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvasW, canvasH);

  // 纹理斑点
  ctx.save();
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 60; i++) {
    const x = (i * 37.3 + 13) % canvasW;
    const y = (i * 53.7 + 27) % canvasH;
    const r = 2 + (i % 4);
    ctx.fillStyle = '#8a7f6f';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// 经纬度网格
function drawGrid() {
  ctx.save();
  ctx.strokeStyle = 'rgba(138, 127, 111, 0.08)';
  ctx.lineWidth = 0.5;
  ctx.setLineDash([2, 4]);
  const stepX = canvasW / 12;
  const stepY = canvasH / 8;
  for (let i = 1; i < 12; i++) {
    ctx.beginPath();
    ctx.moveTo(i * stepX, 0);
    ctx.lineTo(i * stepX, canvasH);
    ctx.stroke();
  }
  for (let i = 1; i < 8; i++) {
    ctx.beginPath();
    ctx.moveTo(0, i * stepY);
    ctx.lineTo(canvasW, i * stepY);
    ctx.stroke();
  }
  ctx.restore();
}

// 地理参考线（海岸线、河流、长城）
function drawGeoRef() {
  ctx.save();

  // 海洋区域（东海岸以东）
  ctx.fillStyle = 'rgba(168, 192, 200, 0.12)';
  ctx.beginPath();
  ctx.moveTo(geoRef.coastline[0][0] * canvasW, geoRef.coastline[0][1] * canvasH);
  geoRef.coastline.forEach(p => ctx.lineTo(p[0] * canvasW, p[1] * canvasH));
  ctx.lineTo(canvasW, canvasH);
  ctx.lineTo(canvasW, 0);
  ctx.closePath();
  ctx.fill();

  // 海岸线
  ctx.strokeStyle = 'rgba(90, 79, 63, 0.25)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  geoRef.coastline.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p[0] * canvasW, p[1] * canvasH);
    else ctx.lineTo(p[0] * canvasW, p[1] * canvasH);
  });
  ctx.stroke();

  // 黄河
  ctx.strokeStyle = 'rgba(184, 146, 60, 0.3)';
  ctx.lineWidth = 1.8;
  ctx.setLineDash([]);
  ctx.beginPath();
  geoRef.yellowRiver.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p[0] * canvasW, p[1] * canvasH);
    else {
      const prev = geoRef.yellowRiver[i - 1];
      const cpx = (prev[0] + p[0]) / 2 * canvasW;
      const cpy = (prev[1] + p[1]) / 2 * canvasH;
      ctx.quadraticCurveTo(prev[0] * canvasW, prev[1] * canvasH, cpx, cpy);
    }
  });
  ctx.stroke();

  // 长江
  ctx.strokeStyle = 'rgba(120, 160, 170, 0.3)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  geoRef.yangtze.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p[0] * canvasW, p[1] * canvasH);
    else {
      const prev = geoRef.yangtze[i - 1];
      const cpx = (prev[0] + p[0]) / 2 * canvasW;
      const cpy = (prev[1] + p[1]) / 2 * canvasH;
      ctx.quadraticCurveTo(prev[0] * canvasW, prev[1] * canvasH, cpx, cpy);
    }
  });
  ctx.stroke();

  // 长城
  ctx.strokeStyle = 'rgba(146, 64, 14, 0.2)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();
  geoRef.greatWall.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p[0] * canvasW, p[1] * canvasH);
    else ctx.lineTo(p[0] * canvasW, p[1] * canvasH);
  });
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.restore();
}

// 领土多边形
function drawTerritory() {
  const d = dynasties[currentIdx];
  ctx.save();

  // 计算多边形路径
  const path = new Path2D();
  currentPoints.forEach((p, i) => {
    const x = p.x * canvasW;
    const y = p.y * canvasH;
    if (i === 0) path.moveTo(x, y);
    else path.lineTo(x, y);
  });
  path.closePath();

  // 填充（径向渐变）
  const cx = d.center.x * canvasW;
  const cy = d.center.y * canvasH;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, canvasW * 0.3);
  grad.addColorStop(0, 'rgba(180, 83, 9, 0.28)');
  grad.addColorStop(0.6, 'rgba(180, 83, 9, 0.18)');
  grad.addColorStop(1, 'rgba(146, 64, 14, 0.08)');
  ctx.fillStyle = grad;
  ctx.fill(path);

  // 填充纹理（斜线）
  ctx.save();
  ctx.clip(path);
  ctx.strokeStyle = 'rgba(180, 83, 9, 0.06)';
  ctx.lineWidth = 1;
  for (let i = -canvasH; i < canvasW + canvasH; i += 8) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i + canvasH, canvasH);
    ctx.stroke();
  }
  ctx.restore();

  // 外发光
  ctx.shadowColor = 'rgba(180, 83, 9, 0.3)';
  ctx.shadowBlur = 12;
  ctx.strokeStyle = 'rgba(180, 83, 9, 0.6)';
  ctx.lineWidth = 2;
  ctx.stroke(path);
  ctx.shadowBlur = 0;

  // 内部细线
  ctx.strokeStyle = 'rgba(146, 64, 14, 0.4)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.stroke(path);
  ctx.setLineDash([]);

  ctx.restore();
}

// 都城标记
function drawCapital() {
  const x = currentCapital.x * canvasW;
  const y = currentCapital.y * canvasH;
  const pulse = Math.sin(pulsePhase) * 0.5 + 0.5;

  ctx.save();

  // 外圈脉冲光晕
  ctx.fillStyle = `rgba(180, 83, 9, ${0.08 + pulse * 0.06})`;
  ctx.beginPath();
  ctx.arc(x, y, 18 + pulse * 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = `rgba(180, 83, 9, ${0.12 + pulse * 0.08})`;
  ctx.beginPath();
  ctx.arc(x, y, 12, 0, Math.PI * 2);
  ctx.fill();

  // 星形标记
  drawStar(x, y, 7, 3, 5, '#B45309', '#92400E');

  // 都城名称
  ctx.font = '600 12px "Noto Serif SC", serif';
  ctx.fillStyle = '#3a2f1f';
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(247, 240, 224, 0.9)';
  ctx.shadowBlur = 4;
  ctx.fillText(dynasties[currentIdx].capital, x, y - 16);
  ctx.shadowBlur = 0;

  ctx.restore();
}

// 绘制星形
function drawStar(cx, cy, outerR, innerR, points, fill, stroke) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const angle = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

// 领土上的朝代名称
function drawDynastyLabel() {
  const d = dynasties[currentIdx];
  const x = d.center.x * canvasW;
  const y = d.center.y * canvasH;

  ctx.save();
  ctx.font = '700 28px "Noto Serif SC", serif';
  ctx.fillStyle = 'rgba(58, 47, 31, 0.15)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(d.name, x, y + 20);
  ctx.restore();
}

// ====== 动画循环（脉冲效果） ======
function animateLoop() {
  pulsePhase += 0.04;
  if (pulsePhase > Math.PI * 2) pulsePhase -= Math.PI * 2;
  render();
  requestAnimationFrame(animateLoop);
}

// ====== 时间轴列表生成 ======
function buildTimeline() {
  const list = document.getElementById('timelineList');
  list.innerHTML = dynasties.map((d, i) => `
    <div class="timeline-event ${i === 0 ? 'active' : ''}" data-idx="${i}">
      <div class="timeline-event-dot"></div>
      <div class="timeline-event-content">
        <div class="timeline-event-year">${d.yearLabel}</div>
        <div class="timeline-event-title">${d.name} · ${d.title}</div>
        <div class="timeline-event-desc">${d.desc.substring(0, 50)}...</div>
        <div class="dt-dynasty-area">${d.area} · 都城 ${d.capital}</div>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.timeline-event').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      if (idx !== currentIdx) {
        transitionTo(idx);
      }
    });
  });
}

// ====== 朝代切换（核心动画） ======
function transitionTo(idx) {
  const target = dynasties[idx];
  const prevIdx = currentIdx;
  currentIdx = idx;

  // 显示切换指示器
  const indicator = document.getElementById('transitionIndicator');
  indicator.textContent = target.name;
  gsap.fromTo(indicator,
    { opacity: 0, scale: 0.8 },
    { opacity: 0.15, scale: 1, duration: 0.4, ease: 'power2.out',
      onComplete: () => {
        gsap.to(indicator, { opacity: 0, scale: 1.1, duration: 0.4, delay: 0.3 });
      }
    }
  );

  // 更新印章
  const seal = document.getElementById('dynastySeal');
  seal.classList.add('changing');
  setTimeout(() => {
    seal.textContent = target.sealChar;
    seal.classList.remove('changing');
  }, 200);

  // GSAP 动画领土点
  const tl = gsap.timeline();
  currentPoints.forEach((pt, i) => {
    tl.to(pt, {
      x: target.territory[i].x,
      y: target.territory[i].y,
      duration: 1.2,
      ease: 'power2.inOut'
    }, 0);
  });

  // 都城位置动画
  tl.to(currentCapital, {
    x: target.capitalPos.x,
    y: target.capitalPos.y,
    duration: 1.2,
    ease: 'power2.inOut'
  }, 0);

  // 更新信息卡片
  updateInfoCard(target);

  // 更新时间轴高亮
  document.querySelectorAll('.timeline-event').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  // 滚动到当前事件
  const activeEl = document.querySelector('.timeline-event.active');
  if (activeEl) {
    activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // 更新进度条
  const progress = ((idx + 1) / dynasties.length) * 100;
  document.getElementById('progressBar').style.width = `${progress}%`;
  document.getElementById('eventCounter').textContent = `${idx + 1} / ${dynasties.length}`;
}

// ====== 更新信息卡片 ======
function updateInfoCard(d) {
  const card = document.getElementById('infoCard');
  gsap.fromTo(card,
    { opacity: 0.5, y: 10 },
    { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }
  );

  document.getElementById('infoYear').textContent = d.yearLabel;
  document.getElementById('infoTitle').textContent = d.title;
  document.getElementById('infoCapital').textContent = d.capital;
  document.getElementById('infoArea').textContent = d.area;
  document.getElementById('infoDesc').textContent = d.desc;

  const factsEl = document.getElementById('infoFacts');
  factsEl.innerHTML = d.facts.map(f => `<span class="dt-fact-tag">${f}</span>`).join('');
}

// ====== 播放控制 ======
function togglePlay() {
  isPlaying = !isPlaying;
  const icon = document.getElementById('playIcon');
  const label = document.getElementById('playLabel');

  if (isPlaying) {
    icon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
    label.textContent = '暂停';
    playTimer = setInterval(() => {
      let next = currentIdx + 1;
      if (next >= dynasties.length) next = 0;
      transitionTo(next);
    }, 2800);
  } else {
    icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    label.textContent = '播放';
    clearInterval(playTimer);
  }
}

// ====== Canvas 点击交互 ======
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width;
  const my = (e.clientY - rect.top) / rect.height;

  // 检测点击是否在领土内
  dynasties.forEach((d, i) => {
    const dx = mx - d.center.x;
    const dy = my - d.center.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const avgRadius = d.radii.reduce((a, b) => a + b, 0) / d.radii.length;
    if (dist < avgRadius && i !== currentIdx) {
      transitionTo(i);
    }
  });
});

// ====== 键盘交互 ======
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    let prev = currentIdx - 1;
    if (prev < 0) prev = dynasties.length - 1;
    transitionTo(prev);
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    let next = currentIdx + 1;
    if (next >= dynasties.length) next = 0;
    transitionTo(next);
  } else if (e.key === ' ') {
    e.preventDefault();
    togglePlay();
  }
});

// ====== 初始化 ======
document.addEventListener('DOMContentLoaded', () => {
  resizeCanvas();
  buildTimeline();
  updateInfoCard(dynasties[0]);
  animateLoop();

  document.getElementById('playBtn').addEventListener('click', togglePlay);

  // 导航栏滚动效果
  const navbar = document.getElementById('demoNavbar');
  window.addEventListener('scroll', () => {
    navbar.classList.toggle('scrolled', window.scrollY > 10);
  });

  // 隐藏加载屏
  setTimeout(() => {
    document.getElementById('dtLoading').classList.add('hidden');
  }, 800);
});
</script>
