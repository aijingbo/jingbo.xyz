/* ============================================
   朝代疆域演变 · 主题样式
   古地图质感 · 历史厚重 · 暖陶配色
   ============================================ */

:root {
  --dt-parchment: #f0e8d8;
  --dt-parchment-dark: #e0d4bc;
  --dt-parchment-light: #f7f0e0;
  --dt-ink: #3a2f1f;
  --dt-ink-light: #5a4f3f;
  --dt-ink-muted: #8a7f6f;
  --dt-ochre: #B45309;
  --dt-ochre-dark: #92400E;
  --dt-ochre-light: #d97706;
  --dt-rust: #92400E;
  --dt-gold: #b8923c;
  --dt-sepia: rgba(146, 64, 14, 0.12);
  --dt-border-soft: #d4c4b0;
}

/* ---------- 加载屏 ---------- */
.dt-loading {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: linear-gradient(135deg, #f0e8d8 0%, #e0d4bc 50%, #d4c4b0 100%);
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
.dt-loading.hidden {
  opacity: 0;
  visibility: hidden;
}
.dt-loading-seal {
  width: 80px;
  height: 80px;
  border: 3px solid var(--dt-ochre);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-size: 42px;
  font-weight: 700;
  color: var(--dt-ochre);
  margin-bottom: 28px;
  animation: dt-seal-pulse 1.6s ease-in-out infinite;
  background: rgba(180, 83, 9, 0.05);
}
@keyframes dt-seal-pulse {
  0%, 100% { transform: scale(1); opacity: 0.85; box-shadow: 0 0 0 0 rgba(180, 83, 9, 0.3); }
  50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 0 12px rgba(180, 83, 9, 0); }
}
.dt-loading-title {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 700;
  color: var(--dt-ink);
  letter-spacing: 0.15em;
  margin-bottom: 6px;
}
.dt-loading-sub {
  font-family: var(--font-serif);
  font-size: 12px;
  color: var(--dt-ink-muted);
  letter-spacing: 0.3em;
  margin-bottom: 28px;
}
.dt-loading-bar {
  width: 140px;
  height: 2px;
  background: rgba(146, 64, 14, 0.15);
  border-radius: 1px;
  overflow: hidden;
}
.dt-loading-bar-fill {
  height: 100%;
  width: 40%;
  background: var(--dt-ochre);
  border-radius: 1px;
  animation: dt-bar-slide 1.2s ease-in-out infinite;
}
@keyframes dt-bar-slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

/* ---------- 主体框架覆盖 ---------- */
.framework-narrative {
  background: var(--dt-parchment);
}

/* ---------- 导航栏覆盖 ---------- */
.demo-navbar {
  background-color: rgba(240, 232, 216, 0.88);
}
.demo-navbar.scrolled {
  background-color: rgba(240, 232, 216, 0.95);
}

/* ---------- 地图区域 ---------- */
.narrative-map-area {
  background: var(--dt-parchment);
  border-right: 1px solid var(--dt-border-soft);
  position: relative;
  overflow: hidden;
}

/* 覆盖框架 .narrative-map-area svg{width:100%;height:100%} —— 仅 canvas 全尺寸，所有 overlay 内 SVG 用自身尺寸 */
.narrative-map-area .dt-map-overlay svg,
.narrative-map-area .narrative-info-card svg {
  width: auto;
  height: auto;
}

#mapCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: default;
}

/* ---------- 地图叠加层 ---------- */
.dt-map-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

/* 朝代印章（右上角） */
.dt-dynasty-seal {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 72px;
  height: 72px;
  border: 2.5px solid var(--dt-ochre);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-size: 38px;
  font-weight: 700;
  color: var(--dt-ochre);
  background: rgba(240, 232, 216, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: all 0.4s var(--ease);
  box-shadow: 0 4px 16px rgba(146, 64, 14, 0.12);
}
.dt-dynasty-seal.changing {
  transform: scale(0.8) rotate(-5deg);
  opacity: 0;
}

/* 比例尺（右下角） */
.dt-scale-bar {
  position: absolute;
  bottom: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--dt-ink-muted);
  letter-spacing: 0.05em;
}
.dt-scale-bar-line {
  width: 80px;
  height: 6px;
  border: 1px solid var(--dt-ink-muted);
  border-top: none;
  position: relative;
}
.dt-scale-bar-line::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  width: 1px;
  height: 4px;
  background: var(--dt-ink-muted);
}

/* 罗盘（左上角）—— 必须用更高优先级选择器覆盖框架的 .narrative-map-area svg{width:100%;height:100%} */
.narrative-map-area .dt-map-overlay .dt-compass {
  position: absolute;
  top: 20px;
  left: 20px;
  width: 52px !important;
  height: 52px !important;
  opacity: 0.45;
}

/* ---------- 信息卡片覆盖 ---------- */
.narrative-info-card {
  background-color: rgba(247, 240, 224, 0.94);
  border: 1px solid var(--dt-border-soft);
  border-left: 3px solid var(--dt-ochre);
  max-width: 280px;
  padding: 16px 18px;
  border-radius: 10px;
  box-shadow: 0 6px 24px rgba(146, 64, 14, 0.10);
}

.narrative-info-year {
  color: var(--dt-ochre);
  font-size: 18px;
  letter-spacing: 0.02em;
  margin-bottom: 2px;
}

.narrative-info-title {
  font-size: 15px;
  margin-bottom: 6px;
}

.narrative-info-desc {
  font-size: 12px;
  line-height: 1.55;
  color: var(--dt-ink-light);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.dt-info-meta {
  display: flex;
  gap: 12px;
  margin-top: 6px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.dt-info-meta-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--dt-ink-muted);
}
.dt-info-meta-item strong {
  color: var(--dt-ink);
  font-weight: 600;
}
.narrative-map-area .narrative-info-card .dt-info-meta-icon {
  width: 13px !important;
  height: 13px !important;
  flex-shrink: 0;
  opacity: 0.5;
}

.dt-info-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 8px;
}
.dt-fact-tag {

  align-items: center;
  padding: 2px 8px;
  font-size: 10px;
  font-weight: 500;
  border-radius: var(--radius-full);
  background: var(--dt-sepia);
  color: var(--dt-ochre-dark);
  border: 1px solid rgba(180, 83, 9, 0.12);
}

/* ---------- 时间轴面板覆盖 ---------- */
.narrative-timeline-panel {
  background-color: var(--dt-parchment-light);
  border-left: 1px solid var(--dt-border-soft);
}

.narrative-timeline-header {
  border-bottom: 1px solid var(--dt-border-soft);
  padding: 20px 24px 16px;
}

.dt-timeline-kicker {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--dt-ochre);
  text-transform: uppercase;
  margin-bottom: 4px;
}

.narrative-timeline-title {
  font-size: 18px;
  color: var(--dt-ink);
}

.narrative-timeline-subtitle {
  color: var(--dt-ink-muted);
  font-size: 11px;
  margin-top: 4px;
}

/* 时间轴列表覆盖 */
.narrative-timeline-list {
  padding: 16px 24px;
}
.narrative-timeline-list::before {
  left: 33px;
  background: var(--dt-border-soft);
}

.timeline-event {
  padding: 10px 0;
}

.timeline-event-dot {
  background: var(--dt-parchment-light);
  border-color: var(--dt-border-soft);
}

.timeline-event.active .timeline-event-dot {
  background: var(--dt-ochre);
  border-color: var(--dt-ochre);
  box-shadow: 0 0 0 4px rgba(180, 83, 9, 0.15);
}

.timeline-event-year {
  color: var(--dt-ink-muted);
}

.timeline-event.active .timeline-event-year {
  color: var(--dt-ochre);
}

.timeline-event-title {
  color: var(--dt-ink);
}

.timeline-event.active .timeline-event-title {
  color: var(--dt-ochre-dark);
}

.timeline-event-desc {
  color: var(--dt-ink-muted);
}

.dt-dynasty-area {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--dt-ink-muted);
  margin-top: 2px;
  opacity: 0.7;
}
.timeline-event.active .dt-dynasty-area {
  color: var(--dt-ochre);
  opacity: 1;
}

/* ---------- 底部播放控件覆盖 ---------- */
.narrative-timeline-footer {
  border-top: 1px solid var(--dt-border-soft);
  background: var(--dt-parchment-light);
}

.narrative-play-btn {
  background-color: var(--dt-ochre);
}
.narrative-play-btn:hover {
  background-color: var(--dt-ochre-dark);
}

.narrative-progress {
  background: var(--dt-border-soft);
}
.narrative-progress-bar {
  background: var(--dt-ochre);
}

/* ---------- 朝代切换指示器 ---------- */
.dt-transition-indicator {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--font-serif);
  font-size: 48px;
  font-weight: 700;
  color: var(--dt-ochre);
  opacity: 0;
  pointer-events: none;
  z-index: 10;
  text-shadow: 0 2px 20px rgba(180, 83, 9, 0.2);
  white-space: nowrap;
}

/* ---------- 响应式覆盖 ---------- */
@media (max-width: 1024px) {
  .narrative-map-area .dt-map-overlay .dt-compass {
    width: 44px !important;
    height: 44px !important;
  }
}

@media (max-width: 768px) {
  .narrative-map-area .dt-map-overlay .dt-compass {
    display: none;
  }
  .dt-scale-bar {
    display: none;
  }
  .narrative-info-card {
    max-width: none;
    left: 12px;
    right: 12px;
    bottom: 12px;
  }
}
</style>

/* ============================================================

// ====== 地图投影 ======
// 经纬度 → Canvas 坐标
const MAP = { lonMin: 70, lonMax: 140, latMin: 14, latMax: 57 };
function project(lon, lat) {
  return {
    x: ((lon - MAP.lonMin) / (MAP.lonMax - MAP.lonMin)) * canvasW,
    y: ((MAP.latMax - lat) / (MAP.latMax - MAP.latMin)) * canvasH
  };
}
function projectPoly(pts) {
  return pts.map(([lon, lat]) => project(lon, lat));
}

// ====== 状态 ======
let currentIdx = 0;
let prevIdx = 0;
const animState = { prevOpacity: 0, currentOpacity: 1 };
const capitalState = { lon: dynasties[0].capitalPos[0], lat: dynasties[0].capitalPos[1] };
let isPlaying = false;
let playTimer = null;
let pulsePhase = 0;

// ====== Canvas 初始化 ======
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
let canvasW = 0, canvasH = 0;

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvasW = rect.width;
  canvasH = rect.height;
}

window.addEventListener('resize', () => {
  resizeCanvas();
});

// ====== 渲染主函数 ======
function render() {
  if (canvasW === 0) return;
  ctx.clearRect(0, 0, canvasW, canvasH);

  drawParchmentBg();
  drawBaseMap();
  drawGrid();

  // 绘制前一朝代疆域（淡出）
  if (animState.prevOpacity > 0.01) {
    drawTerritory(dynasties[prevIdx], animState.prevOpacity, true);
  }
  // 绘制当前朝代疆域
  drawTerritory(dynasties[currentIdx], animState.currentOpacity, false);

  drawCapital();
  drawDynastyLabel();
}

// 羊皮纸背景
function drawParchmentBg() {
  const grad = ctx.createRadialGradient(
    canvasW * 0.5, canvasH * 0.4, 0,
    canvasW * 0.5, canvasH * 0.4, Math.max(canvasW, canvasH) * 0.7
  );
  grad.addColorStop(0, '#f7f0e0');
  grad.addColorStop(0.5, '#f0e8d8');
  grad.addColorStop(1, '#e5d9c0');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvasW, canvasH);

  // 纹理斑点
  ctx.save();
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 60; i++) {
    const x = (i * 37.3 + 13) % canvasW;
    const y = (i * 53.7 + 27) % canvasH;
    const r = 2 + (i % 4);
    ctx.fillStyle = '#8a7f6f';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// 经纬度网格
function drawGrid() {
  ctx.save();
  ctx.strokeStyle = 'rgba(138, 127, 111, 0.06)';
  ctx.lineWidth = 0.5;
  ctx.setLineDash([2, 4]);
  // 每5度一条经线
  for (let lon = 75; lon <= 135; lon += 10) {
    const p1 = project(lon, MAP.latMin);
    const p2 = project(lon, MAP.latMax);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }
  // 每5度一条纬线
  for (let lat = 20; lat <= 50; lat += 10) {
    const p1 = project(MAP.lonMin, lat);
    const p2 = project(MAP.lonMax, lat);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
}

// 底图（东亚大陆轮廓、河流、长城）
function drawBaseMap() {
  ctx.save();

  // ---- 大陆填充 ----
  const land = projectPoly(baseMap.landmass);
  ctx.beginPath();
  land.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.closePath();

  // 陆地淡色填充
  ctx.fillStyle = 'rgba(180, 160, 130, 0.08)';
  ctx.fill();

  // 海洋区域（大陆右侧/东南）
  ctx.fillStyle = 'rgba(168, 192, 200, 0.06)';
  ctx.beginPath();
  ctx.moveTo(canvasW, 0);
  // 从大陆轮廓最东北点开始画海洋
  const nePoint = project(134, 48);
  ctx.lineTo(nePoint.x, nePoint.y);
  // 沿大陆东海岸向南
  for (let i = baseMap.landmass.length - 1; i >= 0; i--) {
    const p = project(baseMap.landmass[i][0], baseMap.landmass[i][1]);
    // 只画东海岸部分
    if (baseMap.landmass[i][0] > 100) {
      ctx.lineTo(p.x, p.y);
    }
  }
  ctx.lineTo(canvasW, canvasH);
  ctx.closePath();
  ctx.fill();

  // 大陆轮廓线
  ctx.strokeStyle = 'rgba(90, 79, 63, 0.22)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  land.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.closePath();
  ctx.stroke();

  // ---- 台湾 ----
  const tw = projectPoly(baseMap.taiwan);
  ctx.beginPath();
  tw.forEach((p, i) => { i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); });
  ctx.closePath();
  ctx.fillStyle = 'rgba(180, 160, 130, 0.08)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(90, 79, 63, 0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // ---- 海南 ----
  const hn = projectPoly(baseMap.hainan);
  ctx.beginPath();
  hn.forEach((p, i) => { i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); });
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // ---- 黄河 ----
  ctx.strokeStyle = 'rgba(184, 146, 60, 0.28)';
  ctx.lineWidth = 1.8;
  ctx.setLineDash([]);
  ctx.beginPath();
  baseMap.yellowRiver.forEach((pt, i) => {
    const p = project(pt[0], pt[1]);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else {
      const prev = baseMap.yellowRiver[i - 1];
      const pp = project(prev[0], prev[1]);
      const cpx = (pp.x + p.x) / 2;
      const cpy = (pp.y + p.y) / 2;
      ctx.quadraticCurveTo(pp.x, pp.y, cpx, cpy);
    }
  });
  ctx.stroke();

  // ---- 长江 ----
  ctx.strokeStyle = 'rgba(120, 160, 170, 0.28)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  baseMap.yangtze.forEach((pt, i) => {
    const p = project(pt[0], pt[1]);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else {
      const prev = baseMap.yangtze[i - 1];
      const pp = project(prev[0], prev[1]);
      const cpx = (pp.x + p.x) / 2;
      const cpy = (pp.y + p.y) / 2;
      ctx.quadraticCurveTo(pp.x, pp.y, cpx, cpy);
    }
  });
  ctx.stroke();

  // ---- 长城 ----
  ctx.strokeStyle = 'rgba(146, 64, 14, 0.18)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();
  baseMap.greatWall.forEach((pt, i) => {
    const p = project(pt[0], pt[1]);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.restore();
}

// 疆域多边形
function drawTerritory(d, opacity, isPrev) {
  if (opacity < 0.01) return;
  const pts = projectPoly(d.territory);
  ctx.save();
  ctx.globalAlpha = opacity;

  // 路径
  const path = new Path2D();
  pts.forEach((p, i) => {
    if (i === 0) path.moveTo(p.x, p.y);
    else path.lineTo(p.x, p.y);
  });
  path.closePath();

  // 填充（径向渐变）
  const cx = d.capitalPos[0];
  const cy = d.capitalPos[1];
  const cp = project(cx, cy);
  const fillRadius = Math.max(canvasW, canvasH) * 0.4;
  const grad = ctx.createRadialGradient(cp.x, cp.y, 0, cp.x, cp.y, fillRadius);
  grad.addColorStop(0, 'rgba(180, 83, 9, 0.32)');
  grad.addColorStop(0.5, 'rgba(180, 83, 9, 0.20)');
  grad.addColorStop(1, 'rgba(146, 64, 14, 0.10)');
  ctx.fillStyle = grad;
  ctx.fill(path);

  // 填充纹理（斜线）
  ctx.save();
  ctx.clip(path);
  ctx.strokeStyle = 'rgba(180, 83, 9, 0.05)';
  ctx.lineWidth = 1;
  for (let i = -canvasH; i < canvasW + canvasH; i += 8) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i + canvasH, canvasH);
    ctx.stroke();
  }
  ctx.restore();

  // 外发光边线
  if (!isPrev) {
    ctx.shadowColor = 'rgba(180, 83, 9, 0.35)';
    ctx.shadowBlur = 14;
  }
  ctx.strokeStyle = isPrev ? 'rgba(146, 64, 14, 0.4)' : 'rgba(180, 83, 9, 0.7)';
  ctx.lineWidth = isPrev ? 1.5 : 2.2;
  ctx.stroke(path);
  ctx.shadowBlur = 0;

  // 内部虚线
  if (!isPrev) {
    ctx.strokeStyle = 'rgba(146, 64, 14, 0.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.stroke(path);
    ctx.setLineDash([]);
  }

  ctx.restore();
}

// 都城标记
function drawCapital() {
  const p = project(capitalState.lon, capitalState.lat);
  const pulse = Math.sin(pulsePhase) * 0.5 + 0.5;

  ctx.save();

  // 外圈脉冲光晕
  ctx.fillStyle = `rgba(180, 83, 9, ${0.08 + pulse * 0.06})`;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 18 + pulse * 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = `rgba(180, 83, 9, ${0.12 + pulse * 0.08})`;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
  ctx.fill();

  // 星形标记
  drawStar(p.x, p.y, 7, 3, 5, '#B45309', '#92400E');

  // 都城名称
  ctx.font = '600 12px "Noto Serif SC", serif';
  ctx.fillStyle = '#3a2f1f';
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(247, 240, 224, 0.9)';
  ctx.shadowBlur = 4;
  ctx.fillText(dynasties[currentIdx].capital, p.x, p.y - 16);
  ctx.shadowBlur = 0;

  ctx.restore();
}

// 绘制星形
function drawStar(cx, cy, outerR, innerR, points, fill, stroke) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const angle = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

// 领土上的朝代名称（水印）
function drawDynastyLabel() {
  const d = dynasties[currentIdx];
  // 计算领土质心
  let cx = 0, cy = 0;
  d.territory.forEach(([lon, lat]) => { cx += lon; cy += lat; });
  cx /= d.territory.length;
  cy /= d.territory.length;
  const p = project(cx, cy);

  ctx.save();
  ctx.font = '700 32px "Noto Serif SC", serif';
  ctx.fillStyle = 'rgba(58, 47, 31, 0.12)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(d.name, p.x, p.y + 22);
  ctx.restore();
}

// ====== 动画循环（脉冲效果） ======
function animateLoop() {
  pulsePhase += 0.04;
  if (pulsePhase > Math.PI * 2) pulsePhase -= Math.PI * 2;
  render();
  requestAnimationFrame(animateLoop);
}

// ====== 时间轴列表生成 ======
function buildTimeline() {
  const list = document.getElementById('timelineList');
  list.innerHTML = dynasties.map((d, i) => `
    <div class="timeline-event ${i === 0 ? 'active' : ''}" data-idx="${i}">
      <div class="timeline-event-dot"></div>
      <div class="timeline-event-content">
        <div class="timeline-event-year">${d.yearLabel}</div>
        <div class="timeline-event-title">${d.name} · ${d.title}</div>
        <div class="timeline-event-desc">${d.desc.substring(0, 50)}...</div>
        <div class="dt-dynasty-area">${d.area} · 都城 ${d.capital}</div>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.timeline-event').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      if (idx !== currentIdx) {
        transitionTo(idx);
      }
    });
  });
}

// ====== 朝代切换（交叉淡入） ======
function transitionTo(idx) {
  const target = dynasties[idx];
  prevIdx = currentIdx;
  currentIdx = idx;

  // 显示切换指示器
  const indicator = document.getElementById('transitionIndicator');
  indicator.textContent = target.name;
  gsap.fromTo(indicator,
    { opacity: 0, scale: 0.8 },
    { opacity: 0.15, scale: 1, duration: 0.4, ease: 'power2.out',
      onComplete: () => {
        gsap.to(indicator, { opacity: 0, scale: 1.1, duration: 0.4, delay: 0.3 });
      }
    }
  );

  // 更新印章
  const seal = document.getElementById('dynastySeal');
  seal.classList.add('changing');
  setTimeout(() => {
    seal.textContent = target.sealChar;
    seal.classList.remove('changing');
  }, 200);

  // 交叉淡入动画
  animState.prevOpacity = animState.currentOpacity;
  animState.currentOpacity = 0;
  gsap.to(animState, {
    prevOpacity: 0,
    currentOpacity: 1,
    duration: 0.8,
    ease: 'power2.out'
  });

  // 都城位置动画
  gsap.to(capitalState, {
    lon: target.capitalPos[0],
    lat: target.capitalPos[1],
    duration: 0.8,
    ease: 'power2.inOut'
  });

  // 更新信息卡片
  updateInfoCard(target);

  // 更新时间轴高亮
  document.querySelectorAll('.timeline-event').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  // 滚动到当前事件
  const activeEl = document.querySelector('.timeline-event.active');
  if (activeEl) {
    activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // 更新进度条
  const progress = ((idx + 1) / dynasties.length) * 100;
  document.getElementById('progressBar').style.width = `${progress}%`;
  document.getElementById('eventCounter').textContent = `${idx + 1} / ${dynasties.length}`;
}

// ====== 更新信息卡片 ======
function updateInfoCard(d) {
  const card = document.getElementById('infoCard');
  gsap.fromTo(card,
    { opacity: 0.5, y: 10 },
    { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }
  );

  document.getElementById('infoYear').textContent = d.yearLabel;
  document.getElementById('infoTitle').textContent = d.title;
  document.getElementById('infoCapital').textContent = d.capital;
  document.getElementById('infoArea').textContent = d.area;
  document.getElementById('infoDesc').textContent = d.desc;

  const factsEl = document.getElementById('infoFacts');
  factsEl.innerHTML = d.facts.map(f => `<span class="dt-fact-tag">${f}</span>`).join('');
}

// ====== 播放控制 ======
function togglePlay() {
  isPlaying = !isPlaying;
  const icon = document.getElementById('playIcon');
  const label = document.getElementById('playLabel');

  if (isPlaying) {
    icon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
    label.textContent = '暂停';
    playTimer = setInterval(() => {
      let next = currentIdx + 1;
      if (next >= dynasties.length) next = 0;
      transitionTo(next);
    }, 3000);
  } else {
    icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    label.textContent = '播放';
    clearInterval(playTimer);
  }
}

// ====== 键盘交互 ======
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    let prev = currentIdx - 1;
    if (prev < 0) prev = dynasties.length - 1;
    transitionTo(prev);
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    let next = currentIdx + 1;
    if (next >= dynasties.length) next = 0;
    transitionTo(next);
  } else if (e.key === ' ') {
    e.preventDefault();
    togglePlay();
  }
});

// ====== 初始化 ======
document.addEventListener('DOMContentLoaded', () => {
  resizeCanvas();
  buildTimeline();
  updateInfoCard(dynasties[0]);
  animateLoop();

  document.getElementById('playBtn').addEventListener('click', togglePlay);

  // 导航栏滚动效果
  const navbar = document.getElementById('demoNavbar');
  window.addEventListener('scroll', () => {
    navbar.classList.toggle('scrolled', window.scrollY > 10);
  });

  // 隐藏加载屏
  setTimeout(() => {
    document.getElementById('dtLoading').classList.add('hidden');
  }, 800);
});
</script>
