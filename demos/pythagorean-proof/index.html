<script>
"use strict";

/* ============================================================
   勾股定理几何证明 — SVG 可视化
   ============================================================ */

const SVG_W = 700, SVG_H = 480;
const svg = document.getElementById('viz');
let triA = 3, triB = 4;

/* ---- Dynamic layout (auto-scales to fit any a,b values) ---- */
let curS = 36, curAx = 250, curAy = 340;
function calcLayout(a, b) {
  const pad = 35;
  const reqW = a + 2 * b;   // b-square + triangle + c-square extension
  const reqH = 2 * a + b;   // c-square + triangle + a-square
  const s = Math.min((SVG_W - 2*pad) / reqW, (SVG_H - 2*pad) / reqH, 42);
  const ax = pad + b * s + (SVG_W - 2*pad - reqW * s) / 2;
  const ay = pad + (a + b) * s + (SVG_H - 2*pad - reqH * s) / 2;
  return { s, ax, ay };
}

const COL = {
  tri: 'rgba(253,186,116,0.3)',
  triS: '#fdba74',
  sqA: 'rgba(56,189,248,0.15)',
  sqAS: '#38bdf8',
  sqB: 'rgba(74,222,128,0.15)',
  sqBS: '#4ade80',
  sqC: 'rgba(129,140,248,0.15)',
  sqCS: '#818cf8',
  big: '#b45309',
  label: '#1a1a1a',
  muted: '#78716c',
  accent: '#4f46e5'
};

/* ====== Step content ====== */
const steps = [
  {
    title: '一个流传了三千年的定理',
    html: `
      <p class="lead">勾股定理——也许是人类最古老的数学发现。它说的是：直角三角形两直角边的平方和，等于斜边的平方。</p>
      <div class="theorem-box">
        <div class="theorem-title">勾股定理</div>
        <div class="theorem-text">设直角边为 a、b，斜边为 c，则：<br><strong style="font-size:18px;font-family:var(--font-serif)">a² + b² = c²</strong></div>
      </div>
      <div class="history-card"><span class="era">公元前1800年</span><span class="desc">古巴比伦泥板 Plimpton 322 上刻有 15 组勾股数</span></div>
      <div class="history-card"><span class="era">公元前1100年</span><span class="desc">中国《周髀算经》记载"勾三股四弦五"</span></div>
      <div class="history-card"><span class="era">公元前500年</span><span class="desc">毕达哥拉斯学派给出最早的逻辑证明</span></div>
      <p>三个文明独立发现了同一条定理——因为它不是巧合，而是<strong>空间本身的基本规律</strong>。</p>
      <p style="color:#b45309;font-weight:500;font-style:italic;font-family:var(--font-serif)">→ 试着拖动右侧三角形的顶点，看看 a² + b² 是否永远等于 c²</p>
    `
  },
  {
    title: '把四个三角形放进大正方形',
    html: `
      <p class="lead">证明的第一步：取四个完全相同的直角三角形，将它们放入一个边长为 (a+b) 的大正方形中。</p>
      <div class="proof-step">
        <div class="proof-num">1</div>
        <div class="proof-text">大正方形边长 = a + b，面积 = (a+b)²</div>
      </div>
      <div class="proof-step">
        <div class="proof-num">2</div>
        <div class="proof-text">四个三角形分别占据四个角落，斜边朝内</div>
      </div>
      <div class="proof-step">
        <div class="proof-num">3</div>
        <div class="proof-text">中间的空白区域，四条边都是 c ——它恰好是一个<strong>边长为 c 的正方形</strong></div>
      </div>
      <p>每个三角形面积 = ½ab，四个总面积 = 2ab。而中间正方形面积 = c²。</p>
      <p style="color:#b45309;font-weight:500;font-style:italic;font-family:var(--font-serif)">→ 看右侧：四个三角形依次"飞"入大正方形</p>
    `
  },
  {
    title: '面积算一算',
    html: `
      <p class="lead">大正方形的面积，等于四个三角形面积加中间正方形面积。这个简单的等式，就是证明的全部。</p>
      <div class="theorem-box">
        <div class="theorem-title">面积等式</div>
        <div class="theorem-text">
          (a + b)² = 4 × ½ab + c²<br>
          <strong>(a + b)² = 2ab + c²</strong>
        </div>
      </div>
      <p>展开左边：</p>
      <div class="proof-step">
        <div class="proof-num">→</div>

/* ====== Navigation ====== */
let curStep = 0;
const stepContent = document.getElementById('stepContent');
const stepLabel = document.getElementById('stepLabel');
const stepDots = document.querySelectorAll('.step-dot');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const captionEl = document.getElementById('visualCaption');
const formulaDisplay = document.getElementById('formulaDisplay');
const areaCards = document.getElementById('areaCards');
const interactivePanel = document.getElementById('interactivePanel');

const captions = [
  '拖动橙色顶点改变边长，观察 a² + b² 永远等于 c²',
  '四个相同的三角形飞入大正方形，中间形成 c² 正方形',
  '大正方形面积 = 四个三角形面积 + 中间正方形面积',
  '赵爽弦图：斜边朝外，围成边长 c 的大正方形',
  '输入数值或拖动滑块，探索勾股数'
];

function updateStep() {
  stepContent.classList.add('fade-out');
  setTimeout(() => {
    const s = steps[curStep];
    stepContent.innerHTML = `<h3 style="font-family:var(--font-serif);font-size:var(--fs-h2);margin-bottom:12px;color:var(--text)">${s.title}</h3>${s.html}`;
    stepContent.classList.remove('fade-out');
    stepContent.classList.add('fade-in');
    setTimeout(() => stepContent.classList.remove('fade-in'), 400);
  }, 200);

  stepLabel.textContent = `第 ${curStep + 1} / ${steps.length} 步`;
  stepDots.forEach((d, i) => {
    d.classList.remove('active', 'completed');
    if (i === curStep) d.classList.add('active');
    else if (i < curStep) d.classList.add('completed');
  });

  prevBtn.disabled = curStep === 0;
  prevBtn.style.opacity = curStep === 0 ? '0.4' : '1';
  prevBtn.style.cursor = curStep === 0 ? 'not-allowed' : 'pointer';
  nextBtn.innerHTML = curStep === steps.length - 1 ? '完成 ✓' : '下一步 <span>→</span>';

  captionEl.textContent = captions[curStep];
  drawStep(curStep);
}

prevBtn.addEventListener('click', () => { if (curStep > 0) { curStep--; updateStep(); resetAutoplay(); } });
nextBtn.addEventListener('click', () => { if (curStep < steps.length - 1) { curStep++; updateStep(); resetAutoplay(); } });
stepDots.forEach(d => d.addEventListener('click', () => { const s = parseInt(d.dataset.step); if (s !== curStep) { curStep = s; updateStep(); resetAutoplay(); } }));

/* ====== SVG Drawing ====== */
function drawStep(step) {
  switch (step) {
    case 0: drawInteractiveTriangle(); break;
    case 1: drawFourTriangles(true); break;
    case 2: drawFourTriangles(false); break;
    case 3: drawZhaoShuang(); break;
    case 4: drawExplorer(); break;
  }
  // Show/hide panels
  areaCards.style.display = (step === 0 || step === 4) ? 'grid' : 'none';
  interactivePanel.style.display = (step === 4) ? 'block' : 'none';
  formulaDisplay.style.display = (step === 4) ? 'none' : 'block';
}

/* ---- Step 0 & 4: Interactive triangle with 3 squares (auto-scaled) ---- */
function drawInteractiveTriangle() {
  const a = triA, b = triB, c = Math.sqrt(a*a + b*b);
  const layout = calcLayout(a, b);

  const s = curS, ax = curAx, ay = curAy;
  const bx = ax + a * s, by = ay;
  const cx = ax, cy = ay - b * s;

  // Square on c (hypotenuse)
  const nx = b / c, ny = -a / c;

  const v3x = cx + nx * dv, v3y = cy + ny * dv;
  const v4x = bx + nx * dv, v4y = by + ny * dv;

    <text x="${(bx+cx)/2 + 12}" y="${(by+cy)/2 - 4}" fill="${COL.muted}" font-size="${labelSize}" text-anchor="start" font-family="'JetBrains Mono',monospace" transform="rotate(${Math.atan2(cy-by, cx-bx) * 180/Math.PI} ${(bx+cx)/2+12} ${(by+cy)/2-4})">c = ${c.toFixed(2)}</text>

    <!-- Drag handles -->
    <circle cx="${bx}" cy="${by}" r="14" fill="rgba(180,83,9,0.08)" stroke="${COL.big}" stroke-width="1.5" class="drag-handle" data-vertex="B"/>

/* ---- Step 3: Zhao Shuang string diagram ---- */
function drawZhaoShuang() {
  const a = 3, b = 4, c = 5, s = 44;
  const side = c * s;
  const ox = (SVG_W - side) / 2;
  const oy = (SVG_H - side) / 2 - 5;

  const a2c = a * a / c * s;
  const b2c = b * b / c * s;
  const abc = a * b / c * s;

  // Outer square corners
  const TL = [ox, oy], TR = [ox + side, oy];
  const BR = [ox + side, oy + side], BL = [ox, oy + side];

  // Right-angle vertices of the 4 triangles
  const v1 = [ox + a2c, oy + abc];
  const v2 = [ox + side - abc, oy + a2c];
  const v3 = [ox + side - a2c, oy + side - abc];
  const v4 = [ox + abc, oy + side - a2c];

  const tris = [
    { pts: `${TL[0]},${TL[1]} ${TR[0]},${TR[1]} ${v1[0]},${v1[1]}`, delay: 0 },
    { pts: `${TR[0]},${TR[1]} ${BR[0]},${BR[1]} ${v2[0]},${v2[1]}`, delay: 0.15 },
    { pts: `${BR[0]},${BR[1]} ${BL[0]},${BL[1]} ${v3[0]},${v3[1]}`, delay: 0.3 },
    { pts: `${BL[0]},${BL[1]} ${TL[0]},${TL[1]} ${v4[0]},${v4[1]}`, delay: 0.45 }
  ];

  let triHtml = tris.map(t =>
    `<polygon points="${t.pts}" fill="${COL.tri}" stroke="${COL.triS}" stroke-width="2" class="tri-appear" style="animation-delay:${t.delay}s;transform-origin:center;transform-box:fill-box"/>`
  ).join('');

  const innerSide = (b - a) * s;

  svg.innerHTML = `
    <!-- Outer square (side = c) -->
    <rect x="${ox}" y="${oy}" width="${side}" height="${side}" fill="none" stroke="${COL.big}" stroke-width="2.5" rx="2"/>

    <!-- Four triangles -->
    ${triHtml}

    <!-- Inner small square (side = b-a) -->
    <polygon points="${v1[0]},${v1[1]} ${v2[0]},${v2[1]} ${v3[0]},${v3[1]} ${v4[0]},${v4[1]}"
             fill="rgba(79,70,229,0.12)" stroke="${COL.accent}" stroke-width="2" class="tri-appear"
             style="animation-delay:0.7s;transform-origin:center;transform-box:fill-box"/>

    <!-- Labels -->
    <text x="${ox + side/2}" y="${oy + side/2 + 6}" fill="${COL.accent}" font-size="14" font-weight="600" text-anchor="middle" font-family="'Noto Serif SC',serif" class="label-appear" style="animation-delay:0.9s">(b−a)²</text>

    <text x="${ox + side/2}" y="${oy - 10}" fill="${COL.big}" font-size="15" font-weight="700" text-anchor="middle" font-family="'Noto Serif SC',serif" class="label-appear" style="animation-delay:0.8s">c²</text>

    <!-- Hypotenuse labels -->
    <text x="${ox + side/2}" y="${oy + abc + 16}" fill="${COL.muted}" font-size="11" text-anchor="middle" font-family="'JetBrains Mono',monospace" class="label-appear" style="animation-delay:1s">c</text>
    <text x="${ox + side - abc - 14}" y="${oy + side/2}" fill="${COL.muted}" font-size="11" text-anchor="middle" font-family="'JetBrains Mono',monospace" class="label-appear" style="animation-delay:1s">c</text>

    <!-- Formula -->
    <text x="${SVG_W/2}" y="${oy + side + 32}" fill="${COL.big}" font-size="15" font-weight="600" text-anchor="middle" font-family="'Noto Serif SC',serif" class="label-appear" style="animation-delay:1.1s">c² = 4·½ab + (b−a)²</text>
    <text x="${SVG_W/2}" y="${oy + side + 52}" fill="${COL.muted}" font-size="13" font-weight="500" text-anchor="middle" font-family="'JetBrains Mono',monospace" class="label-appear" style="animation-delay:1.2s">= 2ab + a² + b² − 2ab = a² + b²</text>
  `;

  document.getElementById('formulaMain').innerHTML = 'c² = 4·½ab + (b−a)² = <span class="hl">a² + b²</span>';

}

/* ====== Drag interaction (Step 0) ====== */
function setupDrag() {
  const handles = svg.querySelectorAll('.drag-handle');
  handles.forEach(h => {
    h.addEventListener('mousedown', startDrag);
    h.addEventListener('touchstart', startDrag, { passive: false });
  });
}

let dragVertex = null;

function startDrag(e) {
  e.preventDefault();
  dragVertex = e.currentTarget.dataset.vertex;
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('touchmove', onDrag, { passive: false });
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('touchend', endDrag);
}

function onDrag(e) {
  if (!dragVertex) return;
  e.preventDefault();
  const pt = getSVGPoint(e);

  if (dragVertex === 'B') {
    let newA = (pt.x - curAx) / curS;
    newA = Math.max(1, Math.min(8, newA));
    triA = Math.round(newA * 10) / 10;
  } else if (dragVertex === 'C') {
    let newB = (curAy - pt.y) / curS;
    newB = Math.max(1, Math.min(8, newB));
    triB = Math.round(newB * 10) / 10;
  }
  drawInteractiveTriangle();
}

function endDrag() {
  dragVertex = null;
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('touchmove', onDrag);
  document.removeEventListener('mouseup', endDrag);
  document.removeEventListener('touchend', endDrag);
}

function getSVGPoint(e) {
  const rect = svg.getBoundingClientRect();
  const x = (e.clientX || e.touches[0].clientX) - rect.left;
  const y = (e.clientY || e.touches[0].clientY) - rect.top;
  return { x: x * (SVG_W / rect.width), y: y * (SVG_H / rect.height) };
}

  if (playing) { stopAutoplay(); startAutoplay(); }

    document.getElementById('inputA').value = a;
    document.getElementById('inputB').value = b;
    triA = a; triB = b;
    drawInteractiveTriangle();
  }

  const c2 = a*a + b*b;
  const c = Math.sqrt(c2);
  if (Number.isInteger(c) && c > 0) {
    tripleResult.className = 'triple-result found';
    tripleResult.textContent = `✓ 勾股数！${a}² + ${b}² = ${c}² （${a}, ${b}, ${c}）`;
  } else {
    tripleResult.className = 'triple-result not-found';
    tripleResult.textContent = `${a}² + ${b}² = ${c2} → c ≈ ${c.toFixed(3)}`;
  }
}

tripleA.addEventListener('input', checkTriple);
tripleB.addEventListener('input', checkTriple);

/* ====== Navbar scroll ====== */
window.addEventListener('scroll', () => {
  document.getElementById('demoNavbar').classList.toggle('scrolled', window.scrollY > 10);
});

/* ====== Init ====== */
checkTriple();
updateStep();
</script>
