<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== 细胞器数据 =====
const ORGANELLE_DATA = [
  { id:'membrane', name:'细胞膜', nameEn:'Cell Membrane', color:0xC8B4FF, hex:'#C8B4FF',
    desc:'由磷脂双分子层构成的基本支架，蛋白质镶嵌其中，具有选择透过性。',

  { id:'mitochondria', name:'线粒体', nameEn:'Mitochondria', color:0xE65100, hex:'#E65100',
    desc:'双层膜结构，内膜向内折叠形成嵴，扩大了内膜面积。嵴上附着多种酶。',
    func:'有氧呼吸的主要场所，细胞的"动力车间"，为生命活动提供约95%能量。', type:'both' },
  { id:'er', name:'内质网', nameEn:'Endoplasmic Reticulum', color:0x64B5F6, hex:'#64B5F6',
    desc:'由膜连接而成的网状结构。粗面内质网附着核糖体，滑面内质网表面光滑。',
    func:'蛋白质合成和加工、脂质合成的"车间"。', type:'both' },
  { id:'golgi', name:'高尔基体', nameEn:'Golgi Apparatus', color:0xFFB300, hex:'#FFB300',
    desc:'由扁平囊泡和分泌小泡组成，接受来自内质网的产物进行加工。',
    func:'对蛋白质进行加工、分类、包装和发送的"车间"及"发送站"。', type:'both' },
  { id:'ribosome', name:'核糖体', nameEn:'Ribosome', color:0x455A64, hex:'#455A64',
    desc:'无膜结构，由RNA和蛋白质组成。游离在细胞质基质中或附着在内质网上。',
    func:'蛋白质的合成场所，"生产蛋白质的机器"。', type:'both' },
  { id:'lysosome', name:'溶酶体', nameEn:'Lysosome', color:0xC62828, hex:'#C62828',
    desc:'单层膜囊状结构，内含多种水解酶。',
    func:'细胞的"消化车间"，能分解衰老损伤的细胞器和吞入的颗粒。', type:'both' },
  { id:'centriole', name:'中心体', nameEn:'Centrosome', color:0xFF9800, hex:'#FF9800',
    desc:'由两个互相垂直的中心粒组成。动物细胞和低等植物细胞特有。',
    func:'与细胞有丝分裂有关，参与纺锤体的形成。', type:'animal' },
  { id:'chloroplast', name:'叶绿体', nameEn:'Chloroplast', color:0x2E7D32, hex:'#2E7D32',
    desc:'双层膜结构，内部有基粒（类囊体堆叠而成）。基质中含有酶、DNA和核糖体。',
    func:'光合作用的场所，"养料制造车间"和"能量转换站"。', type:'plant' },
  { id:'vacuole', name:'液泡', nameEn:'Vacuole', color:0x80DEEA, hex:'#80DEEA',
    desc:'单层膜囊泡，内含细胞液（糖类、无机盐、色素和蛋白质等）。',
    func:'调节细胞内环境，维持细胞渗透压，使细胞保持坚挺。', type:'plant' },
  { id:'cellwall', name:'细胞壁', nameEn:'Cell Wall', color:0x96C896, hex:'#96C896',
    desc:'由纤维素和果胶构成，位于植物细胞最外层，具有全透性。',
    func:'支持和保护细胞，维持细胞形态。', type:'plant' }
];

// ===== 全局变量 =====
let scene, camera, renderer, controls, clock;
let cellGroup;
const organelles = {};
const allMaterials = [];
let raycaster, pointer;
let currentCellType = 'animal';
let currentDisplayMode = 'solid';
let selectedId = null;
let bgParticles, cytoParticles;
let secretionActive = false;
let isFlying = false;
const activeTweens = [];
let clipPlane = null;
let clipEnabled = false;
let clipAxis = 'x';
let clipPos = 0;

// ===== Tween 工具 =====
function tween(from, to, duration, onUpdate, onComplete) {
  const startTime = performance.now();
  activeTweens.push({ from, to, duration, onUpdate, onComplete, startTime, active: true });
}
function updateTweens() {
  const now = performance.now();
  for (let i = activeTweens.length - 1; i >= 0; i--) {
    const tw = activeTweens[i];
    if (!tw.active) { activeTweens.splice(i, 1); continue; }
    const p = Math.min((now - tw.startTime) / tw.duration, 1);
    const e = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
    tw.onUpdate(tw.from + (tw.to - tw.from) * e, p);
    if (p >= 1) { tw.active = false; activeTweens.splice(i, 1); if (tw.onComplete) tw.onComplete(); }
  }
}

// ===== 材质创建 =====
function createMaterial(color, opacity, emissive, emissiveIntensity) {
  const mat = new THREE.MeshStandardMaterial({
    color, transparent: true, opacity: opacity ?? 0.85,
    roughness: 0.35, metalness: 0.0,
    emissive: emissive || 0x000000,
    emissiveIntensity: emissiveIntensity || 0,
    depthWrite: (opacity ?? 0.85) > 0.5
  });
  mat.userData.baseOpacity = opacity ?? 0.85;
  mat.userData.baseEmissive = emissiveIntensity || 0;
  allMaterials.push(mat);
  return mat;
}

function setOrganelleId(group, id) {
  group.userData.organelleId = id;
  group.traverse(c => { c.userData.organelleId = id; });
}

// ===== 初始化 =====
function init() {
  const container = document.getElementById('canvasContainer');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a1510);
  scene.fog = new THREE.Fog(0x0a1510, 14, 38);

  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(0, 2, 13);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.localClippingEnabled = true;
  container.appendChild(renderer.domElement);

  // 光照系统
  scene.add(new THREE.AmbientLight(0x1a3322, 0.5));
  const key = new THREE.DirectionalLight(0xaaffcc, 0.7);
  key.position.set(6, 8, 5);
  scene.add(key);
  const fill = new THREE.PointLight(0x44aaff, 0.4, 30);
  fill.position.set(-6, -4, -5);
  scene.add(fill);
  const rim = new THREE.PointLight(0xff6688, 0.3, 25);
  rim.position.set(0, 6, -6);
  scene.add(rim);
  const top = new THREE.PointLight(0x88ff88, 0.25, 20);
  top.position.set(0, 5, 3);
  scene.add(top);

  // 控制器
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 2;
  controls.maxDistance = 25;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;
  controls.target.set(0, 0, 0);

  raycaster = new THREE.Raycaster();
  pointer = new THREE.Vector2();
  clock = new THREE.Clock();

  // 构建细胞
  cellGroup = new THREE.Group();
  buildMembrane();
  buildNucleus();
  buildMitochondria();
  buildER();
  buildGolgi();
  buildRibosomes();
  buildLysosomes();
  buildCentrioles();
  buildChloroplasts();
  buildVacuole();
  buildCellWall();
  scene.add(cellGroup);

  // 粒子系统
  createBackgroundParticles();
  createCytoplasmParticles();

  // 初始可见性
  updateCellTypeVisibility();

  // 入场动画：细胞膜先成形，然后细胞器逐个浮现
  const introOrder = ['nucleus', 'mitochondria', 'er', 'golgi', 'ribosome', 'lysosome', 'centriole', 'chloroplast', 'vacuole', 'cellwall'];
  introOrder.forEach(id => {
    if (organelles[id]) organelles[id].group.visible = false;
  });
  cellGroup.scale.setScalar(0.01);
  tween(0.01, 1, 1200, (v) => {
    cellGroup.scale.setScalar(v);
  }, () => {
    document.getElementById('loading').classList.remove('active');
    // 逐个浮现细胞器
    introOrder.forEach((id, i) => {
      setTimeout(() => {
        const org = organelles[id];
        if (!org) return;
        org.group.visible = true;
        // 跳过当前细胞类型不可见的细胞器
        const type = org.data.type;
        if (type !== 'both' && type !== currentCellType) {
          org.group.visible = false;
        }
        // 微弹效果
        org.group.scale.setScalar(0.3);
        tween(0.3, 1, 400, (v) => org.group.scale.setScalar(v));
      }, i * 180);
    });
  });

  // 构建UI
  updateOrganelleList();
  bindUI();
  animate();
}

// ===== 构建细胞膜 =====
function buildMembrane() {
  const g = new THREE.Group();
  const mat = createMaterial(0xC8B4FF, 0.06, 0x6644AA, 0.05);
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(4.5, 32, 32), mat);
  mesh.raycast = () => {}; // 不参与拾取
  g.add(mesh);
  // 边缘发光
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xC8B4FF, transparent: true, opacity: 0.04,
    side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const glow = new THREE.Mesh(new THREE.SphereGeometry(4.8, 24, 24), glowMat);
  glow.raycast = () => {};
  g.add(glow);
  g.userData.glowMesh = glow;
  setOrganelleId(g, 'membrane');
  organelles.membrane = { group: g, data: ORGANELLE_DATA[0] };
  cellGroup.add(g);
}

// ===== 构建细胞核 =====
function buildNucleus() {
  const g = new THREE.Group();
  const envMat = createMaterial(0x8E24AA, 0.35, 0x4A148C, 0.15);
  const env = new THREE.Mesh(new THREE.SphereGeometry(1.3, 24, 24), envMat);
  g.add(env);
  // 核仁
  const nucMat = createMaterial(0xBA68C8, 0.9, 0x6A1B9A, 0.3);
  const nuc = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), nucMat);
  nuc.position.set(0.2, 0.1, -0.1);
  g.add(nuc);
  // 染色质纹理（小球点缀）
  const chrMat = createMaterial(0x7B1FA2, 0.5, 0x4A148C, 0.1);
  for (let i = 0; i < 5; i++) {
    const chr = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), chrMat);
    const a = (i / 5) * Math.PI * 2;
    chr.position.set(Math.cos(a) * 0.7, Math.sin(a) * 0.5, Math.sin(a * 2) * 0.4);
    g.add(chr);
  }
  setOrganelleId(g, 'nucleus');
  organelles.nucleus = { group: g, data: ORGANELLE_DATA[1] };
  cellGroup.add(g);
}

// ===== 构建线粒体 =====
function buildMitochondria() {
  const g = new THREE.Group();
  const mat = createMaterial(0xE65100, 0.82, 0xBF360C, 0.2);
  const positions = [
    [2.5, 1, -1], [-2.2, -1, 1.5], [0.5, -2.5, -2]
  ];
  positions.forEach((pos, i) => {
    const mg = new THREE.Group();
    // 外膜胶囊
    const outer = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.7, 6, 12), mat);
    outer.rotation.set(
      Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI
    );
    mg.add(outer);
    // 嵴（内部环形结构）
    const cristaeMat = createMaterial(0xFF8A65, 0.6, 0xE65100, 0.1);
    for (let j = 0; j < 3; j++) {
      const cr = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.02, 6, 12), cristaeMat);
      cr.position.x = (j - 1) * 0.25;
      cr.rotation.y = Math.PI / 2;
      outer.add(cr);
    }
    mg.position.set(...pos);
    mg.userData.basePos = [...pos];
    g.add(mg);
  });
  setOrganelleId(g, 'mitochondria');
  organelles.mitochondria = { group: g, data: ORGANELLE_DATA[2] };
  cellGroup.add(g);
}

// ===== 构建内质网 =====
function buildER() {
  const g = new THREE.Group();
  const mat = createMaterial(0x64B5F6, 0.55, 0x1565C0, 0.1);
  const pieces = [
    [[0.4, 0.4, 0.3], [1.2, 0.8, 0.7], [2, 1, 1]],
    [[-0.4, -0.3, -0.3], [-1.2, -0.8, -0.7], [-2, -1, -1]],
    [[0.3, -0.4, 0.3], [0.8, -1, 0.7], [1.5, -1.5, 1]]
  ];
  pieces.forEach(pts => {
    const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)));
    const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 15, 0.1, 6, false), mat);
    g.add(mesh);
  });
  // 粗面内质网上的核糖体颗粒
  const ribMat = createMaterial(0x546E7A, 0.9);
  pieces.forEach((pts, pi) => {
    const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)));
    for (let i = 0; i < 4; i++) {
      const t = (i + 0.5) / 4;
      const pos = curve.getPoint(t);
      pos.x += (Math.random() - 0.5) * 0.15;
      pos.y += (Math.random() - 0.5) * 0.15;
      pos.z += (Math.random() - 0.5) * 0.15;
      const rib = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), ribMat);
      rib.position.copy(pos);
      g.add(rib);
    }
  });
  setOrganelleId(g, 'er');
  organelles.er = { group: g, data: ORGANELLE_DATA[3] };
  cellGroup.add(g);
}

// ===== 构建高尔基体 =====
function buildGolgi() {
  const g = new THREE.Group();
  const mat = createMaterial(0xFFB300, 0.72, 0xFF6F00, 0.12);
  // 堆叠扁平囊
  for (let i = 0; i < 5; i++) {
    const r = 0.5 - i * 0.04;
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.06, 20), mat);
    mesh.position.set(2.5, 0.9 + i * 0.14, 1.5);
    mesh.rotation.y = i * 0.08;
    g.add(mesh);
  }
  // 分泌小泡
  const vesiMat = createMaterial(0xFFB300, 0.5, 0xFF6F00, 0.05);
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2;
    const v = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 10), vesiMat);
    v.position.set(2.5 + Math.cos(a) * 0.7, 0.6, 1.5 + Math.sin(a) * 0.7);
    g.add(v);
  }
  setOrganelleId(g, 'golgi');
  organelles.golgi = { group: g, data: ORGANELLE_DATA[4] };
  cellGroup.add(g);
}

// ===== 背景粒子 =====
function createBackgroundParticles() {
  const count = 200;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const r = 15 + Math.random() * 15;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
    sizes[i] = Math.random() * 0.05 + 0.02;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x4a9d6a, size: 0.08, transparent: true, opacity: 0.4,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  bgParticles = new THREE.Points(geo, mat);
  scene.add(bgParticles);
}

// ===== 细胞质粒子 =====
function createCytoplasmParticles() {
  const count = 100;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const vel = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = Math.random() * 3.8;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
    vel[i*3] = (Math.random() - 0.5) * 0.002;
    vel[i*3+1] = (Math.random() - 0.5) * 0.002;
    vel[i*3+2] = (Math.random() - 0.5) * 0.002;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.userData.velocities = vel;
  const mat = new THREE.PointsMaterial({
    color: 0x88ddaa, size: 0.05, transparent: true, opacity: 0.3,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  cytoParticles = new THREE.Points(geo, mat);
  cellGroup.add(cytoParticles);
}

// ===== 动画循环 =====
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  updateTweens();

  // 线粒体脉动
  if (organelles.mitochondria) {
    organelles.mitochondria.group.children.forEach((mg, i) => {
      const s = 1 + Math.sin(t * 2 + i * 1.5) * 0.06;
      mg.scale.setScalar(s);
    });
  }

  // 细胞质粒子流动
  if (cytoParticles) {
    const pos = cytoParticles.geometry.attributes.position.array;
    const vel = cytoParticles.geometry.userData.velocities;
    for (let i = 0; i < pos.length; i += 3) {
      pos[i] += vel[i] + Math.sin(t * 0.5 + i) * 0.0008;
      pos[i+1] += vel[i+1] + Math.cos(t * 0.3 + i) * 0.0008;
      pos[i+2] += vel[i+2] + Math.sin(t * 0.4 + i * 0.5) * 0.0008;
      // 边界约束
      const d = Math.sqrt(pos[i]**2 + pos[i+1]**2 + pos[i+2]**2);
      if (d > 3.8) {
        pos[i] *= -0.95; pos[i+1] *= -0.95; pos[i+2] *= -0.95;
      }
    }
    cytoParticles.geometry.attributes.position.needsUpdate = true;
  }

  // 背景粒子缓慢旋转
  if (bgParticles) bgParticles.rotation.y += dt * 0.02;

  // 细胞器微悬浮
  if (organelles.lysosome) {
    organelles.lysosome.group.children.forEach((m, i) => {
      const bp = m.userData.basePos;
      if (bp) m.position.y = bp[1] + Math.sin(t * 0.8 + i * 2) * 0.08;
    });
  }
  if (organelles.ribosome) {
    organelles.ribosome.group.children.forEach((m, i) => {
      const bp = m.userData.basePos;
      if (bp) m.position.y = bp[1] + Math.sin(t * 1.2 + i) * 0.05;
    });
  }

  // 细胞膜呼吸效果
  if (organelles.membrane) {
    const s = 1 + Math.sin(t * 0.4) * 0.008;
    organelles.membrane.group.scale.setScalar(s);
  }

  controls.update();
  renderer.render(scene, camera);
}

// ===== 点击交互 =====
function onCanvasClick(e) {
  if (isFlying || secretionActive) return;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(cellGroup, true);
  // 过滤不可见对象
  for (const hit of hits) {
    let obj = hit.object;
    let visible = true;
    while (obj) {
      if (obj.visible === false) { visible = false; break; }
      obj = obj.parent;
    }
    if (visible && hit.object.userData.organelleId) {
      highlightOrganelle(hit.object.userData.organelleId);
      return;
    }
  }
  unhighlight();
}

// ===== 高亮细胞器 =====
function highlightOrganelle(id) {
  if (selectedId === id) { unhighlight(); return; }
  unhighlight();
  selectedId = id;
  const org = organelles[id];
  if (!org) return;
  // 提升 emissive
  org.group.traverse(c => {
    if (c.isMesh && c.material && c.material.emissive) {
      c.material.userData.origEmissive = c.material.emissiveIntensity;
      c.material.emissiveIntensity = Math.max(c.material.emissiveIntensity, 0.6);
    }
  });
  document.querySelectorAll('.organelle-item').forEach(item => {
    item.classList.toggle('active', item.dataset.id === id);
  });
  showInfo(id);
}

// ===== 取消高亮 =====
function unhighlight() {
  if (!selectedId) return;
  Object.values(organelles).forEach(org => {
    org.group.traverse(c => {
      if (c.isMesh && c.material && c.material.userData.origEmissive !== undefined) {
        c.material.emissiveIntensity = c.material.userData.origEmissive;
        delete c.material.userData.origEmissive;
      }
    });
  });
  selectedId = null;
  document.querySelectorAll('.organelle-item').forEach(item => item.classList.remove('active'));
  document.getElementById('infoPanel').classList.remove('visible');
}

// ===== 显示信息面板 =====
function showInfo(id) {
  const d = ORGANELLE_DATA.find(o => o.id === id);
  if (!d) return;
  const dot = document.getElementById('infoColorDot');
  dot.style.background = d.hex;
  dot.style.color = d.hex;
  document.getElementById('infoName').textContent = d.name;
  document.getElementById('infoNameEn').textContent = d.nameEn;
  document.getElementById('infoDesc').textContent = d.desc;
  document.getElementById('infoFunc').textContent = d.func;
  document.getElementById('infoPanel').classList.add('visible');
}

// ===== 更新细胞类型可见性 =====
function updateCellTypeVisibility() {
  Object.values(organelles).forEach(org => {
    const type = org.data.type;
    if (type === 'both') {
      org.group.visible = true;
    } else {
      org.group.visible = (type === currentCellType);
    }
  });
  // 植物细胞时调整细胞核位置（为液泡让空间）
  if (currentCellType === 'plant') {
    if (organelles.nucleus) organelles.nucleus.group.position.set(-1.2, 0.8, 0);
    if (organelles.mitochondria) organelles.mitochondria.group.position.set(0, 0, 0);
  } else {
    if (organelles.nucleus) organelles.nucleus.group.position.set(0, 0, 0);
    if (organelles.mitochondria) organelles.mitochondria.group.position.set(0, 0, 0);
  }
  updateOrganelleList();
}

// ===== 更新细胞器列表 =====
function updateOrganelleList() {
  const list = document.getElementById('organelleList');
  list.innerHTML = '';
  ORGANELLE_DATA.forEach(d => {
    if (d.type !== 'both' && d.type !== currentCellType) return;
    const org = organelles[d.id];
    if (!org || !org.group.visible) return;
    const item = document.createElement('div');
    item.className = 'organelle-item';
    if (selectedId === d.id) item.classList.add('active');
    item.dataset.id = d.id;
    item.innerHTML = `
      <span class="organelle-dot" style="background:${d.hex};color:${d.hex}"></span>
      <span class="organelle-name">${d.name}</span>
      <button class="organelle-toggle" data-id="${d.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    `;
    item.addEventListener('click', (e) => {
      if (e.target.closest('.organelle-toggle')) {
        e.stopPropagation();
        toggleOrganelle(d.id);
        return;
      }
      highlightOrganelle(d.id);
    });
    list.appendChild(item);
  });
}

// ===== 切换细胞器可见性 =====
function toggleOrganelle(id) {
  const org = organelles[id];
  if (!org) return;
  org.group.visible = !org.group.visible;
  const btn = document.querySelector(`.organelle-toggle[data-id="${id}"]`);
  if (btn) btn.classList.toggle('hidden', !org.group.visible);
}

// ===== 剖切平面 =====
function updateClipPlane() {
  if (!clipEnabled) {
    allMaterials.forEach(mat => { mat.clippingPlanes = []; });
    return;
  }
  const dir = new THREE.Vector3(0, 0, 0);
  dir[clipAxis] = 1;
  clipPlane = new THREE.Plane(dir, -clipPos);
  allMaterials.forEach(mat => { mat.clippingPlanes = [clipPlane]; });
}

function toggleClipping() {
  clipEnabled = !clipEnabled;
  const btn = document.getElementById('clipBtn');
  const panel = document.getElementById('clipPanel');
  btn.classList.toggle('active', clipEnabled);
  panel.classList.toggle('visible', clipEnabled);
  if (clipEnabled) {
    controls.autoRotate = false;
    document.getElementById('spinBtn').classList.remove('active');
  }
  updateClipPlane();
}

function setClipAxis(axis) {
  clipAxis = axis;
  document.querySelectorAll('.clip-axis-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.axis === axis);
  });
  updateClipPlane();
}

// ===== 绑定UI事件 =====
function bindUI() {
  // 画布点击
  renderer.domElement.addEventListener('click', onCanvasClick);
  // 窗口缩放
  window.addEventListener('resize', onWindowResize);
  // 关闭信息面板
  document.getElementById('infoClose').addEventListener('click', unhighlight);
  // 细胞类型切换
  document.querySelectorAll('.cell-type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.classList.contains('active')) return;
      document.querySelectorAll('.cell-type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCellType = btn.dataset.type;
      document.getElementById('statusTag').textContent = currentCellType === 'animal' ? '动物细胞' : '植物细胞';
      unhighlight();
      // 切换动画
      tween(cellGroup.scale.x, 0.3, 300, (v) => {
        cellGroup.scale.setScalar(v);
      }, () => {
        updateCellTypeVisibility();
        tween(0.3, 1, 400, (v) => {
          cellGroup.scale.setScalar(v);
        });
      });
    });
  });
  // 显示模式切换
  document.querySelectorAll('.demo-mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.demo-mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setDisplayMode(btn.dataset.mode);
    });
  });
  // 自动旋转
  document.getElementById('spinBtn').addEventListener('click', function() {
    controls.autoRotate = !controls.autoRotate;
    this.classList.toggle('active', controls.autoRotate);
  });
  // 重置视角
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (isFlying) return;
    const targetPos = { x: 0, y: 2, z: 13 };
    tween(camera.position.x, targetPos.x, 600, (v) => camera.position.x = v);
    tween(camera.position.y, targetPos.y, 600, (v) => camera.position.y = v);
    tween(camera.position.z, targetPos.z, 600, (v) => camera.position.z = v);
    tween(controls.target.x, 0, 600, (v) => controls.target.x = v);
    tween(controls.target.y, 0, 600, (v) => controls.target.y = v);
    tween(controls.target.z, 0, 600, (v) => controls.target.z = v);
  });
  // 飞入细胞
  document.getElementById('flyBtn').addEventListener('click', flyIntoCell);
  // 分泌蛋白演示
  document.getElementById('secretionBtn').addEventListener('click', startSecretion);
  // 全屏
  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });
  // 剖切开关
  document.getElementById('clipBtn').addEventListener('click', toggleClipping);
  // 剖切轴选择
  document.querySelectorAll('.clip-axis-btn').forEach(btn => {
    btn.addEventListener('click', () => setClipAxis(btn.dataset.axis));
  });
  // 剖切位置滑块
  const clipSlider = document.getElementById('clipSlider');
  const clipValue = document.getElementById('clipValue');
  clipSlider.addEventListener('input', () => {
    clipPos = parseFloat(clipSlider.value);
    clipValue.textContent = clipPos.toFixed(1);
    updateClipPlane();
  });
}

// ===== 设置显示模式 =====
function setDisplayMode(mode) {
  currentDisplayMode = mode;
  allMaterials.forEach(mat => {
    if (mode === 'wireframe') {
      mat.wireframe = true;
      mat.opacity = Math.min(mat.userData.baseOpacity, 0.6);
    } else if (mode === 'transparent') {
      mat.wireframe = false;
      mat.opacity = Math.min(mat.userData.baseOpacity, 0.3);
      mat.depthWrite = false;
    } else {
      mat.wireframe = false;
      mat.opacity = mat.userData.baseOpacity;
      mat.depthWrite = mat.userData.baseOpacity > 0.5;
    }
  });
}

// ===== 飞入细胞视角 =====
function flyIntoCell() {
  if (isFlying) return;
  isFlying = true;
  controls.autoRotate = false;
  document.getElementById('spinBtn').classList.remove('active');
  // 目标：靠近细胞核
  const targetPos = { x: 0, y: 0, z: 4 };
  const targetLook = { x: 0, y: 0, z: 0 };
  tween(camera.position.x, targetPos.x, 2000, (v) => camera.position.x = v);
  tween(camera.position.y, targetPos.y, 2000, (v) => camera.position.y = v);
  tween(camera.position.z, targetPos.z, 2000, (v) => camera.position.z = v);
  tween(controls.target.x, targetLook.x, 2000, (v) => controls.target.x = v);
  tween(controls.target.y, targetLook.y, 2000, (v) => controls.target.y = v);
  tween(controls.target.z, targetLook.z, 2000, (v) => controls.target.z = v, () => {
    isFlying = false;
    // 3秒后自动退回
    setTimeout(() => {
      if (!isFlying) {
        const backPos = { x: 0, y: 2, z: 13 };
        tween(camera.position.x, backPos.x, 1500, (v) => camera.position.x = v);
        tween(camera.position.y, backPos.y, 1500, (v) => camera.position.y = v);
        tween(camera.position.z, backPos.z, 1500, (v) => camera.position.z = v);
      }
    }, 3000);
  });
}

// ===== 分泌蛋白通路演示 =====
function startSecretion() {
  if (secretionActive) return;
  secretionActive = true;
  unhighlight();
  const label = document.getElementById('secretionLabel');
  label.textContent = '分泌蛋白合成通路：核糖体 → 内质网 → 高尔基体 → 细胞膜';
  label.classList.add('visible');
  // 创建蛋白质小球
  const proteinMat = new THREE.MeshStandardMaterial({
    color: 0x76FF03, emissive: 0x558822, emissiveIntensity: 0.8,
    transparent: true, opacity: 0.9
  });
  const protein = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 12), proteinMat);
  // 起点：核糖体（内质网附近）
  const startPos = new THREE.Vector3(1.2, 0.8, 0.7);
  protein.position.copy(startPos);
  cellGroup.add(protein);
  // 闪烁效果
  protein.userData.glow = true;
  // 路径关键点
  const path = [
    { pos: new THREE.Vector3(1.2, 0.8, 0.7), label: '核糖体', dur: 0 },
    { pos: new THREE.Vector3(0.5, 0.5, 0.3), label: '内质网', dur: 1500 },
    { pos: new THREE.Vector3(2.5, 0.9, 1.5), label: '高尔基体', dur: 2000 },
    { pos: new THREE.Vector3(3.8, 1.5, 1), label: '分泌小泡', dur: 2000 },
    { pos: new THREE.Vector3(4.3, 2, 0.5), label: '细胞膜外排', dur: 1500 }
  ];
  let stepIdx = 0;
  function moveStep() {
    if (stepIdx >= path.length - 1) {
      // 结束
      tween(protein.material.opacity, 0, 800, (v) => {
        protein.material.opacity = v;
      }, () => {
        cellGroup.remove(protein);
        protein.geometry.dispose();
        protein.material.dispose();
        label.classList.remove('visible');
        secretionActive = false;
      });
      return;
    }
    const from = path[stepIdx].pos;
    const to = path[stepIdx + 1].pos;
    const dur = path[stepIdx + 1].dur;
    label.textContent = `分泌蛋白通路 [${stepIdx + 1}/${path.length - 1}]：${path[stepIdx].label} → ${path[stepIdx + 1].label}`;
    tween(0, 1, dur, (t) => {
      protein.position.lerpVectors(from, to, t);
      // 蛋白质微弹
      protein.scale.setScalar(1 + Math.sin(t * Math.PI * 4) * 0.1);
    }, () => {
      stepIdx++;
      moveStep();
    });
  }
  moveStep();
}

// ===== 窗口缩放 =====
function onWindowResize() {
  const container = document.getElementById('canvasContainer');
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}

// ===== 启动 =====
init();
</script>
