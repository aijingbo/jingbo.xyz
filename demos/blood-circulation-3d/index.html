let scene, camera, renderer, controls, clock;

/* ============================================================
   场景初始化
   ============================================================ */
const container = document.getElementById('canvas-container');
const canvas = document.getElementById('scene');

function initScene() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.localClippingEnabled = true;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f1115);
  scene.fog = new THREE.Fog(0x0f1115, 12, 40);

  camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 200);
  camera.position.set(0, 1, 9);

  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 3;
  controls.maxDistance = 25;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;
  controls.target.set(0, 0.2, 0);

  clock = new THREE.Clock();
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  setupLights();
  setupBackground();
  buildHeart();
  buildVessels();
  buildBloodFlow();
}

/* ============================================================
   背景粒子
   ============================================================ */
function setupBackground() {
  const starCount = 600;
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(starCount * 3);
  const starColors = new Float32Array(starCount * 3);

  for (let i = 0; i < starCount; i++) {
    const r = 20 + Math.random() * 25;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 2 - 1);
    starPos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    starPos[i * 3 + 2] = r * Math.cos(phi);

    const hue = 0.05 + Math.random() * 0.1;
    const c = new THREE.Color().setHSL(hue, 0.3, 0.2 + Math.random() * 0.2);
    starColors[i * 3]     = c.r;
    starColors[i * 3 + 1] = c.g;
    starColors[i * 3 + 2] = c.b;
  }

  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

  const starMat = new THREE.PointsMaterial({
    size: 0.06,
    vertexColors: true,
    transparent: true,
    opacity: 0.4,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });

  bgStars = new THREE.Points(starGeo, starMat);
  scene.add(bgStars);
}

/* ============================================================
   构建心脏
   ============================================================ */
function buildHeart() {
  heartGroup = new THREE.Group();
  scene.add(heartGroup);

  // 心脏材质（琥珀金色，有光泽）
  const heartMat = new THREE.MeshStandardMaterial({
    color: 0xf59e0b,
    emissive: 0xd97706,
    emissiveIntensity: 0.15,
    metalness: 0.2,
    roughness: 0.45,
    transparent: true,
    opacity: 1.0,
  });

  // 构建四个腔室
  CHAMBERS.forEach(chamber => {
    const geo = new THREE.SphereGeometry(0.8, 48, 48);

    // 修改几何体使腔室看起来更自然
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      const z = pos.getZ(i);

      // 底部稍微拉长（心室尖部）
      if (y < 0 && (chamber.id.includes('ventricle'))) {
        const taper = 1 + Math.abs(y) * 0.15;
        pos.setX(i, x / taper);
        pos.setZ(i, z / taper);
        pos.setY(i, y * 1.15);
      }

      // 添加表面不规则性
      const noise = (Math.sin(x * 8) * Math.cos(y * 8) * Math.sin(z * 8)) * 0.015;
      const r = Math.sqrt(x * x + y * y + z * z);
      if (r > 0.001) {
        pos.setX(i, x + (x / r) * noise);
        pos.setY(i, y + (y / r) * noise);
        pos.setZ(i, z + (z / r) * noise);
      }
    }
    geo.computeVertexNormals();

    const mesh = new THREE.Mesh(geo, heartMat.clone());
    mesh.position.fromArray(chamber.position);
    mesh.scale.fromArray(chamber.scale);
    mesh.rotation.fromArray(chamber.rotation);
    mesh.userData.structureId = chamber.id;
    mesh.userData.basePosition = mesh.position.clone();
    mesh.userData.baseScale = mesh.scale.clone();
    mesh.userData.baseRotation = mesh.rotation.clone();

    chamberMeshes[chamber.id] = mesh;
    heartGroup.add(mesh);
  });

  // 心脏外发光层
  const glowGeo = new THREE.SphereGeometry(2.5, 32, 32);
  const glowMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uColor: { value: new THREE.Color(0xf59e0b) },
      uIntensity: { value: 0.3 },
    },
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uIntensity;
      uniform float uTime;
      varying vec3 vNormal;
      void main() {
        float fresnel = 1.0 - dot(vNormal, vec3(0.0, 0.0, 1.0));
        fresnel = pow(fresnel, 2.5);
        float pulse = sin(uTime * 2.5) * 0.08 + 0.92;
        gl_FragColor = vec4(uColor * uIntensity * fresnel * pulse, fresnel * 0.25);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    depthWrite: false,
  });
  heartGlowMesh = new THREE.Mesh(glowGeo, glowMat);
  heartGlowMesh.position.set(0, 0.1, 0);
  heartGroup.add(heartGlowMesh);
}

/* ============================================================
   构建血管
   ============================================================ */
function buildVessels() {
  VESSELS.forEach(vessel => {
    const points = vessel.points.map(p => new THREE.Vector3(p[0], p[1], p[2]));
    const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.3);
    vesselCurves[vessel.id] = curve;

    const radius = Math.max(0.01, vessel.radius);
    const tubeGeo = new THREE.TubeGeometry(curve, 80, radius, 16, false);

    const tubeMat = new THREE.MeshStandardMaterial({
      color: vessel.color,
      emissive: vessel.color,
      emissiveIntensity: 0.2,
      metalness: 0.1,
      roughness: 0.5,
      transparent: true,
      opacity: 0.85,
    });

    const mesh = new THREE.Mesh(tubeGeo, tubeMat);
    mesh.userData.structureId = vessel.id === 'pulmonary-vein-2' ? 'pulmonary-vein' : vessel.id;
    mesh.userData.vesselId = vessel.id;
    vesselMeshes[vessel.id] = mesh;
    scene.add(mesh);
  });
}

/* ============================================================
   构建血流粒子
   ============================================================ */
function buildBloodFlow() {
  const particleGeo = new THREE.SphereGeometry(0.055, 8, 8);

  VESSELS.forEach(vessel => {
    const curve = vesselCurves[vessel.id];
    const count = vessel.particleCount;

    const particleMat = new THREE.MeshBasicMaterial({
      color: vessel.bloodColor,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending,
    });

    for (let i = 0; i < count; i++) {
      const particle = new THREE.Mesh(particleGeo, particleMat.clone());
      particle.userData = {
        curve: curve,
        progress: i / count,
        speed: 0.0015 + Math.random() * 0.001,
        baseOpacity: 0.9,
        vesselId: vessel.id,
      };

      // 初始位置
      const pos = curve.getPointAt(particle.userData.progress);
      particle.position.copy(pos);

      bloodParticles.push(particle);
      scene.add(particle);
    }
  });
}

/* ============================================================
   渲染循环
   ============================================================ */
function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  // 入场动画
  if (entranceProgress < 1) {
    entranceProgress = Math.min(1, entranceProgress + dt * 0.7);
  }

  // 心跳动画
  if (isPlaying) {
    updateHeartbeat(t);
  }

  // 血流粒子
  if (isPlaying && bloodFlowEnabled) {
    updateBloodParticles(dt);
  }

  // 心脏发光层
  if (heartGlowMesh && heartGlowMesh.material.uniforms) {
    heartGlowMesh.material.uniforms.uTime.value = t;
    heartGlowMesh.material.uniforms.uIntensity.value = 0.25 + Math.sin(t * 2.5) * 0.08;
  }

  // 中心光源脉动
  const hLight = scene.getObjectByName('heartLight');
  if (hLight) {
    const bpm = 72;
    const beatPeriod = 60 / bpm;
    const phase = (t % beatPeriod) / beatPeriod;
    let lightIntensity = 1.2;
    if (phase < 0.1) {
      lightIntensity = 1.2 + (1 - Math.abs(phase / 0.1 - 1)) * 0.6;
    }
    hLight.intensity = lightIntensity;
  }

  // 背景星尘旋转
  if (bgStars) {
    bgStars.rotation.y = t * 0.008;
    bgStars.rotation.x = t * 0.004;
  }

  // 血管呼吸效果
  Object.values(vesselMeshes).forEach((mesh, i) => {
    if (mesh.material) {
      mesh.material.emissiveIntensity = 0.15 + Math.sin(t * 1.5 + i * 0.5) * 0.08;
    }
  });

  // 入场缩放
  if (entranceProgress < 1) {
    const eased = easeOutCubic(entranceProgress);
    heartGroup.scale.setScalar(0.1 + eased * 0.9);
    Object.values(vesselMeshes).forEach(m => {
      m.scale.setScalar(0.1 + eased * 0.9);
    });
    bloodParticles.forEach(p => {
      p.scale.setScalar(eased);
    });
  } else {
    heartGroup.scale.setScalar(1);
    Object.values(vesselMeshes).forEach(m => {
      if (m.scale.x !== 1) m.scale.setScalar(1);
    });
  }

  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   心跳动画
   ============================================================ */
function updateHeartbeat(t) {
  const bpm = 72;
  const beatPeriod = 60 / bpm;
  let phase = (t % beatPeriod) / beatPeriod;

  // 手动触发的心跳
  if (beatTriggerTime > 0) {
    const sinceTrigger = t - beatTriggerTime;
    if (sinceTrigger < beatPeriod) {
      phase = sinceTrigger / beatPeriod;
    } else {
      beatTriggerTime = -1;
    }
  }

  // 心动周期：
  // 0.00-0.08: 心房收缩
  // 0.08-0.25: 心室收缩
  // 0.25-1.00: 舒张

  let atriumScale = 1.0;
  let ventricleScale = 1.0;

  if (phase < 0.08) {
    // 心房收缩
    const p = phase / 0.08;
    atriumScale = 1.0 - 0.06 * Math.sin(p * Math.PI);
  } else if (phase < 0.25) {
    // 心室收缩
    const p = (phase - 0.08) / 0.17;
    ventricleScale = 1.0 - 0.10 * Math.sin(p * Math.PI);
    atriumScale = 1.0 + 0.02 * Math.sin(p * Math.PI);
  }

  // 应用缩放
  const la = chamberMeshes['left-atrium'];
  const ra = chamberMeshes['right-atrium'];
  const lv = chamberMeshes['left-ventricle'];
  const rv = chamberMeshes['right-ventricle'];

  if (la) la.scale.set(la.userData.baseScale.x * atriumScale, la.userData.baseScale.y * atriumScale, la.userData.baseScale.z * atriumScale);
  if (ra) ra.scale.set(ra.userData.baseScale.x * atriumScale, ra.userData.baseScale.y * atriumScale, ra.userData.baseScale.z * atriumScale);
  if (lv) lv.scale.set(lv.userData.baseScale.x * ventricleScale, lv.userData.baseScale.y * ventricleScale, lv.userData.baseScale.z * ventricleScale);
  if (rv) rv.scale.set(rv.userData.baseScale.x * ventricleScale, rv.userData.baseScale.y * ventricleScale, rv.userData.baseScale.z * ventricleScale);

  // 心率指示器闪烁
  if (phase < 0.08 || (phase >= 0.08 && phase < 0.12)) {
    bpmDot.classList.add('beat');
  } else {
    bpmDot.classList.remove('beat');
  }
}

/* ============================================================
   血流粒子更新
   ============================================================ */
function updateBloodParticles(dt) {
  bloodParticles.forEach(particle => {
    particle.userData.progress += particle.userData.speed * (dt * 60);
    if (particle.userData.progress >= 1) {
      particle.userData.progress -= 1;
    }

    const pos = particle.userData.curve.getPointAt(particle.userData.progress);
    particle.position.copy(pos);

    // 粒子大小随流速变化
    const pulse = 0.8 + Math.sin(particle.userData.progress * Math.PI * 4) * 0.2;
    particle.scale.setScalar(pulse * entranceProgress);
  });
}

/* ============================================================
   模式切换
   ============================================================ */
function setMode(mode) {
  currentMode = mode;

  Object.values(chamberMeshes).forEach(mesh => {
    if (mode === 'solid') {
      mesh.material.transparent = false;
      mesh.material.opacity = 1.0;
      mesh.material.wireframe = false;
      mesh.material.emissiveIntensity = 0.15;
    } else if (mode === 'xray') {
      mesh.material.transparent = true;
      mesh.material.opacity = 0.35;
      mesh.material.wireframe = false;
      mesh.material.emissiveIntensity = 0.3;
    } else if (mode === 'flow') {
      mesh.material.transparent = true;
      mesh.material.opacity = 0.15;
      mesh.material.wireframe = true;
      mesh.material.emissiveIntensity = 0.1;
    }
    mesh.material.needsUpdate = true;
  });

  Object.values(vesselMeshes).forEach(mesh => {
    if (mode === 'flow') {
      mesh.material.opacity = 0.4;
      mesh.material.emissiveIntensity = 0.4;
    } else {
      mesh.material.opacity = 0.85;
      mesh.material.emissiveIntensity = 0.2;
    }
    mesh.material.needsUpdate = true;
  });

  // 血流模式粒子更亮
  bloodParticles.forEach(p => {
    p.material.opacity = mode === 'flow' ? 1.0 : 0.9;
  });
}

/* ============================================================
   高亮结构
   ============================================================ */
let highlightedId = null;

function highlightStructure(id) {
  // 恢复之前的高亮
  if (highlightedId && highlightedId !== id) {
    const prev = chamberMeshes[highlightedId] || vesselMeshes[highlightedId] || vesselMeshes[highlightedId + '-2'];
    if (prev) {
      prev.material.emissiveIntensity = currentMode === 'flow' ? 0.1 : (currentMode === 'xray' ? 0.3 : 0.15);
    }
    // 对于血管，还要恢复关联的
    if (highlightedId === 'pulmonary-vein') {
      const pv2 = vesselMeshes['pulmonary-vein-2'];
      if (pv2) pv2.material.emissiveIntensity = currentMode === 'flow' ? 0.1 : (currentMode === 'xray' ? 0.3 : 0.15);
    }
  }

  highlightedId = id;

  if (id === 'heart') {
    // 高亮所有
    Object.values(chamberMeshes).forEach(m => {
      m.material.emissiveIntensity = currentMode === 'flow' ? 0.25 : 0.4;
    });
  } else if (chamberMeshes[id]) {
    chamberMeshes[id].material.emissiveIntensity = 0.6;
    // 降低其他腔室
    Object.entries(chamberMeshes).forEach(([key, m]) => {
      if (key !== id) {
        m.material.emissiveIntensity = currentMode === 'flow' ? 0.05 : 0.1;
      }
    });
  } else if (id === 'pulmonary-vein') {
    if (vesselMeshes['pulmonary-vein']) vesselMeshes['pulmonary-vein'].material.emissiveIntensity = 0.6;
    if (vesselMeshes['pulmonary-vein-2']) vesselMeshes['pulmonary-vein-2'].material.emissiveIntensity = 0.6;
  } else if (vesselMeshes[id]) {
    vesselMeshes[id].material.emissiveIntensity = 0.6;
  }
}

/* ============================================================
   选择结构
   ============================================================ */
function selectStructure(id) {
  currentStructure = id;
  const struct = STRUCTURES.find(s => s.id === id);
  if (!struct) return;

  // 更新信息面板
  document.getElementById('structName').textContent = struct.name;
  document.getElementById('structSubtitle').textContent = struct.subtitle;

  const infoContainer = document.getElementById('structInfo');
  infoContainer.innerHTML = struct.info.map(row => {
    const cls = row.cls ? ` ${row.cls}` : '';
    return `<div class="info-row">
      <span class="info-label">${row.label}</span>
      <span class="info-value${cls}">${row.value}</span>
    </div>`;
  }).join('');

  // 更新选择列表
  document.querySelectorAll('.structure-item').forEach(item => {
    item.classList.toggle('active', item.dataset.id === id);
  });

  // 高亮3D模型
  highlightStructure(id);

  showStatus(`已选中：${struct.name}`);
}

/* ============================================================
   构建结构选择列表
   ============================================================ */
function buildStructureList() {
  const list = document.getElementById('structureList');
  list.innerHTML = '';

  STRUCTURES.forEach(struct => {
    const item = document.createElement('div');
    item.className = 'structure-item';
    if (struct.id === currentStructure) item.classList.add('active');
    item.dataset.id = struct.id;
    item.innerHTML = `
      <span class="structure-dot" style="background:${struct.dotColor};box-shadow:0 0 6px ${struct.dotColor}80;"></span>
      <span class="structure-name">${struct.name}</span>
      ${struct.tag ? `<span class="structure-tag">${struct.tag}</span>` : ''}
    `;
    item.addEventListener('click', () => selectStructure(struct.id));
    list.appendChild(item);
  });
}

/* ============================================================
   工具函数
   ============================================================ */
function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

function showStatus(msg) {
  const tag = document.getElementById('statusTag');
  tag.textContent = msg;
  tag.classList.add('active');
  clearTimeout(showStatus._timer);
  showStatus._timer = setTimeout(() => {
    tag.classList.remove('active');
    tag.textContent = '就绪';
  }, 2500);
}

/* ============================================================
   UI 交互
   ============================================================ */

// 播放/暂停
const playPauseBtn = document.getElementById('playPauseBtn');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');

playPauseBtn.addEventListener('click', () => {
  isPlaying = !isPlaying;
  controls.autoRotate = isPlaying;
  playPauseBtn.classList.toggle('active', isPlaying);
  playIcon.style.display = isPlaying ? 'none' : 'block';
  pauseIcon.style.display = isPlaying ? 'block' : 'none';
  showStatus(isPlaying ? '播放' : '已暂停');
});

// 重置视角
document.getElementById('resetViewBtn').addEventListener('click', () => {
  animateCameraTo(0, 1, 9, 0, 0.2, 0);
  showStatus('视角已重置');
});

// 触发心跳
document.getElementById('beatBtn').addEventListener('click', () => {
  beatTriggerTime = clock.getElapsedTime();
  showStatus('触发额外心跳');
});

// 血流开关
const flowToggleBtn = document.getElementById('flowToggleBtn');
flowToggleBtn.classList.add('active');
flowToggleBtn.addEventListener('click', () => {
  bloodFlowEnabled = !bloodFlowEnabled;
  flowToggleBtn.classList.toggle('active', bloodFlowEnabled);
  bloodParticles.forEach(p => {
    p.visible = bloodFlowEnabled;
  });
  showStatus(bloodFlowEnabled ? '血流已开启' : '血流已关闭');
});

// 全屏
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});

// 模式切换
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setMode(btn.dataset.mode);
    const modeNames = { solid: '实体模式', xray: '透视模式', flow: '血流模式' };
    showStatus(modeNames[btn.dataset.mode]);
  });
});

// 相机动画
function animateCameraTo(x, y, z, tx, ty, tz) {
  const startPos = camera.position.clone();
  const endPos = new THREE.Vector3(x, y, z);
  const startTarget = controls.target.clone();
  const endTarget = new THREE.Vector3(tx, ty, tz);
  const startTime = clock.getElapsedTime();

  function step() {
    const elapsed = clock.getElapsedTime() - startTime;
    const t = Math.min(elapsed / 1.0, 1);
    const eased = easeOutCubic(t);

    camera.position.lerpVectors(startPos, endPos, eased);
    controls.target.lerpVectors(startTarget, endTarget, eased);
    controls.update();

    if (t < 1) requestAnimationFrame(step);
  }
  step();
}

// 点击交互（Raycaster）
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  // 检测腔室
  const chamberObjects = Object.values(chamberMeshes);
  const vesselObjects = Object.values(vesselMeshes);
  const allObjects = [...chamberObjects, ...vesselObjects];

  const intersects = raycaster.intersectObjects(allObjects);
  if (intersects.length > 0) {
    const obj = intersects[0].object;
    const structId = obj.userData.structureId;
    if (structId) {
      selectStructure(structId);
    }
  }
});

// 窗口自适应
function onResize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

/* ============================================================
   启动
   ============================================================ */
initScene();
buildStructureList();
selectStructure('heart');
setMode('solid');
animate();

// 隐藏加载层
setTimeout(() => {
  document.getElementById('loadingOverlay').classList.add('hidden');
}, 800);

</script>
