<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>丝绸之路贸易路线 · 景礴</title>
<link rel="stylesheet" href="/assets/css/design-system.css" />
<link rel="stylesheet" href="/assets/css/demo-framework.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
/* ============================================
   丝绸之路 · 主题样式
   ============================================ */

:root {
  --sr-parchment: #F0E6D3;
  --sr-parchment-dark: #E5D9C0;
  --sr-parchment-light: #F7F0E0;
  --sr-gold: #D4A574;
  --sr-brown: #8B6914;
  --sr-brown-light: #A67C2A;
  --sr-red: #B8332B;
  --sr-red-soft: rgba(184, 51, 43, 0.12);
  --sr-blue: #2A52BE;
  --sr-green: #2E8B57;
  --sr-text: #3a2f1f;
  --sr-text-muted: #7a6f5f;
}

/* ---------- 加载屏 ---------- */
.sr-loading {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: linear-gradient(135deg, #F0E6D3 0%, #E5D9C0 50%, #DBCDB0 100%);
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
.sr-loading.hidden {
  opacity: 0;
  visibility: hidden;
}
.sr-loading-inner {
  text-align: center;
}
.sr-loading-caravan {
  width: 180px;
  height: 60px;
  margin: 0 auto 24px;
  position: relative;
}
.sr-loading-caravan svg {
  width: 100%;
  height: 100%;
}
.sr-camel {
  animation: sr-camel-walk 0.8s ease-in-out infinite alternate;
}
.sr-camel:nth-child(2) { animation-delay: 0.15s; }
.sr-camel:nth-child(3) { animation-delay: 0.3s; }
@keyframes sr-camel-walk {
  0% { transform: translateY(0); }
  100% { transform: translateY(-2px); }
}
.sr-loading-title {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 700;
  color: var(--sr-brown);
  letter-spacing: 0.15em;
  margin-bottom: 8px;
}
.sr-loading-sub {
  font-family: var(--font-serif);
  font-size: 13px;
  color: var(--sr-text-muted);
  letter-spacing: 0.3em;
  margin-bottom: 32px;
}
.sr-loading-bar {
  width: 160px;
  height: 2px;
  background: rgba(139, 105, 20, 0.15);
  border-radius: 1px;
  overflow: hidden;
  margin: 0 auto;
}
.sr-loading-bar-fill {
  height: 100%;
  width: 40%;
  background: var(--sr-brown);
  border-radius: 1px;
  animation: sr-bar-slide 1.2s ease-in-out infinite;
}
@keyframes sr-bar-slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

/* ---------- 主体框架覆盖 ---------- */
.framework-narrative {
  background: var(--sr-parchment);
}

/* ---------- 导航栏覆盖 ---------- */
.demo-navbar {
  background-color: rgba(240, 230, 211, 0.88);
}
.demo-navbar.scrolled {
  background-color: rgba(240, 230, 211, 0.95);
}

/* ---------- 地图区域 ---------- */
.narrative-map-area {
  background: var(--sr-parchment);
  border-right: 1px solid var(--sr-parchment-dark);
  position: relative;
}

/* 地图容器 */
#map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

/* 瓦片滤镜：羊皮纸暖调 */
.leaflet-tile-pane {
  filter: sepia(0.28) saturate(0.55) brightness(1.12) hue-rotate(-8deg) contrast(0.92);
}
.leaflet-container {
  background: var(--sr-parchment);
  font-family: var(--font-sans);
}

/* 地图控件 */
.leaflet-control-attribution {
  background: rgba(240, 230, 211, 0.7) !important;
  color: var(--sr-text-muted) !important;
  font-size: 9px !important;
  padding: 2px 6px !important;
  border-radius: 3px;
}
.leaflet-control-attribution a {
  color: var(--sr-brown) !important;
}
.leaflet-control-zoom {
  border: none !important;
  box-shadow: 0 2px 12px rgba(58, 47, 31, 0.12) !important;
}
.leaflet-control-zoom a {
  background: rgba(247, 240, 224, 0.95) !important;
  color: var(--sr-brown) !important;
  border-color: var(--sr-parchment-dark) !important;
  font-weight: 600;
}
.leaflet-control-zoom a:hover {
  background: var(--sr-parchment-light) !important;
}

/* ---------- 羊皮纸纹理叠加 ---------- */
.narrative-map-area::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(ellipse at 30% 20%, rgba(212, 165, 116, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(139, 105, 20, 0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 400;
  mix-blend-mode: multiply;
}

/* ---------- 路线样式 ---------- */
.silk-route {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: opacity 0.4s ease;
}
.silk-route-north {
  stroke: var(--sr-green);
  stroke-width: 2.5;
  stroke-dasharray: 10 7;
  animation: sr-dash-flow 1.5s linear infinite;
  opacity: 0.7;
}
.silk-route-south {
  stroke: var(--sr-blue);
  stroke-width: 2.5;
  stroke-dasharray: 10 7;
  animation: sr-dash-flow 1.5s linear infinite;
  opacity: 0.7;
}
.silk-route-central {
  stroke: var(--sr-gold);
  stroke-width: 2.5;
  stroke-dasharray: 10 7;
  animation: sr-dash-flow 1.5s linear infinite;
  opacity: 0.7;
}
.silk-route.dimmed {
  opacity: 0.15;
}
@keyframes sr-dash-flow {
  to { stroke-dashoffset: -17; }
}

/* 路线辉光底层 */
.silk-route-glow {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.15;
  filter: blur(4px);
}
.silk-route-glow-north { stroke: var(--sr-green); stroke-width: 6; }
.silk-route-glow-south { stroke: var(--sr-blue); stroke-width: 6; }
.silk-route-glow-central { stroke: var(--sr-gold); stroke-width: 6; }

/* ---------- 城市标记 ---------- */
.sr-city-marker {
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
}
.sr-city-icon {
  width: 14px;
  height: 14px;
  filter: drop-shadow(0 1px 2px rgba(58, 47, 31, 0.3));
}
.sr-city-icon svg {
  width: 100%;
  height: 100%;
}
.sr-city-label {
  font-family: var(--font-serif);
  font-size: 10px;
  font-weight: 600;
  color: var(--sr-text);
  background: rgba(247, 240, 224, 0.85);
  padding: 1px 6px;
  border-radius: 3px;
  margin-top: 2px;
  white-space: nowrap;
  border: 1px solid rgba(212, 165, 116, 0.3);
  letter-spacing: 0.02em;
}

/* ---------- 事件标记 ---------- */
.sr-event-marker {
  position: relative;
  width: 28px;
  height: 28px;
  pointer-events: auto;
  cursor: pointer;
}
.sr-event-core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--sr-red);
  border: 2px solid #fff;
  box-shadow: 0 0 8px rgba(184, 51, 43, 0.5);
  z-index: 2;
  transition: all 0.3s ease;
}
.sr-event-marker.passed .sr-event-core {
  background: var(--sr-brown);
  box-shadow: 0 0 4px rgba(139, 105, 20, 0.3);
  width: 8px;
  height: 8px;
}
.sr-event-marker.future .sr-event-core {
  background: var(--sr-parchment-dark);
  border-color: var(--sr-gold);
  width: 8px;
  height: 8px;
  box-shadow: none;
}
.sr-event-marker.active .sr-event-core {
  width: 14px;
  height: 14px;
  background: var(--sr-red);
  box-shadow: 0 0 16px rgba(184, 51, 43, 0.7);
}
.sr-event-pulse {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: rgba(184, 51, 43, 0.3);
  z-index: 1;
}
.sr-event-marker.active .sr-event-pulse {
  animation: sr-pulse 2s ease-out infinite;
}
@keyframes sr-pulse {
  0% { width: 14px; height: 14px; opacity: 0.5; }
  100% { width: 48px; height: 48px; opacity: 0; }
}
.sr-event-label {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--sr-red);
  background: rgba(247, 240, 224, 0.9);
  padding: 1px 5px;
  border-radius: 3px;
  white-space: nowrap;
  border: 1px solid rgba(184, 51, 43, 0.2);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.sr-event-marker.active .sr-event-label {
  opacity: 1;
}

/* ---------- 罗盘装饰 ---------- */
.sr-compass {
  position: absolute;
  bottom: 24px;
  right: 24px;
  width: 70px;
  height: 70px;
  z-index: 500;
  pointer-events: none;
  opacity: 0.5;
}
.sr-compass svg {
  width: 100%;
  height: 100%;
}

/* ---------- 路线切换按钮 ---------- */
.sr-route-toggles {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 500;
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: rgba(247, 240, 224, 0.9);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--sr-parchment-dark);
  border-radius: var(--radius-card);
  padding: 10px 12px;
  box-shadow: var(--shadow-soft);
}
.sr-route-toggle-title {
  font-family: var(--font-serif);
  font-size: 10px;
  font-weight: 700;
  color: var(--sr-text-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.sr-route-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius);
  font-size: 11px;
  font-family: var(--font-sans);
  color: var(--sr-text-muted);
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.sr-route-btn:hover {
  background: rgba(212, 165, 116, 0.1);
}
.sr-route-btn.active {
  background: rgba(212, 165, 116, 0.15);
  border-color: rgba(212, 165, 116, 0.3);
  color: var(--sr-text);
  font-weight: 600;
}
.sr-route-btn.inactive {
  opacity: 0.4;
}
.sr-route-dot {
  width: 10px;
  height: 3px;
  border-radius: 2px;
  flex-shrink: 0;
}
.sr-route-dot-north { background: var(--sr-green); }
.sr-route-dot-south { background: var(--sr-blue); }
.sr-route-dot-central { background: var(--sr-gold); }

/* ---------- 信息卡片覆盖 ---------- */
.narrative-info-card {
  background-color: rgba(247, 240, 224, 0.96);
  border-color: var(--sr-gold);
  border-left: 3px solid var(--sr-red);
}
.narrative-info-year {
  color: var(--sr-red);
  font-size: 24px;
}
.sr-info-era {
  display: inline-block;
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 600;
  color: var(--sr-brown);
  background: rgba(212, 165, 116, 0.15);
  padding: 2px 8px;
  border-radius: var(--radius-full);
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}
.narrative-info-desc {
  color: var(--sr-text);
  font-size: 12px;
  line-height: 1.7;
}

/* ---------- 时间轴面板覆盖 ---------- */
.narrative-timeline-panel {
  background-color: rgba(247, 240, 224, 0.6);
}

.narrative-timeline-header {
  border-bottom-color: var(--sr-parchment-dark);
  background: rgba(240, 230, 211, 0.5);
}
.narrative-timeline-title {
  color: var(--sr-text);
  font-size: 18px;
}
.narrative-timeline-subtitle {
  color: var(--sr-text-muted);
}

/* 时间轴竖线 */
.narrative-timeline-list::before {
  background: var(--sr-parchment-dark);
}

/* 时代标签 */
.sr-era-label {
  font-family: var(--font-serif);
  font-size: 10px;
  font-weight: 700;
  color: var(--sr-brown);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 10px 0 4px;
  position: relative;
  margin-left: 32px;
}
.sr-era-label::before {
  content: '';
  position: absolute;
  left: -16px;
  top: 16px;
  width: 8px;
  height: 1px;
  background: var(--sr-gold);
}
.sr-era-label::after {
  content: '';
  display: block;
  height: 1px;
  background: linear-gradient(90deg, var(--sr-gold) 0%, transparent 100%);
  margin-top: 4px;
  opacity: 0.4;
}

/* 事件项 */
.timeline-event-dot {
  border-color: var(--sr-parchment-dark);
}
.timeline-event:hover .timeline-event-dot {
  border-color: var(--sr-gold);
}
.timeline-event.active .timeline-event-dot {
  background: var(--sr-red);
  border-color: var(--sr-red);
  box-shadow: 0 0 0 4px rgba(184, 51, 43, 0.15);
}
.timeline-event.passed .timeline-event-dot {
  background: var(--sr-brown);
  border-color: var(--sr-brown);
  opacity: 0.5;
}
.timeline-event.active .timeline-event-year {
  color: var(--sr-red);
}
.timeline-event.active .timeline-event-title {
  color: var(--sr-red);
}
.timeline-event-year {
  color: var(--sr-text-muted);
}
.timeline-event-title {
  color: var(--sr-text);
}
.timeline-event-desc {
  color: var(--sr-text-muted);
  line-height: 1.6;
}

/* 播放控件 */
.narrative-play-btn {
  background-color: var(--sr-red);
}
.narrative-play-btn:hover {
  background-color: #9e2b24;
}
.narrative-progress-bar {
  background: var(--sr-red);
}

/* ---------- 响应式 ---------- */
@media (max-width: 1024px) {
  .framework-narrative .narrative-main {
    grid-template-columns: 1fr;
    grid-template-rows: 58% 42%;
  }
  .narrative-map-area {
    border-right: none;
    border-bottom: 1px solid var(--sr-parchment-dark);
  }
  .sr-route-toggles {
    top: 10px;
    right: 10px;
    padding: 6px 8px;
  }
  .sr-route-btn {
    font-size: 10px;
    padding: 3px 6px;
  }
  .sr-compass {
    display: none;
  }
}

@media (max-width: 768px) {
  .narrative-info-card {
    left: 12px;
    right: 12px;
    max-width: none;
    bottom: 12px;
    padding: 14px 16px;
  }
  .narrative-info-year {
    font-size: 20px;
  }
  .narrative-info-title {
    font-size: 16px;
  }
  .narrative-info-desc {
    font-size: 11px;
  }
  .sr-route-toggles {
    flex-direction: row;
    padding: 6px 8px;
  }
  .sr-route-toggle-title {
    display: none;
  }
}

/* ---------- 滚动条 ---------- */
.narrative-timeline-list::-webkit-scrollbar {
  width: 4px;
}
.narrative-timeline-list::-webkit-scrollbar-track {
  background: transparent;
}
.narrative-timeline-list::-webkit-scrollbar-thumb {
  background: var(--sr-parchment-dark);
  border-radius: 2px;
}
</style>
</head>

    <!-- ========== 左侧：地图区域 ========== -->
    <div class="narrative-map-area">
      <div id="map"></div>

      <!-- 罗盘装饰 -->
      <div class="sr-compass">
        <svg viewBox="0 0 70 70">
          <circle cx="35" cy="35" r="32" fill="none" stroke="#8B6914" stroke-width="0.8" opacity="0.5"/>

          <path d="M35,62 L32,35 L35,38 L38,35 Z" fill="#8B6914" opacity="0.4"/>

          <text x="5" y="38" text-anchor="middle" font-family="serif" font-size="6" fill="#8B6914" opacity="0.4">西</text>
          <text x="66" y="38" text-anchor="middle" font-family="serif" font-size="6" fill="#8B6914" opacity="0.4">东</text>
        </svg>
      </div>

      <!-- 路线切换 -->
      <div class="sr-route-toggles">
        <div class="sr-route-toggle-title">商路</div>
        <button class="sr-route-btn active" data-route="north">
          <span class="sr-route-dot sr-route-dot-north"></span>
          <span>北道</span>
        </button>
        <button class="sr-route-btn active" data-route="south">
          <span class="sr-route-dot sr-route-dot-south"></span>
          <span>南道</span>
        </button>
        <button class="sr-route-btn active" data-route="central">
          <span class="sr-route-dot sr-route-dot-central"></span>
          <span>中道</span>
        </button>
      </div>

// ====== 绘制路线 ======
function drawRoutes() {
  const routeConfig = [
    { key: 'north', className: 'silk-route-north', glowClass: 'silk-route-glow-north' },
    { key: 'south', className: 'silk-route-south', glowClass: 'silk-route-glow-south' },
    { key: 'central', className: 'silk-route-central', glowClass: 'silk-route-glow-central' },
  ];

  routeConfig.forEach(cfg => {
    const coords = routes[cfg.key];

    // 辉光底层
    const glow = L.polyline(coords, {
      className: 'silk-route-glow ' + cfg.glowClass,
      interactive: false,
    }).addTo(map);
    routeGlowLayers[cfg.key].push(glow);

    // 主路线
    const route = L.polyline(coords, {
      className: 'silk-route ' + cfg.className,
      interactive: false,
    }).addTo(map);
    routeLayers[cfg.key].push(route);
  });
}

      iconAnchor: [14, 14],

    const marker = L.marker([evt.lat, evt.lng], {

      zIndexOffset: 1000,

// ====== 更新事件标记状态 ======
function updateEventMarkers() {
  eventMarkers.forEach((marker, i) => {
    const el = marker.getElement();
    if (!el) return;
    const inner = el.querySelector('.sr-event-marker');
    if (!inner) return;

    inner.classList.remove('active', 'passed', 'future');
    if (i === currentEvent) {
      inner.classList.add('active');
    } else if (i < currentEvent) {
      inner.classList.add('passed');
    } else {
      inner.classList.add('future');
    }
  });
}

// ====== 构建时间轴 ======
function buildTimeline() {
  const list = document.getElementById('timelineList');
  let html = '';

  eraGroups.forEach((era) => {
    html += `<div class="sr-era-label">${era.name}</div>`;
    for (let i = era.startIdx; i <= era.endIdx; i++) {
      const e = events[i];
      html += `
        <div class="timeline-event ${i === currentEvent ? 'active' : ''}" data-idx="${i}">
          <div class="timeline-event-dot"></div>
          <div class="timeline-event-content">
            <div class="timeline-event-year">${e.year}</div>
            <div class="timeline-event-title">${e.title}</div>
            <div class="timeline-event-desc">${e.desc.length > 80 ? e.desc.substring(0, 78) + '…' : e.desc}</div>
          </div>
        </div>
      `;
    }
  });

  list.innerHTML = html;

  // 绑定点击
  list.querySelectorAll('.timeline-event').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      selectEvent(idx);
    });
  });
}

  // 更新信息卡片（带动画）
  const card = document.getElementById('infoCard');
  if (typeof gsap !== 'undefined') {
    gsap.to(card, {
      opacity: 0,
      y: 10,
      duration: 0.2,
      onComplete: () => {
        document.getElementById('infoEra').textContent = e.era;
        document.getElementById('infoYear').textContent = e.year;
        document.getElementById('infoTitle').textContent = e.title;
        document.getElementById('infoDesc').textContent = e.desc;
        gsap.to(card, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' });
      }
    });
  } else {
    document.getElementById('infoEra').textContent = e.era;
    document.getElementById('infoYear').textContent = e.year;
    document.getElementById('infoTitle').textContent = e.title;
    document.getElementById('infoDesc').textContent = e.desc;
  }

  // 更新时间轴高亮
  document.querySelectorAll('.timeline-event').forEach((el, i) => {
    el.classList.remove('active', 'passed');
    if (i === idx) {
      el.classList.add('active');
    } else if (i < idx) {
      el.classList.add('passed');
    }
  });

  // 滚动到当前事件
  const activeEl = document.querySelector('.timeline-event.active');
  if (activeEl) {
    activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // 更新进度条
  const progress = ((idx + 1) / events.length) * 100;
  document.getElementById('progressBar').style.width = `${progress}%`;
  document.getElementById('eventCounter').textContent = `${idx + 1} / ${events.length}`;

  // 更新事件标记
  updateEventMarkers();
}

// ====== 播放控制 ======
function togglePlay() {
  isPlaying = !isPlaying;
  const icon = document.getElementById('playIcon');
  const label = document.getElementById('playLabel');

  if (isPlaying) {
    icon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
    label.textContent = '暂停';

    playTimer = setInterval(() => {
      let next = currentEvent + 1;
      if (next >= events.length) {
        next = 0;
      }
      selectEvent(next);
    }, 4500);
  } else {
    icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    label.textContent = '播放';
    clearInterval(playTimer);
  }
}

// ====== 路线切换 ======
function setupRouteToggles() {
  document.querySelectorAll('.sr-route-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const routeKey = btn.dataset.route;
      routeVisibility[routeKey] = !routeVisibility[routeKey];

      btn.classList.toggle('active', routeVisibility[routeKey]);
      btn.classList.toggle('inactive', !routeVisibility[routeKey]);

      // 显示/隐藏路线
      [...routeLayers[routeKey], ...routeGlowLayers[routeKey]].forEach(layer => {
        if (routeVisibility[routeKey]) {
          layer.addTo(map);
        } else {
          map.removeLayer(layer);
        }
      });
    });
  });
}

// ====== 隐藏加载屏 ======
function hideLoading() {
  const loading = document.getElementById('srLoading');
  if (loading && !loading.classList.contains('hidden')) {
    loading.classList.add('hidden');
    setTimeout(() => {
      if (map) map.invalidateSize();
    }, 400);
  }
}

// ====== 导航栏滚动效果 ======
function setupNavbar() {
  const navbar = document.getElementById('demoNavbar');
  window.addEventListener('scroll', () => {
    navbar.classList.toggle('scrolled', window.scrollY > 10);
  });
}

// ====== 初始化 ======
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  drawRoutes();
  addCityMarkers();
  addEventMarkers();
  buildTimeline();
  setupRouteToggles();
  setupNavbar();

  // 初始选中第一个事件
  setTimeout(() => {
    selectEvent(0);
    updateEventMarkers();
  }, 200);

  // 播放按钮
  document.getElementById('playBtn').addEventListener('click', togglePlay);

  // 窗口大小变化时刷新地图
  window.addEventListener('resize', () => {
    if (map) map.invalidateSize();
  });

  // 安全兜底：5秒后强制隐藏加载屏
  setTimeout(hideLoading, 5000);
});
</script>
