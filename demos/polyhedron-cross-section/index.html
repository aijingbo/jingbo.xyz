<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   一、正多面体定义
   ============================================================ */
const SOLIDS = {
  tetra:  { name: '正四面体',   geom: () => new THREE.TetrahedronGeometry(1.7, 0),
            v: 4,  e: 6,  f: 4,  schlafli: '{3,3}',
            note: '最简单的正多面体，四个等边三角形面。截面可为三角形或四边形。' },
  cube:   { name: '正六面体',   geom: () => new THREE.BoxGeometry(1.96, 1.96, 1.96),
            v: 8,  e: 12, f: 6,  schlafli: '{4,3}',
            note: '立方体截面形态最丰富：三角形、四边形、五边形、六边形皆可出现，但不会超过六边形。' },
  octa:   { name: '正八面体',   geom: () => new THREE.OctahedronGeometry(1.7, 0),
            v: 6,  e: 12, f: 8,  schlafli: '{3,4}',
            note: '八个等边三角形面，与立方体互为对偶。截面最多为六边形。' },
  dodeca: { name: '正十二面体', geom: () => new THREE.DodecahedronGeometry(1.7, 0),
            v: 20, e: 30, f: 12, schlafli: '{5,3}',
            note: '十二个正五边形面，含黄金比。截面最多为十边形。' },
  icosa:  { name: '正二十面体', geom: () => new THREE.IcosahedronGeometry(1.7, 0),
            v: 12, e: 30, f: 20, schlafli: '{3,5}',
            note: '二十个等边三角形面，与正十二面体互为对偶。截面最多为十边形。' },
};
const SOLID_ORDER = ['tetra', 'cube', 'octa', 'dodeca', 'icosa'];

/* ============================================================
   二、场景初始化
   ============================================================ */
const container = document.getElementById('canvasContainer');
const scene = new THREE.Scene();

// 径向渐变背景（聚光灯效果）
function makeBgTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256, 250, 30, 256, 250, 380);
  g.addColorStop(0, '#1c1620');
  g.addColorStop(0.55, '#100c12');
  g.addColorStop(1, '#070608');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
scene.background = makeBgTexture();
scene.fog = new THREE.Fog(0x0c0a0e, 9, 22);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
const CAM_INIT = new THREE.Vector3(3.4, -3.8, 3.0);
const TARGET_INIT = new THREE.Vector3(0, 0, 0);
camera.position.copy(CAM_INIT);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.localClippingEnabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.copy(TARGET_INIT);
controls.minDistance = 3;
controls.maxDistance = 13;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;

/* 光照 —— 暖色主光 + 赤陶边缘光 */
scene.add(new THREE.AmbientLight(0x4a3f50, 0.45));
const keyLight = new THREE.DirectionalLight(0xffd9a8, 1.0);
keyLight.position.set(5, 6, 5);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xc2410c, 0.85);
rimLight.position.set(-4, -2, -5);
scene.add(rimLight);
const fillLight = new THREE.DirectionalLight(0x6b7280, 0.28);
fillLight.position.set(-3, 3, 4);
scene.add(fillLight);

/* ============================================================
   三、辅助函数
   ============================================================ */
// 文字标签（Sprite）
function makeLabel(text, color = '#f5e6d3') {
  const canvas = document.createElement('canvas');
  const size = 128; canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.font = `bold 70px Inter, 'PingFang SC', sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(8,6,10,0.92)';
  ctx.strokeText(text, size / 2, size / 2);
  ctx.fillStyle = color; ctx.fillText(text, size / 2, size / 2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(0.5, 0.5, 0.5); sp.renderOrder = 12;
  return sp;
}

// 顶点小球
function makeVertexSphere(pos, color = 0xf0c987) {
  const geo = new THREE.SphereGeometry(0.052, 20, 20);
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: 0.35, metalness: 0.2,
    emissive: color, emissiveIntensity: 0.35
  });
  const m = new THREE.Mesh(geo, mat); m.position.copy(pos);
  return m;
}

// 从几何体提取顶点与三角面
function extractTriangles(geometry) {
  const pos = geometry.attributes.position;
  const verts = [];
  for (let i = 0; i < pos.count; i++) verts.push(new THREE.Vector3().fromBufferAttribute(pos, i));
  const tris = [];
  if (geometry.index) {
    const idx = geometry.index;
    for (let i = 0; i < idx.count; i += 3) tris.push([idx.getX(i), idx.getX(i + 1), idx.getX(i + 2)]);
  } else {
    for (let i = 0; i < pos.count; i += 3) tris.push([i, i + 1, i + 2]);
  }
  return { verts, tris };
}

// 顶点去重（用于显示标签）
function uniqueVertices(verts, prec = 3) {
  const map = new Map(); const out = [];
  for (const v of verts) {
    const k = `${v.x.toFixed(prec)},${v.y.toFixed(prec)},${v.z.toFixed(prec)}`;
    if (!map.has(k)) { map.set(k, out.length); out.push(v.clone()); }
  }
  return out;
}

// 二维凸包（单调链），返回点索引的 CCW 序列
function convexHull2D(pts) {
  const n = pts.length;
  if (n < 3) return pts.map((_, i) => i);
  const order = [...Array(n).keys()].sort((a, b) => pts[a][0] - pts[b][0] || pts[a][1] - pts[b][1]);
  const cross = (O, A, B) =>
    (pts[A][0] - pts[O][0]) * (pts[B][1] - pts[O][1]) - (pts[A][1] - pts[O][1]) * (pts[B][0] - pts[O][0]);
  const lower = [];
  for (const i of order) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], i) <= 0) lower.pop();
    lower.push(i);
  }
  const upper = [];
  for (let k = order.length - 1; k >= 0; k--) {
    const i = order[k];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], i) <= 0) upper.pop();
    upper.push(i);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

// 计算平面与多面体的截面（凸包法）
// 平面方程：normal·p = d
function computeSection(verts, tris, normal, d) {
  const isect = [];
  for (const [ia, ib, ic] of tris) {
    const a = verts[ia], b = verts[ib], c = verts[ic];
    const sa = a.dot(normal) - d, sb = b.dot(normal) - d, sc = c.dot(normal) - d;
    const s = [sa, sb, sc], p = [a, b, c];
    const cross = [];
    for (let e = 0; e < 3; e++) {
      const i = e, j = (e + 1) % 3;
      if (s[i] * s[j] < 0) {
        const t = s[i] / (s[i] - s[j]);
        cross.push(p[i].clone().lerp(p[j], t));
      }
    }
    if (cross.length === 2) { isect.push(cross[0]); isect.push(cross[1]); }
  }
  if (isect.length < 3) return null;

  // 去重
  const uniq = []; const seen = new Set();
  for (const p of isect) {
    const k = `${p.x.toFixed(3)},${p.y.toFixed(3)},${p.z.toFixed(3)}`;
    if (!seen.has(k)) { seen.add(k); uniq.push(p); }
  }
  if (uniq.length < 3) return null;

  // 建立平面上的二维坐标系
  const origin = new THREE.Vector3();
  uniq.forEach(p => origin.add(p)); origin.multiplyScalar(1 / uniq.length);
  let u = new THREE.Vector3().crossVectors(normal, new THREE.Vector3(1, 0, 0));
  if (u.lengthSq() < 1e-6) u = new THREE.Vector3().crossVectors(normal, new THREE.Vector3(0, 1, 0));
  u.normalize();
  const v = new THREE.Vector3().crossVectors(normal, u).normalize();

  const pts2d = uniq.map(p => {
    const r = p.clone().sub(origin);
    return [r.dot(u), r.dot(v)];
  });
  const hull = convexHull2D(pts2d);
  if (hull.length < 3) return null;

  const hullPts3 = hull.map(i => uniq[i]);

  // 面积（鞋带公式）
  let area = 0;
  for (let i = 0; i < hull.length; i++) {
    const A = pts2d[hull[i]], B = pts2d[hull[(i + 1) % hull.length]];
    area += A[0] * B[1] - B[0] * A[1];
  }
  area = Math.abs(area) / 2;

  return { pts: hullPts3, sides: hull.length, area, centroid: origin };
}

/* ============================================================
   四、主体容器
   ============================================================ */
const sceneRoot = new THREE.Group();      // 自动旋转挂载点
scene.add(sceneRoot);

let solidMesh = null;      // 实体网格
let edgeLines = null;      // 真实棱线
let vertexGroup = null;    // 顶点小球 + 标签
let currentTris = null;    // 当前三角面数据（供截面计算）
let currentType = 'cube';

const solidMaterial = new THREE.MeshStandardMaterial({
  color: 0xb87a4e, metalness: 0.28, roughness: 0.5,
  flatShading: true, side: THREE.DoubleSide,
  emissive: 0x2a1408, emissiveIntensity: 0.4,
  transparent: true, opacity: 0.32, depthWrite: false,
});
const edgeMaterial = new THREE.LineBasicMaterial({
  color: 0xe9b873, transparent: true, opacity: 0.6,
});

// 剖切平面（复用对象，实时更新）
const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
solidMaterial.clippingPlanes = [clipPlane];

/* ============================================================
   五、剖切面可视化
   ============================================================ */
const planeGeom = new THREE.PlaneGeometry(5.2, 5.2);
const planeMat = new THREE.MeshBasicMaterial({
  color: 0xc2410c, transparent: true, opacity: 0.09,
  side: THREE.DoubleSide, depthWrite: false,
});
const planeMesh = new THREE.Mesh(planeGeom, planeMat);
planeMesh.renderOrder = 2;
const planeBorderMat = new THREE.LineBasicMaterial({ color: 0xc2410c, transparent: true, opacity: 0.4 });
const planeBorder = new THREE.LineSegments(new THREE.EdgesGeometry(planeGeom), planeBorderMat);
planeMesh.add(planeBorder);
sceneRoot.add(planeMesh);

/* ============================================================
   六、截面图形
   ============================================================ */
const sectionGroup = new THREE.Group();
sectionGroup.renderOrder = 6;
sceneRoot.add(sectionGroup);

const sectionFillMat = new THREE.MeshBasicMaterial({
  color: 0xf59e0b, transparent: true, opacity: 0.42,
  side: THREE.DoubleSide, depthWrite: false,
});
const sectionEdgeMat = new THREE.LineBasicMaterial({
  color: 0xfbbf24, transparent: true, opacity: 0.95,
});
const sectionGlowMat = new THREE.LineBasicMaterial({
  color: 0xc2410c, transparent: true, opacity: 0.45,
});

const sectionLight = new THREE.PointLight(0xf59e0b, 0, 6, 2);
scene.add(sectionLight);

function clearSection() {
  while (sectionGroup.children.length) {
    const o = sectionGroup.children.pop();
    if (o.geometry) o.geometry.dispose();
  }
  sectionLight.intensity = 0;
}

function updateSectionMesh(section) {
  clearSection();
  if (!section) return;
  const { pts, centroid } = section;

  // 填充（扇形三角化）
  const positions = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    positions.push(centroid.x, centroid.y, centroid.z, a.x, a.y, a.z, b.x, b.y, b.z);
  }
  const fillGeo = new THREE.BufferGeometry();
  fillGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  fillGeo.computeVertexNormals();
  const fill = new THREE.Mesh(fillGeo, sectionFillMat);
  fill.renderOrder = 6;
  sectionGroup.add(fill);

  // 边线
  const edgePts = pts.concat([pts[0]]);
  const edgeGeo = new THREE.BufferGeometry().setFromPoints(edgePts);
  const edges = new THREE.Line(edgeGeo, sectionEdgeMat);
  edges.renderOrder = 7;
  sectionGroup.add(edges);

  // 外发光（略大的同名线）
  const glowGeo = new THREE.BufferGeometry().setFromPoints(edgePts);
  const glow = new THREE.Line(glowGeo, sectionGlowMat);
  glow.renderOrder = 5;
  sectionGroup.add(glow);

  // 点光源
  sectionLight.position.copy(centroid);
  sectionLight.intensity = 0.7;
}

/* ============================================================
   七、构建多面体
   ============================================================ */
function buildSolid(type) {
  // 清理旧对象
  if (solidMesh) { sceneRoot.remove(solidMesh); solidMesh.geometry.dispose(); }
  if (edgeLines) { sceneRoot.remove(edgeLines); edgeLines.geometry.dispose(); }
  if (vertexGroup) { sceneRoot.remove(vertexGroup); vertexGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }

  const def = SOLIDS[type];
  const geometry = def.geom();
  const { verts, tris } = extractTriangles(geometry);
  currentTris = { verts, tris };
  currentType = type;

  // 实体
  solidMesh = new THREE.Mesh(geometry, solidMaterial);
  sceneRoot.add(solidMesh);

  // 真实棱线（EdgesGeometry 自动剔除共面三角化边）
  const edgeGeo = new THREE.EdgesGeometry(geometry, 1);
  edgeLines = new THREE.LineSegments(edgeGeo, edgeMaterial);
  sceneRoot.add(edgeLines);

  // 顶点 + 标签
  vertexGroup = new THREE.Group();
  const uniq = uniqueVertices(verts);
  uniq.forEach((p, idx) => {
    vertexGroup.add(makeVertexSphere(p));
    const letter = String.fromCharCode(65 + idx); // A, B, C …
    const lab = makeLabel(letter, '#f5e6d3');
    lab.position.copy(p).multiplyScalar(1.14); // 略向外偏移，避免与棱重合
    lab.scale.set(0.42, 0.42, 0.42);
    vertexGroup.add(lab);
  });
  sceneRoot.add(vertexGroup);
  vertexGroup.visible = state.showLabels;

  // 更新参数面板
  document.getElementById('statV').textContent = def.v;
  document.getElementById('statE').textContent = def.e;
  document.getElementById('statF').textContent = def.f;
  document.getElementById('statSch').textContent = def.schlafli;
  document.getElementById('eulerLine').textContent = `${def.v} − ${def.e} + ${def.f} = ${def.v - def.e + def.f}`;
  document.getElementById('solidNote').textContent = def.note;

  // 入场动画
  entryT = 0;
}

/* ============================================================
   八、状态与截面更新
   ============================================================ */
const state = {
  mode: 'transparent',
  showPlane: true,
  doClip: true,
  showLabels: true,
  offset: 0,
  tilt: 20,
  spin: 30,
};

function normalFromAngles(tiltDeg, spinDeg) {
  const n = new THREE.Vector3(0, 0, 1);
  n.applyAxisAngle(new THREE.Vector3(1, 0, 0), tiltDeg * Math.PI / 180);
  n.applyAxisAngle(new THREE.Vector3(0, 1, 0), spinDeg * Math.PI / 180);
  n.normalize();
  return n;
}

const _zAxis = new THREE.Vector3(0, 0, 1);
const _q = new THREE.Quaternion();

function updatePlaneAndSection() {
  const normal = normalFromAngles(state.tilt, state.spin);
  const d = state.offset;

  // 剖切面网格朝向与位置
  _q.setFromUnitVectors(_zAxis, normal);
  planeMesh.quaternion.copy(_q);
  planeMesh.position.copy(normal).multiplyScalar(d);
  planeMesh.visible = state.showPlane;

  // 剖切平面（用于裁剪）
  clipPlane.normal.copy(normal);
  clipPlane.constant = -d;
  solidMaterial.clippingPlanes = state.doClip ? [clipPlane] : [];

  // 截面计算
  const section = computeSection(currentTris.verts, currentTris.tris, normal, d);
  updateSectionMesh(section);

  // 读数
  const readout = document.getElementById('shapeReadout');
  const nameEl = document.getElementById('shapeName');
  const metaEl = document.getElementById('shapeMeta');
  if (section) {
    const names = { 3: '三角形', 4: '四边形', 5: '五边形', 6: '六边形', 7: '七边形', 8: '八边形', 9: '九边形', 10: '十边形' };
    readout.classList.remove('empty');
    nameEl.textContent = names[section.sides] || `${section.sides} 边形`;
    metaEl.textContent = `${section.sides} 顶点 · 面积 ${section.area.toFixed(2)}`;
  } else {
    readout.classList.add('empty');
    nameEl.textContent = '未相交';
    metaEl.textContent = '调整平面位置或角度';
  }
}

/* ============================================================
   九、显示模式
   ============================================================ */
function applyMode() {
  if (state.mode === 'solid') {
    solidMesh.visible = true;
    solidMaterial.opacity = 1; solidMaterial.transparent = false; solidMaterial.depthWrite = true;
    edgeMaterial.opacity = 0.55;
  } else if (state.mode === 'transparent') {
    solidMesh.visible = true;
    solidMaterial.opacity = 0.32; solidMaterial.transparent = true; solidMaterial.depthWrite = false;
    edgeMaterial.opacity = 0.6;
  } else { // wireframe
    solidMesh.visible = false;
    edgeMaterial.opacity = 0.92;
  }
  solidMaterial.needsUpdate = true;
}

/* ============================================================
   十、UI 绑定
   ============================================================ */
// 多面体选择按钮
const solList = document.getElementById('solList');
SOLID_ORDER.forEach(key => {
  const def = SOLIDS[key];
  const btn = document.createElement('button');
  btn.className = 'sol-btn' + (key === 'cube' ? ' active' : '');
  btn.dataset.solid = key;
  btn.innerHTML = `<span>${def.name}</span><span class="sol-vef">V${def.v} · E${def.e} · F${def.f}</span>`;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sol-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    buildSolid(key);
    updatePlaneAndSection();
  });
  solList.appendChild(btn);
});

// 滑块
const sliderOffset = document.getElementById('sliderOffset');
const sliderTilt = document.getElementById('sliderTilt');
const sliderSpin = document.getElementById('sliderSpin');
const valOffset = document.getElementById('valOffset');
const valTilt = document.getElementById('valTilt');
const valSpin = document.getElementById('valSpin');

function onSlider() {
  state.offset = parseFloat(sliderOffset.value);
  state.tilt = parseFloat(sliderTilt.value);
  state.spin = parseFloat(sliderSpin.value);
  valOffset.textContent = state.offset.toFixed(2);
  valTilt.textContent = `${state.tilt}°`;
  valSpin.textContent = `${state.spin}°`;
  updatePlaneAndSection();
}
[sliderOffset, sliderTilt, sliderSpin].forEach(s => s.addEventListener('input', onSlider));

// 开关
function bindToggle(id, key, onChange) {
  const btn = document.getElementById(id);
  btn.addEventListener('click', () => {
    state[key] = !state[key];
    btn.classList.toggle('on', state[key]);
    if (onChange) onChange();
  });
}
bindToggle('tgPlane', 'showPlane', updatePlaneAndSection);
bindToggle('tgClip', 'doClip', () => { applyMode(); updatePlaneAndSection(); });
bindToggle('tgLabels', 'showLabels', () => { if (vertexGroup) vertexGroup.visible = state.showLabels; });

// 模式切换
document.querySelectorAll('.demo-mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.demo-mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    applyMode();
  });
});

// 浮动按钮
const spinBtn = document.getElementById('spinBtn');
spinBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  spinBtn.classList.toggle('active', controls.autoRotate);
});
document.getElementById('resetBtn').addEventListener('click', () => {
  camera.position.copy(CAM_INIT);
  controls.target.copy(TARGET_INIT);
  controls.update();
  sliderOffset.value = 0; sliderTilt.value = 20; sliderSpin.value = 30;
  onSlider();
});
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

// 键盘
window.addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); spinBtn.click(); }
  if (e.key === 'r' || e.key === 'R') document.getElementById('resetBtn').click();
});

// 移动端标签切换
document.querySelectorAll('.mtab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mtab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.demo-floating-panel').forEach(p => p.classList.remove('mobile-show'));
    document.getElementById(tab.dataset.target).classList.add('mobile-show');
  });
});
// 移动端默认显示截面控制
if (window.innerWidth <= 768) document.getElementById('panelRight').classList.add('mobile-show');

// 导航栏滚动
window.addEventListener('scroll', () => {
  document.getElementById('demoNavbar').classList.toggle('scrolled', window.scrollY > 10);
});

/* ============================================================
   十一、渲染循环
   ============================================================ */
let entryT = 0;
const _v = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);

  // 入场动画
  if (entryT < 1) {
    entryT = Math.min(1, entryT + 0.025);
    const e = 1 - Math.pow(1 - entryT, 3); // easeOutCubic
    sceneRoot.scale.setScalar(e);
    if (edgeLines) edgeMaterial.opacity = (state.mode === 'wireframe' ? 0.92 : 0.6) * e;
  } else {
    sceneRoot.scale.setScalar(1);
  }

  // 截面边线呼吸
  const pulse = 0.85 + 0.15 * Math.sin(performance.now() * 0.003);
  sectionEdgeMat.opacity = 0.95 * pulse;
  sectionLight.intensity = sectionGroup.children.length ? 0.5 + 0.25 * pulse : 0;

  controls.update();
  renderer.render(scene, camera);
}

/* 窗口自适应 */
function onResize() {
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

/* ============================================================
   十二、启动
   ============================================================ */
buildSolid('cube');
applyMode();
updatePlaneAndSection();
document.getElementById('loading').classList.remove('active');
animate();
</script>
