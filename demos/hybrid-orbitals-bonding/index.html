import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ========================================
   配置
   ======================================== */
const COLORS = {
  hybrid:       0x10B981,
  hybridEmis:   0x064f3b,
  pOrbital:     0xF59E0B,
  pOrbitalEmis: 0x7c3d04,
  centralAtom:  0x475569,
  centralEmis:  0x1e293b,
  peripheral:   0xcbd5e1,
  bond:         0x475569,
  angle:        0x10B981
};

const HYBRID = {
  sp3: {
    name: 'sp³ 杂化',
    sub: 'TETRAHEDRAL HYBRIDIZATION',
    molecule: 'CH₄ 甲烷',
    geometryTag: '正四面体 · 109.5°',
    dirs: [
      new THREE.Vector3( 1,  1,  1),
      new THREE.Vector3( 1, -1, -1),
      new THREE.Vector3(-1,  1, -1),
      new THREE.Vector3(-1, -1,  1)
    ],
    pDirs: [],
    angle: 109.5,
    composition: '1个s轨道 + 3个p轨道 → 4个sp³杂化轨道',
    geometry: '正四面体',
    examples: 'CH₄（甲烷）、NH₃（氨）、H₂O（水）',
    desc: '碳原子的1个2s轨道与3个2p轨道混合，形成4个能量相同的sp³杂化轨道。4个大瓣指向正四面体的四个顶点，任意两个轨道间的夹角为109.5°。每个sp³轨道含1个单电子，可形成1个σ键。',

/* ========================================
   缓动函数
   ======================================== */
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const easeOutBack = t => {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t-1, 3) + c1 * Math.pow(t-1, 2);
};

function tween(obj, prop, from, to, dur, ease, onDone) {
  const t = { obj, prop, from, to, dur, ease, elapsed: 0, done: false, onDone };
  tweens.push(t);
  return t;
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const t = tweens[i];
    t.elapsed += dt;
    const p = Math.min(t.elapsed / t.dur, 1);
    const e = t.ease(p);
    t.obj[t.prop] = t.from + (t.to - t.from) * e;
    if (p >= 1) {
      t.done = true;
      if (t.onDone) t.onDone();
      tweens.splice(i, 1);
    }
  }
}

/* ========================================
   球面线性插值
   ======================================== */
function slerpVec(v1, v2, t) {
  const a = v1.clone().normalize();
  const b = v2.clone().normalize();
  let dot = a.dot(b);
  dot = Math.max(-1, Math.min(1, dot));
  const omega = Math.acos(dot);
  if (omega < 0.001) return a.clone();
  const sinO = Math.sin(omega);
  return a.multiplyScalar(Math.sin((1-t)*omega)/sinO)
           .add(b.multiplyScalar(Math.sin(t*omega)/sinO));
}

/* ========================================
   背景粒子
   ======================================== */
function createParticles() {
  const count = 200;
  const positions = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const r = 8 + Math.random() * 12;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i*3+2] = r * Math.cos(phi);
    sizes[i] = Math.random() * 0.05 + 0.01;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.PointsMaterial({
    color: 0x10B981,
    size: 0.04,
    transparent: true,
    opacity: 0.25,
    sizeAttenuation: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  particleField = new THREE.Points(geo, mat);
  scene.add(particleField);
}

/* ========================================
   创建杂化轨道瓣
   ======================================== */
function createOrbitalGroup(direction, opts = {}) {
  const {
    isHybrid = true,
    color = COLORS.hybrid,
    emissive = COLORS.hybridEmis,
    opacity = 0.5,
    lobeLen = 1.5,
    lobeRad = 0.5
  } = opts;

  const group = new THREE.Group();
  const dir = direction.clone().normalize();

  // 大瓣
  const largeGeo = new THREE.SphereGeometry(1, 48, 32);
  largeGeo.scale(lobeRad, lobeRad, lobeLen);
  const largeMat = new THREE.MeshPhongMaterial({
    color, emissive, emissiveIntensity: 0.35,
    transparent: true, opacity,
    shininess: 90,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  allOrbitalMats.push(largeMat);
  const largeLobe = new THREE.Mesh(largeGeo, largeMat);
  largeLobe.position.z = lobeLen * 0.55;
  largeLobe.userData = { isOrbital: true, orbitalType: isHybrid ? 'hybrid' : 'pOrbital' };
  group.add(largeLobe);

  // 小瓣
  if (isHybrid) {
    const smallRad = lobeRad * 0.38;
    const smallLen = lobeLen * 0.25;
    const smallGeo = new THREE.SphereGeometry(1, 32, 24);
    smallGeo.scale(smallRad, smallRad, smallLen);
    const smallMat = largeMat.clone();
    smallMat.opacity = opacity * 0.45;
    allOrbitalMats.push(smallMat);
    const smallLobe = new THREE.Mesh(smallGeo, smallMat);
    smallLobe.position.z = -smallLen * 0.5;
    smallLobe.userData = { isOrbital: true, orbitalType: 'hybrid' };
    group.add(smallLobe);
  } else {
    // p轨道：等大对瓣
    const smallGeo = new THREE.SphereGeometry(1, 48, 32);
    smallGeo.scale(lobeRad * 0.9, lobeRad * 0.9, lobeLen * 0.9);
    const smallMat = largeMat.clone();
    smallMat.opacity = opacity * 0.75;
    allOrbitalMats.push(smallMat);
    const smallLobe = new THREE.Mesh(smallGeo, smallMat);
    smallLobe.position.z = -lobeLen * 0.5;
    smallLobe.userData = { isOrbital: true, orbitalType: 'pOrbital' };
    group.add(smallLobe);
  }

  // 发光壳层
  const glowGeo = new THREE.SphereGeometry(1, 24, 16);
  glowGeo.scale(lobeRad * 1.5, lobeRad * 1.5, lobeLen * 1.15);
  const glowMat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.05,
    side: THREE.BackSide, depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.z = lobeLen * 0.55;
  group.add(glow);

  // 定向
  const up = new THREE.Vector3(0, 0, 1);
  group.quaternion.setFromUnitVectors(up, dir);

  group.userData.orbitalType = isHybrid ? 'hybrid' : 'pOrbital';
  return group;
}

/* ========================================
   创建中心原子
   ======================================== */
function createCentralAtom() {
  const geo = new THREE.SphereGeometry(0.32, 64, 48);
  const mat = new THREE.MeshPhongMaterial({
    color: COLORS.centralAtom,
    emissive: COLORS.centralEmis,
    emissiveIntensity: 0.2,
    shininess: 120,
    specular: 0x8899aa
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData = { isOrbital: false, orbitalType: 'centralAtom' };

  // 原子发光环
  const ringGeo = new THREE.SphereGeometry(0.38, 32, 24);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x10B981, transparent: true, opacity: 0.06,
    side: THREE.BackSide, depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  mesh.add(ring);

  return mesh;
}

/* ========================================
   创建外围原子
   ======================================== */
function createPeripheralAtom(position) {
  const geo = new THREE.SphereGeometry(0.18, 32, 24);
  const mat = new THREE.MeshPhongMaterial({
    color: COLORS.peripheral,
    emissive: 0x334155,
    emissiveIntensity: 0.1,
    shininess: 80
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(position);
  mesh.userData = { isOrbital: false, orbitalType: 'peripheral' };
  return mesh;
}

/* ========================================
   创建化学键
   ======================================== */
function createBond(from, to) {
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const mid = new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5);
  const geo = new THREE.CylinderGeometry(0.018, 0.018, len, 8);
  const mat = new THREE.MeshBasicMaterial({
    color: COLORS.bond, transparent: true, opacity: 0.35
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(mid);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    dir.clone().normalize()
  );
  return mesh;
}

/* ========================================
   创建键角弧线
   ======================================== */
function createBondAngleArc(dir1, dir2, angle, radius = 1.25) {
  const segs = 32;
  const pts = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    pts.push(slerpVec(dir1, dir2, t).multiplyScalar(radius));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({
    color: COLORS.angle, transparent: true, opacity: 0.25
  });
  return new THREE.Line(geo, mat);
}

/* ========================================
   创建 CSS2D 标签
   ======================================== */
function createLabel(text, position, cls = 'orbital-label') {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  const obj = new CSS2DObject(div);
  obj.position.copy(position);
  labelObjects.push(obj);
  return obj;
}

/* ========================================
   构建杂化场景
   ======================================== */
function buildHybridization(type) {
  // 清理旧内容
  while (mainGroup.children.length > 0) {
    const child = mainGroup.children[0];
    mainGroup.remove(child);
    if (child.geometry) child.geometry.dispose?.();
  }
  allOrbitalMats = [];
  labelObjects = [];
  centralAtomMesh = null;

  const cfg = HYBRID[type];
  currentType = type;

  // 中心原子
  centralAtomMesh = createCentralAtom();
  mainGroup.add(centralAtomMesh);

  // 中心原子标签
  const centerLabel = createLabel('C', new THREE.Vector3(0, -0.5, 0), 'orbital-label atom-label');
  mainGroup.add(centerLabel);

  // 杂化轨道
  cfg.dirs.forEach((dir, i) => {
    const og = createOrbitalGroup(dir, { isHybrid: true });
    og.userData.index = i;
    og.scale.setScalar(0); // 入场动画起点
    mainGroup.add(og);

    // 轨道标签（大瓣末端）
    const labelPos = dir.clone().normalize().multiplyScalar(1.8);
    const label = createLabel(
      type === 'sp3' ? 'sp³' : type === 'sp2' ? 'sp²' : 'sp',
      labelPos
    );
    mainGroup.add(label);

    // 入场动画
    const delay = 0.15 + i * 0.08;
    setTimeout(() => {
      tween(og.scale, 'x', 0, 1, 0.6, easeOutBack);
      tween(og.scale, 'y', 0, 1, 0.6, easeOutBack);
      tween(og.scale, 'z', 0, 1, 0.6, easeOutBack);
    }, delay * 1000);
  });

  // 未杂化 p 轨道
  cfg.pDirs.forEach((dir, i) => {
    const pg = createOrbitalGroup(dir, {
      isHybrid: false,
      color: COLORS.pOrbital,
      emissive: COLORS.pOrbitalEmis,
      opacity: 0.45,
      lobeLen: 1.3,
      lobeRad: 0.42
    });
    pg.scale.setScalar(0);
    mainGroup.add(pg);

    // p轨道标签
    const labelPos = dir.clone().normalize().multiplyScalar(1.6);
    const label = createLabel('p', labelPos, 'orbital-label p-orbital');
    mainGroup.add(label);

    const delay = 0.15 + (cfg.dirs.length + i) * 0.08;
    setTimeout(() => {
      tween(pg.scale, 'x', 0, 1, 0.6, easeOutBack);
      tween(pg.scale, 'y', 0, 1, 0.6, easeOutBack);
      tween(pg.scale, 'z', 0, 1, 0.6, easeOutBack);
    }, delay * 1000);
  });

  // 外围原子 + 化学键
  if (state.showPeripheral) {
    cfg.dirs.forEach((dir, i) => {
      const pos = dir.clone().normalize().multiplyScalar(1.55);
      const atom = createPeripheralAtom(pos);
      atom.scale.setScalar(0);
      mainGroup.add(atom);

      const bond = createBond(
        new THREE.Vector3(0, 0, 0),
        pos.clone().multiplyScalar(0.93)
      );
      bond.material.opacity = 0;
      mainGroup.add(bond);

      const delay = 0.4 + i * 0.08;
      setTimeout(() => {
        tween(atom.scale, 'x', 0, 1, 0.4, easeOutCubic);
        tween(atom.scale, 'y', 0, 1, 0.4, easeOutCubic);
        tween(atom.scale, 'z', 0, 1, 0.4, easeOutCubic);
        tween(bond.material, 'opacity', 0, 0.3, 0.4, easeOutCubic);
      }, delay * 1000);
    });
  }

  // 键角弧线
  if (state.showAngles && cfg.dirs.length >= 2) {
    const angleGroup = new THREE.Group();
    // 只画相邻轨道间的角度（避免过多弧线）
    const pairs = cfg.dirs.length === 4
      ? [[0,1],[0,2],[0,3]]  // sp3: 画3条代表性弧线
      : cfg.dirs.length === 3
      ? [[0,1],[1,2],[0,2]]  // sp2: 画3条
      : [[0,1]];              // sp: 画1条

    pairs.forEach(([a, b]) => {
      const arc = createBondAngleArc(cfg.dirs[a], cfg.dirs[b], cfg.angle);
      arc.material.opacity = 0;
      angleGroup.add(arc);

      // 角度标签
      const midDir = slerpVec(cfg.dirs[a], cfg.dirs[b], 0.5).multiplyScalar(1.5);
      const aLabel = createLabel(cfg.angle + '°', midDir, 'angle-label');
      aLabel.element.style.opacity = '0';
      angleGroup.add(aLabel);

      const delay = 0.6;
      setTimeout(() => {
        tween(arc.material, 'opacity', 0, 0.25, 0.5, easeOutCubic);
        tween(aLabel.element.style, 'opacity', 0, 1, 0.5, easeOutCubic);
      }, delay * 1000);
    });
    mainGroup.add(angleGroup);
  }

  // 更新底部信息
  document.getElementById('moleculeName').textContent = cfg.molecule;
  document.getElementById('geometryTag').textContent = cfg.geometryTag;

  // 更新显示模式
  applyDisplayMode();
  // 更新标签可见性
  applyLabelVisibility();
}

/* ========================================
   显示模式
   ======================================== */
function applyDisplayMode() {
  allOrbitalMats.forEach(mat => {
    if (state.displayMode === 'wireframe') {
      mat.wireframe = true;
      mat.opacity = Math.min(mat.opacity, 0.7);
      mat.transparent = true;
    } else if (state.displayMode === 'solid') {
      mat.wireframe = false;
      mat.opacity = 0.85;
      mat.transparent = true;
    } else {
      mat.wireframe = false;
      mat.transparent = true;
      // 恢复原始透明度
    }
  });

  // 重新构建以恢复正确的透明度
  if (state.displayMode === 'transparent') {
    // 透明模式下恢复默认透明度
    allOrbitalMats.forEach((mat, i) => {
      // 大瓣用0.5，小瓣用0.225
      mat.opacity = i % 2 === 0 ? 0.5 : 0.225;
    });
  }
}

function applyLabelVisibility() {
  labelObjects.forEach(obj => {
    obj.visible = state.showLabels;
  });
}

/* ========================================
   事件
   ======================================== */
function setupEvents() {
  // 杂化类型选择
  document.querySelectorAll('.hybrid-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.hybrid-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const type = btn.dataset.type;

      // 淡出当前
      tween(mainGroup.scale, 'x', 1, 0.85, 0.2, easeInOutCubic, () => {
        buildHybridization(type);
        tween(mainGroup.scale, 'x', 0.85, 1, 0.3, easeOutCubic);
        tween(mainGroup.scale, 'y', 0.85, 1, 0.3, easeOutCubic);
        tween(mainGroup.scale, 'z', 0.85, 1, 0.3, easeOutCubic);
      });
      tween(mainGroup.scale, 'y', 1, 0.85, 0.2, easeInOutCubic);
      tween(mainGroup.scale, 'z', 1, 0.85, 0.2, easeInOutCubic);
    });
  });

  // 切换开关
  document.querySelectorAll('.toggle-row').forEach(row => {
    row.addEventListener('click', () => {
      row.classList.toggle('active');
      const key = row.dataset.toggle;
      state[key] = row.classList.contains('active');

      if (key === 'autoRotate') {
        controls.autoRotate = state.autoRotate;
        document.getElementById('spinBtn').classList.toggle('active', state.autoRotate);
      } else if (key === 'peripheral') {
        // 重建场景
        const btn = document.querySelector('.hybrid-btn.active');
        buildHybridization(btn.dataset.type);
      } else if (key === 'angles') {
        const btn = document.querySelector('.hybrid-btn.active');
        buildHybridization(btn.dataset.type);
      } else if (key === 'labels') {
        applyLabelVisibility();
      }
    });
  });

  // 显示模式
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.displayMode = btn.dataset.mode;
      applyDisplayMode();
    });
  });

  // 自动旋转按钮
  document.getElementById('spinBtn').addEventListener('click', () => {
    state.autoRotate = !state.autoRotate;
    controls.autoRotate = state.autoRotate;
    document.getElementById('spinBtn').classList.toggle('active', state.autoRotate);
    document.querySelector('[data-toggle="autoRotate"]').classList.toggle('active', state.autoRotate);
  });

  // 重置视角
  document.getElementById('resetBtn').addEventListener('click', () => {
    tween(camera.position, 'x', camera.position.x, 4.5, 0.8, easeInOutCubic);
    tween(camera.position, 'y', camera.position.y, 3, 0.8, easeInOutCubic);
    tween(camera.position, 'z', camera.position.z, 6, 0.8, easeInOutCubic);
    controls.target.set(0, 0, 0);
  });

  // 全屏
  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });

  // 信息面板关闭
  document.getElementById('infoClose').addEventListener('click', () => {
    document.getElementById('infoPanel').classList.remove('show');
  });

  // 鼠标移动（悬停检测）
  renderer.domElement.addEventListener('pointermove', onMouseMove);
  // 点击
  renderer.domElement.addEventListener('click', onClick);

  // 键盘
  window.addEventListener('keydown', (e) => {
    if (e.key === '1') document.querySelector('[data-type="sp3"]').click();
    if (e.key === '2') document.querySelector('[data-type="sp2"]').click();
    if (e.key === '3') document.querySelector('[data-type="sp"]').click();
    if (e.key === ' ') { e.preventDefault(); document.getElementById('spinBtn').click(); }
  });

  // 窗口缩放
  window.addEventListener('resize', onResize);
}

/* ========================================
   悬停检测
   ======================================== */
function onMouseMove(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const meshes = [];
  mainGroup.traverse(obj => {
    if (obj.isMesh && obj.userData.isOrbital !== undefined) meshes.push(obj);
  });
  const hits = raycaster.intersectObjects(meshes);

  // 恢复上一个悬停
  if (hoveredMesh && hoveredMesh.material) {
    hoveredMesh.material.emissiveIntensity = hoveredMesh.userData.origEmissive || 0.35;
    hoveredMesh = null;
    renderer.domElement.style.cursor = 'grab';
  }

  if (hits.length > 0) {
    hoveredMesh = hits[0].object;
    if (hoveredMesh.material && hoveredMesh.material.emissive) {
      hoveredMesh.userData.origEmissive = hoveredMesh.material.emissiveIntensity;
      hoveredMesh.material.emissiveIntensity = 0.7;
    }
    renderer.domElement.style.cursor = 'pointer';
  }
}

/* ========================================
   点击检测
   ======================================== */
function onClick(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const meshes = [];
  mainGroup.traverse(obj => {
    if (obj.isMesh && obj.userData.isOrbital !== undefined) meshes.push(obj);
  });
  const hits = raycaster.intersectObjects(meshes);

  if (hits.length > 0) {
    const hit = hits[0].object;
    const type = hit.userData.orbitalType;
    if (type && ORBITAL_INFO[type]) {
      showInfoPanel(ORBITAL_INFO[type]);
    }
  }
}

/* ========================================
   显示信息面板
   ======================================== */
function showInfoPanel(info) {
  const panel = document.getElementById('infoPanel');
  const content = document.getElementById('infoContent');

  content.innerHTML = `
    <div class="info-panel-tag">${info.tag}</div>
    <div class="info-panel-title">${info.title}</div>
    <div class="info-panel-sub">${info.sub}</div>
    <div class="info-panel-desc">${info.desc}</div>
  `;

  panel.classList.add('show');
}

/* ========================================
   窗口缩放
   ======================================== */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
}

/* ========================================
   动画循环
   ======================================== */
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // 更新补间
  updateTweens(dt);

  // 轨道呼吸效果
  if (mainGroup.children.length > 1) {
    const breath = 1 + Math.sin(clock.elapsedTime * 1.5) * 0.015;
    mainGroup.children.forEach(child => {
      if (child.userData.orbitalType === 'hybrid' || child.userData.orbitalType === 'pOrbital') {
        if (child.scale.x > 0.5) {
          // 轻微呼吸（不干扰入场动画）
        }
      }
    });
  }

  // 中心原子脉冲
  if (centralAtomMesh && centralAtomMesh.children[0]) {
    const pulse = 1 + Math.sin(clock.elapsedTime * 2) * 0.04;
    centralAtomMesh.children[0].scale.setScalar(pulse);
  }

  // 粒子缓慢旋转
  if (particleField) {
    particleField.rotation.y += dt * 0.02;
    particleField.rotation.x += dt * 0.01;
  }

  // 控制器更新
  controls.update();

  // 渲染
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* ========================================
   启动
   ======================================== */
init();
</script>
