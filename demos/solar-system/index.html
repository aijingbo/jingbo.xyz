<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #050510;
    color: #e5e5e5;
    font-family: var(--font-sans);
  }

  /* ============ 顶部导航栏 ============ */
  .navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: rgba(8, 8, 16, 0.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    transition: opacity 0.6s ease;
  }
  .navbar.hidden { opacity: 0; pointer-events: none; }

  .nav-left, .nav-right { display: flex; align-items: center; gap: 16px; }
  .nav-center {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-family: var(--font-serif); font-size: 16px; font-weight: 700;
    color: #e5e5e5; white-space: nowrap;
  }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: #a3a3a3; text-decoration: none; font-size: 13px; font-weight: 500;
    transition: color 0.15s ease;
  }
  .back-link:hover { color: #fff; }
  .back-link svg { width: 16px; height: 16px; }
  .brand-logo {
    font-family: var(--font-serif); font-size: 17px; font-weight: 700;
    color: #fff; text-decoration: none;
  }
  .brand-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.1); }
  .tag-astronomy {
    display: inline-flex; align-items: center; padding: 4px 12px;
    font-size: 11px; font-weight: 500; border-radius: 999px;
    background: rgba(124,58,237,0.15); color: #a78bfa;
  }
  .btn-download {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 18px; background: var(--brand); color: white;
    border: none; border-radius: var(--radius); font-size: 13px;
    font-weight: 500; font-family: var(--font-sans);
    cursor: pointer; text-decoration: none; transition: all 0.25s ease;
  }
  .btn-download:hover { background: var(--brand-hover); transform: translateY(-1px); }
  .btn-download svg { width: 14px; height: 14px; }

  /* ============ 3D 画布 ============ */
  #canvas-container {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  }

  /* ============ 加载画面 ============ */
  #loading {
    position: fixed; inset: 0; z-index: 200;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #050510; transition: opacity 0.8s ease;
  }
  #loading.fade { opacity: 0; pointer-events: none; }
  .loading-text {
    font-family: var(--font-serif); font-size: 18px; color: #a3a3a3;
    letter-spacing: 0.15em; margin-top: 20px;
  }
  .loading-orb {
    width: 60px; height: 60px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #FFEE00 30%, #FFA000 70%, #FF6F00);
    box-shadow: 0 0 40px rgba(255,160,0,0.6), 0 0 80px rgba(255,100,0,0.3);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 40px rgba(255,160,0,0.6), 0 0 80px rgba(255,100,0,0.3); }
    50% { transform: scale(1.1); box-shadow: 0 0 60px rgba(255,160,0,0.8), 0 0 120px rgba(255,100,0,0.4); }
  }

  /* ============ 左侧行星列表 ============ */
  .planet-list {
    position: fixed; top: 84px; left: 24px; z-index: 50;
    padding: 14px 16px; min-width: 160px;
    background: rgba(10,10,20,0.5);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: var(--radius-card);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .planet-list-title {
    font-family: var(--font-serif); font-size: 12px; font-weight: 600;
    color: #a3a3a3; margin-bottom: 10px; letter-spacing: 0.08em;
  }
  .planet-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: var(--radius);
    cursor: pointer; font-size: 13px; color: #d4d4d4;
    transition: all 0.15s ease; margin-bottom: 2px;
  }
  .planet-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .planet-item.active { background: rgba(0,229,255,0.12); color: #00E5FF; }
  .planet-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    box-shadow: 0 0 6px currentColor;
  }
  .planet-item-name { font-weight: 500; }
  .planet-item-en { font-size: 10px; color: #6b6b6b; margin-left: auto; }

  /* ============ 右侧信息卡片 ============ */
  .info-card {
    position: fixed; top: 84px; right: 24px; z-index: 50;
    width: 340px; max-height: calc(100vh - 180px); overflow-y: auto;
    background: rgba(10,10,20,0.6);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-card);
    transform: translateX(380px); opacity: 0;
    transition: transform 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease;
  }
  .info-card.show { transform: translateX(0); opacity: 1; }
  .info-card::-webkit-scrollbar { width: 4px; }
  .info-card::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .info-header {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 20px 14px; border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .info-planet-icon {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    box-shadow: 0 0 12px currentColor;
  }
  .info-planet-name {
    font-family: var(--font-serif); font-size: 20px; font-weight: 700; color: #fff;
  }
  .info-planet-en {
    font-size: 11px; color: #6b6b6b; letter-spacing: 0.05em; margin-top: 2px;
  }
  .info-close {
    margin-left: auto; background: none; border: none; color: #6b6b6b;
    cursor: pointer; font-size: 18px; padding: 4px; transition: color 0.15s ease;
  }
  .info-close:hover { color: #fff; }

  .info-body { padding: 16px 20px 20px; }
  .info-desc {
    font-size: 13px; line-height: 1.65; color: #c4c4c4; margin-bottom: 16px;
  }
  .info-section-title {
    font-size: 11px; font-weight: 600; color: #00E5FF;
    letter-spacing: 0.1em; margin-bottom: 8px; text-transform: uppercase;
  }
  .info-facts { margin-bottom: 16px; }
  .info-fact {
    display: flex; gap: 8px; font-size: 12px; color: #d4d4d4;
    line-height: 1.6; margin-bottom: 4px;
  }
  .info-fact::before { content: '•'; color: #00E5FF; flex-shrink: 0; }
  .info-data-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: rgba(255,255,255,0.06); border-radius: var(--radius); overflow: hidden;
  }
  .info-data-item {
    background: rgba(10,10,20,0.5); padding: 8px 10px;
  }
  .info-data-label { font-size: 10px; color: #6b6b6b; margin-bottom: 2px; }
  .info-data-value { font-size: 13px; color: #e5e5e5; font-weight: 500; font-family: var(--font-mono); }

  /* ============ 底部控制条 ============ */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    height: 64px; display: flex; align-items: center;
    padding: 0 24px; gap: 24px;
    background: rgba(8,8,16,0.6);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid rgba(255,255,255,0.06);
    transition: opacity 0.4s ease;
  }
  .bottom-bar.hidden { opacity: 0; pointer-events: none; }

  .play-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: rgba(0,229,255,0.15); border: 1px solid rgba(0,229,255,0.3);
    color: #00E5FF; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: all 0.2s ease; flex-shrink: 0;
  }
  .play-btn:hover { background: rgba(0,229,255,0.25); }
  .play-btn svg { width: 20px; height: 20px; }

  .speed-control { display: flex; flex-direction: column; gap: 4px; min-width: 180px; }
  .speed-label-row {
    display: flex; justify-content: space-between; font-size: 10px; color: #6b6b6b;
  }
  .speed-value { font-family: var(--font-mono); color: #fbbf24; font-weight: 600; }

  input[type="range"].speed-slider {
    -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.1); outline: none; cursor: pointer;
  }
  input[type="range"].speed-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fbbf24; cursor: pointer; box-shadow: 0 0 8px rgba(251,191,36,0.6);
  }
  input[type="range"].speed-slider::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; border: none;
    background: #fbbf24; cursor: pointer; box-shadow: 0 0 8px rgba(251,191,36,0.6);
  }

  .time-display {
    font-family: var(--font-mono); font-size: 14px; color: #e5e5e5;
    letter-spacing: 0.05em; min-width: 100px; text-align: center;
  }

  .scale-toggle {
    display: flex; gap: 0; border-radius: var(--radius); overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .scale-btn {
    padding: 6px 14px; font-size: 12px; border: none; cursor: pointer;
    background: transparent; color: #6b6b6b; transition: all 0.2s ease;
    font-family: var(--font-sans);
  }
  .scale-btn.active { background: rgba(0,229,255,0.15); color: #00E5FF; }

  .bar-spacer { flex: 1; }

  /* ============ 视角预设 ============ */
  .view-presets {
    position: fixed; bottom: 84px; left: 24px; z-index: 50;
    display: flex; flex-direction: column; gap: 6px;
  }
  .view-preset-btn {
    padding: 6px 14px; font-size: 11px; color: #a3a3a3;
    background: rgba(10,10,20,0.5);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.07); border-radius: var(--radius);
    cursor: pointer; transition: all 0.15s ease; font-family: var(--font-sans);
    text-align: left; white-space: nowrap;
  }
  .view-preset-btn:hover { color: #fff; border-color: rgba(0,229,255,0.3); }
  .view-preset-btn.active { color: #00E5FF; border-color: rgba(0,229,255,0.4); background: rgba(0,229,255,0.08); }

  /* ============ 右下角控件 ============ */
  .floating-right {
    position: fixed; bottom: 84px; right: 24px; z-index: 50;
    display: flex; flex-direction: column; gap: 8px;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1); color: #e5e5e5;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .icon-btn:hover {
    background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.2);
    transform: scale(1.05);
  }
  .icon-btn.active { background: rgba(0,229,255,0.2); border-color: rgba(0,229,255,0.4); color: #00E5FF; }
  .icon-btn svg { width: 20px; height: 20px; }

  /* ============ 操作提示 ============ */
  .scene-hint {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    z-index: 40; font-size: 12px; color: rgba(255,255,255,0.3);
    pointer-events: none; transition: opacity 1s ease;
  }
  .scene-hint.fade { opacity: 0; }

  /* ============ 元素开关面板 ============ */
  .toggle-panel {
    position: fixed; top: 84px; right: 24px; z-index: 50;
    padding: 12px 14px; min-width: 150px;
    background: rgba(10,10,20,0.5);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.07); border-radius: var(--radius-card);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .toggle-panel.hidden { opacity: 0; transform: translateX(20px); pointer-events: none; }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 0; font-size: 12px; color: #d4d4d4;
  }
  .toggle-switch {
    position: relative; width: 32px; height: 18px; border-radius: 9px;
    background: rgba(255,255,255,0.1); cursor: pointer; transition: background 0.2s ease;
  }
  .toggle-switch.on { background: rgba(0,229,255,0.4); }
  .toggle-knob {
    position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; transition: transform 0.2s ease;
  }
  .toggle-switch.on .toggle-knob { transform: translateX(14px); }

  /* ============ 响应式 ============ */
  @media (max-width: 768px) {
    .planet-list {
      top: 72px; left: 12px; right: 12px; min-width: auto;
      padding: 10px 12px;
    }
    .planet-list-title { margin-bottom: 6px; }
    .planet-list-items {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
    }
    .planet-item { flex-shrink: 0; margin-bottom: 0; padding: 5px 8px; }
    .planet-item-en { display: none; }

    .info-card {
      top: auto; bottom: 76px; right: 12px; left: 12px; width: auto;
      max-height: 50vh;
    }

    .view-presets { display: none; }
    .toggle-panel { display: none; }

    .bottom-bar { padding: 0 12px; gap: 12px; }
    .speed-control { min-width: 100px; }
    .time-display { display: none; }
    .scale-toggle .scale-btn { padding: 6px 8px; font-size: 10px; }
  }
</style>
</head>

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   太阳系 3D 可视化
   ============================================================ */

// ============ 行星科学数据 ============
const PLANETS = [
  {
    id:'mercury', name:'水星', nameEn:'Mercury', color:0x8D6E63, colorHex:'#8D6E63',
    teachingR:0.8, realR:0.38, teachingOrbit:8, realOrbit:14,
    period:88, rotPeriod:58.6, diameter:'4,879 km', mass:'3.30×10²³ kg',
    moons:0, distance:'0.39 AU', temp:'-180~430°C', tilt:0.03,
    desc:'太阳系最小的行星，也是最靠近太阳的行星。表面布满陨石坑，类似月球。没有大气层保护，昼夜温差极大。',
    facts:['一天比一年长（自转58.6天，公转88天）','没有大气层和卫星','表面温差太阳系最大'],
    startAngle: 0.2
  },
  {
    id:'venus', name:'金星', nameEn:'Venus', color:0xFFCC80, colorHex:'#FFCC80',
    teachingR:1.2, realR:0.95, teachingOrbit:12, realOrbit:22,
    period:225, rotPeriod:-243, diameter:'12,104 km', mass:'4.87×10²⁴ kg',

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function texMercury() {
  const c = makeCanvas(256, 128), ctx = c.getContext('2d');
  ctx.fillStyle = '#8D6E63'; ctx.fillRect(0, 0, 256, 128);
  // 表面变化
  for (let i = 0; i < 80; i++) {
    const x = Math.random()*256, y = Math.random()*128, r = Math.random()*15+5;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const shade = Math.random()*0.3;
    g.addColorStop(0, `rgba(${100+Math.random()*40},${80+Math.random()*30},${60+Math.random()*20},${shade})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x-r, y-r, r*2, r*2);
  }
  // 陨石坑
  for (let i = 0; i < 40; i++) {
    const x = Math.random()*256, y = Math.random()*128, r = Math.random()*6+2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(60,45,35,${0.3+Math.random()*0.3})`; ctx.fill();
    ctx.beginPath(); ctx.arc(x-r*0.3, y-r*0.3, r*0.5, 0, Math.PI*2);
    ctx.fillStyle = `rgba(180,160,140,0.2)`; ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

function createStarfield() {
  // 远景星
  const farGeo = new THREE.BufferGeometry();
  const farPos = [];
  for (let i = 0; i < 5000; i++) {
    const r = 600 + Math.random()*400;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos(2*Math.random()-1);
    farPos.push(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
  }
  farGeo.setAttribute('position', new THREE.Float32BufferAttribute(farPos, 3));
  starfield1 = new THREE.Points(farGeo, new THREE.PointsMaterial({
    color:0xffffff, size:0.4, transparent:true, opacity:0.6, sizeAttenuation:true
  }));
  scene.add(starfield1);

  // 中景星
  const midGeo = new THREE.BufferGeometry();
  const midPos = [];
  for (let i = 0; i < 2000; i++) {
    const r = 300 + Math.random()*200;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos(2*Math.random()-1);
    midPos.push(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
  }
  midGeo.setAttribute('position', new THREE.Float32BufferAttribute(midPos, 3));
  starfield2 = new THREE.Points(midGeo, new THREE.PointsMaterial({
    color:0xffffff, size:0.8, transparent:true, opacity:0.8, sizeAttenuation:true
  }));
  scene.add(starfield2);

  // 近景星（带颜色）
  const nearGeo = new THREE.BufferGeometry();
  const nearPos = [], nearCol = [];
  const colors = [[1,1,1],[0.7,0.8,1],[1,0.8,0.6],[1,1,0.8]];
  for (let i = 0; i < 500; i++) {
    const r = 150 + Math.random()*100;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos(2*Math.random()-1);
    nearPos.push(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
    const col = colors[Math.floor(Math.random()*colors.length)];
    nearCol.push(col[0], col[1], col[2]);
  }
  nearGeo.setAttribute('position', new THREE.Float32BufferAttribute(nearPos, 3));
  nearGeo.setAttribute('color', new THREE.Float32BufferAttribute(nearCol, 3));
  starfield3 = new THREE.Points(nearGeo, new THREE.PointsMaterial({
    size:1.5, transparent:true, opacity:0.9, sizeAttenuation:true, vertexColors:true
  }));
  scene.add(starfield3);

  // 星云背景 sprite
  const nebulaTex = (() => {
    const c = makeCanvas(512, 512), ctx = c.getContext('2d');
    for (let i = 0; i < 8; i++) {
      const x = Math.random()*512, y = Math.random()*512, r = Math.random()*150+80;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      const hue = [280, 240, 200, 320][Math.floor(Math.random()*4)];
      g.addColorStop(0, `hsla(${hue},60%,30%,0.15)`);
      g.addColorStop(1, 'hsla(0,0%,0%,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 512);
    }
    return new THREE.CanvasTexture(c);
  })();
  const nebula = new THREE.Sprite(new THREE.SpriteMaterial({
    map: nebulaTex, transparent:true, opacity:0.5, depthWrite:false,
    blending: THREE.AdditiveBlending
  }));
  nebula.scale.set(900, 900, 1);
  scene.add(nebula);
}

// ============ 创建太阳 ============
function createSun() {
  const sunR = 2.5;
  const geo = new THREE.SphereGeometry(sunR, 48, 32);
  const mat = new THREE.MeshBasicMaterial({ map: texSun() });
  sun = new THREE.Mesh(geo, mat);
  scene.add(sun);

  // 光晕层
  const glowTex = texGlow();
  const glowConfigs = [
    { scale: 14, opacity: 0.15 },
    { scale: 9, opacity: 0.25 },
    { scale: 5.5, opacity: 0.4 },
    { scale: 3.5, opacity: 0.6 }
  ];
  glowConfigs.forEach(cfg => {
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, transparent:true, opacity:cfg.opacity,
      depthWrite:false, blending: THREE.AdditiveBlending
    }));
    sprite.scale.set(cfg.scale, cfg.scale, 1);
    sun.add(sprite);
    sunGlowSprites.push(sprite);
  });

  // 太阳光
  const sunLight = new THREE.PointLight(0xFFE0A0, 2.5, 300, 0);
  scene.add(sunLight);
  // 微弱环境光
  scene.add(new THREE.AmbientLight(0x333355, 0.4));
}

// ============ 创建行星 ============
function createPlanets() {
  const texMap = {
    mercury: texMercury, venus: texVenus, earth: texEarth, mars: texMars,
    jupiter: texJupiter, saturn: texSaturn, uranus: texUranus, neptune: texNeptune
  };

  PLANETS.forEach((data, i) => {
    const radius = currentScale === 'teaching' ? data.teachingR : data.realR * 0.3;
    const orbitR = currentScale === 'teaching' ? data.teachingOrbit : data.realOrbit;

    const geo = new THREE.SphereGeometry(radius, 48, 24);
    const mat = new THREE.MeshStandardMaterial({
      map: texMap[data.id](),
      roughness: 0.85,
      metalness: 0.05
    });
    const mesh = new THREE.Mesh(geo, mat);

    // 轴倾角
    mesh.rotation.z = THREE.MathUtils.degToRad(data.tilt > 90 ? data.tilt - 180 : data.tilt);

    const group = new THREE.Group();
    group.add(mesh);
    // 设置初始位置
    group.position.x = Math.cos(data.startAngle) * orbitR;
    group.position.z = Math.sin(data.startAngle) * orbitR;
    scene.add(group);

    // 轨道线
    const orbitGeo = new THREE.BufferGeometry();
    const orbitPts = [];
    const segs = 128;
    for (let j = 0; j <= segs; j++) {
      const a = (j / segs) * Math.PI * 2;
      orbitPts.push(Math.cos(a) * orbitR, 0, Math.sin(a) * orbitR);
    }
    orbitGeo.setAttribute('position', new THREE.Float32BufferAttribute(orbitPts, 3));
    const orbitLine = new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0.08
    }));
    scene.add(orbitLine);

    // 标签
    const labelSprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: texLabel(data.name), transparent: true, depthTest: false, depthWrite: false
    }));
    const labelScale = Math.max(radius * 2.5, 2.5);
    labelSprite.scale.set(labelScale, labelScale * 0.25, 1);
    labelSprite.position.y = radius + labelScale * 0.3;
    group.add(labelSprite);

    // 土星环
    if (data.hasRings) {
      const ringInner = radius * 1.3;
      const ringOuter = radius * 2.3;
      const ringGeo = new THREE.RingGeometry(ringInner, ringOuter, 64, 1);
      // 修复 UV 让纹理沿径向映射
      const rPos = ringGeo.attributes.position;
      const rUV = ringGeo.attributes.uv;
      for (let j = 0; j < rPos.count; j++) {
        const x = rPos.getX(j), y = rPos.getY(j);
        const r = Math.sqrt(x*x + y*y);
        const u = (r - ringInner) / (ringOuter - ringInner);
        const angle = Math.atan2(y, x);
        const v = (angle + Math.PI) / (Math.PI * 2);
        rUV.setXY(j, u, v);
      }
      const ringMat = new THREE.MeshBasicMaterial({
        map: texRing(), transparent: true, side: THREE.DoubleSide,
        opacity: 0.8, depthWrite: false
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2;
      // 环的倾角由 mesh 的轴倾角继承
      mesh.add(ring);
    }

    planetObjs.push({
      mesh, group, data, orbitLine, label: labelSprite,
      angle: data.startAngle, rotAngle: 0,
      radius, orbitR
    });
  });
}

// ============ 小行星带 ============
function createAsteroidBelt() {
  // 根据比例模式调整小行星带位置
  const marsOrbit = currentScale === 'teaching' ? PLANETS[3].teachingOrbit : PLANETS[3].realOrbit;
  const jupiterOrbit = currentScale === 'teaching' ? PLANETS[4].teachingOrbit : PLANETS[4].realOrbit;
  const innerR = marsOrbit + (jupiterOrbit - marsOrbit) * 0.25;
  const outerR = marsOrbit + (jupiterOrbit - marsOrbit) * 0.75;
  const count = 4000;
  const geo = new THREE.BufferGeometry();
  const pos = [];
  for (let i = 0; i < count; i++) {
    const r = innerR + Math.random() * (outerR - innerR);
    const a = Math.random() * Math.PI * 2;
    const y = (Math.random() - 0.5) * 1.5;
    pos.push(Math.cos(a) * r, y, Math.sin(a) * r);
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  asteroidBelt = new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0x9e9e9e, size: 0.12, transparent: true, opacity: 0.6, sizeAttenuation: true
  }));
  scene.add(asteroidBelt);
}

// ============ 交互：点击行星 ============
function onCanvasClick(e) {
  if (!entranceDone) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const meshes = planetObjs.map(p => p.mesh);
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length > 0) {
    const idx = planetObjs.findIndex(p => p.mesh === hits[0].object);
    if (idx >= 0) selectPlanet(idx);
  }
}

function selectPlanet(idx) {
  selectedIdx = idx;
  const p = planetObjs[idx];
  const d = p.data;

  // 高亮轨道
  planetObjs.forEach(po => {
    po.orbitLine.material.opacity = 0.08;
    po.orbitLine.material.color.setHex(0xffffff);
  });
  p.orbitLine.material.opacity = 0.35;
  p.orbitLine.material.color.setHex(0x00E5FF);

  // 更新行星列表
  document.querySelectorAll('.planet-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  // 信息卡片
  const card = document.getElementById('infoCard');
  document.getElementById('infoIcon').style.background = d.colorHex;
  document.getElementById('infoIcon').style.color = d.colorHex;
  document.getElementById('infoName').textContent = d.name;
  document.getElementById('infoEn').textContent = d.nameEn;
  document.getElementById('infoDesc').textContent = d.desc;
  document.getElementById('infoFacts').innerHTML = d.facts.map(f => `<div class="info-fact">${f}</div>`).join('');
  document.getElementById('infoData').innerHTML = `
    <div class="info-data-item"><div class="info-data-label">与太阳距离</div><div class="info-data-value">${d.distance}</div></div>
    <div class="info-data-item"><div class="info-data-label">公转周期</div><div class="info-data-value">${d.period < 1000 ? d.period + ' 天' : (d.period/365).toFixed(1) + ' 年'}</div></div>
    <div class="info-data-item"><div class="info-data-label">自转周期</div><div class="info-data-value">${Math.abs(d.rotPeriod) < 2 ? (d.rotPeriod*24).toFixed(1)+' 小时' : Math.abs(d.rotPeriod).toFixed(1)+' 天'}${d.rotPeriod < 0 ? ' (逆行)' : ''}</div></div>
    <div class="info-data-item"><div class="info-data-label">直径</div><div class="info-data-value">${d.diameter}</div></div>
    <div class="info-data-item"><div class="info-data-label">质量</div><div class="info-data-value">${d.mass}</div></div>
    <div class="info-data-item"><div class="info-data-label">卫星</div><div class="info-data-value">${d.moons}</div></div>
    <div class="info-data-item"><div class="info-data-label">表面温度</div><div class="info-data-value">${d.temp}</div></div>
    <div class="info-data-item"><div class="info-data-label">轴倾角</div><div class="info-data-value">${d.tilt}°</div></div>
  `;
  card.classList.add('show');

  // 隐藏元素开关面板
  document.getElementById('togglePanel').classList.add('hidden');
}

function deselectPlanet() {
  selectedIdx = -1;
  planetObjs.forEach(po => {
    po.orbitLine.material.opacity = 0.08;
    po.orbitLine.material.color.setHex(0xffffff);
  });
  document.querySelectorAll('.planet-item').forEach(el => el.classList.remove('active'));
  document.getElementById('infoCard').classList.remove('show');
  document.getElementById('togglePanel').classList.remove('hidden');
}

// ============ 视角预设 ============
function getPlanetPos(p) {
  return new THREE.Vector3(
    Math.cos(p.angle) * p.orbitR, 0, Math.sin(p.angle) * p.orbitR
  );
}

function setViewPreset(preset) {
  followIdx = -1;
  document.querySelectorAll('.view-preset-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.preset === preset);
  });

  let targetPos, targetLookAt;
  switch(preset) {
    case 'overview': {
      const maxR = Math.max(...planetObjs.map(p => p.orbitR));
      const d = maxR / Math.tan(Math.PI * 50 / 360) * 1.3;
      targetPos = new THREE.Vector3(0, d * 0.5, d * 0.85);
      targetLookAt = new THREE.Vector3(0, 0, 0);
      break;
    }
    case 'ecliptic': {
      const maxR2 = Math.max(...planetObjs.map(p => p.orbitR));
      targetPos = new THREE.Vector3(maxR2 * 1.5, 3, 0);
      targetLookAt = new THREE.Vector3(0, 0, 0);
      break;
    }
    case 'earth': {
      const ep = getPlanetPos(planetObjs[2]);
      targetPos = ep.clone().add(new THREE.Vector3(0, 3, 5));
      targetLookAt = ep.clone();
      followIdx = 2;
      break;
    }
    case 'saturn': {
      const sp = getPlanetPos(planetObjs[5]);
      targetPos = sp.clone().add(new THREE.Vector3(5, 3, 5));
      targetLookAt = sp.clone();
      break;
    }
    case 'sun':
      targetPos = new THREE.Vector3(0, 2, 10);
      targetLookAt = new THREE.Vector3(0, 0, 0);
      break;
  }
  animateCameraTo(targetPos, targetLookAt, 1500);
}

function animateCameraTo(targetPos, targetLookAt, duration) {
  const startPos = camera.position.clone();
  const startTarget = controls.target.clone();
  const startTime = performance.now();
  camAnim = {
    update() {
      const t = Math.min((performance.now() - startTime) / duration, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      camera.position.lerpVectors(startPos, targetPos, ease);
      if (followIdx >= 0) {
        const fp = getPlanetPos(planetObjs[followIdx]);
        controls.target.lerpVectors(startTarget, fp, ease);
      } else {
        controls.target.lerpVectors(startTarget, targetLookAt, ease);
      }
      controls.update();
      if (t >= 1) camAnim = null;
    }
  };
}

// ============ 比例切换 ============
function switchScale(scale) {
  if (scale === currentScale) return;
  currentScale = scale;
  // 移除旧行星
  planetObjs.forEach(po => {
    scene.remove(po.group);
    scene.remove(po.orbitLine);
    po.mesh.geometry.dispose();
    po.mesh.material.dispose();
  });
  planetObjs.length = 0;
  createPlanets();
  // 重建小行星带
  if (asteroidBelt) {
    scene.remove(asteroidBelt);
    asteroidBelt.geometry.dispose();
    asteroidBelt.material.dispose();
  }
  createAsteroidBelt();
  asteroidBelt.visible = toggles.asteroids;
  // 重置选择
  if (selectedIdx >= 0) {
    const prevIdx = selectedIdx;
    selectedIdx = -1;
    selectPlanet(prevIdx);
  }
}

// ============ 更新行星 ============
function updatePlanets(dt) {
  if (!isPlaying) return;
  const dayDelta = dt * timeSpeed;
  simDays += dayDelta;

  planetObjs.forEach(po => {
    // 公转
    po.angle += (dayDelta / po.data.period) * Math.PI * 2;
    po.group.position.x = Math.cos(po.angle) * po.orbitR;
    po.group.position.z = Math.sin(po.angle) * po.orbitR;
    // 自转
    const rotDir = po.data.rotPeriod < 0 ? -1 : 1;
    po.rotAngle += rotDir * (dayDelta / Math.abs(po.data.rotPeriod)) * Math.PI * 2;
    po.mesh.rotation.y = po.rotAngle;
    // 恢复轴倾角
    po.mesh.rotation.z = THREE.MathUtils.degToRad(
      po.data.tilt > 90 ? po.data.tilt - 180 : po.data.tilt
    );
  });

  // 小行星带缓慢旋转
  if (asteroidBelt) asteroidBelt.rotation.y += dt * 0.01;

  // 太阳自转
  if (sun) sun.rotation.y += dt * 0.05;
}

// ============ 更新时间显示 ============
function updateTimeDisplay() {
  const startDate = new Date(2000, 0, 1);
  const currentDate = new Date(startDate.getTime() + simDays * 86400000);
  const y = currentDate.getFullYear();
  const m = String(currentDate.getMonth() + 1).padStart(2, '0');
  const d = String(currentDate.getDate()).padStart(2, '0');
  document.getElementById('timeDisplay').textContent = `${y}-${m}-${d}`;
}

// ============ 更新标签可见性 ============
function updateLabels() {
  if (!toggles.labels) return;
  planetObjs.forEach(po => {
    const dist = camera.position.distanceTo(po.mesh.getWorldPosition(new THREE.Vector3()));
    const opacity = Math.max(0, Math.min(0.9, 30 / dist));
    po.label.material.opacity = opacity;
  });
}

// ============ 入场动画 ============
function updateEntrance(dt) {
  if (entranceDone) return;
  entranceT += dt;
  const duration = 3.0;
  const t = Math.min(entranceT / duration, 1);
  const ease = 1 - Math.pow(1 - t, 4);

  // 从远处推入
  const farPos = new THREE.Vector3(0, 150, 250);
  const maxOrbit = Math.max(...planetObjs.map(p => p.orbitR));
  const camDist = maxOrbit / Math.tan(Math.PI * 50 / 360) * 1.3;
  const nearPos = new THREE.Vector3(0, camDist * 0.5, camDist * 0.85);
  camera.position.lerpVectors(farPos, nearPos, ease);
  controls.target.lerp(new THREE.Vector3(0, 0, 0), ease);

  // 行星渐现
  planetObjs.forEach(po => {
    po.mesh.material.opacity = ease;
    po.mesh.material.transparent = true;
    po.orbitLine.material.opacity = 0.08 * ease;
  });

  if (t >= 1) {
    entranceDone = true;
    planetObjs.forEach(po => {
      po.mesh.material.transparent = false;
      po.mesh.material.opacity = 1;
    });
    // 显示 UI
    document.getElementById('loading').classList.add('fade');
    setTimeout(() => {
      document.getElementById('planetList').style.opacity = '1';
      document.getElementById('viewPresets').style.opacity = '1';
      document.getElementById('floatingRight').style.opacity = '1';
      document.getElementById('bottomBar').style.opacity = '1';
      document.getElementById('togglePanel').style.opacity = '1';
    }, 200);
    setTimeout(() => {
      document.getElementById('sceneHint').classList.add('fade');
    }, 5000);
  }
}

// ============ 动画循环 ============
let lastTime = 0;
function animate(time) {
  requestAnimationFrame(animate);
  const dt = lastTime ? Math.min((time - lastTime) / 1000, 0.1) : 0;
  lastTime = time;

  if (!entranceDone) {
    updateEntrance(dt);
  } else {
    updatePlanets(dt);
    updateTimeDisplay();
    updateLabels();
    if (followIdx >= 0 && !camAnim) {
      const fp = getPlanetPos(planetObjs[followIdx]);
      controls.target.lerp(fp, 0.05);
    }
  }

  if (camAnim) camAnim.update();
  controls.update();
  renderer.render(scene, camera);
}

// ============ 初始化 ============
function init() {
  const container = document.getElementById('canvas-container');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050510);

  camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 3000);
  camera.position.set(0, 150, 250);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 4;
  controls.maxDistance = 800;
  controls.maxPolarAngle = Math.PI;

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  // 构建场景
  createStarfield();
  createSun();
  createPlanets();
  createAsteroidBelt();

  // 事件
  renderer.domElement.addEventListener('click', onCanvasClick);
  window.addEventListener('resize', onResize);

  animate(0);
}

function onResize() {
  const container = document.getElementById('canvas-container');
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}

// ============ UI 事件绑定 ============
document.addEventListener('DOMContentLoaded', () => {
  init();

  // 行星列表
  const listEl = document.getElementById('planetItems');
  PLANETS.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'planet-item';
    el.innerHTML = `
      <span class="planet-dot" style="background:${p.colorHex};color:${p.colorHex};"></span>
      <span class="planet-item-name">${p.name}</span>
      <span class="planet-item-en">${p.nameEn}</span>
    `;
    el.addEventListener('click', () => selectPlanet(i));
    listEl.appendChild(el);
  });

  // 播放/暂停
  document.getElementById('playBtn').addEventListener('click', () => {
    isPlaying = !isPlaying;
    document.getElementById('playIcon').style.display = isPlaying ? 'none' : 'block';
    document.getElementById('pauseIcon').style.display = isPlaying ? 'block' : 'none';
  });

  // 速度滑块
  const slider = document.getElementById('speedSlider');
  slider.addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    // 对数映射: 0->1天/秒, 50->30天/秒, 100->3650天/秒
    timeSpeed = Math.pow(10, v / 100 * 3.562); // 10^3.562 ≈ 3650
    const display = timeSpeed < 100 ? timeSpeed.toFixed(1) + ' 天/秒' :
                    timeSpeed < 365 ? Math.round(timeSpeed) + ' 天/秒' :
                    (timeSpeed / 365).toFixed(1) + ' 年/秒';
    document.getElementById('speedValue').textContent = display;
  });

  // 比例切换
  document.querySelectorAll('.scale-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      switchScale(btn.dataset.scale);
    });
  });

  // 视角预设
  document.querySelectorAll('.view-preset-btn').forEach(btn => {
    btn.addEventListener('click', () => setViewPreset(btn.dataset.preset));
  });

  // 信息卡片关闭
  document.getElementById('infoClose').addEventListener('click', deselectPlanet);

  // 全屏
  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });

  // 元素开关
  document.querySelectorAll('.toggle-switch').forEach(sw => {
    sw.addEventListener('click', () => {
      sw.classList.toggle('on');
      const key = sw.dataset.toggle;
      toggles[key] = sw.classList.contains('on');
      applyToggles();
    });
  });
});

function applyToggles() {
  planetObjs.forEach(po => {
    po.orbitLine.visible = toggles.orbits;
    po.label.visible = toggles.labels;
  });
  if (asteroidBelt) asteroidBelt.visible = toggles.asteroids;
  if (starfield1) starfield1.visible = toggles.stars;
  if (starfield2) starfield2.visible = toggles.stars;
  if (starfield3) starfield3.visible = toggles.stars;
}
