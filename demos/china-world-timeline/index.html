<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中外对照交互式时间轴 · 景礴</title>
<link rel="stylesheet" href="/assets/css/design-system.css" />
<link rel="stylesheet" href="/assets/css/demo-framework.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
/* ============================================
   中外对照时间轴 · 主题样式
   历史地图册 × 双轨时间轴
   ============================================ */

:root {
  --cw-parchment: #f5f0e8;
  --cw-parchment-dark: #e8e0d0;
  --cw-parchment-light: #faf6ef;
  --cw-ochre: #B45309;
  --cw-ochre-dark: #92400E;
  --cw-ochre-light: #d97706;
  --cw-china: #C2410C;
  --cw-china-soft: rgba(194, 65, 12, 0.12);
  --cw-china-glow: rgba(194, 65, 12, 0.35);
  --cw-world: #475569;
  --cw-world-soft: rgba(71, 85, 105, 0.12);
  --cw-world-glow: rgba(71, 85, 105, 0.3);
  --cw-brown: #78350F;
  --cw-gold: #B08D57;
  --cw-ink: #4A3728;
  --cw-text: #3D2B1F;
  --cw-text-muted: #8B7355;
  --cw-text-faint: #B0A090;
  --cw-border-warm: #d4c4b0;
  --cw-divider: #c9b99e;
}

/* ---------- 加载屏 ---------- */
.cw-loading {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  background: linear-gradient(135deg, #f5f0e8 0%, #e8e0d0 50%, #dccdb5 100%);
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
.cw-loading.hidden { opacity: 0; visibility: hidden; }
.cw-loading-inner { text-align: center; }
.cw-hourglass {
  width: 64px; height: 80px; margin: 0 auto 24px; position: relative;
}
.cw-hourglass svg { width: 100%; height: 100%; }
.cw-sand-top { animation: cw-sand-empty 2s ease-in-out infinite; }
.cw-sand-bottom { animation: cw-sand-fill 2s ease-in-out infinite; }
.cw-sand-stream { animation: cw-sand-stream 2s ease-in-out infinite; }
@keyframes cw-sand-empty { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
@keyframes cw-sand-fill { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
@keyframes cw-sand-stream { 0%,100% { opacity: 0; } 50% { opacity: 1; } }
.cw-loading-title {
  font-family: var(--font-serif); font-size: 28px; font-weight: 700;
  color: var(--cw-brown); letter-spacing: 0.15em; margin-bottom: 6px;
}
.cw-loading-sub {
  font-family: var(--font-serif); font-size: 12px;
  color: var(--cw-text-muted); letter-spacing: 0.3em; margin-bottom: 28px;
}
.cw-loading-bar {
  width: 140px; height: 2px; background: rgba(120, 53, 15, 0.12);
  border-radius: 1px; overflow: hidden; margin: 0 auto;
}
.cw-loading-bar-fill {
  height: 100%; width: 40%; background: var(--cw-ochre);
  border-radius: 1px; animation: cw-bar-slide 1.2s ease-in-out infinite;
}
@keyframes cw-bar-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

/* ---------- 主体框架覆盖 ---------- */
.framework-narrative { background: var(--cw-parchment); }
.framework-narrative .narrative-main { grid-template-columns: 62% 38%; }

/* ---------- 导航栏覆盖 ---------- */
.demo-navbar {
  background-color: rgba(245, 240, 232, 0.9);
  border-bottom-color: transparent;
}
.demo-navbar.scrolled {
  background-color: rgba(245, 240, 232, 0.96);
  border-bottom-color: var(--cw-border-warm);
}
.demo-nav-logo { color: var(--cw-text); }
.demo-nav-subject { color: var(--cw-text-muted); }
.demo-nav-divider { background: var(--cw-border-warm); }
.demo-nav-center { color: var(--cw-text); font-family: var(--font-serif); }
.demo-btn-download {
  background: var(--cw-ochre); color: #fff;
}
.demo-btn-download:hover { background: var(--cw-ochre-dark); }
.tag-history {
  background: rgba(176, 141, 87, 0.15); color: var(--cw-brown);
  border: 1px solid rgba(176, 141, 87, 0.3);
}

/* ---------- 地图区域 ---------- */
.narrative-map-area {
  background: var(--cw-parchment);
  border-right: 1px solid var(--cw-border-warm);
}
#map { position: absolute; inset: 0; z-index: 1; }

/* 瓦片滤镜：古地图暖调 */
.leaflet-tile-pane {
  filter: sepia(0.32) saturate(0.5) brightness(1.1) hue-rotate(-5deg) contrast(0.92);
}
.leaflet-container {
  background: var(--cw-parchment); font-family: var(--font-sans);
}
.leaflet-control-attribution {
  background: rgba(245, 240, 232, 0.7) !important;
  color: var(--cw-text-muted) !important; font-size: 9px !important;
  padding: 2px 6px !important; border-radius: 3px;
}
.leaflet-control-attribution a { color: var(--cw-brown) !important; }
.leaflet-control-zoom { border: none !important; box-shadow: 0 2px 12px rgba(74, 55, 40, 0.12) !important; }
.leaflet-control-zoom a {
  background: rgba(250, 246, 239, 0.95) !important;
  color: var(--cw-brown) !important;
  border-color: var(--cw-border-warm) !important; font-weight: 600;
}
.leaflet-control-zoom a:hover { background: var(--cw-parchment-light) !important; }

/* 羊皮纸纹理叠加 */
.narrative-map-area::after {
  content: ''; position: absolute; inset: 0; z-index: 400;
  pointer-events: none; mix-blend-mode: multiply;
  background-image:
    radial-gradient(ellipse at 30% 20%, rgba(176, 141, 87, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(120, 53, 15, 0.04) 0%, transparent 50%);
}

/* ---------- 事件标记 ---------- */
.cw-event-marker {
  position: relative; width: 28px; height: 28px;
  pointer-events: auto; cursor: pointer;
}
.cw-event-core {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid #fff; z-index: 2;
  transition: all 0.3s ease;
}
.cw-event-marker.china .cw-event-core {
  background: var(--cw-china); box-shadow: 0 0 8px var(--cw-china-glow);
}
.cw-event-marker.world .cw-event-core {
  background: var(--cw-world); box-shadow: 0 0 8px var(--cw-world-glow);
}
.cw-event-marker.passed .cw-event-core {
  width: 8px; height: 8px; opacity: 0.5;
}
.cw-event-marker.passed.china .cw-event-core { background: var(--cw-brown); box-shadow: none; }
.cw-event-marker.passed.world .cw-event-core { background: var(--cw-text-faint); box-shadow: none; }
.cw-event-marker.future .cw-event-core {
  width: 8px; height: 8px;
  background: var(--cw-parchment-dark);
  border-color: var(--cw-gold); box-shadow: none;
}
.cw-event-marker.active .cw-event-core {
  width: 16px; height: 16px;
}
.cw-event-marker.active.china .cw-event-core {
  background: var(--cw-china);
  box-shadow: 0 0 16px var(--cw-china-glow), 0 0 32px var(--cw-china-glow);
}
.cw-event-marker.active.world .cw-event-core {
  background: var(--cw-world);
  box-shadow: 0 0 16px var(--cw-world-glow), 0 0 32px var(--cw-world-glow);
}
.cw-event-pulse {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 14px; height: 14px; border-radius: 50%;
  z-index: 1; opacity: 0;
}
.cw-event-marker.active.china .cw-event-pulse {
  background: var(--cw-china-glow);
  animation: cw-pulse 2s ease-out infinite;
}
.cw-event-marker.active.world .cw-event-pulse {
  background: var(--cw-world-glow);
  animation: cw-pulse 2s ease-out infinite;
}
@keyframes cw-pulse {
  0% { width: 14px; height: 14px; opacity: 0.5; }
  100% { width: 52px; height: 52px; opacity: 0; }
}
.cw-event-label {
  position: absolute; top: -22px; left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 9px; font-weight: 600;
  white-space: nowrap; padding: 1px 5px; border-radius: 3px;
  background: rgba(250, 246, 239, 0.92);
  opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
}
.cw-event-marker.active .cw-event-label { opacity: 1; }
.cw-event-marker.active.china .cw-event-label {
  color: var(--cw-china); border: 1px solid rgba(194, 65, 12, 0.25);
}
.cw-event-marker.active.world .cw-event-label {
  color: var(--cw-world); border: 1px solid rgba(71, 85, 105, 0.25);
}

/* ---------- 罗盘装饰 ---------- */
.cw-compass {
  position: absolute; bottom: 24px; right: 24px;
  width: 70px; height: 70px; z-index: 500;
  pointer-events: none; opacity: 0.45;
}
.cw-compass svg { width: 100%; height: 100%; }

/* ---------- 对照指示器 ---------- */
.cw-comparison-badge {
  position: absolute; top: 16px; left: 16px; z-index: 500;
  display: flex; align-items: center; gap: 8px;
  background: rgba(250, 246, 239, 0.9);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--cw-border-warm);
  border-radius: var(--radius-card);
  padding: 8px 14px;
  box-shadow: var(--shadow-soft);
}
.cw-comparison-icon {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  transition: background 0.4s ease, box-shadow 0.4s ease;
}
.cw-comparison-icon.china {
  background: var(--cw-china); box-shadow: 0 0 6px var(--cw-china-glow);
}
.cw-comparison-icon.world {
  background: var(--cw-world); box-shadow: 0 0 6px var(--cw-world-glow);
}
.cw-comparison-label {
  font-family: var(--font-serif); font-size: 12px; font-weight: 600;
  color: var(--cw-text); letter-spacing: 0.02em;
}

/* ---------- 信息卡片 ---------- */
.narrative-info-card {
  background-color: rgba(250, 246, 239, 0.96);
  border: 1px solid var(--cw-gold);
  border-radius: var(--radius-card);
  max-width: 360px; padding: 20px 24px;
  box-shadow: 0 8px 32px rgba(74, 55, 40, 0.12);
}
.narrative-info-card::before {
  content: ''; position: absolute; top: 0; left: 0;
  width: 3px; height: 100%; border-radius: 8px 0 0 8px;
  background: var(--cw-china); transition: background 0.4s ease;
}
.narrative-info-card.world-side::before { background: var(--cw-world); }
.cw-info-side {
  display: inline-block; font-family: var(--font-sans);
  font-size: 10px; font-weight: 600; padding: 2px 10px;
  border-radius: var(--radius-full); letter-spacing: 0.05em; margin-bottom: 8px;
}
.cw-info-side.china {
  background: var(--cw-china-soft); color: var(--cw-china);
  border: 1px solid rgba(194, 65, 12, 0.2);
}
.cw-info-side.world {
  background: var(--cw-world-soft); color: var(--cw-world);
  border: 1px solid rgba(71, 85, 105, 0.2);
}
.narrative-info-year {
  font-family: var(--font-serif); font-size: 26px; font-weight: 700;
  color: var(--cw-china); line-height: 1; margin-bottom: 6px;
}
.narrative-info-card.world-side .narrative-info-year { color: var(--cw-world); }
.narrative-info-title {
  font-family: var(--font-serif); font-size: 19px; font-weight: 700;
  color: var(--cw-text); margin-bottom: 8px; line-height: 1.3;
}
.narrative-info-desc {
  font-size: 12px; color: var(--cw-text-muted); line-height: 1.7;
}
.cw-info-location {
  font-size: 11px; color: var(--cw-text-faint);
  margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
}
.cw-info-location svg { width: 11px; height: 11px; flex-shrink: 0; }

/* 同时期对照框 */
.cw-comparison-box {
  margin-top: 14px; padding-top: 14px;
  border-top: 1px dashed var(--cw-border-warm);
}
.cw-comparison-box-title {
  font-family: var(--font-sans); font-size: 10px; font-weight: 600;
  color: var(--cw-text-faint); letter-spacing: 0.1em;
  text-transform: uppercase; margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.cw-comparison-box-title svg { width: 12px; height: 12px; }
.cw-comparison-event {
  display: flex; align-items: flex-start; gap: 8px;
}
.cw-comparison-dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0; margin-top: 5px;
}
.cw-comparison-dot.china { background: var(--cw-china); }
.cw-comparison-dot.world { background: var(--cw-world); }
.cw-comparison-text {
  font-size: 11px; color: var(--cw-text-muted); line-height: 1.6;
}
.cw-comparison-text strong {
  font-family: var(--font-serif); font-weight: 600;
  color: var(--cw-text);
}

/* ---------- 时间轴面板覆盖 ---------- */
.narrative-timeline-panel {
  background-color: rgba(250, 246, 239, 0.5);
  border-left: 1px solid var(--cw-border-warm);
}
.narrative-timeline-header {
  border-bottom-color: var(--cw-border-warm);
  background: rgba(245, 240, 232, 0.5);
}
.narrative-timeline-title {
  color: var(--cw-text); font-size: 18px;
}
.narrative-timeline-subtitle {
  color: var(--cw-text-muted); font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.05em;
}

/* 双轨标签 */
.cw-track-labels {
  display: flex; padding: 0 24px 8px;
  border-bottom: 1px solid var(--cw-border-warm);
  flex-shrink: 0;
}
.cw-track-label {
  flex: 1; text-align: center;
  font-family: var(--font-serif); font-size: 13px; font-weight: 700;
  letter-spacing: 0.1em; padding: 6px 0;
  position: relative;
}
.cw-track-label.china { color: var(--cw-china); }
.cw-track-label.world { color: var(--cw-world); }
.cw-track-label::after {
  content: ''; position: absolute; bottom: 0; left: 20%; right: 20%;
  height: 2px; border-radius: 1px;
}
.cw-track-label.china::after { background: var(--cw-china); opacity: 0.5; }
.cw-track-label.world::after { background: var(--cw-world); opacity: 0.5; }
.cw-track-label.active::after { opacity: 1; height: 3px; }

/* 时间轴列表 — 双列 */
.cw-timeline-dual {
  flex: 1; overflow-y: auto; display: grid;
  grid-template-columns: 1fr 1px 1fr;
  position: relative;
}
.cw-timeline-dual::before {
  content: ''; position: absolute;
  left: 50%; top: 12px; bottom: 12px;
  width: 1px; background: var(--cw-border-warm);
  transform: translateX(-0.5px);
}
.cw-timeline-column {
  overflow-y: auto; padding: 12px 8px;
  scrollbar-width: thin;
}
.cw-timeline-column::-webkit-scrollbar { width: 3px; }
.cw-timeline-column::-webkit-scrollbar-track { background: transparent; }
.cw-timeline-column::-webkit-scrollbar-thumb { background: var(--cw-border-warm); border-radius: 2px; }

.cw-timeline-divider { background: var(--cw-border-warm); }

.cw-tl-event {
  padding: 10px 10px; cursor: pointer; position: relative;
  border-radius: 6px; transition: all 0.25s ease;
  margin-bottom: 4px;
}
.cw-tl-event:hover { background: rgba(176, 141, 87, 0.08); }
.cw-tl-event.active.china { background: var(--cw-china-soft); }
.cw-tl-event.active.world { background: var(--cw-world-soft); }

.cw-tl-event-year {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.03em;
}
.cw-tl-event.china .cw-tl-event-year { color: var(--cw-china); }
.cw-tl-event.world .cw-tl-event-year { color: var(--cw-world); }
.cw-tl-event-title {
  font-family: var(--font-serif); font-size: 12px; font-weight: 600;
  color: var(--cw-text); margin-top: 2px; line-height: 1.35;
}
.cw-tl-event.active.china .cw-tl-event-title { color: var(--cw-china); }
.cw-tl-event.active.world .cw-tl-event-title { color: var(--cw-world); }
.cw-tl-event-loc {
  font-size: 10px; color: var(--cw-text-faint); margin-top: 2px;
}

/* 同时期高亮 */
.cw-tl-event.comparison-hl {
  position: relative;
}
.cw-tl-event.comparison-hl::after {
  content: '同时期'; position: absolute; top: 4px; right: 4px;
  font-size: 8px; font-family: var(--font-sans); font-weight: 600;
  padding: 1px 5px; border-radius: 3px; letter-spacing: 0.05em;
}
.cw-tl-event.comparison-hl.china::after {
  background: var(--cw-china-soft); color: var(--cw-china);
}
.cw-tl-event.comparison-hl.world::after {
  background: var(--cw-world-soft); color: var(--cw-world);
}

/* 底部播放控件 */
.narrative-timeline-footer {
  border-top-color: var(--cw-border-warm);
  background: rgba(245, 240, 232, 0.5);
}
.narrative-play-btn { background-color: var(--cw-ochre); }
.narrative-play-btn:hover { background-color: var(--cw-ochre-dark); }
.narrative-progress { background: var(--cw-border-warm); }
.narrative-progress-bar {
  background: linear-gradient(90deg, var(--cw-china), var(--cw-ochre-light));
}
#eventCounter {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--cw-text-muted); letter-spacing: 0.05em;
}
.cw-nav-btn {
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px;
  background: transparent; border: 1px solid var(--cw-border-warm);
  border-radius: var(--radius); color: var(--cw-text-muted);
  cursor: pointer; transition: all 0.2s ease; flex-shrink: 0;
}
.cw-nav-btn:hover {
  color: var(--cw-text); border-color: var(--cw-gold);
  background: rgba(176, 141, 87, 0.08);
}
.cw-nav-btn:active { transform: scale(0.95); }
.cw-nav-btn svg { width: 15px; height: 15px; }
.cw-footer-left { display: flex; align-items: center; gap: 6px; }

/* 速度控制 */
.cw-speed-control { display: flex; align-items: center; gap: 4px; }
.cw-speed-btn {
  font-family: var(--font-mono); font-size: 9px; font-weight: 600;
  padding: 3px 7px; background: transparent;
  border: 1px solid var(--cw-border-warm); border-radius: 3px;
  color: var(--cw-text-faint); cursor: pointer; transition: all 0.2s ease;
}
.cw-speed-btn:hover { color: var(--cw-text-muted); border-color: var(--cw-gold); }
.cw-speed-btn.active {
  background: var(--cw-china-soft); color: var(--cw-china);
  border-color: rgba(194, 65, 12, 0.3);
}

/* ---------- 响应式 ---------- */
@media (max-width: 1024px) {
  .framework-narrative .narrative-main {
    grid-template-columns: 1fr;
    grid-template-rows: 58% 42%;
  }
  .narrative-map-area { border-right: none; border-bottom: 1px solid var(--cw-border-warm); }
  .cw-compass { display: none; }
}
@media (max-width: 768px) {
  .narrative-info-card {
    left: 12px; right: 12px; max-width: none; bottom: 12px; padding: 14px 16px;
  }
  .narrative-info-year { font-size: 22px; }
  .narrative-info-title { font-size: 16px; }
  .narrative-info-desc { font-size: 11px; }
  .cw-comparison-badge { top: 8px; left: 8px; padding: 6px 10px; }
  .cw-comparison-label { font-size: 11px; }
  .cw-timeline-dual { grid-template-columns: 1fr 1px 1fr; }
  .cw-tl-event { padding: 8px 6px; }
  .cw-tl-event-title { font-size: 11px; }
  .cw-speed-control { display: none; }
}

/* 路线动画 */
.leaflet-overlay-pane path { animation: cw-route-fade 0.6s ease-out; }
@keyframes cw-route-fade { from { opacity: 0; } to { opacity: var(--route-op, 0.5); } }
</style>
</head>
<body>

<!-- ====== 加载屏 ====== -->
<div class="cw-loading" id="cwLoading">
  <div class="cw-loading-inner">
    <div class="cw-hourglass">
      <svg viewBox="0 0 64 80">
        <path d="M8,4 L56,4 L56,12 L40,32 L40,36 L56,56 L56,76 L8,76 L8,56 L24,36 L24,32 L8,12 Z"
              fill="none" stroke="#78350F" stroke-width="2" stroke-linejoin="round"/>
        <path class="cw-sand-top" d="M14,8 L50,8 L38,28 L26,28 Z" fill="#B45309" opacity="0.7"/>
        <rect class="cw-sand-stream" x="31" y="30" width="2" height="20" fill="#B45309" opacity="0"/>
        <path class="cw-sand-bottom" d="M14,70 L50,70 L38,52 L26,52 Z" fill="#B45309" opacity="0.2"/>
      </svg>
    </div>
    <div class="cw-loading-title">中外对照</div>

    maxBoundsViscosity: 0.7,
  });

  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
    attribution: '© 高德地图',
    subdomains: ['1', '2', '3', '4'],
    maxZoom: 18,
  }).addTo(map);

  map.whenReady(() => { setTimeout(hideLoading, 600); });
}

// ====== 创建事件标记 ======
function createMarkers() {
  events.forEach((e, i) => {
    const icon = L.divIcon({
      className: '',
      html: `
        <div class="cw-event-marker future ${e.side}" data-idx="${i}">
          <div class="cw-event-pulse"></div>
          <div class="cw-event-core"></div>
          <div class="cw-event-label">${e.year}</div>
        </div>
      `,
      iconSize: [28, 28],
      iconAnchor: [14, 14],
    });

    const marker = L.marker([e.lat, e.lng], { icon, zIndexOffset: 1000 });
    marker.on('click', () => selectEvent(i));
    marker.addTo(map);
    markers.push(marker);
  });
}

// ====== 更新标记状态 ======
function updateMarkers() {
  markers.forEach((marker, i) => {
    const el = marker.getElement();
    if (!el) return;
    const inner = el.querySelector('.cw-event-marker');
    if (!inner) return;
    inner.classList.remove('active', 'passed', 'future');
    if (i === currentEvent) inner.classList.add('active');
    else if (i < currentEvent) inner.classList.add('passed');
    else inner.classList.add('future');
  });
}

// ====== 绘制路线（已访问事件之间的连线） ======
function drawRoutes(upToIdx) {
  routeLines.forEach(l => map.removeLayer(l));
  routeLines = [];

  for (let i = 0; i < upToIdx; i++) {
    const from = events[i];
    const to = events[i + 1];
    if (!from || !to) continue;

    const isChina = from.side === 'china' && to.side === 'china';
    const isWorld = from.side === 'world' && to.side === 'world';
    const isCross = from.side !== to.side;

    let color, opacity, weight, dashArray;
    if (isChina) {
      color = '#C2410C'; opacity = 0.4; weight = 1.5; dashArray = '6,6';
    } else if (isWorld) {
      color = '#475569'; opacity = 0.35; weight = 1.5; dashArray = '6,6';
    } else {
      color = '#B08D57'; opacity = 0.3; weight = 1; dashArray = '2,8';
    }

    const line = L.polyline(
      [[from.lat, from.lng], [to.lat, to.lng]],
      { color, weight, opacity, dashArray, lineCap: 'round', lineJoin: 'round' }
    ).addTo(map);
    routeLines.push(line);
  }
}

// ====== 构建双轨时间轴 ======
function buildTimeline() {
  const colChina = document.getElementById('columnChina');
  const colWorld = document.getElementById('columnWorld');
  let htmlC = '', htmlW = '';

  events.forEach((e, i) => {
    const item = `
      <div class="cw-tl-event ${e.side} ${i === currentEvent ? 'active' : ''}" data-idx="${i}">
        <div class="cw-tl-event-year">${e.year}</div>
        <div class="cw-tl-event-title">${e.title}</div>
        <div class="cw-tl-event-loc">${e.location}</div>
      </div>
    `;
    if (e.side === 'china') htmlC += item;
    else htmlW += item;
  });

  colChina.innerHTML = htmlC;
  colWorld.innerHTML = htmlW;

  // 绑定点击
  document.querySelectorAll('.cw-tl-event').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      if (isPlaying) togglePlay();
      selectEvent(idx);
    });
  });
}

// ====== 找到最近的同时期对照事件 ======
function findComparison(idx) {
  const e = events[idx];
  const target = e.comparison;
  // 找到 comparison 中描述的那个时代最近的对方事件
  let nearest = -1;
  let minDiff = Infinity;
  events.forEach((ev, i) => {
    if (ev.side === e.side) return;
    const diff = Math.abs(ev.yearSort - e.yearSort);
    if (diff < minDiff) { minDiff = diff; nearest = i; }
  });
  return nearest;
}

// ====== 选中事件 ======
function selectEvent(idx) {
  currentEvent = idx;
  const e = events[idx];
  const cmpIdx = findComparison(idx);
  const cmpEvent = cmpIdx >= 0 ? events[cmpIdx] : null;

  // 地图飞行
  map.flyTo([e.lat, e.lng], e.zoom, { duration: 1.2, easeLinearity: 0.25 });

  // 绘制路线
  setTimeout(() => drawRoutes(idx), 200);

  // 更新信息卡片
  const card = document.getElementById('infoCard');
  card.classList.toggle('world-side', e.side === 'world');

  document.getElementById('infoSide').textContent = e.side === 'china' ? '中国' : '世界';
  document.getElementById('infoSide').className = `cw-info-side ${e.side}`;
  document.getElementById('infoLocationText').textContent = e.location;
  document.getElementById('infoYear').textContent = e.year;
  document.getElementById('infoTitle').textContent = e.title;
  document.getElementById('infoDesc').textContent = e.desc;

  // 对照框
  const cmpBox = document.getElementById('comparisonBox');
  const cmpTitleEl = cmpBox.querySelector('.cw-comparison-box-title');
  const cmpDot = document.getElementById('cmpDot');
  const cmpText = document.getElementById('cmpText');

  if (e.comparison) {
    const otherSide = e.side === 'china' ? '世界' : '中国';
    cmpTitleEl.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      同时期的${otherSide}
    `;
    cmpDot.className = `cw-comparison-dot ${e.comparison.side}`;
    cmpText.innerHTML = `<strong>${e.comparison.title}</strong> — ${e.comparison.text}`;
    cmpBox.style.display = '';
  } else {
    cmpBox.style.display = 'none';
  }

  // 更新对照指示器
  const badgeIcon = document.getElementById('badgeIcon');
  const badgeLabel = document.getElementById('badgeLabel');
  badgeIcon.className = `cw-comparison-icon ${e.side}`;
  badgeLabel.textContent = `${e.side === 'china' ? '中国' : '世界'} · ${e.title}`;

  // 更新双轨标签
  document.getElementById('labelChina').classList.toggle('active', e.side === 'china');
  document.getElementById('labelWorld').classList.toggle('active', e.side === 'world');

  // 更新时间轴高亮
  document.querySelectorAll('.cw-tl-event').forEach(el => {
    const i = parseInt(el.dataset.idx);
    el.classList.remove('active', 'comparison-hl');
    if (i === idx) el.classList.add('active');
    else if (i === cmpIdx) el.classList.add('comparison-hl');
  });

  // 滚动到当前事件
  const activeEl = document.querySelector('.cw-tl-event.active');
  if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  // 滚动对照事件
  const cmpEl = document.querySelector('.cw-tl-event.comparison-hl');
  if (cmpEl) setTimeout(() => cmpEl.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);

  // 进度条
  const progress = ((idx + 1) / events.length) * 100;
  document.getElementById('progressBar').style.width = `${progress}%`;
  document.getElementById('eventCounter').textContent = `${idx + 1} / ${events.length}`;

  // 标记
  updateMarkers();

  // GSAP 动画
  if (typeof gsap !== 'undefined') {
    gsap.fromTo(card, { opacity: 0.5, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' });
  }
}

// ====== 播放控制 ======
function togglePlay() {
  isPlaying = !isPlaying;
  const icon = document.getElementById('playIcon');
  const label = document.getElementById('playLabel');

  if (isPlaying) {
    icon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
    label.textContent = '暂停';
    playTimer = setInterval(() => {
      let next = currentEvent + 1;
      if (next >= events.length) next = 0;
      selectEvent(next);
    }, playSpeed);
  } else {
    icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    label.textContent = '播放';
    clearInterval(playTimer);
  }
}

// ====== 速度控制 ======
function initSpeedControl() {
  document.querySelectorAll('.cw-speed-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cw-speed-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      playSpeed = parseInt(btn.dataset.speed);
      if (isPlaying) {
        clearInterval(playTimer);
        playTimer = setInterval(() => {
          let next = currentEvent + 1;
          if (next >= events.length) next = 0;
          selectEvent(next);
        }, playSpeed);
      }
    });
  });
}

// ====== 隐藏加载屏 ======
function hideLoading() {
  const loading = document.getElementById('cwLoading');
  if (loading && !loading.classList.contains('hidden')) {
    loading.classList.add('hidden');
    setTimeout(() => { if (map) map.invalidateSize(); }, 400);
  }
}

// ====== 导航栏 ======
function setupNavbar() {
  const navbar = document.getElementById('demoNavbar');
  window.addEventListener('scroll', () => {
    navbar.classList.toggle('scrolled', window.scrollY > 10);
  });
}

// ====== 初始化 ======
function init() {
  initMap();
  createMarkers();
  buildTimeline();
  initSpeedControl();
  setupNavbar();

  map.whenReady(() => {
    setTimeout(() => {
      selectEvent(0);
      // GSAP 入场动画
      if (typeof gsap !== 'undefined') {
        gsap.fromTo('.narrative-map-area', { opacity: 0 }, { opacity: 1, duration: 0.8, ease: 'power2.out' });
        gsap.fromTo('.narrative-timeline-panel', { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.8, ease: 'power2.out', delay: 0.2 });
        gsap.fromTo('.cw-comparison-badge', { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out', delay: 0.5 });
      }
    }, 500);
  });

  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('prevBtn').addEventListener('click', () => {
    if (isPlaying) togglePlay();
    if (currentEvent > 0) selectEvent(currentEvent - 1);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (isPlaying) togglePlay();
    if (currentEvent < events.length - 1) selectEvent(currentEvent + 1);
  });

  // 键盘控制
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      if (currentEvent > 0) { if (isPlaying) togglePlay(); selectEvent(currentEvent - 1); }
    } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      if (currentEvent < events.length - 1) { if (isPlaying) togglePlay(); selectEvent(currentEvent + 1); }
    } else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  });

  // 窗口大小变化
  window.addEventListener('resize', () => { if (map) map.invalidateSize(); });

  // 安全兜底
  setTimeout(hideLoading, 5000);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
