<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0f1115;
    color: #e5e5e5;
    font-family: var(--font-sans);
  }

  /* ===== 3D 画布容器 ===== */
  #canvasContainer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvasContainer:active { cursor: grabbing; }

  /* 背景径向渐变聚光灯 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 45%, #1a1d28 0%, #0f1115 50%, #08090c 100%);
    z-index: 0;
    pointer-events: none;
  }

  /* ===== 加载层 ===== */
  .loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1115;
    transition: opacity 0.8s ease;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-text {
    font-family: var(--font-mono);
    font-size: 13px;
    color: rgba(245, 158, 11, 0.5);
    letter-spacing: 0.15em;
    animation: pulse-fade 1.5s ease-in-out infinite;
  }
  @keyframes pulse-fade {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }

  /* ===== 左侧信息面板 ===== */
  .info-panel {
    position: fixed;
    top: 84px;
    left: 20px;
    z-index: 50;
    width: 280px;
    padding: 18px 22px;
    background: rgba(15, 17, 21, 0.65);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(245, 158, 11, 0.12);
    border-radius: 12px;
    transform: translateX(-360px);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }
  .info-panel.visible {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
  }
  .info-close {
    position: absolute;
    top: 10px; right: 12px;
    width: 26px; height: 26px;
    border: none;
    background: rgba(255, 255, 255, 0.05);
    color: #888;
    font-size: 18px;
    cursor: pointer;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .info-close:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
  .info-phase-tag {
    display: inline-block;
    padding: 3px 10px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;

    margin-bottom: 10px;
    font-family: var(--font-mono);
  }
  .info-name {
    font-family: var(--font-serif);
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    margin: 0 0 4px 0;
  }
  .info-name-en {
    font-family: var(--font-mono);
    font-size: 11px;
    color: #6b6b6b;
    margin-bottom: 14px;
  }
  .info-section { margin-bottom: 12px; }
  .info-label {
    font-size: 11px;
    font-weight: 600;
    color: #F59E0B;
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }
  .info-desc {

    line-height: 1.7;
    color: #aaa;
    margin: 0;

  /* ===== 右侧图例面板 ===== */

    position: fixed;
    top: 84px;
    right: 20px;
    z-index: 50;
    width: 200px;
    padding: 14px 16px;
    background: rgba(15, 17, 21, 0.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
  }
  .legend-title {
    font-family: var(--font-serif);
    font-size: 12px;
    font-weight: 600;
    color: #e5e5e5;
    margin-bottom: 10px;

    border-bottom: 1px solid rgba(255, 255, 255, 0.06);

  .legend-item {

    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 12px;
    color: #a3a3a3;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;

  .legend-divider {

    background: rgba(255, 255, 255, 0.06);
    margin: 10px 0;
  }
  .legend-fact {

    color: #6b6b6b;
    margin-bottom: 3px;
    line-height: 1.5;

  /* ===== 底部分期控制条 ===== */
  .phase-bar {

    left: 50%;

    align-items: center;
    gap: 0;
    padding: 6px 8px;
    background: rgba(15, 17, 21, 0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 40px;
  }
  .phase-btn {
    padding: 8px 16px;
    border: none;
    background: transparent;
    color: #6b6b6b;

    font-weight: 500;
    font-family: var(--font-sans);

  .phase-btn .phase-num {

    font-size: 9px;
    opacity: 0.5;
    display: block;
    line-height: 1;
    margin-bottom: 2px;
  }

  /* ===== 浮动控件 ===== */
  .floating-controls-left {
    position: fixed;
    bottom: 130px;
    left: 24px;
    z-index: 50;

    flex-direction: column;

  .floating-controls-right {
    position: fixed;
    bottom: 130px;
    right: 24px;

    display: flex;
    flex-direction: column;
    gap: 10px;
  }

    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #e5e5e5;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;

    color: #6b6b6b;

  .speed-slider::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: none;
    background: #F59E0B;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(245, 158, 11, 0.4);
  }

    font-size: 10px;
    color: #F59E0B;
    font-family: var(--font-mono);
    min-width: 24px;
    text-align: right;
  }

  /* ===== 底部信息条 ===== */
  .info-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 50;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: rgba(15, 17, 21, 0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .info-bar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .info-bar-title {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: #e5e5e5;
  }
  .tech-tag {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 500;
    line-height: 1.5;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.05);
    color: #a3a3a3;
    border: 1px solid rgba(255, 255, 255, 0.07);
  }
  .info-bar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .status-tag {
    font-size: 11px;
    font-family: var(--font-mono);
    color: #6b6b6b;
    transition: color 0.3s ease;
  }
  .status-tag.active { color: #F59E0B; }

  /* ===== 进度条 ===== */
  .progress-bar {
    position: fixed;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 49;
    width: 320px;
    height: 2px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 1px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #F59E0B, #D97706);
    border-radius: 1px;
    transition: width 0.1s linear;
    box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
  }

  /* ===== 操作提示 ===== */
  .scene-hint {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    color: rgba(255, 255, 255, 0.25);
    font-size: 11px;
    font-family: var(--font-mono);
    pointer-events: none;
    white-space: nowrap;
    letter-spacing: 0.05em;
  }

  /* ===== 响应式 ===== */
  @media (max-width: 768px) {
    .info-panel {
      top: auto;
      bottom: 200px;
      left: 8px; right: 8px;
      width: auto;
      transform: translateY(360px);
    }
    .info-panel.visible { transform: translateY(0); }
    .legend-panel { display: none; }
    .phase-bar {
      flex-wrap: nowrap;
      overflow-x: auto;
      max-width: calc(100% - 24px);
      -webkit-overflow-scrolling: touch;
    }
    .phase-btn { padding: 6px 10px; font-size: 11px; }
    .phase-btn .phase-num { display: none; }
    .floating-controls-left { bottom: 180px; left: 12px; }
    .floating-controls-right { bottom: 180px; right: 12px; }
    .icon-btn { width: 40px; height: 40px; }
    .speed-control { bottom: 180px; }
    .progress-bar { width: 240px; bottom: 160px; }
    .scene-hint { display: none; }
    .info-bar-title { display: none; }
  }
</style>
</head>

/* ============================================================
   全局变量
   ============================================================ */
let scene, camera, renderer, controls, clock;
let cellGroup;
let cellMembrane, nuclearEnvelope, nucleolus;
let centrosome1, centrosome2;
let chromosomePairs = [];
let spindleFibers = [];
let bgParticles;
let raycaster, pointer;

let currentPhase = 0;
let phaseProgress = 0;
let isPlaying = true;
let autoAdvance = true;
let speedMultiplier = 1.0;
let entranceProgress = 0;
let showInfo = false;

// 染色体配置（4对）
const CHROMOSOME_COUNT = 4;
const CELL_RADIUS = 5.0;
const NUCLEUS_RADIUS = 2.5;

/* ============================================================
   场景初始化
   ============================================================ */
function init() {
  const container = document.getElementById('canvasContainer');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f1115);
  scene.fog = new THREE.Fog(0x0f1115, 20, 50);

  camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 200);
  camera.position.set(0, 3, 16);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  container.appendChild(renderer.domElement);

  // 控制器
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 5;
  controls.maxDistance = 35;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.4;
  controls.target.set(0, 0, 0);

  clock = new THREE.Clock();
  raycaster = new THREE.Raycaster();
  pointer = new THREE.Vector2();

  // 光照
  setupLights();
  // 背景
  createBackgroundParticles();
  // 构建细胞
  buildCell();

  // 入场动画
  cellGroup.scale.setScalar(0.01);

  animate();

  // 隐藏加载层
  setTimeout(() => {
    document.getElementById('loadingOverlay').classList.add('hidden');
  }, 500);
}

/* ============================================================
   光照系统
   ============================================================ */
function setupLights() {
  scene.add(new THREE.AmbientLight(0x2a2d3a, 0.5));

  // 主光（暖色调，模拟聚光灯）
  const keyLight = new THREE.DirectionalLight(0xfff5e0, 0.6);
  keyLight.position.set(5, 10, 8);
  scene.add(keyLight);

  // 补光（冷色调）
  const fillLight = new THREE.DirectionalLight(0x4a6a9a, 0.25);
  fillLight.position.set(-8, -3, -5);
  scene.add(fillLight);

  // 中心点光源（琥珀色辉光）
  const centerLight = new THREE.PointLight(0xF59E0B, 0.6, 20);
  centerLight.position.set(0, 0, 0);
  scene.add(centerLight);

  // 边缘光
  const rimLight = new THREE.PointLight(0xD97706, 0.4, 25);
  rimLight.position.set(-5, 5, -5);
  scene.add(rimLight);

  // 半球光
  const hemi = new THREE.HemisphereLight(0x3a3520, 0x0a0a0e, 0.3);
  scene.add(hemi);
}

/* ============================================================
   背景粒子
   ============================================================ */
function createBackgroundParticles() {
  const count = 500;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const r = 20 + Math.random() * 30;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);

    // 暖色调粒子
    const hue = 0.08 + Math.random() * 0.05;
    const c = new THREE.Color().setHSL(hue, 0.4, 0.2 + Math.random() * 0.2);
    colors[i * 3] = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.1,
    vertexColors: true,
    transparent: true,
    opacity: 0.35,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });

  bgParticles = new THREE.Points(geo, mat);
  scene.add(bgParticles);
}

/* ============================================================
   构建细胞
   ============================================================ */
function buildCell() {
  cellGroup = new THREE.Group();
  scene.add(cellGroup);

  buildCellMembrane();
  buildNuclearEnvelope();
  buildNucleolus();
  buildCentrosomes();
  buildChromosomes();
  buildSpindleFibers();

  updatePhase(0, 0);
}

/* ============================================================
   细胞膜
   ============================================================ */
function buildCellMembrane() {
  const geo = new THREE.SphereGeometry(CELL_RADIUS, 48, 48);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x94A3B8,
    transparent: true,
    opacity: 0.08,
    roughness: 0.3,
    metalness: 0.0,
    side: THREE.DoubleSide,
    depthWrite: false,
  });
  cellMembrane = new THREE.Mesh(geo, mat);
  cellMembrane.userData.baseOpacity = 0.08;

  // 边缘发光层
  const glowGeo = new THREE.SphereGeometry(CELL_RADIUS * 1.03, 32, 32);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x64748B,
    transparent: true,
    opacity: 0.03,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  cellMembrane.add(glow);

  cellGroup.add(cellMembrane);
}

/* ============================================================
   核膜
   ============================================================ */
function buildNuclearEnvelope() {
  const geo = new THREE.SphereGeometry(NUCLEUS_RADIUS, 40, 40);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xC4B5FD,
    transparent: true,
    opacity: 0.12,
    roughness: 0.2,
    metalness: 0.0,
    side: THREE.DoubleSide,
    depthWrite: false,
  });
  nuclearEnvelope = new THREE.Mesh(geo, mat);
  nuclearEnvelope.userData.baseOpacity = 0.12;
  cellGroup.add(nuclearEnvelope);
}

/* ============================================================
   核仁
   ============================================================ */
function buildNucleolus() {
  const geo = new THREE.SphereGeometry(0.5, 16, 16);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xFCD34D,
    emissive: 0xFCD34D,
    emissiveIntensity: 0.2,
    transparent: true,
    opacity: 0.7,
    roughness: 0.4,
  });
  nucleolus = new THREE.Mesh(geo, mat);
  nucleolus.position.set(0.3, 0.2, -0.2);
  cellGroup.add(nucleolus);
}

/* ============================================================
   中心体
   ============================================================ */
function buildCentrosomes() {
  const geo = new THREE.SphereGeometry(0.25, 16, 16);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xD97706,
    emissive: 0xD97706,
    emissiveIntensity: 0.6,
    roughness: 0.3,
    metalness: 0.4,
  });

  centrosome1 = new THREE.Mesh(geo, mat);
  centrosome2 = new THREE.Mesh(geo.clone(), mat.clone());

  cellGroup.add(centrosome1, centrosome2);
}

/* ============================================================
   染色体（4对，每对两条染色单体）
   ============================================================ */
function buildChromosomes() {
  // 每条染色体由两条姐妹染色单体组成，在着丝粒处相连（X形）
  // 用两个交叉的胶囊体表示
  const chromatidGeo = new THREE.CapsuleGeometry(0.12, 0.8, 8, 12);

  for (let i = 0; i < CHROMOSOME_COUNT; i++) {
    const pair = createChromosomePair(i);
    chromosomePairs.push(pair);
    cellGroup.add(pair.group);
  }
}

function createChromosomePair(index) {
  const group = new THREE.Group();
  group.userData.index = index;

  // 染色体材质（琥珀金）
  const chromoMat = new THREE.MeshStandardMaterial({
    color: 0xF59E0B,
    emissive: 0xF59E0B,
    emissiveIntensity: 0.35,
    roughness: 0.35,
    metalness: 0.2,
    transparent: true,
    opacity: 0.9,
  });

  // 染色质材质（松散状态，更淡更小）
  const chromatinMat = new THREE.MeshStandardMaterial({
    color: 0xFCD34D,
    emissive: 0xFCD34D,
    emissiveIntensity: 0.15,
    roughness: 0.5,
    transparent: true,
    opacity: 0.5,
  });

  // 两条姐妹染色单体（X形排列）
  const chromatid1 = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.1, 0.7, 8, 12),
    chromoMat.clone()
  );
  chromatid1.rotation.z = Math.PI / 4;

  const chromatid2 = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.1, 0.7, 8, 12),
    chromoMat.clone()
  );
  chromatid2.rotation.z = -Math.PI / 4;

  // 着丝粒（连接点）
  const centromereGeo = new THREE.SphereGeometry(0.1, 12, 12);
  const centromereMat = new THREE.MeshStandardMaterial({
    color: 0xD97706,
    emissive: 0xD97706,
    emissiveIntensity: 0.5,
    roughness: 0.3,
  });
  const centromere = new THREE.Mesh(centromereGeo, centromereMat);

  // 染色质球团（间期状态的松散形式）
  const chromatinClump = new THREE.Group();
  for (let j = 0; j < 6; j++) {
    const blob = new THREE.Mesh(
      new THREE.SphereGeometry(0.12 + Math.random() * 0.08, 8, 8),
      chromatinMat.clone()
    );
    blob.position.set(
      (Math.random() - 0.5) * 0.6,
      (Math.random() - 0.5) * 0.6,
      (Math.random() - 0.5) * 0.6
    );
    blob.userData.basePos = blob.position.clone();
    blob.userData.phase = Math.random() * Math.PI * 2;
    chromatinClump.add(blob);
  }

  group.add(chromatid1, chromatid2, centromere, chromatinClump);
  group.userData.chromatid1 = chromatid1;
  group.userData.chromatid2 = chromatid2;
  group.userData.centromere = centromere;
  group.userData.chromatinClump = chromatinClump;
  group.userData.chromoMat = chromoMat;

  // 随机分布角度（用于间期核内分布）
  const angle = (index / CHROMOSOME_COUNT) * Math.PI * 2 + Math.random() * 0.5;
  const r = 0.8 + Math.random() * 0.8;
  group.userData.basePos = new THREE.Vector3(
    r * Math.cos(angle),
    (Math.random() - 0.5) * 1.2,
    r * Math.sin(angle)
  );

  return { group, index };
}

/* ============================================================
   纺锤丝
   ============================================================ */
function buildSpindleFibers() {
  // 从每个中心体到每条染色体的着丝粒
  for (let i = 0; i < CHROMOSOME_COUNT; i++) {
    // 从中心体1到染色体
    const fiber1 = createSpindleFiber();
    const fiber2 = createSpindleFiber();
    spindleFibers.push({ fiber: fiber1, pole: 1, chromoIdx: i });
    spindleFibers.push({ fiber: fiber2, pole: 2, chromoIdx: i });
    cellGroup.add(fiber1, fiber2);
  }

  // 两极之间的极间纺锤丝
  for (let i = 0; i < 3; i++) {
    const fiber = createSpindleFiber();
    fiber.userData.isPolar = true;
    spindleFibers.push({ fiber, pole: 0, chromoIdx: -1 });
    cellGroup.add(fiber);
  }
}

function createSpindleFiber() {
  const geo = new THREE.CylinderGeometry(0.02, 0.02, 1, 6);
  const mat = new THREE.MeshBasicMaterial({
    color: 0x64748B,
    transparent: true,
    opacity: 0,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  return new THREE.Mesh(geo, mat);
}

function updateSpindleFiber(fiber, start, end) {
  const dir = new THREE.Vector3().subVectors(end, start);
  const len = dir.length();
  if (len < 0.001) {
    fiber.visible = false;
    return;
  }
  fiber.visible = true;
  fiber.scale.y = len;
  fiber.position.copy(start).add(end).multiplyScalar(0.5);
  const up = new THREE.Vector3(0, 1, 0);
  const norm = dir.clone().normalize();
  if (norm.distanceTo(up) > 0.001) {
    fiber.quaternion.setFromUnitVectors(up, norm);
  }
}

/* ============================================================
   分期状态更新
   ============================================================ */
function updatePhase(phaseIdx, progress) {
  currentPhase = phaseIdx;
  phaseProgress = progress;

  const t = clock ? clock.getElapsedTime() : 0;

  // 更新 UI
  updatePhaseUI(phaseIdx);

  // 根据分期和进度更新细胞状态
  updateCellState(phaseIdx, progress, t);
}

function updateCellState(phase, p, t) {
  // p: 0→1 表示该分期内的进度

  // 基本参数
  let membraneScale = 1.0;
  let membranePinch = 0; // 胞质分裂时的收缩
  let nuclearOpacity = 0.12;
  let nuclearScale = 1.0;
  let nuclearPosY = 0;
  let nucleolusOpacity = 0.7;
  let centro1Pos = new THREE.Vector3(-1.5, 0, 0);
  let centro2Pos = new THREE.Vector3(1.5, 0, 0);
  let spindleOpacity = 0;
  let chromosomeCondense = 0; // 0=松散染色质, 1=凝聚染色体
  let chromosomePos = 'nucleus'; // 'nucleus', 'equator', 'poles'
  let chromosomeSplit = 0; // 0=未分裂, 1=完全分离
  let chromosomeDecondense = 0; // 末期解聚

  switch (phase) {
    case 0: // 间期
      chromosomeCondense = 0;
      chromosomePos = 'nucleus';
      nuclearOpacity = 0.12;
      nucleolusOpacity = 0.7;
      spindleOpacity = 0;
      centro1Pos.set(-1.2, 0.3, 0.3);
      centro2Pos.set(1.2, -0.3, -0.3);
      break;

    case 1: // 前期
      chromosomeCondense = p; // 逐渐凝聚
      chromosomePos = 'nucleus';
      nuclearOpacity = 0.12 * (1 - p * 0.8); // 核膜逐渐消失
      nucleolusOpacity = 0.7 * (1 - p); // 核仁消失
      spindleOpacity = p * 0.5; // 纺锤体开始形成
      // 中心体向两极移动
      const poleDist = 1.5 + p * 1.5;
      centro1Pos.set(-poleDist, 0, 0);
      centro2Pos.set(poleDist, 0, 0);
      break;

    case 2: // 中期
      chromosomeCondense = 1;
      chromosomePos = 'equator';
      nuclearOpacity = 0;
      nucleolusOpacity = 0;
      spindleOpacity = 0.6;
      centro1Pos.set(-3.5, 0, 0);
      centro2Pos.set(3.5, 0, 0);
      break;

    case 3: // 后期
      chromosomeCondense = 1;
      chromosomePos = 'poles';
      chromosomeSplit = p; // 逐渐分离
      nuclearOpacity = 0;
      nucleolusOpacity = 0;
      spindleOpacity = 0.6;
      centro1Pos.set(-3.5, 0, 0);
      centro2Pos.set(3.5, 0, 0);
      break;

    case 4: // 末期
      chromosomeCondense = 1 - p * 0.7; // 逐渐解聚
      chromosomeDecondense = p;
      chromosomePos = 'poles';
      chromosomeSplit = 1;
      nuclearOpacity = p * 0.12; // 核膜重建
      nuclearScale = 0.5 + p * 0.3;
      nucleolusOpacity = p * 0.7;
      spindleOpacity = 0.6 * (1 - p); // 纺锤体消失
      // 中心体回到较近位置
      const retreat = 3.5 - p * 1.5;
      centro1Pos.set(-retreat, 0, 0);
      centro2Pos.set(retreat, 0, 0);
      // 两个核分别位于两极附近
      nuclearPosY = 0;
      break;

    case 5: // 胞质分裂
      chromosomeCondense = 0.3 * (1 - p); // 完全解聚
      chromosomePos = 'poles';
      chromosomeSplit = 1;
      nuclearOpacity = 0.12;
      nuclearScale = 0.8;
      nucleolusOpacity = 0.7;
      spindleOpacity = 0;
      membranePinch = p; // 细胞膜内陷
      // 中心体回到正常位置
      const finalDist = 2.0 - p * 1.0;
      centro1Pos.set(-finalDist, 0, 0);
      centro2Pos.set(finalDist, 0, 0);
      break;
  }

  // 应用状态到 3D 对象
  applyCellState({
    membraneScale,
    membranePinch,
    nuclearOpacity,
    nuclearScale,
    nuclearPosY,
    nucleolusOpacity,
    centro1Pos,
    centro2Pos,
    spindleOpacity,
    chromosomeCondense,
    chromosomePos,
    chromosomeSplit,
    chromosomeDecondense,
    phase,
    p,
    t,
  });
}

function applyCellState(state) {
  const { membranePinch, nuclearOpacity, nuclearScale, nuclearPosY,
    nucleolusOpacity, centro1Pos, centro2Pos, spindleOpacity,
    chromosomeCondense, chromosomePos, chromosomeSplit, chromosomeDecondense,
    phase, p, t } = state;

  // 细胞膜（胞质分裂时变形）
  if (cellMembrane) {
    if (membranePinch > 0) {
      // 通过修改顶点位置实现收缩
      const positions = cellMembrane.geometry.attributes.position;
      const orig = cellMembrane.geometry.userData.origPositions;
      if (!orig) {
        cellMembrane.geometry.userData.origPositions = positions.array.slice();
      }
      const origArr = cellMembrane.geometry.userData.origPositions;
      const pinchAmount = membranePinch * 0.8;
      for (let i = 0; i < positions.count; i++) {
        const ox = origArr[i * 3];
        const oy = origArr[i * 3 + 1];
        const oz = origArr[i * 3 + 2];
        // 在赤道面（x≈0）处收缩
        const distFromEquator = Math.abs(ox);
        const pinchFactor = Math.exp(-distFromEquator * 2) * pinchAmount;
        positions.array[i * 3 + 1] = oy * (1 - pinchFactor);
        positions.array[i * 3 + 2] = oz * (1 - pinchFactor);
      }
      positions.needsUpdate = true;
      cellMembrane.geometry.computeVertexNormals();
    } else {
      const orig = cellMembrane.geometry.userData.origPositions;
      if (orig) {
        cellMembrane.geometry.attributes.position.array.set(orig);
        cellMembrane.geometry.attributes.position.needsUpdate = true;
        cellMembrane.geometry.computeVertexNormals();
      }
    }
  }

  // 核膜
  if (nuclearEnvelope) {
    nuclearEnvelope.material.opacity = nuclearOpacity;
    nuclearEnvelope.scale.setScalar(nuclearScale);
    // 末期有两个核，分别位于两极
    if (phase >= 4) {
      // 只显示一个（简化），位置偏移
      const offset = phase === 4 ? (1.5 * chromosomeSplit) : 1.5;
      nuclearEnvelope.position.x = -offset * 0.5;
    } else {
      nuclearEnvelope.position.x = 0;
    }
  }

  // 核仁
  if (nucleolus) {
    nucleolus.material.opacity = nucleolusOpacity;
    nucleolus.visible = nucleolusOpacity > 0.01;
  }

  // 中心体
  if (centrosome1) centrosome1.position.copy(centro1Pos);
  if (centrosome2) centrosome2.position.copy(centro2Pos);

  // 染色体
  chromosomePairs.forEach((pair, i) => {
    updateChromosomePair(pair, i, {
      condense: chromosomeCondense,
      pos: chromosomePos,
      split: chromosomeSplit,
      decondense: chromosomeDecondense,
      phase, p, t, index: i,
    });
  });

  // 纺锤丝
  spindleFibers.forEach(s => {
    s.fiber.material.opacity = spindleOpacity;
    if (spindleOpacity > 0.01) {
      if (s.pole === 0) {
        // 极间纺锤丝
        updateSpindleFiber(s.fiber, centro1Pos, centro2Pos);
      } else {
        // 从中心体到染色体
        const pole = s.pole === 1 ? centro1Pos : centro2Pos;
        const chromo = chromosomePairs[s.chromoIdx];
        if (chromo) {
          const targetPos = getChromosomeTargetPos(s.chromoIdx, chromosomePos, chromosomeSplit, s.pole, p);
          updateSpindleFiber(s.fiber, pole, targetPos);
        }
      }
    } else {
      s.fiber.visible = false;
    }
  });
}

function getChromosomeTargetPos(index, pos, split, pole, progress) {
  if (pos === 'nucleus') {
    return chromosomePairs[index].group.userData.basePos.clone();
  } else if (pos === 'equator') {
    // 赤道板上排列
    const angle = (index / CHROMOSOME_COUNT) * Math.PI * 2;
    const r = 0.5 + index * 0.2;
    return new THREE.Vector3(0, r * Math.cos(angle), r * Math.sin(angle));
  } else if (pos === 'poles') {
    // 分离后移向两极
    const angle = (index / CHROMOSOME_COUNT) * Math.PI * 2;
    const r = 0.5 + index * 0.2;
    const xOffset = (pole === 1 ? -1 : 1) * (1.5 + progress * 1.5);
    return new THREE.Vector3(xOffset, r * Math.cos(angle) * 0.7, r * Math.sin(angle) * 0.7);
  }
  return new THREE.Vector3(0, 0, 0);
}

function updateChromosomePair(pair, index, state) {
  const { condense, pos, split, decondense, phase, p, t } = state;
  const group = pair.group;
  const { chromatid1, chromatid2, centromere, chromatinClump, chromoMat } = group.userData;

  // 计算目标位置
  let targetPos;
  if (pos === 'nucleus') {
    targetPos = group.userData.basePos.clone();
    // 间期轻微浮动
    targetPos.y += Math.sin(t * 0.5 + index) * 0.1;
  } else if (pos === 'equator') {
    const angle = (index / CHROMOSOME_COUNT) * Math.PI * 2;
    const r = 0.5 + index * 0.2;
    targetPos = new THREE.Vector3(0, r * Math.cos(angle), r * Math.sin(angle));
  } else if (pos === 'poles') {
    const angle = (index / CHROMOSOME_COUNT) * Math.PI * 2;
    const r = 0.5 + index * 0.2;
    // 在后期，两条染色单体分别向两极移动
    if (split > 0) {
      // 染色单体1向左极
      chromatid1.userData.targetPos = new THREE.Vector3(
        -1.5 - p * 1.5,
        r * Math.cos(angle) * 0.7,
        r * Math.sin(angle) * 0.7
      );
      // 染色单体2向右极
      chromatid2.userData.targetPos = new THREE.Vector3(
        1.5 + p * 1.5,
        r * Math.cos(angle) * 0.7,
        r * Math.sin(angle) * 0.7
      );
      targetPos = new THREE.Vector3(0, r * Math.cos(angle), r * Math.sin(angle));
    } else {
      targetPos = new THREE.Vector3(0, r * Math.cos(angle), r * Math.sin(angle));
    }
  }

  // 平滑移动染色体组
  if (group.position.distanceTo(targetPos) > 0.01) {
    group.position.lerp(targetPos, 0.06);
  }

  // 凝聚度：控制染色质球团 vs 染色体的可见性和缩放
  const chromatinVisible = 1 - condense;
  const chromoVisible = condense;

  // 染色质球团
  chromatinClump.children.forEach(blob => {
    blob.material.opacity = 0.5 * chromatinVisible;
    // 染色质轻微浮动
    const bp = blob.userData.basePos;
    const ph = blob.userData.phase;
    blob.position.x = bp.x + Math.sin(t * 0.3 + ph) * 0.05;
    blob.position.y = bp.y + Math.cos(t * 0.4 + ph) * 0.05;
    blob.position.z = bp.z + Math.sin(t * 0.35 + ph * 1.3) * 0.05;
  });
  chromatinClump.scale.setScalar(0.8 + chromatinVisible * 0.4);

  // 染色体（凝聚状态）
  const chromoScale = 0.3 + condense * 0.7;
  chromatid1.scale.setScalar(chromoScale);
  chromatid2.scale.setScalar(chromoScale);
  centromere.scale.setScalar(chromoScale);

  // 染色体材质透明度
  const chromoOpacity = 0.9 * chromoVisible;
  chromatid1.material.opacity = chromoOpacity;
  chromatid2.material.opacity = chromoOpacity;
  centromere.material.opacity = chromoOpacity;

  // 后期：染色单体分离动画
  if (pos === 'poles' && split > 0) {
    const t1 = chromatid1.userData.targetPos;
    const t2 = chromatid2.userData.targetPos;
    if (t1 && t2) {
      // 计算相对于组位置的位置
      const localT1 = t1.clone().sub(targetPos);
      const localT2 = t2.clone().sub(targetPos);

      // 平滑移动到分离位置
      chromatid1.position.lerp(localT1, 0.08);
      chromatid2.position.lerp(localT2, 0.08);
      centromere.position.lerp(new THREE.Vector3(0, 0, 0), 0.08);

      // 着丝粒分裂后变暗
      centromere.material.opacity = chromoOpacity * (1 - split * 0.5);
    }
  } else {
    // 恢复到X形排列
    const restPos1 = new THREE.Vector3(0, 0, 0);
    const restPos2 = new THREE.Vector3(0, 0, 0);
    chromatid1.position.lerp(restPos1, 0.1);
    chromatid2.position.lerp(restPos2, 0.1);
    centromere.position.lerp(restPos1, 0.1);
  }

  // 末期解聚：缩小染色体，放大染色质
  if (decondense > 0) {
    const decondenseScale = 1 - decondense * 0.5;
    chromatid1.scale.multiplyScalar(decondenseScale);
    chromatid2.scale.multiplyScalar(decondenseScale);
    centromere.scale.multiplyScalar(decondenseScale);

    chromatinClump.scale.setScalar(0.8 + (1 - decondense * 0.3) * 0.4 + decondense * 0.3);
    chromatinClump.children.forEach(blob => {
      blob.material.opacity = 0.5 * (1 - condense) + decondense * 0.3;
    });
  }

  // 染色体微脉动（生命感）
  if (chromoVisible > 0.1) {
    const pulse = 1 + Math.sin(t * 1.5 + index * 0.8) * 0.03;
    const baseScale = chromatid1.scale.x;
    // 不直接修改scale，避免覆盖分离动画
  }
}

/* ============================================================
   动画循环
   ============================================================ */
function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  // 入场动画
  if (entranceProgress < 1) {
    entranceProgress = Math.min(1, entranceProgress + dt * 0.6);
    const eased = easeOutCubic(entranceProgress);
    cellGroup.scale.setScalar(eased);
  }

  // 自动推进分期
  if (isPlaying && autoAdvance && entranceProgress >= 1) {
    phaseProgress += dt * 0.15 * speedMultiplier;
    if (phaseProgress >= 1) {
      phaseProgress = 0;
      const nextPhase = (currentPhase + 1) % PHASES.length;
      updatePhase(nextPhase, 0);
    } else {
      updatePhase(currentPhase, phaseProgress);
    }
  } else if (!isPlaying) {
    // 暂停时仍更新动画细节（浮动等）
    updateCellState(currentPhase, phaseProgress, t);
  }

  // 更新进度条
  const totalProgress = (currentPhase + phaseProgress) / PHASES.length;
  document.getElementById('progressFill').style.width = (totalProgress * 100) + '%';

  // 背景粒子缓慢旋转
  if (bgParticles) {
    bgParticles.rotation.y = t * 0.01;
    bgParticles.rotation.x = t * 0.005;
  }

  // 中心体脉动
  if (centrosome1 && centrosome2) {
    const pulse = 1 + Math.sin(t * 2) * 0.08;
    centrosome1.scale.setScalar(pulse);
    centrosome2.scale.setScalar(pulse);

    // 中心体发光强度脉动
    const emissive = 0.5 + Math.sin(t * 2) * 0.15;
    centrosome1.material.emissiveIntensity = emissive;
    centrosome2.material.emissiveIntensity = emissive;
  }

  // 核仁在间期轻微旋转
  if (nucleolus && nucleolus.visible) {
    nucleolus.rotation.y += dt * 0.3;
  }

  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   工具函数
   ============================================================ */
function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

/* ============================================================
   UI 交互
   ============================================================ */
function updatePhaseUI(phaseIdx) {
  // 更新分期按钮
  document.querySelectorAll('.phase-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.phase) === phaseIdx);
  });

  // 更新状态标签
  const statusTag = document.getElementById('statusTag');
  statusTag.textContent = PHASES[phaseIdx].status;
  statusTag.classList.add('active');

  // 如果信息面板可见，更新内容
  if (showInfo) {
    showPhaseInfo(phaseIdx);
  }
}

function showPhaseInfo(phaseIdx) {
  const phase = PHASES[phaseIdx];
  document.getElementById('infoPhaseTag').textContent = `PHASE ${phaseIdx + 1}`;
  document.getElementById('infoName').textContent = phase.name;
  document.getElementById('infoNameEn').textContent = phase.nameEn;
  document.getElementById('infoDesc').textContent = phase.desc;
  document.getElementById('infoEvents').textContent = phase.events;
  document.getElementById('infoPanel').classList.add('visible');
  showInfo = true;
}

function hidePhaseInfo() {
  document.getElementById('infoPanel').classList.remove('visible');
  showInfo = false;
}

// 分期按钮
document.querySelectorAll('.phase-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const phase = parseInt(btn.dataset.phase);
    phaseProgress = 0;
    updatePhase(phase, 0);
  });
});

// 播放/暂停
const playPauseBtn = document.getElementById('playPauseBtn');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');

playPauseBtn.addEventListener('click', () => {
  isPlaying = !isPlaying;
  controls.autoRotate = isPlaying;
  playPauseBtn.classList.toggle('active', isPlaying);
  playIcon.style.display = isPlaying ? 'none' : 'block';
  pauseIcon.style.display = isPlaying ? 'block' : 'none';
});

// 速度控制
const speedBtn = document.getElementById('speedBtn');
const speedControl = document.getElementById('speedControl');
const speedSlider = document.getElementById('speedSlider');
const speedValue = document.getElementById('speedValue');

speedBtn.addEventListener('click', () => {
  speedControl.classList.toggle('visible');
  speedBtn.classList.toggle('active', speedControl.classList.contains('visible'));
});

speedSlider.addEventListener('input', (e) => {
  const val = parseInt(e.target.value);
  speedMultiplier = (val / 35);
  speedValue.textContent = speedMultiplier.toFixed(1) + 'x';
});

// 重置视角
document.getElementById('resetBtn').addEventListener('click', () => {
  const startPos = camera.position.clone();
  const endPos = new THREE.Vector3(0, 3, 16);
  const startTarget = controls.target.clone();
  const endTarget = new THREE.Vector3(0, 0, 0);
  const startTime = clock.getElapsedTime();

  function step() {
    const elapsed = clock.getElapsedTime() - startTime;
    const t = Math.min(elapsed / 1.0, 1);
    const eased = easeInOutCubic(t);
    camera.position.lerpVectors(startPos, endPos, eased);
    controls.target.lerpVectors(startTarget, endTarget, eased);
    controls.update();
    if (t < 1) requestAnimationFrame(step);
  }
  step();
});

// 信息面板
document.getElementById('infoBtn').addEventListener('click', () => {
  if (showInfo) {
    hidePhaseInfo();
    document.getElementById('infoBtn').classList.remove('active');
  } else {
    showPhaseInfo(currentPhase);
    document.getElementById('infoBtn').classList.add('active');
  }
});

document.getElementById('infoClose').addEventListener('click', () => {
  hidePhaseInfo();
  document.getElementById('infoBtn').classList.remove('active');
});

// 全屏
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case ' ':
      e.preventDefault();
      playPauseBtn.click();
      break;
    case 'f': case 'F':
      document.getElementById('fullscreenBtn').click();
      break;
    case 'i': case 'I':
      document.getElementById('infoBtn').click();
      break;
    case '1': case '2': case '3': case '4': case '5': case '6':
      const phase = parseInt(e.key) - 1;
      phaseProgress = 0;
      updatePhase(phase, 0);
      break;
    case 'ArrowRight':
      phaseProgress = 0;
      updatePhase((currentPhase + 1) % PHASES.length, 0);
      break;
    case 'ArrowLeft':
      phaseProgress = 0;
      updatePhase((currentPhase - 1 + PHASES.length) % PHASES.length, 0);
      break;
  }
});

// 窗口自适应
window.addEventListener('resize', () => {
  const container = document.getElementById('canvasContainer');
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

/* ============================================================
   启动
   ============================================================ */
init();
</script>
