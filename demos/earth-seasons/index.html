<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; padding: 0; overflow: hidden;
    background: #05050a; color: #e5e5e5;
    font-family: var(--font-sans);
    -webkit-tap-highlight-color: transparent;
  }

  /* ====== 加载层 ====== */
  #loading {
    position: fixed; inset: 0; z-index: 999;
    background: #05050a;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    transition: opacity 0.6s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .loading-ring {
    width: 48px; height: 48px;
    border: 2px solid rgba(255,193,7,0.15);
    border-top-color: #FFC107;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-family: var(--font-serif); font-size: 14px;
    color: rgba(255,255,255,0.5); letter-spacing: 0.1em;
  }

  /* ====== 3D 画布 ====== */
  #canvas-container { position: fixed; inset: 0; }
  #scene { display: block; width: 100%; height: 100%; }

  /* ====== 左侧信息面板 ====== */

    position: fixed; top: 72px; left: 20px; z-index: 50;
    width: 240px; padding: 16px 18px;
    background: rgba(8, 8, 16, 0.6);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius-card);
  }
  .info-date {
    font-family: var(--font-serif); font-size: 22px; font-weight: 700;
    color: #fff; margin-bottom: 2px;
  }
  .info-season-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .season-name {
    font-family: var(--font-serif); font-size: 16px; font-weight: 600;
    color: #FFC107;
  }
  .season-desc { font-size: 11px; color: #8a8a8a; line-height: 1.5; }
  .info-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 12px 0; }
  .info-section-title {
    font-size: 10px; font-weight: 600; color: #666;
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
  }
  .info-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0; font-size: 12px;
  }
  .info-label { color: #888; }
  .info-value {
    font-family: var(--font-mono); font-weight: 600;
    color: #e5e5e5; font-size: 12px;
  }
  .info-value.highlight { color: #FFC107; }

  /* ====== 弹出面板 ====== */
  .popup {
    position: fixed; top: 132px; right: 20px; z-index: 55;
    padding: 14px 16px; min-width: 180px;
    background: rgba(8, 8, 16, 0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-card);
    display: none;
  }
  .popup.show { display: block; animation: popIn 0.2s ease; }
  @keyframes popIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .popup-title {
    font-size: 11px; font-weight: 600; color: #666;
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px;
  }
  .toggle-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 0; cursor: pointer; font-size: 13px; color: #c5c5c5;
  }
  .toggle-item input[type="checkbox"] {
    accent-color: #FFC107; width: 15px; height: 15px; cursor: pointer;
  }
  .view-btn {
    display: block; width: 100%; text-align: left;
    padding: 8px 12px; margin-bottom: 4px;

  .view-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }

    cursor: pointer; color: #fff;

  #timeline {

</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   常量
   ============================================================ */
const SUN_RADIUS = 3;
const EARTH_RADIUS = 1.0;
const ORBIT_RADIUS = 14;
const CLOUD_RADIUS = 1.025;
const ATMOS_RADIUS = 1.15;

/* ============================================================
   状态
   ============================================================ */
let currentDay = 0;
let currentTilt = 23.5;
let isPlaying = true;
let speedIndex = 1;
const speeds = [
  { label: '暂停', value: 0 },
  { label: '1天/秒', value: 1 },
  { label: '3天/秒', value: 3 },
  { label: '7天/秒', value: 7 },
  { label: '14天/秒', value: 14 },
  { label: '30天/秒', value: 30 },
];
let viewMode = 'free';
let loadingProgress = 0;
let dayAnim = null;
let camAnim = null;

const auxVisible = { orbit: true, axis: true, tropics: true, rays: true, subsolar: true };

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const container = document.getElementById('canvas-container');
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05050a);

const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 500);
camera.position.set(0, 14, 30);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.85;
controls.minPolarAngle = Math.PI * 0.1;

/* ============================================================
   星空（自定义着色器 · 闪烁）
   ============================================================ */
// 球面随机星 + 银河带星
const sphereStars = 2400;
const milkyStars = 800;
const starCount = sphereStars + milkyStars;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(starCount * 3);
const starSize = new Float32Array(starCount);
const starPhase = new Float32Array(starCount);
const starColor = new Float32Array(starCount * 3);

// 球面均匀分布星
for (let i = 0; i < sphereStars; i++) {
  const r = 100 + Math.random() * 80;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  starPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  starPos[i*3+2] = r * Math.cos(phi);
  starSize[i] = Math.random() * 1.5 + 0.3;
  starPhase[i] = Math.random() * Math.PI * 2;
  const tint = Math.random();
  if (tint < 0.7) { starColor[i*3]=1; starColor[i*3+1]=1; starColor[i*3+2]=0.95; }
  else if (tint < 0.85) { starColor[i*3]=1; starColor[i*3+1]=0.92; starColor[i*3+2]=0.75; }
  else { starColor[i*3]=0.8; starColor[i*3+1]=0.85; starColor[i*3+2]=1; }
}

// 银河带：沿倾斜平面集中分布，密度向中心递增
const mwTilt = 0.52; // ~30° 倾斜
const cosT = Math.cos(mwTilt), sinT = Math.sin(mwTilt);
for (let i = sphereStars; i < starCount; i++) {
  const r = 100 + Math.random() * 70;
  const theta = Math.random() * Math.PI * 2;
  // 高斯分布形成中间密两侧疏的带状
  const u = Math.random(), v = Math.random();
  const bandOff = (u + v - 1) * 0.42; // 中心聚集
  const phi = Math.PI / 2 + bandOff;
  let x = r * Math.sin(phi) * Math.cos(theta);
  let y = r * Math.sin(phi) * Math.sin(theta);
  let z = r * Math.cos(phi);
  // 倾斜旋转
  const yN = y * cosT - z * sinT;
  const zN = y * sinT + z * cosT;
  starPos[i*3] = x;
  starPos[i*3+1] = yN;
  starPos[i*3+2] = zN;
  starSize[i] = Math.random() * 1.1 + 0.2;
  starPhase[i] = Math.random() * Math.PI * 2;
  // 银河偏暖白与淡蓝
  const tint = Math.random();
  if (tint < 0.35) { starColor[i*3]=0.88; starColor[i*3+1]=0.93; starColor[i*3+2]=1; }
  else if (tint < 0.65) { starColor[i*3]=1; starColor[i*3+1]=0.94; starColor[i*3+2]=0.82; }
  else { starColor[i*3]=1; starColor[i*3+1]=0.85; starColor[i*3+2]=0.65; }
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('aSize', new THREE.BufferAttribute(starSize, 1));
starGeo.setAttribute('aPhase', new THREE.BufferAttribute(starPhase, 1));
starGeo.setAttribute('aColor', new THREE.BufferAttribute(starColor, 3));

const starMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute float aSize;
    attribute float aPhase;
    attribute vec3 aColor;
    varying float vAlpha;
    varying vec3 vColor;
    uniform float uTime;
    void main() {
      vColor = aColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = aSize * (320.0 / -mv.z);
      vAlpha = 0.35 + 0.65 * (0.5 + 0.5 * sin(uTime * 1.5 + aPhase));
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    varying vec3 vColor;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float a = (1.0 - d * 2.0) * vAlpha;
      gl_FragColor = vec4(vColor, a);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});

function spawnMeteor(m) {
  const r = 120;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  m.pos.set(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.sin(phi) * Math.sin(theta),
    r * Math.cos(phi)
  );
  const dir = new THREE.Vector3(
    Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5
  ).normalize();
  m.vel.copy(dir).multiplyScalar(28 + Math.random() * 18);
  m.life = 0;
  m.maxLife = 0.7 + Math.random() * 0.5;
  m.active = true;
}
function updateMeteors(delta) {
  meteorPool.forEach(m => {
    if (!m.active) {
      m.delay -= delta;
      if (m.delay <= 0) { spawnMeteor(m); m.delay = Math.random() * 10 + 5; }
      return;
    }
    m.life += delta;
    if (m.life >= m.maxLife) { m.active = false; m.mat.opacity = 0; return; }
    const prev = m.pos.clone();
    m.pos.addScaledVector(m.vel, delta);
    m.pts[0].copy(m.pos);
    m.pts[1].copy(prev);
    m.line.geometry.setFromPoints(m.pts);
    m.mat.opacity = Math.sin((m.life / m.maxLife) * Math.PI) * 0.75;
  });
}

const sunDirectionUniform = { value: new THREE.Vector3(-1, 0, 0) };

const earthVS = `
  varying vec2 vUv;
  varying vec3 vWorldNormal;
  varying vec3 vWorldPos;
  void main() {
    vUv = uv;
    vWorldNormal = normalize(mat3(modelMatrix) * normal);
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorldPos = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const earthFS = `
  uniform sampler2D dayTexture;
  uniform vec3 sunDirection;
  varying vec2 vUv;
  varying vec3 vWorldNormal;
  varying vec3 vWorldPos;
  void main() {
    vec3 normal = normalize(vWorldNormal);
    vec3 sunDir = normalize(sunDirection);
    float sunDot = dot(normal, sunDir);
    vec3 dayColor = texture2D(dayTexture, vUv).rgb;
    // 夜半球
    vec3 nightColor = dayColor * 0.06 + vec3(0.003, 0.006, 0.012);
    // 昼夜过渡
    float dayFactor = smoothstep(-0.18, 0.18, sunDot);
    vec3 color = mix(nightColor, dayColor, dayFactor);
    // 晨昏线金色辉光
    float term = 1.0 - clamp(abs(sunDot) / 0.22, 0.0, 1.0);
    color += vec3(1.0, 0.65, 0.25) * term * 0.28;
    // 视线方向
    vec3 viewDir = normalize(cameraPosition - vWorldPos);
    // 海洋镜面反射（太阳在海面的闪烁）
    vec3 halfVec = normalize(sunDir + viewDir);
    float spec = pow(max(0.0, dot(normal, halfVec)), 48.0);
    float oceanMask = smoothstep(0.18, 0.38, dayColor.b - dayColor.r);
    color += vec3(1.0, 0.95, 0.82) * spec * oceanMask * dayFactor * 0.7;
    // 大气边缘辉光
    float rim = 1.0 - max(0.0, dot(normal, viewDir));
    color += vec3(0.2, 0.45, 0.9) * pow(rim, 2.5) * 0.35;
    gl_FragColor = vec4(color, 1.0);
  }
`;

  while (tropicGroup.children.length > 0) {
    const c = tropicGroup.children[0];
    tropicGroup.remove(c);
    c.geometry?.dispose();
    c.material?.dispose();
  }
  const lats = [
    { lat: tilt, op: 0.5 },
    { lat: -tilt, op: 0.5 },
    { lat: 90 - tilt, op: 0.35 },
    { lat: -(90 - tilt), op: 0.35 },
  ];
  lats.forEach(({ lat, op }) => {
    const lr = lat * Math.PI / 180;
    const r = EARTH_RADIUS * Math.cos(lr) * 1.004;
    const y = EARTH_RADIUS * Math.sin(lr);
    const pts = [];

      pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));

      dashSize: 0.06, gapSize: 0.04,

/* ============================================================
   日期/节气/天文计算
   ============================================================ */
function dayToDate(day) {
  const base = new Date(2024, 2, 21);
  base.setDate(base.getDate() + Math.round(day));
  return `${base.getMonth() + 1}月${base.getDate()}日`;
}

function getDeclination(day, tilt) {
  const theta = (day / 365) * Math.PI * 2;
  const tRad = tilt * Math.PI / 180;
  return Math.asin(Math.sin(tRad) * Math.sin(theta)) * 180 / Math.PI;
}

function getDayLength(lat, dec) {
  const lr = lat * Math.PI / 180;
  const dr = dec * Math.PI / 180;
  const cosH = -Math.tan(lr) * Math.tan(dr);
  if (cosH > 1) return 0;
  if (cosH < -1) return 24;
  return 2 * Math.acos(cosH) * 180 / Math.PI / 15;
}

function fmtDayLen(h) {
  const hh = Math.floor(h);
  const mm = Math.round((h - hh) * 60);
  return `${hh}时${mm.toString().padStart(2, '0')}分`;
}

function fmtLat(d) {
  const abs = Math.abs(d).toFixed(1);
  return `${abs}°${d >= 0 ? 'N' : 'S'}`;
}

function getSeasonInfo(day) {
  const tol = 3;
  if (day < tol || day > 365 - tol) return { name: '春分', desc: '太阳直射赤道，全球昼夜平分' };
  if (Math.abs(day - 92) < tol) return { name: '夏至', desc: '太阳直射北回归线，北半球昼最长' };
  if (Math.abs(day - 186) < tol) return { name: '秋分', desc: '太阳直射赤道，全球昼夜平分' };
  if (Math.abs(day - 276) < tol) return { name: '冬至', desc: '太阳直射南回归线，北半球昼最短' };
  if (day < 92) return { name: '春季', desc: '太阳直射点从赤道向北回归线移动' };
  if (day < 186) return { name: '夏季', desc: '太阳直射点在北半球，北半球受热多' };
  if (day < 276) return { name: '秋季', desc: '太阳直射点从北回归线向赤道移动' };
  return { name: '冬季', desc: '太阳直射点在南半球，北半球受热少' };
}

function checkSeasonBtn(day) {
  const tol = 3;
  document.querySelectorAll('.season-btn').forEach(btn => {
    const target = parseFloat(btn.dataset.day);
    let near = Math.abs(day - target) < tol;
    if (target === 0 && day > 365 - tol) near = true;
    btn.classList.toggle('active', near);
  });
}

function updateScene() {
  const theta = (currentDay / 365) * Math.PI * 2;
  const tiltRad = currentTilt * Math.PI / 180;

  // 地球公转位置
  const ex = Math.cos(theta) * ORBIT_RADIUS;
  const ez = Math.sin(theta) * ORBIT_RADIUS;
  earthGroup.position.set(ex, 0, ez);

  // 太阳方向（世界空间，从地球指向太阳）
  const sunDir = new THREE.Vector3(-Math.cos(theta), 0, -Math.sin(theta));
  sunDirectionUniform.value.copy(sunDir);

  // 地球自转（独立速度，便于观察昼夜交替）
  if (isPlaying && !dayAnim) {
    earthMesh.rotation.y += 0.012;
    cloudMesh.rotation.y += 0.009;
  }

  // 直射点位置（在倾斜组的局部空间中）
  // 将世界太阳方向变换到倾斜组局部空间（逆倾角旋转）
  const localSunDir = new THREE.Vector3(
    -Math.cos(theta),
    Math.sin(theta) * Math.sin(tiltRad),
    -Math.sin(theta) * Math.cos(tiltRad)
  ).normalize();
  subsolarMarker.position.copy(localSunDir.clone().multiplyScalar(EARTH_RADIUS * 1.04));
  subsolarGlow.position.copy(localSunDir.clone().multiplyScalar(EARTH_RADIUS * 1.04));

  // 太阳光线
  sunRaysGroup.position.copy(earthGroup.position);
  const xAxis = new THREE.Vector3(1, 0, 0);
  sunRaysGroup.quaternion.setFromUnitVectors(xAxis, sunDir);

  // 信息面板
  const dec = getDeclination(currentDay, currentTilt);
  const season = getSeasonInfo(currentDay);
  document.getElementById('infoDate').textContent = dayToDate(currentDay);
  document.getElementById('seasonName').textContent = season.name;
  document.getElementById('seasonDesc').textContent = season.desc;
  document.getElementById('subsolarLat').textContent = fmtLat(dec);
  document.getElementById('dayLen235N').textContent = fmtDayLen(getDayLength(23.5, dec));
  document.getElementById('dayLen40N').textContent = fmtDayLen(getDayLength(40, dec));
  document.getElementById('dayLen0').textContent = fmtDayLen(getDayLength(0, dec));
  document.getElementById('dayLen235S').textContent = fmtDayLen(getDayLength(-23.5, dec));

  // 时间轴
  if (!isDraggingTimeline) {
    document.getElementById('timeline').value = currentDay;
  }
  checkSeasonBtn(currentDay);
}

/* ============================================================
   动画循环
   ============================================================ */
const clock = new THREE.Clock();
let isDraggingTimeline = false;

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 加载动画
  if (loadingProgress < 1) {
    loadingProgress += delta / 2.0;
    loadingProgress = Math.min(loadingProgress, 1);
    if (loadingProgress > 0.15) {
      const p = Math.min((loadingProgress - 0.15) / 0.35, 1);
      sunGroup.scale.setScalar(p);
    }
    if (loadingProgress > 0.45) {
      const p = Math.min((loadingProgress - 0.45) / 0.35, 1);
      earthGroup.scale.setScalar(p);
    }
    if (loadingProgress > 0.85) {
      document.getElementById('loading').style.opacity = 1 - (loadingProgress - 0.85) / 0.15;
    }
    if (loadingProgress >= 1) {
      document.getElementById('loading').classList.add('hidden');
    }
  }

  // 日历动画（四季按钮跳转）
  if (dayAnim) {
    const elapsed = performance.now() - dayAnim.start;
    const k = Math.min(elapsed / dayAnim.duration, 1);
    const eased = 1 - Math.pow(1 - k, 3);
    let d = dayAnim.from + (dayAnim.to - dayAnim.from) * eased;
    d = ((d % 365) + 365) % 365;
    currentDay = d;
    if (k >= 1) {
      dayAnim = null;
      if (speeds[speedIndex].value > 0) isPlaying = true;
    }
  } else if (isPlaying && speeds[speedIndex].value > 0) {
    currentDay += speeds[speedIndex].value * delta;
    if (currentDay >= 365) currentDay -= 365;
  }

  // 星空闪烁
  starMat.uniforms.uTime.value = t;

  // 太阳脉动
  const pulse = 1 + Math.sin(t * 1.8) * 0.015;
  sun.scale.setScalar(pulse);
  corona.material.rotation = t * 0.05;

  // 星空缓慢旋转 + 流星更新
  starField.rotation.y += 0.00008;
  updateMeteors(delta);

  // 视角动画
  if (camAnim) {
    const k = Math.min((performance.now() - camAnim.start) / camAnim.duration, 1);
    const eased = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, eased);
    const look = new THREE.Vector3().lerpVectors(camAnim.fromLook, camAnim.toLook, eased);
    camera.lookAt(look);
    controls.target.copy(look);
    if (k >= 1) camAnim = null;
  } else if (viewMode === 'follow') {
    const ep = earthGroup.position;
    const targetPos = new THREE.Vector3(ep.x * 0.6, 3, ep.z * 0.6 + 5);
    camera.position.lerp(targetPos, 0.06);
    camera.lookAt(ep);
    controls.target.copy(ep);
  }

  updateScene();
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============================================================
   UI 交互
   ============================================================ */

// 播放/暂停
const playBtn = document.getElementById('playBtn');
const iconPlay = document.getElementById('iconPlay');
const iconPause = document.getElementById('iconPause');
playBtn.addEventListener('click', () => {
  isPlaying = !isPlaying;
  iconPlay.style.display = isPlaying ? 'none' : 'block';
  iconPause.style.display = isPlaying ? 'block' : 'none';
});

// 速度切换
const speedBtn = document.getElementById('speedBtn');
speedBtn.addEventListener('click', () => {
  speedIndex = (speedIndex + 1) % speeds.length;
  speedBtn.textContent = speeds[speedIndex].label;
  if (speeds[speedIndex].value === 0) {
    isPlaying = false;
    iconPlay.style.display = 'block';
    iconPause.style.display = 'none';
  } else {
    isPlaying = true;
    iconPlay.style.display = 'none';
    iconPause.style.display = 'block';
  }
});

// 时间轴
const timeline = document.getElementById('timeline');
timeline.addEventListener('input', () => {
  isDraggingTimeline = true;
  currentDay = parseFloat(timeline.value);
  if (isPlaying) {
    isPlaying = false;
    iconPlay.style.display = 'block';
    iconPause.style.display = 'none';
  }
});
timeline.addEventListener('change', () => { isDraggingTimeline = false; });
timeline.addEventListener('mouseup', () => { isDraggingTimeline = false; });
timeline.addEventListener('touchend', () => { isDraggingTimeline = false; });

// 四季按钮
function goToDay(target) {
  let diff = target - currentDay;
  if (diff < -182.5) diff += 365;
  if (diff > 182.5) diff -= 365;
  dayAnim = {
    from: currentDay,
    to: currentDay + diff,
    start: performance.now(),
    duration: 700,
  };
  isPlaying = false;
  iconPlay.style.display = 'block';
  iconPause.style.display = 'none';
}
document.querySelectorAll('.season-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    goToDay(parseFloat(btn.dataset.day));
  });
});

// 弹出面板切换
const btnView = document.getElementById('btnView');
const btnAux = document.getElementById('btnAux');
const viewPopup = document.getElementById('viewPopup');
const auxPopup = document.getElementById('auxPopup');
btnView.addEventListener('click', (e) => {
  e.stopPropagation();
  viewPopup.classList.toggle('show');
  auxPopup.classList.remove('show');
});
btnAux.addEventListener('click', (e) => {
  e.stopPropagation();
  auxPopup.classList.toggle('show');
  viewPopup.classList.remove('show');
});
document.addEventListener('click', () => {
  viewPopup.classList.remove('show');
  auxPopup.classList.remove('show');
});
viewPopup.addEventListener('click', e => e.stopPropagation());
auxPopup.addEventListener('click', e => e.stopPropagation());

// 视角切换
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    viewMode = btn.dataset.view;
    if (viewMode === 'free') {
      controls.enabled = true;
    } else {
      controls.enabled = false;
    }
    if (viewMode !== 'follow') {
      let tp, tl;
      if (viewMode === 'top') { tp = new THREE.Vector3(0, 50, 0.01); tl = new THREE.Vector3(0,0,0); }
      else if (viewMode === 'side') { tp = new THREE.Vector3(0, 2, 32); tl = new THREE.Vector3(0,0,0); }
      else { tp = camera.position.clone(); tl = controls.target.clone(); }
      camAnim = {
        fromPos: camera.position.clone(),
        toPos: tp,
        fromLook: controls.target.clone(),
        toLook: tl,
        start: performance.now(),
        duration: 800,
      };
    }
  });
});

// 辅助线开关
function bindToggle(id, obj) {
  document.getElementById(id).addEventListener('change', e => {
    auxVisible[obj] = e.target.checked;
    applyAuxVisibility();
  });
}
bindToggle('tglOrbit', 'orbit');
bindToggle('tglAxis', 'axis');
bindToggle('tglTropics', 'tropics');
bindToggle('tglRays', 'rays');
bindToggle('tglSubsolar', 'subsolar');

function applyAuxVisibility() {
  orbitLine.visible = auxVisible.orbit;
  seasonMarkers.forEach(m => m.visible = auxVisible.orbit);
  axisGroup.visible = auxVisible.axis;
  tropicGroup.visible = auxVisible.tropics;
  sunRaysGroup.visible = auxVisible.rays;
  subsolarMarker.visible = auxVisible.subsolar;
  subsolarGlow.visible = auxVisible.subsolar;
}

// 倾角滑块
const tiltSlider = document.getElementById('tiltSlider');
const tiltValue = document.getElementById('tiltValue');
tiltSlider.addEventListener('input', () => {
  currentTilt = parseFloat(tiltSlider.value);
  tiltValue.textContent = currentTilt.toFixed(1) + '°';
  earthTiltGroup.rotation.x = -currentTilt * Math.PI / 180;
  rebuildTropicLines(currentTilt);
  applyAuxVisibility();
});

// 全屏
document.getElementById('btnFullscreen').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

/* ============================================================
   响应式
   ============================================================ */
function onResize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// 初始更新
updateScene();
applyAuxVisibility();
</script>
