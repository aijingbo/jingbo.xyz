    .navbar-brand .brand-domain {

      font-weight: 500;
      color: var(--text-faint);
      letter-spacing: 0.03em;
      margin-top: 2px;
    }
    .navbar-links a {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);

    .navbar-links a:hover { color: var(--text); }
    .navbar-links a.active {

    .nav-search input {

      color: var(--text);
      background-color: var(--surface);

      color: var(--text-faint);

      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 12px;
      padding-left: 12px;

    .sidebar-list { list-style: none; padding: 0; margin: 0; }

      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: var(--radius);
      transition: all var(--duration-fast) var(--ease);
      position: relative;
      user-select: none;

    .sidebar-item:hover { color: var(--text); background-color: var(--surface-muted); }
    .sidebar-item.active { color: var(--brand); background-color: var(--brand-soft); }

      background: var(--brand);
      border-radius: 2px;
    }
    .sidebar-item .count {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-faint);
    }

      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background-color: var(--surface-muted);
      border: 1px solid transparent;
      border-radius: var(--radius-full);

      to { opacity: 1; transform: translateY(0); }

      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      background: #0a0a14;

      height: 100%;

      bottom: 10px;
      right: 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.1em;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;

      justify-content: space-between;
      margin-bottom: 4px;

      font-weight: 600;
      color: var(--brand);

      align-items: center;
      justify-content: flex-end;
      margin-top: 12px;

      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      color: var(--brand);

      align-items: center;

      border-radius: var(--radius-full);

    .skill-card:hover .card-link {
      background-color: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    .empty-state {
      text-align: center;
      padding: 80px 24px;
    }
    .empty-state svg {
      width: 48px; height: 48px;
      margin-bottom: 16px;
      opacity: 0.3;
      color: var(--text-muted);

    .empty-state p { font-size: 15px; color: var(--text-muted); }

      border-radius: 50%;
      margin: 0 6px 2px;

    .footer-meta {
      font-size: 12px;
      color: var(--text-faint);
      letter-spacing: 0.04em;

        padding-right: 0;
        padding-bottom: 20px;

      .skills-main { padding-left: 0; }
      .sidebar-list { display: flex; flex-wrap: wrap; gap: 4px; }
      .sidebar-item { padding: 6px 12px; font-size: 14px; }
      .sidebar-item.active::before { display: none; }
      .sidebar-title { padding-left: 0; }
      .type-filter { padding-left: 0; }
      .card-preview { width: 280px; }
    }
    @media (max-width: 600px) {
      .nav-search input { width: 130px; padding: 6px 12px 6px 32px; font-size: 12px; }
      .nav-search input:focus { width: 150px; }
      .nav-search > svg { left: 10px; width: 14px; height: 14px; }
      .navbar-links { display: none; }
      .page-head { padding-top: 90px; }
      .skill-card { flex-direction: column; min-height: auto; }
      .card-preview { width: 100%; height: 180px; }
      .card-body { padding: 16px 18px; }
      .card-desc { -webkit-line-clamp: 3; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
      .skill-card { animation: none !important; }
    }
  </style>
</head>

      { key: 'all',     name: '全部' },

      { key: 'chem',    name: '化学' },
      { key: 'bio',     name: '生物' },
      { key: 'history', name: '历史' },
      { key: 'geo',     name: '地理' },
      { key: 'cs',      name: '计算机' },
      { key: 'art',     name: '艺术' }
    ];

    // ====== 类型配置 ======
    const types = [
      { key: 'all',       name: '全部' },
      { key: 'immersive', name: '沉浸式' },
      { key: 'lecture',   name: '杂志讲解' },
      { key: 'tool',      name: '交互工具' },
      { key: 'narrative', name: '时空叙事' }
    ];

    // ====== 状态 ======
    let currentSubject = 'all';
    let currentType = 'all';
    let searchTerm = '';

    // ====== 工具函数 ======
    function getSubjectCount(key) {
      if (key === 'all') return skills.length;
      return skills.filter(s => s.subjects.includes(key)).length;
    }
    function getTypeCount(key) {
      if (key === 'all') return skills.length;
      return skills.filter(s => s.type === key).length;
    }

    // ====== 渲染：学科列表 ======
    function renderSubjects() {
      const list = document.getElementById('subjectList');
      list.innerHTML = subjects.map(s => `
        <li class="sidebar-item ${s.key === currentSubject ? 'active' : ''}" data-subject="${s.key}">
          <span>${s.name}</span>
          <span class="count">${getSubjectCount(s.key)}</span>
        </li>
      `).join('');
      list.querySelectorAll('.sidebar-item').forEach(el => {
        el.addEventListener('click', () => {
          currentSubject = el.dataset.subject;
          renderSubjects();
          renderSkills();
        });
      });
    }

    // ====== 渲染：类型筛选 ======
    function renderTypes() {
      const filter = document.getElementById('typeFilter');
      filter.innerHTML = types.map(t => `
        <span class="type-chip ${t.key === currentType ? 'active' : ''}" data-type="${t.key}">
          ${t.name}<span class="count">${getTypeCount(t.key)}</span>
        </span>
      `).join('');
      filter.querySelectorAll('.type-chip').forEach(el => {
        el.addEventListener('click', () => {
          currentType = el.dataset.type;
          renderTypes();
          renderSkills();
        });
      });
    }

    // ====== 渲染：Skill 卡片 ======
    function renderSkills() {
      const grid = document.getElementById('skillGrid');
      const titleEl = document.getElementById('resultTitle');
      const countEl = document.getElementById('resultCount');

      let filtered = skills.filter(s => {
        if (currentSubject !== 'all' && !s.subjects.includes(currentSubject)) return false;
        if (currentType !== 'all' && s.type !== currentType) return false;
        if (searchTerm) {
          const q = searchTerm.toLowerCase();
          if (!s.name.toLowerCase().includes(q) && !s.desc.toLowerCase().includes(q) && !s.subjectNames.toLowerCase().includes(q)) return false;
        }
        return true;
      });

      const subjConfig = subjects.find(s => s.key === currentSubject);
      const subjectLabel = currentSubject === 'all' ? '全部' : (subjConfig ? subjConfig.name : '');
      const typeConfig = types.find(t => t.key === currentType);
      const typeLabel = currentType === 'all' ? '' : ' · ' + (typeConfig ? typeConfig.name : '');
      titleEl.textContent = subjectLabel + typeLabel;
      countEl.textContent = filtered.length + ' 个技能';

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <p>没有找到匹配的技能，换个关键词试试？</p>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map((s, i) => `
        <a href="${s.showcaseUrl}" class="skill-card" style="animation-delay:${i * 50}ms">
          <div class="card-preview">
            <img src="assets/img/skill-previews/${s.id}.jpg" alt="${s.name}" loading="lazy">
            <span class="card-type-badge">${s.typeName}</span>
            <span class="card-number">${String(i+1).padStart(2,'0')}</span>
          </div>
          <div class="card-body">
            <div class="card-header">
              <span class="card-subject-label">${s.subjectNames}</span>
              <span class="demo-count">${s.demoCount} 个案例</span>
            </div>
            <div>
              <h3 class="card-name">${s.name}</h3>
              <p class="card-desc">${s.desc}</p>
            </div>
            <div class="card-footer">
              <span class="card-link">
                获取技能
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </span>
            </div>
          </div>
        </a>
      `).join('');
    }

    // ====== 搜索 ======
    const searchInput = document.getElementById('searchInput');
    let searchTimer = null;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchTerm = e.target.value.trim();
        renderSkills();
      }, 150);
    });

    // ====== Navbar 滚动 ======
    const navbar = document.getElementById('navbar');
    const onScroll = () => navbar.classList.toggle('scrolled', window.scrollY > 24);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    // ====== 初始化 ======
    renderSubjects();
    renderTypes();
    renderSkills();
  </script>
