const state = {

  skill: 'all',
  search: '',

};

// ========== 工具函数 ==========
function getFilteredDemos() {
  return demos.filter(d => {
    if (state.status !== 'all' && d.status !== state.status) return false;
    if (state.subject !== 'all' && d.subject !== state.subject) return false;
    if (state.type !== 'all' && d.type !== state.type) return false;
    if (state.skill !== 'all' && d.skill !== state.skill) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      return d.name.toLowerCase().includes(q) ||
             d.id.toLowerCase().includes(q) ||
             d.skill.toLowerCase().includes(q) ||
             d.skillName.toLowerCase().includes(q) ||
             d.subjectName.toLowerCase().includes(q);
    }
    return true;
  });
}

function countBy(key, value) {
  return demos.filter(d => d[key] === value).length;
}

// ========== 渲染统计栏 ==========
function renderStats() {
  const total = demos.length;
  const good = countBy('status', 'good');
  const minor = countBy('status', 'minor');
  const critical = countBy('status', 'critical');
  const redo = countBy('status', 'redo');
  const unchecked = countBy('status', 'unchecked');
  const pending = countBy('status', 'pending');
  const checked = good + minor + critical + redo;
  const checkProgress = Math.round((checked / total) * 100);

  const immersiveCount = countBy('type', 'immersive');
  const magazineCount = countBy('type', 'magazine');
  const toolCount = countBy('type', 'tool');
  const timelineCount = countBy('type', 'timeline');

  const statsBar = document.getElementById('statsBar');
  statsBar.innerHTML = `
    <div class="stat-card">
      <span class="stat-label">Demo 总数</span>
      <span class="stat-value">${total}</span>
      <span class="stat-sub">已检查 ${checked} / ${checkProgress}%</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">完好</span>
      <span class="stat-value good">${good}</span>
      <span class="stat-sub">${Math.round(good/total*100)}% 通过率</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">有小问题</span>
      <span class="stat-value minor">${minor}</span>
      <span class="stat-sub">需微调优化</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">严重问题</span>
      <span class="stat-value critical">${critical + redo}</span>
      <span class="stat-sub">严重${critical} · 重做${redo}</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">待检查</span>
      <span class="stat-value pending">${unchecked + pending}</span>
      <span class="stat-sub">待检${unchecked} · 未开始${pending}</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">框架类型</span>
      <span class="stat-value" style="font-size:14px; font-weight:500">沉浸${immersiveCount} · 杂志${magazineCount} · 工具${toolCount} · 时空${timelineCount}</span>
      <span class="stat-sub">共 4 种框架</span>
    </div>
  `;

  // 更新筛选计数
  document.getElementById('count-all').textContent = total;
  document.getElementById('count-good').textContent = good;
  document.getElementById('count-minor').textContent = minor;
  document.getElementById('count-critical').textContent = critical;
  document.getElementById('count-redo').textContent = redo;
  document.getElementById('count-unchecked').textContent = unchecked + pending;
}

// ========== 渲染学科筛选 ==========
function renderSubjectFilter() {
  const subjectFilter = document.getElementById('subjectFilter');
  const subjects = {};
  demos.forEach(d => {
    subjects[d.subject] = subjects[d.subject] || { name: d.subjectName, count: 0 };
    subjects[d.subject].count++;
  });

  let html = `
    <div class="filter-item ${state.subject === 'all' ? 'active' : ''}" data-filter="subject" data-value="all">
      <div class="filter-item-left">全部学科</div>
      <span class="filter-item-count">${demos.length}</span>
    </div>
  `;

  Object.entries(subjects)
    .sort((a, b) => b[1].count - a[1].count)
    .forEach(([key, val]) => {
      html += `
        <div class="filter-item ${state.subject === key ? 'active' : ''}" data-filter="subject" data-value="${key}">
          <div class="filter-item-left">
            <span class="filter-dot" style="background: var(--subject-${key}, #6b7280)"></span>${val.name}
          </div>
          <span class="filter-item-count">${val.count}</span>
        </div>
      `;
    });

  subjectFilter.innerHTML = html;
}

// ========== 渲染 Skill 筛选 ==========
function renderSkillFilter() {
  const skillFilter = document.getElementById('skillFilter');
  const skills = {};
  demos.forEach(d => {
    skills[d.skill] = skills[d.skill] || { name: d.skillName, count: 0 };
    skills[d.skill].count++;
  });

  const skillCount = Object.keys(skills).length;
  let html = `
    <div class="filter-item ${state.skill === 'all' ? 'active' : ''}" data-filter="skill" data-value="all">
      <div class="filter-item-left">全部 Skill</div>
      <span class="filter-item-count">${skillCount}</span>
    </div>
  `;

  Object.entries(skills)
    .sort((a, b) => a[0].localeCompare(b[0]))
    .forEach(([key, val]) => {
      html += `
        <div class="filter-item ${state.skill === key ? 'active' : ''}" data-filter="skill" data-value="${key}">
          <div class="filter-item-left">
            <span style="font-family:var(--font-mono,monospace); font-size:11px; color:var(--brand); margin-right:6px; font-weight:600">${key}</span>
            <span style="font-size:12px">${val.name}</span>
          </div>
          <span class="filter-item-count">${val.count}</span>
        </div>
      `;
    });

  skillFilter.innerHTML = html;
}

// ========== 渲染网格视图 ==========
function renderGrid() {
  const filtered = getFilteredDemos();
  const grid = document.getElementById('demoGrid');
  const empty = document.getElementById('emptyState');
  const list = document.getElementById('demoList');

  list.style.display = 'none';

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';

  grid.innerHTML = filtered.map(d => {
    const status = statusConfig[d.status];
    const subject = subjectConfig[d.subject];
    return `
      <div class="demo-card" data-id="${d.id}" onclick="openDemo('${d.folder}')">
        <div class="demo-card-thumb ${d.type}">
          <span class="demo-card-status status-${d.status}" data-tooltip="${status.label}"></span>
          <span class="demo-card-id">${d.id}</span>
          <span class="thumb-icon">${typeIcons[d.type]}</span>
        </div>
        <div class="demo-card-body">
          <h3 class="demo-card-title">${d.name}</h3>
          <div class="demo-card-tags">
            <span class="tag tag-subject ${subject.tagClass}">${subject.name}</span>
            <span class="tag tag-type">${d.typeName}</span>
            <span class="tag tag-status tag-status-${status.class}">${status.icon} ${status.label}</span>
          </div>
          <div class="demo-card-skill">
            <span class="skill-code">${d.skill}</span>
            <span>${d.skillName}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

      <div class="demo-list-row" data-id="${d.id}" onclick="openDemo('${d.folder}')">
        <span class="list-id">${d.id}</span>
        <span class="list-name">${d.name}</span>
        <span class="list-col-subject">
          <span class="tag tag-subject ${subject.tagClass}">${subject.name}</span>
        </span>
        <span class="list-col-type">
          <span class="tag tag-type">${typeIcons[d.type]} ${d.typeName}</span>
        </span>
        <span class="list-col-skill list-skill">${d.skill}</span>
        <span>
          <span class="tag tag-status tag-status-${status.class}">${status.icon} ${status.label}</span>
        </span>
      </div>
    `;
  }).join('');

  list.innerHTML = `
    <div class="list-header">
      <div>编号</div>
      <div>名称</div>
      <div class="list-col-subject">学科</div>
      <div class="list-col-type">类型</div>
      <div class="list-col-skill">Skill</div>
      <div>状态</div>
    </div>
    ${rows}
  `;
}

// ========== 更新标题和计数 ==========
function updateHeader() {
  const filtered = getFilteredDemos();
  document.getElementById('contentCount').textContent = `共 ${filtered.length} 个`;

  let title = '';
  if (state.subject !== 'all') {
    title = subjectConfig[state.subject].name;
  } else if (state.type !== 'all') {
    const typeNames = { immersive: '沉浸式全屏', magazine: '杂志讲解', tool: '交互工具', timeline: '时空叙事' };
    title = typeNames[state.type];
  } else if (state.skill !== 'all') {
    const skillDemo = demos.find(d => d.skill === state.skill);
    title = skillDemo ? skillDemo.skillName : 'Skill';
  } else if (state.status !== 'all') {
    title = statusConfig[state.status].label;
  } else {
    title = '全部 Demo';
  }
  document.getElementById('contentTitle').textContent = title;
}

// ========== 重新渲染 ==========
function render() {
  renderStats();
  renderSubjectFilter();
  renderSkillFilter();
  updateHeader();

  if (state.view === 'grid') {
    renderGrid();
  } else {
    renderList();
  }
}

// ========== 打开 Demo ==========
function openDemo(folder) {
  window.open(`demos/${folder}/index.html`, '_blank');
}

// ========== 事件绑定 ==========
document.addEventListener('click', (e) => {
  // 筛选器点击
  const filterItem = e.target.closest('.filter-item');
  if (filterItem) {
    const filterType = filterItem.dataset.filter;
    const filterValue = filterItem.dataset.value;
    state[filterType] = filterValue;
    render();
  }

  // 视图切换
  if (e.target.closest('#gridViewBtn')) {
    state.view = 'grid';
    document.getElementById('gridViewBtn').classList.add('active');
    document.getElementById('listViewBtn').classList.remove('active');
    render();
  }
  if (e.target.closest('#listViewBtn')) {
    state.view = 'list';
    document.getElementById('listViewBtn').classList.add('active');
    document.getElementById('gridViewBtn').classList.remove('active');
    render();
  }
});

// 搜索输入
document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  render();
});

// ========== 初始化 ==========
render();
</script>

</body>
</html>
